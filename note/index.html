<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>디다코 노트</title>
<meta name="theme-color" content="#6B4A2E">
<!-- 홈 화면 앱(PWA): 노트 아이콘은 종이(고동색) 세 겹 책갈피(icons/icon.svg) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="디다코 노트">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<script src="config.js"></script>
<script>
// 저장된 화면 설정을 그림이 그려지기 전에 먼저 입힌다(밝은 화면이 잠깐 번쩍이지 않게). 읽을 수 없으면 기기 설정을 따른다
try {
  const d = JSON.parse(localStorage.getItem('didako-note-display') || '{}'), r = document.documentElement;
  if (d.mode === 'light' || d.mode === 'dark') r.setAttribute('data-mode', d.mode);
  if (d.accent !== 'green') r.setAttribute('data-accent', ['amber', 'blue', 'rose', 'ink', 'paper'].includes(d.accent) ? d.accent : 'paper');   // 기본은 종이(S-83). 초록은 속성 없이 :root 값
  if (['neu', 'skeu', 'glass'].includes(d.style)) r.setAttribute('data-style', d.style);
  if (d.big === true) r.setAttribute('data-big', '');
} catch (e) {}
</script>
<style>
/* 디다코 노트 데모(note/). 색 변수·글꼴은 GBS 앱(app/index.html)과 코이데 값을 그대로 옮겼고, 화면 모양은 디자인 캔버스(prototype/mulpyo/)를 따른다.
   쪽지 종이·쪽지 글·나무색·진한 포인트는 코이데에 없는 색이라 캔버스 보드 값 그대로 더했다(결정 기록 2026-10-24). 이름과 내용은 모두 지어낸 예시다. */
:root {
  --page: #E8EBE8; --surface: #F7F8F6; --surface-2: #E9EDEA;
  --ink: #1B2523; --ink-2: #5B6965; --line: #D7DEDA; --line-strong: #B9C4BF;
  --accent: #2B6A62; --accent-mid: #8DBDB5; --accent-soft: #DCEBE7; --on-accent: #FFFFFF;
  --leader: #62519E; --leader-soft: #ECE7F7; --private: #E8ECEA;
  --warn: #9A5A14; --warn-soft: #F5E8D6; --shadow: rgba(20, 35, 32, .14);
  --neu-hi: rgba(255, 255, 255, .9); --neu-lo: rgba(20, 35, 32, .17);
  --note-paper: #F3E4A8; --note-ink: #4E4214; --accent-deep: #1B4F48; --wood: #B98756;
  --base: 16px;
  --f-display: 'Gowun Batang', 'AppleMyungjo', 'Batang', serif;
  --f-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-mode="light"]) {
  --page: #141B19; --surface: #1C2522; --surface-2: #232D2A;
  --ink: #E5ECE9; --ink-2: #9CAAA5; --line: #2D3935; --line-strong: #4A5853;
  --accent: #7CC2B7; --accent-mid: #3F7C73; --accent-soft: #1E3934; --on-accent: #0F1A18;
  --leader: #B6A8EA; --leader-soft: #2A2442; --private: #252E2B;
  --warn: #E2A563; --warn-soft: #3A2C1B; --shadow: rgba(0, 0, 0, .5); --neu-hi: rgba(255, 255, 255, .06); --neu-lo: rgba(0, 0, 0, .6);
  --accent-deep: #7CC2B7; --wood: #7A5636; color-scheme: dark; } }
/* 화면 모드: 기기 설정이면 기기를 따르고, '밝게'·'어둡게'를 고르면 그대로(data-mode) */
:root[data-mode="dark"] {
  --page: #141B19; --surface: #1C2522; --surface-2: #232D2A;
  --ink: #E5ECE9; --ink-2: #9CAAA5; --line: #2D3935; --line-strong: #4A5853;
  --accent: #7CC2B7; --accent-mid: #3F7C73; --accent-soft: #1E3934; --on-accent: #0F1A18;
  --leader: #B6A8EA; --leader-soft: #2A2442; --private: #252E2B;
  --warn: #E2A563; --warn-soft: #3A2C1B; --shadow: rgba(0, 0, 0, .5); --neu-hi: rgba(255, 255, 255, .06); --neu-lo: rgba(0, 0, 0, .6);
  --accent-deep: #7CC2B7; --wood: #7A5636; color-scheme: dark; }
/* 글씨: 휴대폰·태블릿 16px, PC 15px. 큰 글씨 모드는 약 1.2배 (글씨 크기는 rem, 칸 크기는 px) */
:root[data-big] { --base: 19px; }
@media (min-width: 1000px) { :root[data-big] { --base: 18px; } }
/* 색 테마(초록은 위 기본값). GBS 앱·시안의 THEMES와 같은 값: 밝은 화면 / 어두운 화면 */
:root[data-accent="amber"] { --page:#EDE8E0;--surface:#F9F5EE;--surface-2:#ECE5DA;--ink:#2A221B;--ink-2:#6E6155;--line:#E0D6C8;--line-strong:#C9B9A3;--accent:#A9561B;--accent-mid:#E2B07F;--accent-soft:#F6E3CF;--on-accent:#FFFFFF;--private:#EFE8DE; }
@media (prefers-color-scheme: dark) { :root[data-accent="amber"]:not([data-mode="light"]) { --page:#1A1612;--surface:#231E19;--surface-2:#2B241E;--ink:#EEE6DC;--ink-2:#AE9F8E;--line:#3A3129;--line-strong:#5A4D41;--accent:#E9A066;--accent-mid:#8A5A32;--accent-soft:#3A2818;--on-accent:#1E140C;--private:#2E2721; } }
:root[data-accent="amber"][data-mode="dark"] { --page:#1A1612;--surface:#231E19;--surface-2:#2B241E;--ink:#EEE6DC;--ink-2:#AE9F8E;--line:#3A3129;--line-strong:#5A4D41;--accent:#E9A066;--accent-mid:#8A5A32;--accent-soft:#3A2818;--on-accent:#1E140C;--private:#2E2721; }
:root[data-accent="blue"] { --page:#E7E9EE;--surface:#F6F7FA;--surface-2:#E5E9EF;--ink:#1B2230;--ink-2:#5A6475;--line:#D6DCE5;--line-strong:#B6C0CF;--accent:#2F5D95;--accent-mid:#93AFD3;--accent-soft:#DCE6F3;--on-accent:#FFFFFF;--private:#E8EBF0; }
@media (prefers-color-scheme: dark) { :root[data-accent="blue"]:not([data-mode="light"]) { --page:#12161D;--surface:#1A2029;--surface-2:#212833;--ink:#E4E9F0;--ink-2:#9AA5B5;--line:#2C3542;--line-strong:#485466;--accent:#8EB4E6;--accent-mid:#3C5B85;--accent-soft:#1D2C42;--on-accent:#0E1622;--private:#232A35; } }
:root[data-accent="blue"][data-mode="dark"] { --page:#12161D;--surface:#1A2029;--surface-2:#212833;--ink:#E4E9F0;--ink-2:#9AA5B5;--line:#2C3542;--line-strong:#485466;--accent:#8EB4E6;--accent-mid:#3C5B85;--accent-soft:#1D2C42;--on-accent:#0E1622;--private:#232A35; }
:root[data-accent="rose"] { --page:#EEE7E8;--surface:#FAF5F6;--surface-2:#EDE3E5;--ink:#2A1E21;--ink-2:#6E5B60;--line:#E2D4D7;--line-strong:#CDB6BC;--accent:#A8435C;--accent-mid:#DDA2B1;--accent-soft:#F5DFE5;--on-accent:#FFFFFF;--private:#F0E7E9; }
@media (prefers-color-scheme: dark) { :root[data-accent="rose"]:not([data-mode="light"]) { --page:#1A1416;--surface:#231B1E;--surface-2:#2B2226;--ink:#EEE3E6;--ink-2:#B09CA2;--line:#3A2D31;--line-strong:#5A464C;--accent:#E896AB;--accent-mid:#86475A;--accent-soft:#3B2029;--on-accent:#200E14;--private:#2E2428; } }
:root[data-accent="rose"][data-mode="dark"] { --page:#1A1416;--surface:#231B1E;--surface-2:#2B2226;--ink:#EEE3E6;--ink-2:#B09CA2;--line:#3A2D31;--line-strong:#5A464C;--accent:#E896AB;--accent-mid:#86475A;--accent-soft:#3B2029;--on-accent:#200E14;--private:#2E2428; }
:root[data-accent="ink"] { --page:#E9E9E7;--surface:#F7F7F6;--surface-2:#E8E8E5;--ink:#1D1D1B;--ink-2:#62625E;--line:#DADAD6;--line-strong:#BDBDB7;--accent:#33332F;--accent-mid:#A3A39C;--accent-soft:#E6E6E1;--on-accent:#FFFFFF;--private:#ECECE8; }
@media (prefers-color-scheme: dark) { :root[data-accent="ink"]:not([data-mode="light"]) { --page:#141414;--surface:#1D1D1C;--surface-2:#252524;--ink:#ECECE8;--ink-2:#A3A39E;--line:#30302E;--line-strong:#4D4D4A;--accent:#E2E2DC;--accent-mid:#6A6A65;--accent-soft:#2E2E2C;--on-accent:#141414;--private:#262625; } }
:root[data-accent="ink"][data-mode="dark"] { --page:#141414;--surface:#1D1D1C;--surface-2:#252524;--ink:#ECECE8;--ink-2:#A3A39E;--line:#30302E;--line-strong:#4D4D4A;--accent:#E2E2DC;--accent-mid:#6A6A65;--accent-soft:#2E2E2C;--on-accent:#141414;--private:#262625; }
:root[data-accent="paper"] { --page:#F0EEE6;--surface:#FAF9F5;--surface-2:#F2F0E9;--ink:#1F1E1D;--ink-2:#5E5D59;--line:#E3E0D5;--line-strong:#C4C1B5;--accent:#6B4A2E;--accent-mid:#C4A27F;--accent-soft:#EADFCD;--on-accent:#FFFFFF;--private:#EEECE4; }
@media (prefers-color-scheme: dark) { :root[data-accent="paper"]:not([data-mode="light"]) { --page:#1F1E1D;--surface:#262624;--surface-2:#30302E;--ink:#F5F4EE;--ink-2:#B7B5A9;--line:#3E3E38;--line-strong:#5C5B55;--accent:#D2B08A;--accent-mid:#7E6247;--accent-soft:#362B20;--on-accent:#1C150E;--private:#2C2C2A; } }
:root[data-accent="paper"][data-mode="dark"] { --page:#1F1E1D;--surface:#262624;--surface-2:#30302E;--ink:#F5F4EE;--ink-2:#B7B5A9;--line:#3E3E38;--line-strong:#5C5B55;--accent:#D2B08A;--accent-mid:#7E6247;--accent-soft:#362B20;--on-accent:#1C150E;--private:#2C2C2A; }
/* 색 테마를 고르면 진한 포인트(--accent-deep)도 그 테마색을 따르게 한다: 밝은 화면은 테마색을 조금 어둡게, 어두운 화면은 테마색 그대로 */
:root[data-accent] { --accent-deep: color-mix(in srgb, var(--accent) 78%, #000); }
@media (prefers-color-scheme: dark) { :root[data-accent]:not([data-mode="light"]) { --accent-deep: var(--accent); } }
:root[data-accent][data-mode="dark"] { --accent-deep: var(--accent); }

* { box-sizing: border-box; }
html { font-size: var(--base); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { margin: 0; }
body { background: var(--page); color: var(--ink); font-family: var(--f-body); font-size: 1rem; line-height: 1.55; -webkit-tap-highlight-color: transparent; word-break: keep-all; overflow-wrap: anywhere; overflow-x: hidden; }
button, input, textarea { font: inherit; color: inherit; }
html { touch-action: manipulation; }   /* 두 번 눌러 확대 막기(아이폰 홈 화면 앱) */
button, a, input, textarea, [role="switch"], [role="radio"] { touch-action: manipulation; }
button { cursor: pointer; }
a { color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#main { outline: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.sf { font-family: var(--f-display); }
.sm { font-size: .875rem; color: var(--ink-2); }
.emo { font-size: .8em; margin-left: 8px; vertical-align: 1px; }
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* 공통 부품: 이름은 GBS 앱·코이데와 같게 두어 디자인 스타일(design-styles.css)이 그대로 먹는다 */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 12px; border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); font: 700 1rem var(--f-body); text-decoration: none; }
.btn.ghost { background: none; border-color: var(--accent-mid); color: var(--accent-deep); }
.btn.wide { width: 100%; }
.btn.lg { min-height: 56px; border-radius: 14px; font-size: 1.0625rem; }
.btn.big { width: 100%; min-height: 52px; font-size: 1.0625rem; }
.btn.sm2 { min-height: 44px; padding: 0 18px; font-size: .9375rem; }
.btn:disabled { opacity: .5; cursor: default; }
.tx { display: inline-flex; align-items: center; min-height: 44px; min-width: 44px; padding: 0 6px; background: none; border: 0; color: var(--accent); font: 500 .9375rem var(--f-body); text-decoration: none; }
.chip { display: inline-block; padding: 4px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-deep); font-size: .8125rem; font-weight: 500; }
.field { display: block; width: 100%; min-height: 48px; padding: 11px 12px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); color: var(--ink); font-size: .9375rem; }
.field::placeholder { color: var(--ink-2); }
textarea.field { resize: none; line-height: 1.6; }
.seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; }
.seg button { flex: 1; min-height: 44px; border: 0; border-radius: 10px; background: none; font-size: .875rem; color: var(--ink-2); }
.seg button.on { background: var(--line); color: var(--ink); font-weight: 700; }
.seg.q { background: var(--line); }
.seg.q button.on { background: var(--surface); }
.switch { width: 48px; height: 28px; border-radius: 999px; border: 0; background: var(--line-strong); position: relative; flex: none; padding: 0; }
.switch > span { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); transition: left .2s; }
.switch.on { background: var(--accent); }
.switch.on > span { left: 23px; }
.switch::after { content: ""; position: absolute; inset: -8px -2px; }   /* 눌리는 자리를 44px 이상으로 */
.switch.busy, .btn.busy { opacity: .6; pointer-events: none; }
.kakao:disabled { opacity: .6; cursor: default; }
.kakao { display: flex; align-items: center; justify-content: center; gap: .5em; width: 100%; min-height: 52px; border: 0; border-radius: 12px; background: #FEE500; color: rgba(0, 0, 0, .85); font: 600 1rem var(--f-body); }
.col { max-width: 640px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-right, 0px)) calc(120px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.back-row { display: flex; align-items: center; }
.h1 { font: 700 1.375rem/1.4 var(--f-display); margin: 0; }
.col.more { max-width: 640px; }
/* 탭 첫 화면 제목 줄: 높이 44px, 세로 가운데. 오른쪽 칸(날짜·돋보기·종류 전환)이 있어도 없어도 제목의 자리가 같다 */
.page-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; }

/* 하단 탭(휴대폰·태블릿 세로): 코이데(app/index.html)와 같은 모양. 5칸 같은 폭, 가는 선 아이콘, 지금 탭은 아래 작은 점, 가운데 남기기는 연한 원 안의 + 아이콘 */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 0 env(safe-area-inset-right, 0px) max(6px, env(safe-area-inset-bottom, 0px)) env(safe-area-inset-left, 0px); z-index: 10; }
/* 아래로 스크롤하면 하단 탭이 아래로 숨고, 위로 올리면 다시 나온다(넓은 화면은 하단 탭이 없어 해당 없음) */
.tabs { transition: transform .22s ease; }
body.tabs-off .tabs { transform: translateY(100%); }
body.tabs-off .stickbar { bottom: env(safe-area-inset-bottom, 0px); }
@media (prefers-reduced-motion: reduce) { .tabs { transition: none; } }

.tabs :is(button, a) { text-decoration: none; background: none; border: 0; color: var(--ink-2); display: grid; place-items: center; padding: .55em 0; min-height: 56px; cursor: pointer; position: relative; }
.tabs .ic { width: 28px; height: 28px; stroke-width: 1.4; }
.tabs :is(button, a).on { color: var(--accent); }
.tabs :is(button, a).on .ic { stroke-width: 1.8; }
.tabs :is(button, a).on::after { content: ''; position: absolute; bottom: 6px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.tabs :is(button, a).pray-tab .ic { width: 44px; height: 44px; padding: 8px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); }
.tabs :is(button, a).pray-tab.on .ic { background: var(--accent); color: var(--on-accent); }
.tabs :is(button, a).pray-tab.on::after { content: none; }
/* 모든 화면 폭의 상단 바. 넓은 화면은 글자 메뉴를 쓰고 하단 탭을 숨긴다 */
.topbar { display: none; position: sticky; top: 0; z-index: 20; height: 52px; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-in { position: relative; max-width: 1184px; height: 100%; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; gap: 28px; }
.brand { display: inline-flex; align-items: center; gap: .45em; font: 700 1.05rem var(--f-display); white-space: nowrap; color: var(--ink); text-decoration: none; }
.brand-mark { width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--accent); display: grid; place-items: center; flex: none; }
.brand-mark .mk { width: .95em; height: .95em; --s1: var(--on-accent); --s2: color-mix(in srgb, var(--on-accent) 72%, var(--accent)); --s3: color-mix(in srgb, var(--on-accent) 48%, var(--accent)); --cord-bg: var(--accent); }
:root[data-style] .topbar .brand .brand-mark { background: var(--accent); box-shadow: none; border: 0; backdrop-filter: none; }
.topnav { display: flex; align-items: center; gap: 4px; }
@media (min-width: 1000px) { .col.more { max-width: 1184px; } }
.tm { display: flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 12px; border-radius: 10px; background: none; border: 0; font: 500 .875rem var(--f-body); color: var(--ink-2); white-space: nowrap; text-decoration: none; }
.tm.on { background: var(--accent-soft); color: var(--accent-deep); font-weight: 700; }
.tm.ic-btn { width: 44px; padding: 0; color: var(--ink); margin-left: auto; }
.menu { position: absolute; top: calc(100% + 6px); right: 16px; width: min(300px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 16px 40px -12px var(--shadow); padding: 10px; z-index: 25; }
.menu .mlabel { font-size: .75rem; font-weight: 600; color: var(--ink-2); margin: 6px 6px 6px; }
.topbar:not([hidden]) { display: block; }
@media (min-width: 1000px) { .tabs { display: none !important; } .col { padding-top: 28px; padding-bottom: 56px; } .h1 { font-size: 1.625rem; } }

.top-actions { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.top-actions .ic-btn { margin-left: 0; }
#setBtn[aria-expanded="true"], #placeBtn[aria-expanded="true"] { background: var(--surface-2); }
#setBtn { border-radius: 12px; }
.place-btn { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2); color: var(--ink); font: 600 .8125rem var(--f-body); white-space: nowrap; }
.place-btn::after { content: ''; position: absolute; inset: -4px 0; }

}
@media (max-width: 999px) and (prefers-reduced-motion: reduce) { .topbar { transition: none; } }

/* 시안 보기 설정(톱니, 데모에만 있다) */
.gear { position: fixed; top: 0; right: 0; z-index: 30; width: 44px; height: 44px; padding: 3px 0 0; display: flex; align-items: flex-start; justify-content: center; background: none; border: 0; color: var(--ink-2); opacity: .6; }
.gear:hover, .gear[aria-expanded="true"] { opacity: 1; }
.gear .ic { width: 18px; height: 18px; }
.gearpanel { position: fixed; top: 40px; right: 8px; width: min(340px, calc(100vw - 16px)); max-height: calc(100vh - 56px); overflow-y: auto; z-index: 31; }

.gearpanel .dategrp { display: flex; gap: 8px; align-items: center; margin: 0 6px 6px; }
.gearpanel .dategrp .field { flex: 1; min-width: 0; min-height: 44px; }
.gearpanel .dategrp .btn { flex: none; }

.gearpanel .vine-demo { margin: 8px 6px; }
.vine-demo .vine-demo-days { display: flex; gap: 6px; margin-top: 6px; }
.vine-demo-days .btn { flex: 1; min-width: 0; padding: 0 6px; }

/* 포도나무: 웹용 한 벌을 정수 배율로만 키운다. 작은 폭에서도 그림이 가로 스크롤을 만들지 않는다. */
.col.vine-page { max-width: 816px; padding-left: 0; padding-right: 0; }

.vine-scene { --vine-scale: 1; position: relative; flex: none; width: calc(var(--vine-w) * var(--vine-scale)); height: calc(var(--vine-h) * var(--vine-scale)); overflow: hidden; image-rendering: pixelated; }
.vine-zoom { position: absolute; width: var(--vine-w); height: var(--vine-h); transform: scale(var(--vine-scale)); transform-origin: top left; }
.vine-layers { position: absolute; width: 384px; height: 256px; }
.vine-layers > img { position: absolute; left: 0; top: 0; width: 384px; height: 256px; }
.vine-layers > span { position: absolute; }
.vine-leaf { width: 22px; height: 20px; background: url('img/vine/scene/leaf.png') no-repeat; background-size: 132px 20px; }
.vine-grape { display: inline-block; flex: none; width: 20px; height: 28px; background: url('img/vine/scene/grape.png') no-repeat; background-size: 100px 28px; image-rendering: pixelated; }

@media (prefers-color-scheme: dark) {

:root[data-mode="dark"] .vine-bg-day { display: none; }

.vine-fruit.growing { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

.vine-guide { margin-top: 24px; }
@media (min-width: 1000px) { .vine-scene { --vine-scale: 2; } }
/* 오늘의 질문 끝의 얇은 입구. 웹용 카드 영역을 절반으로 줄인 뒤 작은 창으로 자른다. */
.vine-story { display: flex; flex-direction: column; gap: 12px; }
.vine-story-img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 12px; }
.vine-story-tree { display: flex; justify-content: center; width: 100%; overflow: hidden; border-radius: 12px; }
.vine-story-tree .vine-scene { --vine-scale: 1; }
.pop-sheet .vine-story-text { font-size: 1rem; line-height: 1.7; }
.vine-story .sm { font-size: .875rem; line-height: 1.6; }
.vine-fruit { font: inherit; color: var(--ink); }
.vine-badge-title { margin: 28px 0 4px; }
.vine-badge-sub { margin: 0; }

.mdiv { height: 1px; background: var(--line); margin: 8px 6px; }
.toast { pointer-events: none; position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: max-content; background: var(--ink); color: var(--page); padding: .6em 1em; border-radius: 10px; font-size: .875rem; z-index: 60; max-width: calc(100% - 32px); text-align: center; }
@media (min-width: 1000px) { .toast { bottom: 40px; } }

/* 처음 들어올 때(M18~M18d) */
.ob { max-width: 440px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; padding: 0 24px; display: flex; flex-direction: column; }
.ob-ok { margin-top: 64px; display: flex; align-items: center; gap: 6px; color: var(--accent); font-size: .875rem; font-weight: 500; }

.steps { display: flex; gap: 6px; margin-top: 64px; }
.steps span { flex: 1; height: 4px; border-radius: 4px; background: var(--line); }

.ob-h { font: 700 1.75rem/1.35 var(--f-display); margin: 28px 0 0; }

.ob .sm.lead { margin-top: 28px; }
.ob .btn.big { margin-top: 16px; }
.ob-demo { margin-top: auto; padding: 24px 0 28px; text-align: center; font-size: .8125rem; color: var(--ink-2); }
.ob-mark { width: 72px; height: 72px; border-radius: 36px; background: var(--accent); color: var(--on-accent); font: 700 2.5rem/72px var(--f-display); text-align: center; margin: 0 auto; }
.kv { display: flex; gap: 14px; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-top: 10px; background: var(--surface); }
.kv b { flex: 0 0 72px; color: var(--accent); font-size: .9375rem; }
.kv span { flex: 1; min-width: 0; font-size: .9375rem; line-height: 1.6; }

/* 오늘의 질문(M1, M10, T8) */
.q-card { margin-top: 20px; padding: 24px 20px 20px; }
.q-text { font: 700 1.625rem/1.4 var(--f-display); margin: 14px 0 18px; }
.q-img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 12px; margin-top: 18px; background: var(--surface-2); }
.q-bg { border-top: 1px solid var(--line); margin-top: 18px; padding-top: 14px; }
.q-bg .b { font-weight: 700; }
.q-bg p { font-size: .875rem; line-height: 1.6; margin: 2px 0 0; }
.q-hold { margin-top: 16px; }
.past-h { font-weight: 700; font-size: .875rem; margin: 20px 0 8px; }
.past2 { padding: 4px 16px; }
.past2 button { display: block; width: 100%; text-align: left; padding: 10px 0; background: none; border: 0; border-top: 1px solid var(--line); }
.past2 button:first-child { border-top: 0; }
.past2 .pq { font-size: .9375rem; }
.past-more { text-align: center; }
/* 모두 보기는 지난 질문 상자 안 맨 아래, 질문 줄과 같은 가는 선으로 나눈다(S-40) */
.past2 .past-more { border-top: 1px solid var(--line); }

.pcard { display: block; width: 100%; text-align: left; margin-top: 8px; padding: 10px 16px; color: var(--ink); }
.pcard .d { font-size: .8125rem; color: var(--ink-2); }
.pcard.on { background: var(--accent-soft); border-color: transparent; }   /* 지금 펴 둔 지난 질문 */
.pcard .pq { font: 700 1.0625rem/1.35 var(--f-body); }
/* 넓은 화면: 옆 칸과 가운데 내용을 한 틀로 묶어 위쪽 메뉴 줄 안쪽 폭(1184px)으로 가운데에 둔다. 옆 칸과 내용 사이는 32px, 내용은 옆 칸 바로 곁에 붙는다 */
.t8 { display: flex; align-items: flex-start; gap: 32px; max-width: 1184px; margin: 0 auto; padding: 0 16px; }
.t8-list { flex: 0 0 300px; width: 300px; position: sticky; top: 68px; height: calc(100vh - 84px); margin-top: 16px; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 10px 14px; }
.t8-list .lbl { font-weight: 700; font-size: .8125rem; margin: 6px 2px 8px; color: var(--ink-2); }
.t8-list .pcard { margin: 0 0 8px; padding: 10px 14px; border-radius: 12px; }
.t8-list .pcard .pq { font-size: 1rem; }
.t8-list .pcard .sm { font-size: .8125rem; line-height: 1.4; }
.t8-main { flex: 1; min-width: 0; }
.t8-list .past-more { margin-top: 2px; }
.mnav { display: flex; align-items: center; justify-content: space-between; margin: 4px -10px 0; }
.mnav-t { font-weight: 700; font-size: 1.125rem; }
.ib:disabled { opacity: .35; cursor: default; }
.t8-in { max-width: 640px; margin: 0; padding: 28px 0 56px; }
.t8-in .q-card { margin-top: 20px; }

/* 내 질문에 품기(M1c) */
.strip { margin-top: 8px; background: var(--accent-soft); color: var(--accent-deep); border-radius: 12px; min-height: 44px; padding: 0 16px; display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; }
.strip .l { font-size: .8125rem; font-weight: 500; flex-shrink: 0; }
.strip .v { font: 700 .9375rem var(--f-display); overflow: hidden; text-overflow: ellipsis; }
.wr-ta { min-height: 136px; font-size: 1rem; padding: 12px 14px; margin: 10px 0 6px; }
.wr-ta:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); outline: none; }
.wr-row { padding: 0 6px; width: 100%; border: 0; border-top: 1px solid var(--line); background: none; display: flex; justify-content: space-between; align-items: center; min-height: 44px; text-align: left; }
.wr-row .a { color: var(--accent); }

/* 더보기(M8, T13)와 세부 화면 */
.more-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
@media (min-width: 1000px) { .more-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.gl { font-size: .8125rem; color: var(--ink-2); margin: 20px 4px 8px; }

.gc { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 0 16px; }
.gr { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; padding: 12px 0; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; font: inherit; color: var(--ink); text-decoration: none; }
.gr:first-child { border-top: 0; }
.gr .gt { flex: 1; min-width: 0; }
.gr b { display: block; font-size: .96875rem; font-weight: 700; }
.gr .gd { display: block; font-size: .84375rem; color: var(--ink-2); margin-top: 2px; }
.gr .ch { flex: 0 0 auto; color: var(--ink-2); font-size: 1.25rem; }
.gr.open { border-bottom: 1px solid var(--line); }   /* 화면 설정을 펼치면 머리줄 아래 구분선 */
.gr.off b { color: var(--ink-2); font-weight: 500; }
.logout { display: block; margin: 20px auto 0; min-height: 44px; padding: 0 16px; background: none; border: 0; color: var(--ink-2); font: 500 .9375rem var(--f-body); }
.ex { padding: 4px 0 14px; }
.cdw { display: flex; gap: 4px; margin: 10px 0 10px -2px; }
.cd { width: 48px; height: 48px; border: 0; background: none; padding: 0; display: flex; align-items: center; justify-content: center; }
.cd i { display: block; width: 34px; height: 34px; border-radius: 17px; }
.cd[aria-checked="true"] i { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--ink); }
.set-row { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
.set-row > span { flex: 1; min-width: 0; }
.set-row b { display: block; font-size: .96875rem; }
.bk { min-height: 44px; margin-left: -6px; padding: 0 6px; background: none; border: 0; color: var(--accent); font: 500 1rem var(--f-body); display: inline-flex; align-items: center; gap: 2px; text-decoration: none; }
.sc { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-top: 14px; }
.sl { font-size: .875rem; color: var(--ink-2); font-weight: 500; margin-bottom: 8px; }
.lk { display: inline-flex; align-items: center; min-height: 44px; background: none; border: 0; padding: 0; color: var(--accent); font: 700 .9375rem var(--f-body); text-decoration: none; }
.pg { margin: 0; font-size: 1rem; line-height: 1.65; }
.tt { font: 700 1.875rem/1.3 var(--f-display); margin: 2px 0 0; }
.nm { display: flex; gap: 10px; margin-top: 10px; }
.nm .nb { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 14px; padding: 12px 8px; text-align: center; }
.nm .nb b { display: block; font-size: 1.0625rem; }
.nm .nb .gk { display: block; color: var(--accent); font-size: 1.0625rem; margin: 2px 0; }

.nm .pl { align-self: center; color: var(--ink-2); font-size: 1.125rem; }
.stp { display: flex; gap: 12px; margin-top: 14px; }
.stp .no { flex: 0 0 32px; width: 32px; height: 32px; border-radius: 16px; background: var(--accent-soft); color: var(--accent-deep); font: 700 .9375rem/32px var(--f-body); text-align: center; margin-top: 2px; }
.stp .bd { flex: 1; min-width: 0; }
.stp h3 { margin: 0 0 2px; font: 700 1.125rem/1.4 var(--f-display); }
.stp p { margin: 0; font-size: .96875rem; line-height: 1.65; }
.ls > div { padding: 14px 0; border-top: 1px solid var(--line); }
.ls > div:first-child { border-top: 0; padding-top: 4px; }
.ls > div:last-child { padding-bottom: 0; }
.ls b { display: block; font-size: 1rem; }
.ls p { margin: 2px 0 0; font-size: .96875rem; line-height: 1.65; }
.ls.ac b { color: var(--accent); }
.fq { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 56px; padding: 8px 0; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; font: 700 1rem var(--f-body); color: var(--ink); }
.fq:first-of-type { border-top: 0; }
.mk { display: block; }
.ab-mark { width: 72px; height: 72px; border-radius: 36px; background: var(--accent); margin: 0 auto; display: grid; place-items: center; }
.ab-mark .mk { width: 44px; height: 44px; --s1: var(--on-accent); --s2: color-mix(in srgb, var(--on-accent) 72%, var(--accent)); --s3: color-mix(in srgb, var(--on-accent) 48%, var(--accent)); --cord-bg: var(--accent); }
.story-mark { display: flex; justify-content: center; margin: 4px 0 10px; }

.ta { display: block; width: 100%; min-height: 150px; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); color: var(--ink); font: 400 1rem/1.6 var(--f-body); resize: none; }
.ta::placeholder { color: var(--ink-2); }
.warn { margin: 0; color: var(--warn); }

/* 동기화(M8f, M8g) */
.sy h2 { margin: 0; font: 700 1.1875rem/1.3 var(--f-display); }
.sy .hd { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sy .stt { display: flex; align-items: flex-start; gap: 10px; margin: 8px 0 0; font-size: .9375rem; line-height: 1.55; }
.sy .stt i { flex: 0 0 8px; width: 8px; height: 8px; margin-top: 9px; border-radius: 50%; background: var(--accent); }
.sy .stt.off { color: var(--ink-2); }
.sy .stt.off i { background: var(--line-strong); }
.sy .act { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.ql { display: inline-flex; align-items: center; min-height: 44px; padding: 0 4px; background: none; border: 0; color: var(--ink-2); font: 400 .875rem var(--f-body); text-decoration: underline; text-underline-offset: 3px; }
.cg { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 0 18px; margin-top: 14px; }
.cg .gr { min-height: 60px; }
.cg .gr b { font-size: 1rem; }
.cg .nt2 { margin: 0; padding: 0 0 14px; font-size: .84375rem; color: var(--ink-2); line-height: 1.55; }
.gr.dm { opacity: .5; }
.ft { padding: 18px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); margin-top: 14px; }
.ft .sl { margin-bottom: 6px; }
.ft p { margin: 0 0 8px; font-size: .84375rem; line-height: 1.6; color: var(--ink-2); }
.ft p:last-child { margin-bottom: 0; }
.os { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; font-size: .9375rem; line-height: 1.55; }

/* 아래에서 올라오는 창 */
.pop { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.pop-scrim { position: absolute; inset: 0; background: rgb(0 0 0 / .4); }
.pop-sheet { position: relative; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; background: var(--page); border-radius: 20px 20px 0 0; padding: 20px 16px max(28px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -8px 28px var(--shadow); }
@media (min-width: 640px) { .pop { align-items: center; } .pop-sheet { border-radius: 18px; } }
.pop-sheet h2 { margin: 0; font: 700 1.25rem/1.35 var(--f-display); }
.pop-sheet p { margin: 0; font-size: .9375rem; line-height: 1.65; }
.pop-sheet .nb2 { background: var(--surface-2); border-radius: 12px; padding: 10px 14px; font-size: .84375rem; line-height: 1.6; }
.pop-sheet form { display: flex; flex-direction: column; gap: 12px; }
.pop-sheet .msg { color: var(--warn); font-size: .875rem; min-height: 0; margin: 0; }
.pop-sheet .msg:empty { display: none; }
.ra { display: flex; gap: 8px; justify-content: flex-end; }
.rb { display: flex; gap: 8px; flex-wrap: wrap; }
.sheet-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sheet-top p { font-weight: 700; }
.x { width: 44px; height: 44px; border-radius: 12px; background: none; border: 0; color: var(--ink-2); display: grid; place-items: center; flex: none; }
.wd { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.wd li { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font: 600 1.3125rem var(--f-display); display: flex; align-items: baseline; user-select: all; -webkit-user-select: all; }
.wd li small { font: 500 .6875rem var(--f-body); color: var(--ink-2); margin-right: 8px; }
.os2 { display: flex; flex-direction: column; gap: 4px; margin: 0; padding-left: 1.3em; font-size: .9375rem; }
body.pop-open { overflow: hidden; }
@media (prefers-reduced-motion: reduce) { .switch > span { transition: none; } }
/* 남기기·내 기록(②): 캔버스 보드 M2~M27, T9~T12, P1의 모양을 옮겼다. 새 색 없이 위의 변수만 쓴다(글씨 크기는 rem, 칸 크기는 px) */
.ib { width: 44px; height: 44px; background: none; border: 0; display: flex; align-items: center; justify-content: center; color: var(--ink); flex: none; text-decoration: none; }

.ed .ProseMirror blockquote { margin: 8px 0; padding: 2px 14px; border-left: 3px solid var(--ink-2); color: var(--ink-2); }
.ed .ProseMirror ul, .ed .ProseMirror ol { margin: 0; padding-left: 1.5em; }
.ed .ProseMirror li > p { margin: 0; }
.ed .ProseMirror li + li { margin-top: 4px; }
.ed .ProseMirror hr { border: 0; border-top: 1px solid var(--line-strong); margin: 14px 0; }
.ed .ProseMirror hr.ProseMirror-selectednode { border-top-color: var(--accent); }
.ed .ProseMirror mark { background: var(--note-paper); color: var(--note-ink); border-radius: 3px; padding: 0 1px; }
/* 줄 맨 앞 ? 는 질문 상자, ! 는 발견 상자(T7). 글자는 그대로 두고 상자 모양만 입힌다 */
.ed .ln-q, .ed .ln-f { border-radius: 12px; padding: 8px 14px; margin: 10px 0; font-size: .9375rem; line-height: 1.55; }
.ed .ln-q { border: 1.5px solid var(--accent-mid); background: var(--surface); }
.ed .ln-f { border: 1.5px dashed color-mix(in srgb, var(--note-ink) 45%, transparent); background: var(--note-paper); color: var(--note-ink); }   /* 알게 된 것 쪽지와 같은 노란 종이(어두운 화면에서도 글이 또렷하게) */
.ed .ln-mk { font-weight: 800; }
.ed .ln-q .ln-mk { color: var(--accent); }
/* 표(M23): 칸마다 위쪽에 ⋮ 손잡이. 휴대폰에서 표가 화면보다 넓으면 표만 옆으로 민다 */
.ed .ProseMirror table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; margin: 12px 0; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
.ed .ProseMirror table > tbody { display: table; width: 100%; }
.ed .ProseMirror th, .ed .ProseMirror td { position: relative; min-width: 96px; border: 1px solid var(--line-strong); padding: 20px 10px 8px; font-size: .875rem; line-height: 1.4; text-align: left; vertical-align: top; }
.ed .ProseMirror th { background: var(--accent-soft); font-weight: 700; color: var(--accent-deep); }
.ed .ProseMirror th > *, .ed .ProseMirror td > * { margin: 0; }
.ed .ProseMirror th::before, .ed .ProseMirror td::before { content: ""; position: absolute; top: 2px; left: 50%; width: 4px; height: 18px; margin-left: -2px; color: var(--line-strong); background: radial-gradient(circle, currentColor 1.6px, transparent 1.9px) 0 0 / 4px 6px repeat-y; pointer-events: none; }
.ed .ProseMirror .tcur::before { color: var(--ink-2); }
.ed .ProseMirror .tcur { outline: 2px solid var(--accent); outline-offset: -2px; }
.ed .ProseMirror .selectedCell { background-image: linear-gradient(var(--accent-soft), var(--accent-soft)); }
.ed [data-bg="green"] { background: var(--tb-1) !important; } .ed [data-bg="amber"] { background: var(--tb-2) !important; } .ed [data-bg="blue"] { background: var(--tb-3) !important; } .ed [data-bg="rose"] { background: var(--tb-4) !important; } .ed [data-bg="ink"] { background: var(--tb-5) !important; }
/* 접는 섹션(M23): 제목 줄을 누르면 접고 펴진다. 편집 중에도 된다 */
.ed [data-type="details"] { display: flex; gap: 4px; margin: 12px 0; align-items: flex-start; }
.ed [data-type="details"] > button { flex: 0 0 28px; width: 28px; height: 28px; margin-top: 2px; border: 0; border-radius: 6px; background: none; color: var(--ink-2); display: flex; align-items: center; justify-content: center; padding: 0; }
.ed [data-type="details"] > button::before { content: "\25B6"; font-size: .75rem; transition: transform .15s; }
.ed [data-type="details"].is-open > button::before { transform: rotate(90deg); }
.ed [data-type="details"] > div { flex: 1; min-width: 0; }
.ed [data-type="details"] summary { display: block; font-weight: 500; min-height: 32px; line-height: 32px; list-style: none; }
.ed [data-type="details"] summary::-webkit-details-marker { display: none; }
.ed [data-type="detailsContent"] { margin-left: 2px; padding: 2px 0 2px 16px; border-left: 2px solid var(--line-strong); }
.ed [data-type="detailsContent"] > * + * { margin-top: 8px; }
.ed .ProseMirror-gapcursor:after { border-top-color: var(--accent); }
.edmsg { padding: 14px 16px; border: 1.5px dashed var(--accent-mid); border-radius: 16px; font-size: .9375rem; line-height: 1.55; color: var(--ink-2); }
.edmsg .tx { padding: 0; margin-top: 4px; }
/* 서식 막대(M9f, T7): 아이콘 7개를 세 묶음으로. 휴대폰은 화면 아래에 붙고 옆으로 밀어 본다 */
.fbar { display: flex; align-items: center; background: var(--surface); border-top: 1px solid var(--line); height: 48px; padding: 0 4px; overflow-x: auto; scrollbar-width: none; }
.fbar::-webkit-scrollbar { display: none; }
.fbar button { flex: 0 0 44px; width: 44px; height: 44px; border: 0; border-radius: 10px; background: none; color: var(--ink); display: flex; align-items: center; justify-content: center; padding: 0; }
.fbar button.on { background: var(--accent-soft); color: var(--accent-deep); }
.fbar button:disabled { opacity: .4; cursor: default; }
.fbar .fsep { flex: 0 0 1px; width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
.fbar .fg { display: flex; align-items: center; }
.fbar .mq { color: var(--accent); font-weight: 800; font-size: 18px; }
.fbar.pf { position: fixed; left: 0; right: 0; bottom: var(--kb, 0px); z-index: 12; height: calc(48px + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
.fbar.wd { position: sticky; bottom: 0; z-index: 3; height: 52px; padding: 0 16px; overflow: visible; justify-content: space-between; }
.fbar.wd .fg { margin: 0 auto; }
.fstat { font-size: .8125rem; color: var(--ink-2); white-space: nowrap; }
/* '/' 메뉴(M14, M14b)와 표 설정 메뉴(M23): 아이콘, 이름, › */
.mn { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: 0 4px 14px var(--shadow); padding: 4px 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; z-index: 40; }
.mn .mh { height: 28px; line-height: 28px; padding: 0 14px; color: var(--ink-2); font-size: .8125rem; }
.mn .mr { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 0 14px; border: 0; background: none; font: inherit; font-size: .9375rem; color: var(--ink); text-align: left; cursor: pointer; }
.mn .mr svg { flex: 0 0 20px; color: var(--ink-2); }
.mn .mr .ar { margin-left: auto; color: var(--ink-2); font-size: 1.125rem; }
.mn .mr .dot { flex: 0 0 20px; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
.mn .mr .dot i { display: block; width: 14px; height: 14px; border-radius: 7px; box-shadow: inset 0 0 0 1px var(--line-strong); }
.mn .mr.on, .mn .mr:hover { background: var(--accent-soft); color: var(--accent-deep); }
.mn .mr.on svg { color: var(--accent-deep); }
.mn .mr.ck { font-weight: 700; }
.mn .mr.hd { font-weight: 700; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.mn .mr.hd .bk2 { flex: 0 0 20px; width: 20px; text-align: center; font-size: 1.25rem; color: var(--ink-2); }
.mn .sep { height: 1px; background: var(--line); margin: 4px 0; }
.slashmenu { position: fixed; width: 280px; max-width: calc(100vw - 16px); max-height: 330px; }
.tbmenu { position: absolute; width: 200px; max-height: 70vh; }
/* 쓰는 화면 위쪽 줄의 오른쪽 단추 묶음과 전체 화면(T3) */
body.fs .topbar { display: none !important; }
body.fs .xw { min-height: 100vh; }
body.fs .xw-top { padding-right: 52px; }   /* 시안 보기 설정(톱니)이 오른쪽 위에 떠 있어서 단추가 가려지지 않게 */
.xw.fs .xw-l { display: none; }
.xw.fs { max-width: none; padding: 0; gap: 0; }
.xw.fs .xw-m.pn { border: 0; border-radius: 0; margin: 0; }   /* 전체 화면은 틀 없이 화면 가득 */
.fw-m { display: flex; flex-direction: column; }
.fw-m .xw-in { flex: 1; width: 100%; }
/* 내보내기 시트(M17) */
.exrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 56px; padding: 6px 4px; background: none; border: 0; border-top: 1px solid var(--line); color: var(--ink); font: 500 1rem var(--f-body); text-align: left; }
.exrow .sm { font-weight: 400; text-align: right; }
.map-entry { display: flex; align-items: center; gap: 8px; min-height: 48px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--ink-2); font-size: .875rem; text-decoration: none; flex-wrap: wrap; }
.map-entry .ic { width: 18px; height: 18px; }
.map-go { color: var(--accent-deep); margin-left: auto; white-space: nowrap; }
/* 말씀 지도 입구 카드: 지도 그림을 위에 넓게, 아래에 이름과 한 줄 */

/* 나의 배지: 받은 개수 대신 한 장씩 써 본 흔적만 둔다 */
.bdg { position: relative; }
.bdg-dot { position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.badge-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px 12px; margin-top: 24px; }
@media (min-width: 640px) { .badge-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.badge-item { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0; border: 0; background: none; font: inherit; color: var(--ink-2); text-align: center; min-width: 0; }
.badge-item.earned { color: var(--ink); }
.badge-art { display: flex; align-items: center; justify-content: center; width: 100%; aspect-ratio: 1; border-radius: 16px; background: var(--surface-2); color: var(--ink-2); }
.badge-art.earned { background: var(--accent-soft); color: var(--accent-deep); }
.badge-art img { width: 80%; height: 80%; object-fit: contain; }
.badge-art.locked :is(img, svg) { filter: grayscale(1); opacity: .45; }
.badge-name { width: 100%; line-height: 1.4; min-height: 2.8em; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; color: inherit; }
.badge-sheet { display: flex; flex-direction: column; gap: 12px; text-align: center; align-items: stretch; }
.badge-art.large { width: 144px; align-self: center; }
.badge-art.large svg { width: 88px; height: 88px; }
/* 부드럽게 넘어가기(S-72, S-73): 화면 전환 기능이 있으면 옛 화면과 새 화면을 겹쳐 넘기고(아래 view-transition), 없으면 새 화면만 움직인다(.vt-*). 코이데도 같게 맞춘다 */
.vt-in-r { animation: vt-in-r .2s cubic-bezier(.2, .8, .2, 1) both; }
.vt-in-l { animation: vt-in-l .2s cubic-bezier(.2, .8, .2, 1) both; }
.vt-fade { animation: vt-fade .25s ease-out both; }
.vt-push { animation: vt-push .45s cubic-bezier(.2, .8, .2, 1) both; }
.vt-pop { animation: vt-pop .45s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes vt-in-r { from { opacity: 0; transform: translateX(14px); } }
@keyframes vt-in-l { from { opacity: 0; transform: translateX(-14px); } }
@keyframes vt-fade { from { opacity: 0; } }
@keyframes vt-push { from { opacity: 0; transform: translateX(40px); } }
@keyframes vt-pop { from { opacity: 0; transform: translateX(-28px); } }
@media (prefers-reduced-motion: reduce) { .vt-in-r, .vt-in-l, .vt-fade, .vt-push, .vt-pop { animation: none; } }
/* 겹쳐 넘기기(S-73): 넘기는 동안만 이름을 붙여 따로 찍는다. 위쪽 바·하단 탭은 움직이지 않고, 막대와 패널은 제자리에서 바뀐다. 위쪽 바와 하단 탭도 따로 떼어 맨 위에 둔다(떼어 낸 #main이 그 위를 덮지 않게, S-84) */
:root[data-vt] #main { view-transition-name: main; }
:root[data-vt] .xact { view-transition-name: xact; }
:root[data-vt] .fbar.pf { view-transition-name: fbar; }
:root[data-vt] .qpanel { view-transition-name: qpanel; }
:root[data-vt] #topbar { view-transition-name: topbar; }
:root[data-vt] #tabs { view-transition-name: tabs; }
::view-transition-group(topbar), ::view-transition-group(tabs) { animation: none; }
::view-transition-old(topbar), ::view-transition-old(tabs) { animation: none; opacity: 0; }
::view-transition-new(topbar), ::view-transition-new(tabs) { animation: none; }
:root[data-vt="vt-push"] { --vt-in: 40px; --vt-out: -24px; }
:root[data-vt="vt-pop"] { --vt-in: -28px; --vt-out: 24px; }
:root[data-vt="vt-in-r"] { --vt-in: 14px; --vt-out: -10px; }
:root[data-vt="vt-in-l"] { --vt-in: -14px; --vt-out: 10px; }
:root[data-vt="vt-fade"] { --vt-in: 0px; --vt-out: 0px; }
::view-transition-old(root), ::view-transition-new(root) { animation: none; }
::view-transition-group(main) { animation: none; }
::view-transition-old(main) { animation: vt-old-out .32s ease-out both; }
::view-transition-new(main) { animation: vt-new-in .45s cubic-bezier(.22, .8, .24, 1) both; }
:root[data-vt="vt-in-r"]::view-transition-old(main), :root[data-vt="vt-in-l"]::view-transition-old(main) { animation-duration: .18s; }
:root[data-vt="vt-in-r"]::view-transition-new(main), :root[data-vt="vt-in-l"]::view-transition-new(main) { animation-duration: .25s; }
@keyframes vt-old-out { to { opacity: 0; transform: translateX(var(--vt-out, 0px)); } }
@keyframes vt-new-in { from { opacity: 0; transform: translateX(var(--vt-in, 0px)); } }
/* 클래식(S-81): 광택 버튼은 진한 버튼만. 바탕이 옅은 버튼(ol·lt·alt)은 종이 버튼으로 두고 제 글자색을 지킨다 */
:root[data-style="skeu"] .btn:not(.ghost):is(.ol, .lt, .alt) { background-image: linear-gradient(180deg, rgba(255,255,255,.3), rgba(255,255,255,0) 60%, rgba(0,0,0,.06)); background-color: var(--surface); border: 1px solid color-mix(in srgb, var(--line-strong) 85%, #000 10%); box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 1px 2px rgba(0,0,0,.15); text-shadow: none; }
:root[data-style="skeu"] .btn:not(.ghost).lt { background-color: var(--accent-soft); }
</style>

<script>document.documentElement.classList.add('booting'); setTimeout(() => document.documentElement.classList.remove('booting'), 5000);</script>

// 날짜는 그 기기의 현지 날짜(년·월·일)로만 다룬다. 하루 수(DN)로 바꿔서 더하고 빼니 시각이나 여름시간에 흔들리지 않는다.
const DN = (y, m, d) => Math.round(Date.UTC(y, m - 1, d) / 86400000);   // m은 1~12

function span(from, to) {

  let m = (b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth();
  if (b.getDate() < a.getDate()) m--;
  if (m >= 12) { const y = Math.floor(m / 12), r = m % 12; return r ? `${y}년 ${r}개월` : `${y}년`; }
  if (m >= 1) return `${m}개월`;

function braidPaths(len, amp, periods, vert, sw, ol, cols, n, sub) {
  ol = ol == null ? 3 : ol; cols = cols || STRAND; n = n || periods * 22; sub = sub || 1;

      const d = o.pts.map((q, m) => (m ? 'L' : 'M') + (vert ? `${f(q[1])} ${f(q[0])}` : `${f(q[0])} ${f(q[1])}`)).join('');

}
// o.center: 가운데 칸이 흰 판(이번 주의 질문, 쓰는 화면)이면 true, o.top: 가운데 위쪽 줄, o.right: 오른쪽 칸
function wideShell(main, o) {
  return `<div class="xw${o.right ? ' has-r' : ''}"><aside class="xw-l" aria-label="탐구 목록">${leftPanel(o)}</aside>
    <div class="xw-m${o.pn ? ' pn' : ''}">${o.top != null ? `<div class="xw-top">${o.top}</div>` : ''}<div class="xw-in${o.pn ? ' pn' : ''}">${main}</div></div>${o.right ? `<aside class="xw-r" aria-label="단계 목록">${o.right}</aside>` : ''}</div>`;
}

// ── 탐구 첫 화면(M7, M7a, T2, T2a) ──
function viewExplore() {
  const wide = isWide(), wk = weekNow(), cur = curNotes(), past = pastNotes();
  const wkMeta = `제${wk.n}주일`;   // 주일 번호만(묶음·주제 이름은 질문 글이 대신한다)
  const done = N.wk.some(w => w.id === wk.id && w.done);
  const weekCard = `<div class="card xcard"><div class="sm wk-meta">${wkMeta}${done ? '<span class="week-done sm"><span class="week-check">✓</span> 다 펴 봤어요</span>' : ''}</div><div class="sf xct" style="margin-top:4px">${esc(wk.q)}</div><div class="sm" style="margin-top:4px;line-height:1.5;word-break:keep-all">${wk.refs.map(esc).join(', ')}</div><button class="tx wk-open" type="button" data-act="week-open">${done ? '다시 펴 보기 ›' : '펴 보기 ›'}</button></div>`;   // 다른 카드와 같은 흰 카드(S-52)
  const wn = walkNow(), wbtn = wide ? '' : ' wide';
  const wLinks = wn ? `<div class="wk-links" style="justify-content:flex-end"><a class="tx" href="#/explore/walks">다른 연재 고르기 ›</a></div>` : '';   // 카드를 누르면 목록으로 가므로 [전체 목록]은 뺐다(S-60)
  const wGo = wn ? `<a class="wk-stretch" href="#/explore/walk/${wn.w.id}" aria-label="${esc(walkName(wn.w))} 목록 보기"></a>` : '';   // 카드 전체를 덮는 목록 링크
  const walkCard = !wn ? ''
    : wn.ep ? `<div class="card xcard wk-card">${wGo}${walkCover(wn.w)}<div class="sm">${esc(walkName(wn.w))} ${wn.ep.n}편</div><div class="sf xct" style="margin-top:4px">${esc(wn.ep.title)}</div><div class="sm" style="margin-top:4px">${esc(wn.ep.ref)}</div><a class="btn${wbtn}" href="#/explore/walk/${wn.w.id}/${wn.ep.n}" style="margin-top:12px">읽기</a>${wLinks}</div>`
    : wn.next ? `<div class="card xcard wk-card">${wGo}${walkCover(wn.w)}<div class="sm">${walkWhen(wn.nextDN)} 열려요</div><div class="sf xct" style="margin-top:4px">${esc(wn.next.title)}</div><div class="sm" style="margin-top:4px">${esc(wn.next.ref)}</div>${wLinks}</div>`
    : wn.all ? `<div class="card xcard wk-card">${wGo}${walkCover(wn.w)}<div class="sm">${esc(walkName(wn.w))}</div><div class="sf xct" style="margin-top:4px">${esc(wn.w.title)}</div><div class="sm" style="margin-top:6px;line-height:1.55;word-break:keep-all">모든 편을 마쳤어요. 언제든 다시 읽을 수 있어요.</div>${wLinks}</div>`
    : '';
  const curCard = (n, i) => `<div class="card xcard"${i ? ' style="margin-top:10px"' : ''}><div class="sf xct">${esc(getQ(n.q).text)}</div><div style="margin-top:10px">${n.mode === 'free' ? `<span class="sm">자유롭게 쓰기 · ${startLine(n)}</span>` : dotsHtml(n, false, startLine(n))}</div><button class="btn${wide ? '' : ' wide'}" type="button" data-act="past-open" data-id="${n.q}">이어서 쓰기</button></div>`;
  const curHtml = cur.length
    ? cur.map(curCard).join('')
    : `<div class="card xcard xempty"><div class="ph">품고 있는 질문 하나를 골라 탐구를 시작해 보세요</div><a class="btn${wide ? '' : ' wide'}" href="#/mine">질문 고르기</a></div>`;
  if (wide) {
    return wideShell(`${pageHead('🔍', '탐구하기')}
      ${walkCard ? `<div class="xlb" style="margin-top:20px">질문으로 묵상하기</div>${walkCard}` : ''}
      <div class="xlb" style="margin-top:${walkCard ? 28 : 20}px">내가 탐구하는 질문</div>${curHtml}
      <div class="xlb" style="margin-top:28px">이번 주의 질문</div>${weekCard}`, { pn: false });
  }
  const rows = past.map(n => `<button class="card xrow" type="button" data-act="past-open" data-id="${n.q}"><span><span style="display:block">${esc(getQ(n.q).text)}</span><span class="sm">${n.mode === 'free' ? '자유롭게 쓰기' : '단계별로 쓰기'} · ${startLine(n)}</span></span><span class="xch" aria-hidden="true">›</span></button>`).join('');
  return `<div class="col">
    ${pageHead('🔍', '탐구하기', `<button class="ib" type="button" aria-label="검색" data-act="srch-ex" style="margin-right:-10px">${SEARCH_IC}</button>`)}
    ${walkCard ? `<div class="xlb" style="margin-top:14px">질문으로 묵상하기</div>${walkCard}` : ''}
    <div class="xlb"${walkCard ? '' : ' style="margin-top:14px"'}>내가 탐구하는 질문</div>${curHtml}
    <div class="xlb">이번 주의 질문</div>${weekCard}
    ${past.length ? `<div class="xlb">지난 탐구</div>${rows}` : ''}
  </div>`;
}

// ── 이번 주의 질문(M7b ~ M30, T4): 말씀을 열며 뒤에 한 단계씩 ──
// max: 여기까지 왔다 / view: 지금 펴 둔 단계(0 내 생각, 1 말씀, 2 교회의 고백, 3 마무리)
let WK = { max: 0, view: 0 };
function viewWeek() {
  const wk = weekNow(), wide = isWide();
  const head = `<div class="card xhead"><div class="xlb" style="margin:0 0 6px">이번 주의 질문</div><div class="sf xwq">${esc(wk.q)}</div></div>`
    + (wk.img ? `<img class="q-img" src="${wk.img}" alt="${esc(wk.alt)}" width="1200" height="675" decoding="async" style="margin-top:12px">` : '');   // 정물 그림은 탐구하기 카드에서 이 화면 머리 아래로 옮겼다(S-52)
  const fold = (i, name, sum, skipped) => `<button class="xfd${i === 0 && mine ? ' full' : ''}" type="button" data-act="week-view" data-i="${i}" aria-label="${name}, ${skipped ? '건너뛰었어요' : '답했어요'}. 누르면 다시 펴요"><i class="mk">✓</i><span class="tt"><b>${name}</b><span>${esc(i === 0 && mine ? mine : sum)}</span></span><i class="ar" aria-hidden="true">›</i></button>`;
  const mine = getMine(wk.id);
  const names = ['내 생각 적어보기', '함께 볼 말씀', '교회가 고백해 온 것'];
  const sums = [mine ? oneLine(mine) : '건너뛰었어요', wk.refs.join(', '), shortOf(wk)];
  const open = [
    `<div class="xcur"><div class="xnm s" id="xHead" tabindex="-1">내 생각 적어보기</div>
      <textarea class="field xta" id="wkTa" rows="4" placeholder="솔직한 생각을 적어 봐요. 떠오르는 생각이 없다면 적지 않아도 돼요." aria-label="내 생각 적어보기">${esc(mine)}</textarea>
      ${wk.lastYear ? `<div class="xpriv">${LOCK_IC}<div><div class="sm">작년의 내 생각</div>${esc(wk.lastYear)}</div></div>` : ''}</div>`,
    `<div class="xcur"><div class="xnm s" id="xHead" tabindex="-1">함께 볼 말씀</div><div class="xgq sm">성경을 펴서 읽어 봐요</div>
      <div class="card xvl">${wk.refs.map(r => `<div>${esc(r)}</div>`).join('')}</div></div>`,
    `<div class="xcur"><div class="xnm s" id="xHead" tabindex="-1">교회가 고백해 온 것</div>
      <div class="card" style="margin-top:10px;padding:14px 16px"><div style="font-size:.90625rem;line-height:1.65;word-break:keep-all">${esc(wk.confess)}</div><div class="sm" style="margin-top:10px;font-size:.8125rem;line-height:1.5">${esc(wk.base)}</div></div></div>`
  ];
  let cur = WK.view <= 2 ? open[WK.view] : '';
  let bar;
  if (WK.view === 0) bar = '<button class="btn ol" type="button" data-act="week-next">건너뛰기</button><button class="btn k" type="button" data-act="week-next">다음 →</button>';
  else if (WK.view === 1) bar = '<button class="btn" type="button" data-act="week-next">다음 →</button>';
  else if (WK.view === 2) bar = '<button class="btn" type="button" data-act="week-next">마치기</button>';
  else {
    const m = mineFor(wk);
    cur = `<button class="btn wide" type="button" data-act="pray" style="margin-top:16px;background:var(--accent-soft);color:var(--accent-deep)">이 질문으로 하나님께 기도하기${EXT_IC}</button>
      <div class="xfin"><div class="xft">이번 주의 질문을 다 펴 봤어요.</div><div class="sm">오늘 적은 내 생각은 내년 이맘때<br>이 질문과 함께 다시 보여요.</div></div>
      ${m ? `<div class="sm" style="font-size:.8125rem;margin-top:16px">이 질문과 닿는 내 질문이 있어요</div>
        <div class="card xmine"><span><span class="sf">${esc(m.text)}</span><span class="sm">${qSub(m)}</span></span><button class="tx" type="button" data-act="bring" data-id="${m.id}">좀 더 탐구하기</button></div>`
        : `<button class="btn lt wide" type="button" data-act="bring" style="margin-top:16px">좀 더 탐구하기</button>`}`;
    bar = '<button class="btn" type="button" data-act="week-back">탐구하기로 돌아가기</button>';
  }
  let past = '';
  for (let i = Math.min(WK.max, 2); i >= 0; i--) if (i !== WK.view) past += fold(i, names[i], sums[i], i === 0 && !mine);
  const body = cur + (past ? `<div class="xpast">${past}</div>` : '');
  const actBar = `<div class="xact"><div class="xact-in">${bar}</div></div>`;
  if (wide) return wideShell(head + body + actBar, { week: true, pn: true, top: '' });
  return `<div class="col"><div class="back-row"><a class="tx" href="#/explore"><span style="margin-left:-6px">← 탐구하기</span></a></div>${head}${body}${actBar}</div>`;
}

// ── 서가(S-42): 연재(주제 연재·권별 연재)를 골라 한 번에 한 권씩 걷는다. 완독 표시·진도 숫자는 두지 않는다 ──
function viewWalks() {
  const wide = isWide(), cur = walkCurId(), all = window.WALKS || [];
  const card = w => {
    const kind = w.kind === 'book' ? '권별 연재' : '주제 연재';
    const tail = `${w.eps.length}편으로 된 ${kind}예요.`;
    return `<div class="card xcard" style="margin-top:10px" aria-current="true">${walkCover(w)}<div class="sm">${esc(walkName(w))}</div><div class="sf xct" style="margin-top:4px">${esc(w.title)}</div><div class="sm" style="margin-top:6px;line-height:1.55;word-break:keep-all">${esc(w.line)}</div><div class="sm" style="margin-top:6px">${tail} 지금 묵상하고 있어요.</div><a class="btn${wide ? '' : ' wide'}" href="#/explore/walk/${w.id}" style="margin-top:12px">이어 하기</a></div>`;
  };
  const head = `<div class="card xhead"><div class="xlb" style="margin:0 0 6px">질문으로 묵상하기</div><div class="sf xwq">서가</div></div>`;
  const books = [...new Set(all.map(w => w.book))];
  const bookIndex = book => { const i = BOOKS.findIndex(([n]) => n === book); return i < 0 ? BOOKS.length : i; };
  books.sort((a, b) => bookIndex(a) - bookIndex(b));
  const row = book => {
    const ws = all.filter(w => w.book === book).sort((a, b) => walkPart(a) - walkPart(b));
    const cover = ws.find(w => w.cover);
    const thumb = cover ? `<img class="wk-th" src="${esc(cover.cover)}" alt="" width="128" height="72" decoding="async">` : '<span class="wk-th" aria-hidden="true"></span>';
    if (ws.length === 1) {
      const w = ws[0];
      return `<a class="card xrow wk-bk" href="#/explore/walk/${w.id}">${thumb}<span class="wk-tt"><span style="display:block">${esc(book)}</span><span class="sm">${esc(w.title)}${w.id === cur ? ' 지금 묵상하고 있어요.' : ''}</span></span><span class="xch" aria-hidden="true">›</span></a>`;
    }
    return `<details class="card wk-bk"${ws.some(w => w.id === cur) ? ' open' : ''}><summary class="xrow">${thumb}<span class="wk-tt"><span style="display:block">${esc(book)}</span><span class="sm">${ws.length}부로 나눠 읽어요.</span></span><span class="xch" aria-hidden="true">›</span></summary>${ws.map(w => `<a class="xrow wk-pt" href="#/explore/walk/${w.id}"><span class="wk-tt"><span style="display:block">${walkPart(w)}부 ${esc(w.title)}</span><span class="sm">${walkRange(w) ? walkRange(w) + '을 ' : ''}${w.eps.length}편으로 읽어요.${w.id === cur ? ' 지금 묵상하고 있어요.' : ''}</span></span><span class="xch" aria-hidden="true">›</span></a>`).join('')}</details>`;
  };
  const shelf = old => { const bs = books.filter(book => (bookIndex(book) < 39) === old); return bs.length ? `<div class="xlb">${old ? '구약' : '신약'}</div>${bs.map(row).join('')}` : ''; };
  const current = all.find(w => w.id === cur);
  const body = head + (current ? card(current) : '') + shelf(true) + shelf(false)
    + `<p class="sm" style="margin-top:18px;line-height:1.6;word-break:keep-all">풀이는 STEP Bible 자료에서 확인한 원어를 바탕으로, 여러 교회가 함께 받아들이는 읽기를 따라 AI가 작성하고 사람이 확인한 묵상 글이에요. 다르게 읽히는 곳은 <a href="#/more/feedback">의견 보내기</a>로 알려 주세요.</p>`;
  if (wide) return wideShell(body, { pn: true, top: '' });
  return `<div class="col"><div class="back-row"><a class="tx" href="#/explore"><span style="margin-left:-6px">← 탐구하기</span></a></div>${body}</div>`;
}

// ── 질문을 따라 걷기(S-38): 연재 목록. 열린 토막은 누르고, 아직 안 열린 토막은 흐리게 열리는 날만. 읽은 표시·진도는 두지 않는다 ──
function viewWalk(w) {
  const wide = isWide(), mode = walkMode(w);
  const head = `<div class="card xhead"><div class="xlb" style="margin:0 0 6px">질문으로 묵상하기</div>${walkCover(w)}<div class="sm">${esc(walkName(w))}</div><div class="sf xwq" style="margin-top:2px">${esc(w.title)}</div><p class="wk-p" style="margin-top:10px">${esc(w.intro)}</p></div>`;
  const modes = `<div class="seg" role="radiogroup" aria-label="읽는 방식" style="margin-top:12px">
    <button type="button" role="radio" aria-checked="${mode === 'day'}" class="${mode === 'day' ? 'on' : ''}" data-act="walk-mode" data-id="${w.id}" data-v="day">1일 1편</button>
    <button type="button" role="radio" aria-checked="${mode === 'read'}" class="${mode === 'read' ? 'on' : ''}" data-act="walk-mode" data-id="${w.id}" data-v="read">통독</button>
  </div><div class="sm" style="margin-top:8px;line-height:1.55;word-break:keep-all">${mode === 'read' ? '한 화면에서 쭉 읽어요. 다 읽으면 다음 편이 바로 열려요.' : '하루에 한 편씩 단계를 따라 묵상해요. 머묾까지 읽으면 다음 편이 다음 날 열려요.'}</div>`;
  // 토막 줄: 앞에 순서 번호. 열린 토막은 모두, 안 열린 토막은 바로 다음 하나만 보이고 나머지는 [남은 토막 모두 보기]로 접는다(S-47)
  const no = e => `<span class="wk-no" aria-label="${e.n}편">${e.n}</span>`;
  const openRow = e => `<a class="card xrow wk-row" href="#/explore/walk/${w.id}/${e.n}">${no(e)}<span class="wk-tt"><span style="display:block">${esc(e.title)}</span><span class="sm">${esc(e.ref)}</span></span><span class="xch" aria-hidden="true">›</span></a>`;
  const waitRow = (e, when) => `<div class="card xrow wk-row wk-wait">${no(e)}<span class="wk-tt"><span style="display:block">${esc(e.title)}</span>${when ? `<span class="sm">${when}</span>` : ''}</span></div>`;
  const opened = w.eps.filter(e => walkIsOpen(w, e)), locked = w.eps.filter(e => !walkIsOpen(w, e));
  let rows = opened.map(openRow).join('');
  if (locked.length) {
    const i = w.eps.indexOf(locked[0]), day = walkOpenDN(w, i);
    const when = i === 0 ? '이 연재를 고르면 열려요' : Number.isFinite(day) ? `${walkWhen(day)} 열려요` : '앞 편을 마치면 열려요';
    rows += waitRow(locked[0], when);
    if (locked.length > 1) rows += `<details class="wk-rest"><summary class="tx">남은 편 모두 보기</summary>${locked.slice(1).map(e => waitRow(e, '')).join('')}</details>`;
  }
  const pick = w.id !== walkCurId() ? `<button class="btn${wide ? '' : ' wide'}" type="button" data-act="walk-pick" data-id="${w.id}" style="margin-top:12px">이 연재 시작하기</button>` : '';
  const body = head + modes + pick + `<div style="margin-top:12px">${rows}</div>`;
  if (wide) return wideShell(body, { pn: true, top: '' });
  return `<div class="col"><div class="back-row"><a class="tx" href="#/explore"><span style="margin-left:-6px">← 탐구하기</span></a></div>${body}</div>`;
}

// 한 토막(이번 주의 질문처럼 한 단계씩): 0 본문 읽기 → 1 보기 → 2 묵상(쓰는 칸) → 3 나의 해석(쓰는 칸) → 4 풀이 → 5 머묾. 본문 노트(원어·배경)는 위에 접혀 있고 언제든 편다.
// 사실(본문 노트)은 먼저, 해석(풀이)은 내 묵상과 나의 해석 뒤에 둔다(철학 ⑪). 마친 토막은 머묾까지, 묵상이나 나의 해석만 적어 둔 토막은 풀이까지 펴진 채로 연다
let WE = { key: '', max: 0, view: 0 };
// 본문 노트: 첫 줄은 낱말(히브리어나 그리스어) 우리말 뜻, 그 아래 풀이. 낱말 번호·나오는 절·사전 뜻·같은 낱말은 접힌 "근거"에 모은다(S-43)
const walkNoteRow = n => `<li class="wk-note"><div><b>${esc(n.w)}</b>(<span class="wk-heb" ${n.s.startsWith('G') ? 'lang="grc"' : 'lang="he" dir="rtl"'}>${esc(n.heb)}</span>) ${esc(n.ko)}</div><p>${esc(n.t)}</p><details class="wk-why"><summary class="sm">근거</summary><p class="sm">낱말 번호 ${esc(n.s)}. 이 편에서 나오는 절 ${esc(n.at.join(', '))}. 사전의 영어 뜻 ${esc(n.gloss)}.${n.see.length ? ` 같은 낱말이 나오는 곳 ${esc(n.see.join(', '))}.` : ''}</p></details></li>`;
// 머묾은 두 읽는 방식에서 함께 쓴다. 단계 화면에서만 제목에 초점을 옮긴다(S-70)
function walkStayHtml(w, ep, step = false) {
  const hold = ep.hold ? `<a class="btn wide" href="#/write/walk/${w.id}/${ep.n}" style="margin-top:12px">${ep.hold.kind === 'f' ? '! 발견으로 남기기' : '이 질문을 내 기록에 품기'}</a>` : '';
  const after = ep.after ? `<section class="wk-sec"><div class="xlb">${esc(ep.after.h)}</div>${ep.after.p.map(t => `<p class="wk-p">${esc(t)}</p>`).join('')}</section>` : '';

    const m = /^([?!])\s+(\S.*)$/.exec(line.trim()); if (!m) return;
    const body = m[2].trim(), key = m[1] + '|' + body;

    n.done.push(key);

  });

function buildJournalMd(year) {

  journalEntries().filter(e => journalYearOf(e) === year).forEach(e => {

    blocks.push(`### ${mdEsc(walkDay(dnOfMs(e.t)) + ' ' + e.head)}`);
    if (e.ref) blocks.push(mdEsc(e.ref));
    e.parts.forEach(p => { blocks.push(`**${mdEsc(p.name)}**${p.q ? ' ' + text(p.q) : ''}`, text(p.text)); });

function buildJournalTxt(year) {

    const m = new Date(e.t).getMonth() + 1;
    if (m !== month) { blocks.push(`[${m}월]`); month = m; }
    blocks.push(walkDay(dnOfMs(e.t)) + ' ' + e.head);

    { name: '칸 배경', kids: [...CN.map(([k, nm], i) => ({ name: nm, dot: `var(--tb-${i + 1})`, run: at(td, c => c.setCellAttribute('backgroundColor', k).run()) })), { name: '없음', dot: 'var(--surface)', run: at(td, c => c.setCellAttribute('backgroundColor', null).run()) }] }
  ];
  function closeTable() { if (tm) { tm.remove(); tm = null; } document.removeEventListener('pointerdown', outTable, true); }
  function outTable(e) { if (tm && !tm.contains(e.target)) closeTable(); }
  function drawTable(td, items, title) {
    if (!tm) {
      tm = document.createElement('div'); tm.className = 'mn tbmenu'; tm.setAttribute('role', 'menu'); tm.setAttribute('aria-label', '표 설정'); tm.addEventListener('mousedown', e => e.preventDefault());
      wrap.appendChild(tm); document.addEventListener('pointerdown', outTable, true);
    }
    tm.textContent = '';
    if (title) tm.appendChild(mkBack(title, () => drawTable(td, tblItems(td))));
    items.forEach(it => {
      if (it === 'sep') { const d = document.createElement('div'); d.className = 'sep'; d.setAttribute('role', 'separator'); tm.appendChild(d); return; }
      const r = mkRow(it, false);
      r.addEventListener('click', () => { if (it.kids) { drawTable(td, it.kids, it.name); return; } closeTable(); it.run(); });
      tm.appendChild(r);
    });
    const wr = wrap.getBoundingClientRect(), cr = td.getBoundingClientRect(), w = 200;
    tm.style.top = (cr.top - wr.top + 24) + 'px'; tm.style.left = Math.max(0, Math.min(cr.left - wr.left + cr.width / 2 - w / 2, wr.width - w)) + 'px';
  }
  const inHandle = (e, td) => { const r = td.getBoundingClientRect(); return e.clientY - r.top < 22 && Math.abs(e.clientX - (r.left + r.width / 2)) < 24; };
  const cellOf = e => (e.target.closest ? e.target.closest('td, th') : null);
  const onDown = e => { const td = cellOf(e); hit = false; if (td && host.contains(td) && inHandle(e, td)) { hit = true; e.preventDefault(); } };
  const onClick = e => { const td = cellOf(e); if (hit && td && host.contains(td)) { hit = false; e.preventDefault(); e.stopPropagation(); closeSlash(); closeTable(); cellInfo(td); drawTable(td, tblItems(td)); } };
  host.addEventListener('pointerdown', onDown, true); host.addEventListener('click', onClick, true);

  report();
  return {
    json: () => ed.getJSON(), chars,
    cmd(name) {
      const c = ed.chain().focus();
      if (name === 'bold') c.toggleBold().run(); else if (name === 'highlight') c.toggleHighlight().run(); else if (name === 'quote') c.toggleBlockquote().run();
      else if (name === 'bullet') c.toggleBulletList().run(); else if (name === 'ordered') c.toggleOrderedList().run();
      else if (name === 'q') toggleLine('?'); else if (name === 'f') toggleLine('!');
    },
    focus(where) { ed.commands.focus(where || 'end'); },
    destroy() {
      dead = true; closeSlash(); closeTable(); wrap.removeEventListener('keydown', keyIn, true); host.removeEventListener('pointerdown', onDown, true); host.removeEventListener('click', onClick, true);
      try { ed.destroy(); } catch (e) { /* 이미 없어졌다 */ }
    }
  };
}
window.NoteEditor = { load: () => loadKit().then(() => true), create };
</script>
