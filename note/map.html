<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>말씀 지도</title>
<meta name="theme-color" content="#2B6A62">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="design-styles.css">
<script>
// 노트의 화면 설정을 그림이 그려지기 전에 읽어 입힌다. 읽을 수 없으면 기기 설정을 따른다
try {
  const d = JSON.parse(localStorage.getItem('didako-note-display') || '{}'), r = document.documentElement;
  if (['amber', 'blue', 'rose', 'ink'].includes(d.accent)) r.setAttribute('data-accent', d.accent);
  if (d.mode === 'light' || d.mode === 'dark') r.setAttribute('data-mode', d.mode);
  if (['neu', 'skeu', 'glass'].includes(d.style)) r.setAttribute('data-style', d.style);
  if (d.big === true) r.setAttribute('data-big', '');
} catch (e) {}
</script>
<style>
/* 말씀 지도 시안을 노트에 옮겼다. 색 변수·글꼴·카드·칩·단추·장소 창·화면 모드·큰 글씨는 디다코 노트의 것을 그대로 쓴다(새 색·새 글꼴 없음).
   색 테마도 노트의 저장값을 그대로 따른다. 디자인 스타일(basic·new·classic·glass)은 note/design-styles.css를 그대로 불러 쓴다. 이름과 내용은 모두 지어낸 예시·AI 초안이다. */
:root {
  --page: #F3F5F2; --surface: #FFFFFF; --surface-2: #EEF2EF;
  --ink: #1B2523; --ink-2: #5B6965; --line: #DDE4E0; --line-strong: #B9C4BF;
  --accent: #2B6A62; --accent-mid: #8DBDB5; --accent-soft: #DCEBE7; --on-accent: #FFFFFF;
  --leader: #62519E; --leader-soft: #ECE7F7; --private: #E8ECEA;
  --warn: #9A5A14; --warn-soft: #F5E8D6; --shadow: rgba(20, 35, 32, .14);
  --neu-hi: rgba(255, 255, 255, .9); --neu-lo: rgba(20, 35, 32, .17);
  --note-paper: #F3E4A8; --note-ink: #4E4214; --accent-deep: #1B4F48; --wood: #B98756;
  --base: 16px;
  --f-display: 'Gowun Batang', 'AppleMyungjo', 'Batang', serif;
  --f-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-mode="light"]) {
  --page: #141B19; --surface: #1C2522; --surface-2: #232D2A;
  --ink: #E5ECE9; --ink-2: #9CAAA5; --line: #2D3935; --line-strong: #4A5853;
  --accent: #7CC2B7; --accent-mid: #3F7C73; --accent-soft: #1E3934; --on-accent: #0F1A18;
  --leader: #B6A8EA; --leader-soft: #2A2442; --private: #252E2B;
  --warn: #E2A563; --warn-soft: #3A2C1B; --shadow: rgba(0, 0, 0, .5); --neu-hi: rgba(255, 255, 255, .06); --neu-lo: rgba(0, 0, 0, .6);
  --accent-deep: #7CC2B7; --wood: #7A5636; color-scheme: dark; } }
:root[data-mode="dark"] {
  --page: #141B19; --surface: #1C2522; --surface-2: #232D2A;
  --ink: #E5ECE9; --ink-2: #9CAAA5; --line: #2D3935; --line-strong: #4A5853;
  --accent: #7CC2B7; --accent-mid: #3F7C73; --accent-soft: #1E3934; --on-accent: #0F1A18;
  --leader: #B6A8EA; --leader-soft: #2A2442; --private: #252E2B;
  --warn: #E2A563; --warn-soft: #3A2C1B; --shadow: rgba(0, 0, 0, .5); --neu-hi: rgba(255, 255, 255, .06); --neu-lo: rgba(0, 0, 0, .6);
  --accent-deep: #7CC2B7; --wood: #7A5636; color-scheme: dark; }
/* 글씨: 휴대폰·태블릿 16px, PC 15px. 큰 글씨 모드는 약 1.2배 (글씨 크기는 rem, 칸 크기는 px) */
:root[data-big] { --base: 19px; }
@media (min-width: 1000px) { :root[data-big] { --base: 18px; } }

/* 색 테마(초록은 위 기본값). GBS 앱·시안의 THEMES와 같은 값: 밝은 화면 / 어두운 화면 */
:root[data-accent="amber"] { --page:#F7F2EA;--surface:#FFFDF9;--surface-2:#F1EADF;--ink:#2A221B;--ink-2:#6E6155;--line:#E6DCCD;--line-strong:#C9B9A3;--accent:#A9561B;--accent-mid:#E2B07F;--accent-soft:#F6E3CF;--on-accent:#FFFFFF;--private:#EFE8DE; }
@media (prefers-color-scheme: dark) { :root[data-accent="amber"]:not([data-mode="light"]) { --page:#1A1612;--surface:#231E19;--surface-2:#2B241E;--ink:#EEE6DC;--ink-2:#AE9F8E;--line:#3A3129;--line-strong:#5A4D41;--accent:#E9A066;--accent-mid:#8A5A32;--accent-soft:#3A2818;--on-accent:#1E140C;--private:#2E2721; } }
:root[data-accent="amber"][data-mode="dark"] { --page:#1A1612;--surface:#231E19;--surface-2:#2B241E;--ink:#EEE6DC;--ink-2:#AE9F8E;--line:#3A3129;--line-strong:#5A4D41;--accent:#E9A066;--accent-mid:#8A5A32;--accent-soft:#3A2818;--on-accent:#1E140C;--private:#2E2721; }
:root[data-accent="blue"] { --page:#F2F4F8;--surface:#FFFFFF;--surface-2:#EAEEF4;--ink:#1B2230;--ink-2:#5A6475;--line:#DCE2EB;--line-strong:#B6C0CF;--accent:#2F5D95;--accent-mid:#93AFD3;--accent-soft:#DCE6F3;--on-accent:#FFFFFF;--private:#E8EBF0; }
@media (prefers-color-scheme: dark) { :root[data-accent="blue"]:not([data-mode="light"]) { --page:#12161D;--surface:#1A2029;--surface-2:#212833;--ink:#E4E9F0;--ink-2:#9AA5B5;--line:#2C3542;--line-strong:#485466;--accent:#8EB4E6;--accent-mid:#3C5B85;--accent-soft:#1D2C42;--on-accent:#0E1622;--private:#232A35; } }
:root[data-accent="blue"][data-mode="dark"] { --page:#12161D;--surface:#1A2029;--surface-2:#212833;--ink:#E4E9F0;--ink-2:#9AA5B5;--line:#2C3542;--line-strong:#485466;--accent:#8EB4E6;--accent-mid:#3C5B85;--accent-soft:#1D2C42;--on-accent:#0E1622;--private:#232A35; }
:root[data-accent="rose"] { --page:#F8F2F3;--surface:#FFFDFD;--surface-2:#F2E8EA;--ink:#2A1E21;--ink-2:#6E5B60;--line:#E8DADD;--line-strong:#CDB6BC;--accent:#A8435C;--accent-mid:#DDA2B1;--accent-soft:#F5DFE5;--on-accent:#FFFFFF;--private:#F0E7E9; }
@media (prefers-color-scheme: dark) { :root[data-accent="rose"]:not([data-mode="light"]) { --page:#1A1416;--surface:#231B1E;--surface-2:#2B2226;--ink:#EEE3E6;--ink-2:#B09CA2;--line:#3A2D31;--line-strong:#5A464C;--accent:#E896AB;--accent-mid:#86475A;--accent-soft:#3B2029;--on-accent:#200E14;--private:#2E2428; } }
:root[data-accent="rose"][data-mode="dark"] { --page:#1A1416;--surface:#231B1E;--surface-2:#2B2226;--ink:#EEE3E6;--ink-2:#B09CA2;--line:#3A2D31;--line-strong:#5A464C;--accent:#E896AB;--accent-mid:#86475A;--accent-soft:#3B2029;--on-accent:#200E14;--private:#2E2428; }
:root[data-accent="ink"] { --page:#F4F4F2;--surface:#FFFFFF;--surface-2:#EDEDEA;--ink:#1D1D1B;--ink-2:#62625E;--line:#E0E0DC;--line-strong:#BDBDB7;--accent:#33332F;--accent-mid:#A3A39C;--accent-soft:#E6E6E1;--on-accent:#FFFFFF;--private:#ECECE8; }
@media (prefers-color-scheme: dark) { :root[data-accent="ink"]:not([data-mode="light"]) { --page:#141414;--surface:#1D1D1C;--surface-2:#252524;--ink:#ECECE8;--ink-2:#A3A39E;--line:#30302E;--line-strong:#4D4D4A;--accent:#E2E2DC;--accent-mid:#6A6A65;--accent-soft:#2E2E2C;--on-accent:#141414;--private:#262625; } }
:root[data-accent="ink"][data-mode="dark"] { --page:#141414;--surface:#1D1D1C;--surface-2:#252524;--ink:#ECECE8;--ink-2:#A3A39E;--line:#30302E;--line-strong:#4D4D4A;--accent:#E2E2DC;--accent-mid:#6A6A65;--accent-soft:#2E2E2C;--on-accent:#141414;--private:#262625; }
/* 색 테마를 고르면 진한 포인트(--accent-deep)도 그 테마색을 따르게 한다: 밝은 화면은 테마색을 조금 어둡게, 어두운 화면은 테마색 그대로 */
:root[data-accent] { --accent-deep: color-mix(in srgb, var(--accent) 78%, #000); }
@media (prefers-color-scheme: dark) { :root[data-accent]:not([data-mode="light"]) { --accent-deep: var(--accent); } }
:root[data-accent][data-mode="dark"] { --accent-deep: var(--accent); }

* { box-sizing: border-box; }
html { font-size: var(--base); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; height: 100%; }
html, body { margin: 0; }
body { height: 100%; background: var(--page); color: var(--ink); font-family: var(--f-body); font-size: 1rem; line-height: 1.55; -webkit-tap-highlight-color: transparent; word-break: keep-all; overflow-wrap: anywhere; overflow: hidden; }
button, input, textarea { font: inherit; color: inherit; }
button, a, input, textarea, [role="switch"], [role="radio"] { touch-action: manipulation; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.sf { font-family: var(--f-display); }
.sm { font-size: .875rem; color: var(--ink-2); }
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* 공통 부품(노트와 같은 이름·모양: 디자인 스타일이 그대로 먹는다) */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 12px; border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); font: 700 1rem var(--f-body); text-decoration: none; }
.btn.ghost { background: none; border-color: var(--accent-mid); color: var(--accent-deep); }
.btn.big { width: 100%; min-height: 52px; font-size: 1.0625rem; }
.btn.sm2 { min-height: 44px; padding: 0 14px; font-size: .875rem; }
.btn:disabled { opacity: .5; cursor: default; }
.chip { display: inline-block; padding: 4px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-deep); font-size: .8125rem; font-weight: 500; }
.chip.era { background: var(--surface-2); color: var(--ink-2); }
.field { display: block; width: 100%; min-height: 48px; padding: 11px 12px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); color: var(--ink); font-size: .9375rem; }
.field::placeholder { color: var(--ink-2); }
textarea.field { resize: none; line-height: 1.6; }
.seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; }
.seg button { flex: 1; min-height: 44px; border: 0; border-radius: 10px; background: none; font-size: .875rem; color: var(--ink-2); }
.seg button.on { background: var(--line); color: var(--ink); font-weight: 700; }
.switch { width: 48px; height: 28px; border-radius: 999px; border: 0; background: var(--line-strong); position: relative; flex: none; padding: 0; }
.switch > span { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); transition: left .2s; }
.switch.on { background: var(--accent); }
.switch.on > span { left: 23px; }
.switch::after { content: ""; position: absolute; inset: -8px -2px; }
.ib { width: 44px; height: 44px; background: none; border: 0; display: flex; align-items: center; justify-content: center; color: var(--ink); flex: none; }
.x { width: 44px; height: 44px; border-radius: 12px; background: none; border: 0; color: var(--ink-2); display: grid; place-items: center; flex: none; }
.h1 { font: 700 1.375rem/1.4 var(--f-display); margin: 0; }
.sl { font-size: .875rem; color: var(--ink-2); font-weight: 500; margin: 0 0 8px; }
.toast { pointer-events: none; position: fixed; left: 50%; bottom: calc(32px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: max-content; background: var(--ink); color: var(--page); padding: .6em 1em; border-radius: 10px; font-size: .875rem; z-index: 60; max-width: calc(100% - 32px); text-align: center; }
.toast.pill { background: var(--surface); color: var(--accent); border: 1px solid var(--line); box-shadow: 0 4px 14px var(--shadow); font-weight: 500; border-radius: 999px; padding: .5em 1.1em; }

/* 아래에서 올라오는 창(남기기·화면 설정) */
.pop { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.pop-scrim { position: absolute; inset: 0; background: rgb(0 0 0 / .4); }
.pop-sheet { position: relative; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; background: var(--page); border-radius: 20px 20px 0 0; padding: 20px 16px max(28px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -8px 28px var(--shadow); }
@media (min-width: 640px) { .pop { align-items: center; } .pop-sheet { border-radius: 18px; } }
.pop-sheet h2 { margin: 0; font: 700 1.25rem/1.35 var(--f-display); }
.pop-sheet p { margin: 0; font-size: .9375rem; line-height: 1.65; }
.pop-sheet form { display: flex; flex-direction: column; gap: 12px; }
.sheet-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
:root[data-style="glass"] .pop-sheet { background: var(--glass-strong); }

/* ── 화면 짜임 ── */
.app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
.top { flex: none; padding: 4px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); position: relative; z-index: 45; }   /* 시대 목록·찾기 결과가 장소 판(40) 위로 펼쳐지게 */
.hdr { display: flex; justify-content: space-between; align-items: center; min-height: 44px; padding-top: env(safe-area-inset-top, 0px); }
.map-heading { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.map-back { display: inline-flex; align-items: center; min-height: 44px; color: var(--accent-deep); font-size: .875rem; text-decoration: none; }
.hdr .tools { display: flex; margin-right: -10px; }
.sbox { position: relative; margin-top: 4px; }
.sbox .field { padding-right: 44px; }
.sbox .clr { position: absolute; right: 0; top: 2px; }
.results { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 8; list-style: none; margin: 0; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 28px var(--shadow); }
.results button { display: flex; flex-direction: column; align-items: flex-start; width: 100%; min-height: 44px; padding: 6px 12px; background: none; border: 0; border-radius: 10px; text-align: left; }
.results button:hover, .results button:focus-visible { background: var(--accent-soft); }
.results b { font-weight: 600; }
.results .none { padding: 12px; color: var(--ink-2); font-size: .875rem; }
.qmore { margin: 4px 0 12px; padding: 0 4px; }
.mapwrap { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; }   /* 위 지도 8, 아래 받은 질문 띠 2 */
/* 받은 질문 띠: 지도 8 : 띠 2. 긴 질문도 자르지 않고 한 장에 보이게 최소 높이를 맞춘다 */
.today { order: 2; flex: 2 1 0; min-height: var(--strip-min, 0px); display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 4px; padding: 0 6px; margin: 0; border-radius: 20px 20px 0 0; border-bottom: 0; box-shadow: 0 -2px 10px var(--shadow); position: relative; z-index: 4; }
.qstrip { width: 100%; min-width: 0; align-self: stretch; display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 8px 0; scrollbar-width: none; }
.qstrip::-webkit-scrollbar { display: none; }
/* 시대 고르기: 머리줄의 작은 단추 → 아래로 펼쳐지는 목록 */
.erabtn { display: inline-flex; align-items: center; gap: 2px; min-height: 36px; margin: 4px 4px 4px 0; padding: 0 10px 0 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line-strong); color: var(--ink); font-size: .8125rem; font-weight: 600; white-space: nowrap; }
.erabtn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-deep); }
.today .nv { position: relative; display: flex; width: 40px; height: 40px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line-strong); color: var(--ink); box-shadow: 0 1px 4px var(--shadow); }
.today .nv::after { content: ""; position: absolute; inset: -2px; }
.today .nv:disabled { opacity: .35; cursor: default; }
.today .tb { margin: 0; flex: 0 0 100%; min-width: 0; display: flex; flex-direction: column; gap: 4px; align-self: center; text-align: left; padding: 10px 14px; justify-content: flex-start; scroll-snap-align: center; color: var(--ink); }
.today .tb .meta { display: flex; align-items: center; gap: 4px 8px; flex-wrap: wrap; min-height: 22px; font-size: .8125rem; color: var(--ink-2); }
.today .tb .q { font: 700 1.0625rem/1.5 var(--f-display); color: var(--ink); }
.today .tb .ask { font-size: .8125rem; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.today .tb .go { margin-left: auto; white-space: nowrap; font-size: .875rem; font-weight: 600; color: var(--accent-deep); }
.today .tb .meta > .sm { margin-left: auto; white-space: nowrap; }
.today .tb .chip { padding: 2px 10px; font-size: .75rem; line-height: 18px; }   /* 장소 칩이 있어도 없어도 카드 높이가 같게(meta 줄 22px) */
.eras { position: absolute; top: calc(100% - 4px); right: 12px; z-index: 8; display: flex; flex-direction: column; gap: 2px; min-width: 168px; padding: 6px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 6px 24px var(--shadow); }
.eras[hidden] { display: none; }
.eras .chip-btn { display: flex; align-items: center; justify-content: flex-start; text-align: left; border: 0; background: none; border-radius: 10px; min-height: 40px; }
.eras .chip-btn.on { background: var(--accent-soft); }
.eras::-webkit-scrollbar { display: none; }
.chip-btn { flex: none; min-height: 40px; padding: 0 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line-strong); color: var(--ink-2); font-size: .875rem; white-space: nowrap; }
.chip-btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-deep); font-weight: 700; }
.body { flex: 1; min-height: 0; display: flex; }
.stage { order: 1; position: relative; flex: 8 1 0; min-height: 0; min-width: 0; overflow: hidden; background: #2a3a4f; /* 지도 그림이 오기 전 잠깐 보이는 바다 색. 그림 밖은 보이지 않는다 */ touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; outline: none; }
.stage.drag { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; width: 1728px; height: 2208px; max-width: none; transform-origin: 0 0; will-change: transform; image-rendering: auto; -webkit-user-drag: none; pointer-events: none; }
.world.px { image-rendering: pixelated; }
.zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 8px; z-index: 3; }
.zoom button { position: relative; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line-strong); background: color-mix(in srgb, var(--surface) 92%, transparent); color: var(--ink); box-shadow: 0 2px 8px var(--shadow); display: grid; place-items: center; }

.zoom button::after { content: ""; position: absolute; inset: -4px; }

/* 두 겹 지도: 구역은 그림 좌표에 맞추고, 단추는 지도 위에 둔다 */
.canaan-box { position: absolute; padding: 0; border: 3px solid var(--accent); border-radius: 8px; background: color-mix(in srgb, var(--accent) 10%, transparent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--surface) 75%, transparent), 0 2px 10px var(--shadow); z-index: 0; color: var(--ink); }

.pin .dot { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); box-shadow: 0 1px 3px var(--shadow); }
.pin.sp .dot { width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 2px; transform: rotate(45deg); border-width: 1.5px; }
.pin .lbl { position: absolute; left: calc(50% + var(--lx, 11px)); top: calc(50% + var(--ly, -10px)); white-space: nowrap; font: 600 .75rem/1 var(--f-body); color: var(--ink); background: color-mix(in srgb, var(--surface) 90%, transparent); padding: 3px 7px; border-radius: 999px; box-shadow: 0 1px 3px var(--shadow); pointer-events: none; }

.pin.sel { z-index: 2; opacity: 1; }
.pin.sel .dot { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 35%, transparent), 0 1px 3px var(--shadow); }
.pin.sp.sel .dot { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }

.pin.flash .dot { animation: pin-flash .6s ease-in-out 2; }
@keyframes pin-flash { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--accent) 35%, transparent); } }
@media (prefers-reduced-motion: reduce) { .pin.flash .dot { animation: none; box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 35%, transparent); } }

/* 장소 창: 휴대폰은 아래에서 올라오는 창, 넓은 화면(900px 이상)은 오른쪽 고정 판 */

  .scrim { display: none !important; }

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const calm = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
const isWide = () => matchMedia('(min-width: 900px)').matches;

// ══════════════ 데이터 ══════════════
// 장소·장절·한 줄 풀이·질문과의 짝은 모두 AI 초안이고 교역자 확인 전이다. 성경 원문은 싣지 않고 장절과 쉬운 풀이만 둔다. 하나님과 예수님은 그리지 않는다.
const ERA = { pat: '족장', exo: '출애굽과 정착', king: '왕국', proph: '예언자', jesus: '예수님', church: '초대 교회' };
// 마을 19곳: x·y는 옛칸(지도는 36×46칸, 한 칸 = 그림 48px). 이야기는 장절·시대·쉬운 풀이(prototype/merchant에서 옮김)
const PLACES = window.MAP_TOWNS;
// 이야기 터 12곳. 시대(era)는 prototype/merchant에 없어서 장절을 보고 정했다(책이 속한 시대, 사무엘 이야기는 왕국)
const SPOTS = window.MAP_SPOTS;
const ERA_ORDER = ['pat', 'exo', 'king', 'proph', 'jesus', 'church'];
const NT = new Set(['jesus', 'church']);
const eraLabel = e => (NT.has(e) ? '신약' : '구약') + ' · ' + ERA[e];
const ERA_CHIP = [['all', '모든 시대'], ['pat', '족장'], ['exo', '출애굽과 정착'], ['king', '왕국'], ['proph', '예언자'], ['jesus', '예수님'], ['church', '교회']];

// 성경 책 순서(장절 순서로 줄 세우기와 장절 찾기에 쓴다): [전체 이름, 줄임 이름]
const BOOKS = [['창세기', '창'], ['출애굽기', '출'], ['레위기', '레'], ['민수기', '민'], ['신명기', '신'], ['여호수아', '수'], ['사사기', '삿'], ['룻기', '룻'], ['사무엘상', '삼상'], ['사무엘하', '삼하'],
  ['열왕기상', '왕상'], ['열왕기하', '왕하'], ['역대상', '대상'], ['역대하', '대하'], ['에스라', '스'], ['느헤미야', '느'], ['에스더', '에'], ['욥기', '욥'], ['시편', '시'], ['잠언', '잠'],
  ['전도서', '전'], ['아가', '아'], ['이사야', '사'], ['예레미야', '렘'], ['예레미야애가', '애'], ['에스겔', '겔'], ['다니엘', '단'], ['호세아', '호'], ['요엘', '욜'], ['아모스', '암'],
  ['오바댜', '옵'], ['요나', '욘'], ['미가', '미'], ['나훔', '나'], ['하박국', '합'], ['스바냐', '습'], ['학개', '학'], ['스가랴', '슥'], ['말라기', '말'], ['마태복음', '마'],
  ['마가복음', '막'], ['누가복음', '눅'], ['요한복음', '요'], ['사도행전', '행'], ['로마서', '롬'], ['고린도전서', '고전'], ['고린도후서', '고후'], ['갈라디아서', '갈'], ['에베소서', '엡'], ['빌립보서', '빌'],
  ['골로새서', '골'], ['데살로니가전서', '살전'], ['데살로니가후서', '살후'], ['디모데전서', '딤전'], ['디모데후서', '딤후'], ['디도서', '딛'], ['빌레몬서', '몬'], ['히브리서', '히'], ['야고보서', '약'], ['베드로전서', '벧전'],
  ['베드로후서', '벧후'], ['요한일서', '요일'], ['요한이서', '요이'], ['요한삼서', '요삼'], ['유다서', '유'], ['요한계시록', '계']];
const BOOK_ONE = new Map(); BOOKS.forEach(([f, s], i) => { BOOK_ONE.set(f, i); BOOK_ONE.set(s, i); });
// 장절 글 → { b: 책 번호, c: 장, v1, v2: 절 범위(없으면 null) }. "창세기 3장 9절"·"시편 85편 6절"·"왕상 5:1~12"·"요 2" 모두 읽는다
const REF_RE = /^([가-힣]+)\s*(\d+)(?:\s*[장편](?:\s*(\d+)\s*절?)?|\s*[:：]\s*(\d+)(?:\s*[~\-]\s*(\d+))?\s*절?)?\s*$/;
function parseRef(s) {
  const m = REF_RE.exec(String(s).trim()); if (!m) return null;
  const b = BOOK_ONE.get(m[1]); if (b === undefined) return null;
  const v1 = m[3] ? +m[3] : m[4] ? +m[4] : null, v2 = m[5] ? +m[5] : v1;
  return { b, c: +m[2], v1, v2 };
}
const refOrder = r => (r ? r.b * 1e6 + r.c * 1e3 + (r.v1 || 0) : 9e9);
// 질문의 시대: 장소가 아니라 ref의 책으로 정한다(복음서 = 예수님, 사도행전과 편지 = 교회, 구약은 책에 맞는 시대). 엘리야·엘리사 이야기(왕상 17장~왕하)는 마을 이야기와 같게 예언자
function eraOfRef(r) {
  if (!r) return null;
  const b = r.b;
  if (b === 0 || b === 17) return 'pat';
  if (b >= 1 && b <= 7) return 'exo';
  if (b === 10 && r.c >= 17) return 'proph';
  if (b === 11) return 'proph';
  if ((b >= 8 && b <= 13) || (b >= 18 && b <= 21)) return 'king';
  if (b >= 14 && b <= 16) return 'proph';
  if (b >= 22 && b <= 38) return 'proph';
  if (b >= 39 && b <= 42) return 'jesus';
  return 'church';
}

// ── 장소 모으기: 마을 19곳 + 이야기 터 12곳 + 질문 장소(map-places.js의 새 곳) ──
const PL = {};
Object.entries(PLACES).forEach(([key, p]) => { PL[key] = { key, kind: 'town', name: window.MAP_NAMES[key], region: p.region, x: p.x, y: p.y, stories: p.stories.map(s => ({ ...s, r: parseRef(s.ref) })), qs: [] }; });
Object.entries(SPOTS).forEach(([key, s]) => { PL[key] = { key, kind: 'spot', name: window.MAP_NAMES[key], region: s.region, x: s.x, y: s.y, stories: [{ ref: s.ref, era: s.era, t: s.line, r: parseRef(s.ref) }], qs: [] }; });
Object.entries(window.Q_PLACES_NEW || {}).forEach(([key, s]) => { PL[key] = { key, kind: 'qplace', name: window.MAP_NAMES[key], region: s.region, x: s.x, y: s.y, stories: [], qs: [] }; });
Object.values(PL).forEach(p => { p.layer = 'near'; });
Object.entries(window.WIDE_PLACES).forEach(([key, p]) => { PL[key] = { ...p, key, layer: 'wide', region: '', stories: [], qs: [] }; });
const PL_ORDER = Object.keys(PL);

// ── 오늘의 질문 409개(note/questions-data.js) ──
const QT = (window.NOTE_Q && window.NOTE_Q.today) || {};
const imgKey = it => String(it.img).replace(/^img\/q\//, '').replace(/\.webp$/, '');
const QBY = {};   // 질문 키 → 질문
Object.entries(QT).forEach(([season, arr]) => arr.forEach(it => {
  const key = imgKey(it), r = parseRef(it.ref);
  QBY[key] = { ...it, key, r, era: eraOfRef(r), season, place: null };
}));
Object.entries({ ...window.Q_PLACES, ...window.Q_WIDE }).forEach(([qk, pk]) => { const q = QBY[qk], p = PL[pk]; if (q && p) { q.place = pk; p.qs.push(q); } });
PL_ORDER.forEach(key => PL[key].qs.sort((a, b) => refOrder(a.r) - refOrder(b.r)));
PL_ORDER.forEach(key => { const p = PL[key]; p.eras = new Set([...p.stories.map(s => s.era), ...p.qs.map(q => q.era)].filter(Boolean)); p.weight = p.stories.length + p.qs.length; });

// ── 교회력 계산 시작(note/index.html의 것을 그대로 옮겼다: docs/today-questions/README.md의 규칙. 오늘의 질문 고르기에 쓴다) ──
const DN = (y, m, d) => Math.round(Date.UTC(y, m - 1, d) / 86400000);
const fromDN = n => { const t = new Date(n * 86400000); return { y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate() }; };
const dowOf = n => (((n + 4) % 7) + 7) % 7;
function easterDN(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1;
  return DN(y, mo, da);
}
function adventDN(y) { const c = DN(y, 12, 25), w = dowOf(c); return c - (w || 7) - 21; }
function churchDay(y, m, d, bank) {
  const t = DN(y, m, d), c25 = DN(y, 12, 25), adv = adventDN(y), easter = easterDN(y), ash = easter - 46, pent = easter + 49;

    return `<div class="qitem${hlQ === q.key ? ' hl' : ''}" data-q="${q.key}"><div class="qline"><button class="qmain" type="button" data-act="q-toggle" data-q="${q.key}" aria-expanded="${open}"><img src="img/q/${q.key}.webp" alt="" loading="lazy"><span class="qt"><b>${esc(q.q)}</b><span class="sm">${esc(q.asker)}</span><span class="chip">${esc(q.ref)}</span></span></button><button class="btn ghost sm2" type="button" data-act="leave-q" data-q="${q.key}" aria-label="내 질문에 품기">내 질문에 품기</button></div>${open ? `<div class="qbg">${esc(q.bg)}</div>` : ''}</div>`;
  }).join('')}</section>` : '';
  const qMore = more ? `<p class="sm qmore">이곳에서 나올 질문이 더 있어요</p>` : '';   // 아직 오지 않은 질문: 글·날짜·개수는 보이지 않는다
  const mine = notesMem.filter(n => n.place === selKey).sort((a, b) => b.at - a.at);
  const mHtml = mine.length ? `<section class="sec" aria-label="내가 남긴 것"><h3 class="sl">내가 남긴 것</h3><ul class="mine">${mine.map(n => `<li><span class="sm">${dateOf(n.at)}</span><p><a class="map-back" href="index.html#/mine/${n.route}/${encodeURIComponent(n.target)}">${esc(n.text.split(/\r?\n/)[0])}</a></p></li>`).join('')}</ul></section>` : '';
  const img = p.layer === 'near' && p.kind === 'town' ? `<img class="pimg" src="img/towns/${p.key}.webp" alt="${esc(p.name)} 그림" onerror="this.remove()">` : '';
  return `<div class="pbody"><button class="x px" type="button" data-act="p-x" aria-label="닫기">${X_IC}</button>${img}<div class="phead"><h2>${esc(p.name)}</h2><div class="sm">${esc(p.region)}</div></div>${sHtml}${qHtml}${qMore}${p.layer === 'near' ? mHtml : ''}</div>`;
}
function paintPanel(keepScroll) {
  const old = panel.querySelector('.pbody'), sc = keepScroll && old ? old.scrollTop : 0;
  panel.innerHTML = panelHTML();
  const bd = panel.querySelector('.pbody'); if (bd) bd.scrollTop = sc;
  panel.classList.toggle('open', !!selKey);
  $('#scrim').hidden = !(selKey && !isWide());
  syncInert();
}
function select(key, o) {
  o = o || {};
  if (!PL[key] || labelOnly(PL[key])) return;
  setLayer(PL[key].layer);
  if (selKey && pins[selKey]) pins[selKey].el.classList.remove('sel');
  selKey = key; hlQ = o.hlQ || (todayQ && todayQ.place === key ? todayQ.key : null); openQ = new Set();
  pins[key].el.classList.add('sel');
  paintPanel(false);
  if (o.fly) { const c = cellPx(PL[key]), v = viewCenter(); flyTo(Math.max(k, 0.62), c[0], c[1], v[0], v[1]); } else layoutPins();
  const f = panel.querySelector('.px'); if (f && !isWide()) f.focus({ preventScroll: true });
  if (o.hlQ) { const hl = panel.querySelector('.qitem.hl'); if (hl) hl.scrollIntoView({ block: 'nearest', behavior: 'auto' }); }   // 오늘의 질문 카드에서 열면 강조된 질문이 보이게
}
function viewCenter() {   // 휴대폰에서는 장소 창이 가린 아래쪽을 빼고, 보이는 지도의 가운데
  if (isWide() || !selKey) return [sw / 2, sh / 2];
  const st = stage.getBoundingClientRect(), top = panel.getBoundingClientRect().top;
  const bottom = Math.max(st.top + Math.min(160, sh * 0.4), Math.min(st.bottom, top));
  return [sw / 2, (bottom - st.top) / 2];
}
function deselect() {
  if (!selKey) return;
  const was = selKey; pins[was].el.classList.remove('sel'); selKey = null; hlQ = null; layoutPins(); paintPanel(false);
  if (!isWide()) pins[was].el.focus({ preventScroll: true });
}
// 휴대폰 장소 창이 떠 있으면 뒤 지도를 누르지 못하게 한다. 오늘의 질문으로 돌아가는 링크는 남긴다
function syncInert() {
  const modalPanel = !!selKey && !isWide();
  stage.inert = modalPanel; $('#today').inert = modalPanel;
  document.querySelectorAll('#top button, #sbox').forEach(el => { el.inert = modalPanel; });
}

// 지도는 쓰는 화면으로 이어 주고, 기록은 노트에서 저장한다.
function openWrite(kind, id) {
  location.href = `index.html#/write/map/${encodeURIComponent(selKey)}/${kind}/${encodeURIComponent(id)}`;
}

// ══════════════ 찾기 ══════════════
const norm = s => String(s).replace(/\s+/g, '').toLowerCase();
function search(raw) {
  const q = raw.trim(); if (!q) return [];
  const out = [], seen = new Set(), add = (key, sub) => { if (!labelOnly(PL[key]) && !seen.has(key) && out.length < 8) { seen.add(key); out.push({ key, sub }); } };
  const nq = norm(q);
  PL_ORDER.forEach(key => { if (norm(PL[key].name).includes(nq)) add(key, PL[key].region); });
  const m = REF_RE.exec(q);
  if (m) {
    const b = BOOK_ONE.get(m[1]), books = b !== undefined ? [b] : BOOKS.map((x, i) => (x[0].startsWith(m[1]) ? i : -1)).filter(i => i >= 0);
    const ch = +m[2], vv = m[3] ? +m[3] : m[4] ? +m[4] : null;
    const ok = r => r && books.includes(r.b) && r.c === ch && (vv === null || r.v1 === null || (vv >= r.v1 && vv <= (r.v2 || r.v1)));
    PL_ORDER.forEach(key => {
      const p = PL[key], hit = p.stories.find(s => ok(s.r)) || openQs(p).find(x => ok(x.r));
      if (hit) add(key, hit.ref);
    });
  }
  return out;
}
let results = [];
function paintResults() {
  const raw = $('#sq').value, ul = $('#results');
  if (!raw.trim()) { ul.hidden = true; ul.innerHTML = ''; results = []; return; }
  results = search(raw);
  ul.innerHTML = results.length ? results.map(r => `<li><button type="button" data-act="res" data-k="${r.key}"><b>${esc(PL[r.key].name)}</b><span class="sm">${esc(r.sub)}</span></button></li>`).join('') : `<li class="none">찾는 곳이 없어요</li>`;
  ul.hidden = false;
}
function toggleSearch(open) {
  const box = $('#sbox'); box.hidden = !open; $('#btnSearch').setAttribute('aria-expanded', String(open));
  if (open) $('#sq').focus(); else { $('#sq').value = ''; paintResults(); }
  requestAnimationFrame(() => measure());
}

// ══════════════ 눌렀을 때 ══════════════
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'p-x') deselect();
  else if (act === 'q-toggle') { const id = a.dataset.q; openQ.has(id) ? openQ.delete(id) : openQ.add(id); paintPanel(true); const nb = panel.querySelector(`[data-act="q-toggle"][data-q="${id}"]`); if (nb) nb.focus({ preventScroll: true }); }
  else if (act === 'leave-s') openWrite('s', a.dataset.i);
  else if (act === 'leave-q') openWrite('q', a.dataset.q);
  else if (act === 'res') { const key = a.dataset.k; toggleSearch(false); select(key, { fly: true }); }
});
$('#scrim').addEventListener('click', deselect);
$('#btnSearch').addEventListener('click', () => toggleSearch($('#sbox').hidden));
$('#sq').addEventListener('input', paintResults);
$('#sq').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); const first = results[0]; if (first) { toggleSearch(false); select(first.key, { fly: true }); } } });
function toggleEras(open) {
  if (layer === 'wide') open = false;
  $('#eras').hidden = !open; $('#eraBtn').setAttribute('aria-expanded', String(open));
  if (open) { const b = $('#eras .chip-btn.on') || $('#eras .chip-btn'); if (b) b.focus(); }
}
$('#eraBtn').addEventListener('click', e => { e.stopPropagation(); toggleEras($('#eras').hidden); });
$('#eras').addEventListener('click', e => { const b = e.target.closest('.chip-btn'); if (!b) return; e.stopPropagation(); eraSel = b.dataset.era; paintEra(); if (selKey) paintPanel(true); toggleEras(false); $('#eraBtn').focus(); });
document.addEventListener('click', e => { if (!$('#eras').hidden && !e.target.closest('#eras, #eraBtn')) toggleEras(false); });
$('#today').addEventListener('click', e => {
  const nav = e.target.closest('[data-strip]');
  if (nav) { scrollToCard(Math.max(0, Math.min(stripItems.length - 1, stripIndex + Number(nav.dataset.strip)))); return; }
  const b = e.target.closest('.tb');
  if (b && b.dataset.pair) select(b.dataset.pair, { fly: true, hlQ: b.dataset.q });
});
$('#canaan').addEventListener('click', () => { if (!suppressClick) { setLayer('near'); $('#nearBack').focus({ preventScroll: true }); } });
$('#nearBack').addEventListener('click', () => { setLayer('wide'); $('#canaan').focus({ preventScroll: true }); });
$('#zIn').addEventListener('click', () => zoomAt(1.5, sw / 2, sh / 2));
$('#zOut').addEventListener('click', () => zoomAt(1 / 1.5, sw / 2, sh / 2));
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('#eras').hidden) { toggleEras(false); $('#eraBtn').focus(); } else if (!$('#sbox').hidden) toggleSearch(false); else if (selKey && !isWide()) deselect();
});

// ── 지도 위 손짓: 한 손가락(마우스)은 끌어 옮기기, 두 손가락은 키우기·줄이기, 두 번 누르면 그 자리를 두 배로, 휠은 키우기 ──
const ptrs = new Map();
let g = null, suppressClick = false, lastTap = { t: 0, x: 0, y: 0 };
const local = e => { const r = stage.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
function nearestPin(px, py, r) {
  let best = null, bd = r * r;
  activeKeys().filter(key => !labelOnly(PL[key])).forEach(key => { const pn = pins[key], dx = pn.sx - px, dy = pn.sy - py, d = dx * dx + dy * dy; if (d <= bd) { bd = d; best = key; } });
  return best;
}
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('.zoom, .layer-back')) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  cancelAnimationFrame(anim);
  const [x, y] = local(e); ptrs.set(e.pointerId, { x, y });
  if (ptrs.size === 1) g = { mode: 'tap', x0: x, y0: y, moved: false };
  else if (ptrs.size === 2) {
    const [p, q] = [...ptrs.values()]; g = { mode: 'pinch', d0: Math.hypot(p.x - q.x, p.y - q.y) || 1, k0: k, moved: true };
    ptrs.forEach((v, id) => { try { stage.setPointerCapture(id); } catch (err) { /* 잡지 못해도 된다 */ } });
  }
});
stage.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId) || !g) return;
  const [x, y] = local(e), o = ptrs.get(e.pointerId);
  if (g.mode === 'pinch' && ptrs.size >= 2) {
    ptrs.set(e.pointerId, { x, y });
    const [p, q] = [...ptrs.values()], d = Math.hypot(p.x - q.x, p.y - q.y) || 1, mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
    zoomAt((g.k0 * d / g.d0) / k, mx, my); return;
  }
  if (g.mode === 'tap' && Math.hypot(x - g.x0, y - g.y0) > 6) {
    g.mode = 'pan'; g.moved = true; stage.classList.add('drag');
    try { stage.setPointerCapture(e.pointerId); } catch (err) { /* 잡지 못해도 된다 */ }
  }
  if (g.mode === 'pan') { tx += x - o.x; ty += y - o.y; ptrs.set(e.pointerId, { x, y }); paint(); }
});
function endPtr(e) {
  if (!ptrs.has(e.pointerId)) return;
  const [x, y] = local(e); ptrs.delete(e.pointerId);
  if (g && g.moved) suppressClick = true;
  if (g && g.mode === 'tap' && e.type === 'pointerup' && !nearestPin(x, y, 28)) {   // 빈 자리를 두 번 누르면 그 자리를 두 배로
    const now = performance.now();
    if (now - lastTap.t < 320 && Math.hypot(x - lastTap.x, y - lastTap.y) < 30) {
      lastTap.t = 0;
      if (k >= K_MAX - 1e-3) flyTo(kFit, (IMG_W) / 2, (IMG_H) / 2);
      else { const wx = (x - tx) / k, wy = (y - ty) / k; flyTo(k * 2, wx, wy, x, y); }   // 누른 자리가 제자리에 머물며 커진다
    } else lastTap = { t: now, x, y };
  }
  if (ptrs.size === 0) { g = null; stage.classList.remove('drag'); setTimeout(() => { suppressClick = false; }, 0); }
  else if (ptrs.size === 1) { const r = [...ptrs.values()][0]; g = { mode: 'pan', moved: true }; ptrs.set([...ptrs.keys()][0], r); stage.classList.add('drag'); }
}
stage.addEventListener('pointerup', endPtr);
stage.addEventListener('pointercancel', endPtr);
stage.addEventListener('wheel', e => {
  e.preventDefault(); cancelAnimationFrame(anim);
  const [x, y] = local(e), dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
  zoomAt(Math.exp(-dy * (e.ctrlKey ? 0.01 : 0.0015)), x, y);
}, { passive: false });
stage.addEventListener('click', e => {
  if (suppressClick) { suppressClick = false; return; }
  if (e.target.closest('#canaan, .layer-back, .label-only')) return;
  const pin = e.target.closest('.pin');
  if (e.detail === 0 && pin) { select(pin.dataset.k); return; }   // 키보드로 누른 것
  if (e.target.closest('.zoom, .layer-back')) return;
  const [x, y] = local(e), key = nearestPin(x, y, 30);   // 점이 겹쳐 있어도 가장 가까운 점을 연다
  if (key) select(key);
});

// ══════════════ 시작 ══════════════
world.style.width = IMG_W + 'px'; world.style.height = IMG_H + 'px';
paintToday(); paintEra(); paintPanel(false);
new ResizeObserver(() => measure()).observe(stage);
measure();
function openAddress() {
  const args = new URLSearchParams(location.hash.slice(1)), key = args.get('p'), q = args.get('q');
  const found = q ? stripItems.findIndex(item => item.q.key === q) : -1, index = found >= 0 ? found : 0;
  scrollToCard(index, false); activateStrip(index, !Object.hasOwn(PL, key));
  if (Object.hasOwn(PL, key)) select(key, { fly: true, hlQ: Object.hasOwn(QBY, q) && QBY[q].place === key && isOpen(QBY[q]) ? q : null });
}
openAddress();
window.addEventListener('hashchange', openAddress);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { Object.values(pins).forEach(pn => { pn.lw = 0; }); paint(); });
window.addEventListener('resize', () => { paintPanel(true); });
// 시안 확인을 위해 열어 둔 손잡이(화면에는 보이지 않는다)
window.SCRIPTURE_MAP = { PL, QBY, view: () => ({ layer, IMG_W, IMG_H, k, tx, ty, kFit, sw, sh }), pins: () => Object.fromEntries(PL_ORDER.map(key => [key, { x: pins[key].sx, y: pins[key].sy, lbl: !pins[key].el.classList.contains('nolbl'), dim: pins[key].el.classList.contains('dim') }])) };
})();
</script>
