<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>제본용 PDF - 디다코</title>
<!-- 제본용 PDF(2026-11-26): 앱 관리자 화면(#bind-교재)에서 새 창으로 여는 쪽이다. 글은 book-print.js가 만들고,
     본문은 쪽 나누기 도구(Paged.js, vendor/)로 B5 쪽에 나눈 뒤 브라우저 인쇄 창의 'PDF로 저장'으로 받는다. 표지는 나누지 않고 한 장씩 그대로 인쇄한다. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
html { background: #6b6862; }
body { margin: 0; font: 400 14px/1.6 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
#bar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 16px; background: #fbf9f5; border-bottom: 1px solid #d8d2c6; color: #2a2620; }
#bar b { font-weight: 600; }
#msg { flex: 1 1 260px; color: #5b564c; }
#bar button { appearance: none; min-height: 40px; padding: 0 18px; border: 0; border-radius: 10px; background: #A9561B; color: #fff; font: 600 14px 'IBM Plex Sans KR', sans-serif; cursor: pointer; }
#bar button[disabled] { background: #b9b2a6; cursor: default; }
#bar button.ghost { background: transparent; color: #5b564c; border: 1px solid #cfc7b8; }
#stage { padding: 20px 0 60px; }
#src { position: absolute; left: -99999px; top: 0; visibility: hidden; }
#err { margin: 40px auto; max-width: 420px; padding: 20px; border-radius: 12px; background: #fbf9f5; text-align: center; }
/* 쪽 나누기 도구가 만든 쪽을 화면에 가운데로 세워 보인다 */
.pagedjs_pages { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.pagedjs_page { background: #fff; box-shadow: 0 4px 18px rgba(0, 0, 0, .35); flex: none; }
/* 표지는 펼침면이 가로로 넓어 화면에서만 줄여 보인다 */
@media screen { body.cover #stage { display: flex; flex-direction: column; align-items: center; gap: 16px; } body.cover .spread { zoom: .5; box-shadow: 0 4px 18px rgba(0, 0, 0, .35); } }
/* 표지의 안내선과 표 이름은 보기용이다. 인쇄 미디어 규칙(book-print.js)에 더해, 인쇄가 시작될 때 body에 printing 표시를 달아 한 번 더 감춘다 */
body.printing .g, body.printing .tag, body.printing .bcg { display: none !important; }
@media print {
  html, body { background: #fff; }
  #bar, #err { display: none !important; }
  #stage { padding: 0; }
  #src { display: none !important; }
  .pagedjs_pages { display: block; }
  .pagedjs_page { box-shadow: none; margin: 0 !important; }
  .pagedjs_pages > .pagedjs_page:last-of-type { break-after: auto !important; page-break-after: auto !important; }
}
</style>
</head>
<body>
<div id="bar"><b id="ttl">제본용 PDF</b><span id="msg">준비하고 있어요…</span><button id="go" type="button" disabled>PDF로 저장</button></div>
<div id="stage"></div>
<div id="src"></div>
<script>window.PagedConfig = { auto: false };</script>
<script src="vendor/paged.polyfill.min.js"></script>
<script>
(async () => {
  const $ = s => document.querySelector(s), msg = t => { $('#msg').textContent = t; };
  let job = null; try { job = window.opener && window.opener.DidakoBookJob; } catch (e) { job = null; }
  if (!job || typeof job.build !== 'function') {
    $('#stage').innerHTML = '<div id="err"><p>이 창은 디다코 교재 만들기의 [제본용 PDF 만들기]에서 열어요.</p><p>그 화면으로 돌아가 단추를 다시 눌러 주세요.</p></div>';
    msg('열 수 없어요'); return;
  }
  $('#ttl').textContent = job.kind === 'cover' ? '표지' : '본문';
  const addStyle = css => { const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st); return st; };
  // 글꼴 조각과 그림이 모두 도착한 뒤에 쪽을 나눠야 쪽 수가 맞다
  async function settle(root) {
    const imgs = Array.from(root.querySelectorAll('img'));
    await Promise.race([Promise.all(imgs.map(im => (im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })))), new Promise(r => setTimeout(r, 20000))]);
    for (let i = 0; i < 40; i++) {
      await document.fonts.ready;
      await new Promise(r => setTimeout(r, 150));
      if (document.fonts.status === 'loaded') break;
    }
    await Promise.all(imgs.map(im => (im.decode && im.naturalWidth ? im.decode().catch(() => {}) : 0)));
  }
  const clean = () => { $('#stage').innerHTML = ''; $('#src').innerHTML = ''; };
  document.title = job.title + ' - 디다코';

  if (job.kind === 'cover') {
    document.body.classList.add('cover');
    const r = job.build();
    addStyle(r.css); $('#stage').innerHTML = r.html;
    await settle($('#stage'));
    $('#go').disabled = false; $('#go').onclick = () => window.print();
    window.addEventListener('beforeprint', () => document.body.classList.add('printing'));
    window.addEventListener('afterprint', () => document.body.classList.remove('printing'));
    msg(`펼침면 ${r.spreadW} × ${r.spreadH}mm(재단선 3mm 포함), 책등 ${r.spine}mm. 이 화면의 붉은 점선(자르는 선), 파란 점선(책등), '표 2'·'표 3' 글자는 위치를 보여 주는 표시예요. 저장하는 PDF에는 들어가지 않아요.`);
    return;
  }

  // 본문: 1차로 나눠 쪽 수를 세고, 4의 배수가 아니면 끝에 메모 쪽을 더해 한 번 더 나눈다
  async function paginate(memo) {
    clean();
    const r = job.build(memo);
    const css = addStyle(r.css);
    const src = $('#src'); src.innerHTML = r.html;
    await settle(src);
    const previewer = new Paged.Previewer();
    const flow = await previewer.preview(r.html, [{ bp: r.css }], $('#stage'));
    src.innerHTML = ''; css.remove();
    return flow.total;
  }
  try {
    msg('쪽을 나누고 있어요. 책 한 권이라 1~2분 걸릴 수 있어요…');
    let n = await paginate(0);
    const want = n % 4 === 0 && n - 0 >= 0 ? 0 : (4 - n % 4) % 4;
    if (want) { msg(`${n}쪽이에요. 4의 배수로 맞추려고 메모 쪽을 더하는 중이에요…`); n = await paginate(want); }
    if (job.done) job.done(n);
    $('#go').disabled = false; $('#go').onclick = () => window.print();
    msg(`모두 ${n}쪽(B5)이에요. [PDF로 저장]을 누르고, 인쇄 창에서 대상은 'PDF로 저장', 여백은 '없음', 배경 그래픽은 '켜기'로 해 주세요.`);
  } catch (e) {
    console.error(e);
    msg('쪽을 나누지 못했어요. 이 창을 닫고 다시 눌러 주세요.');
  }
})();
</script>
</body>
</html>
