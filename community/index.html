<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>디다코</title>
<meta name="theme-color" content="#6B4A2E">
<!-- 홈 화면 앱(PWA): 아이콘은 디다코 노트와 같은 종이(고동색) 세 겹 책갈피(icons/icon.svg). 두 앱은 오가는 한 앱이다 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="디다코">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<script>
// 저장된 화면 설정을 그림이 그려지기 전에 먼저 입힌다(밝은 화면이 잠깐 번쩍이지 않게). 읽을 수 없으면 기기 설정을 따른다
try {
  const d = JSON.parse(localStorage.getItem('didako-note-display') || '{}'), r = document.documentElement;
  if (d.mode === 'light' || d.mode === 'dark') r.setAttribute('data-mode', d.mode);
  if (d.accent !== 'green') r.setAttribute('data-accent', ['amber', 'blue', 'rose', 'ink', 'paper'].includes(d.accent) ? d.accent : 'paper');   // 기본은 종이(S-83, S-87). 초록은 속성 없이 :root 값
  if (['neu', 'skeu', 'glass'].includes(d.style)) r.setAttribute('data-style', d.style);
  if (d.big === true) r.setAttribute('data-big', '');
} catch (e) {}
</script>
<style>
/* 디다코 앱. 색 변수와 상단 바·하단 탭·설정 창은 시안(prototype/week.html)과 같은 것을 옮겼고, 코이데 app/index.html의 값을 그대로 쓴다.
   화면 모드는 코이데처럼 data-mode를 쓴다. 이름과 내용은 모두 지어낸 데모 예시다. */
:root {
  --page: #E8EBE8; --surface: #F7F8F6; --surface-2: #E9EDEA;
  --ink: #1B2523; --ink-2: #5B6965; --line: #D7DEDA; --line-strong: #B9C4BF;
  --accent: #2B6A62; --accent-mid: #8DBDB5; --accent-soft: #DCEBE7; --on-accent: #FFFFFF;
  --leader: #62519E; --leader-soft: #ECE7F7; --private: #E8ECEA;
  --warn: #9A5A14; --warn-soft: #F5E8D6; --shadow: rgba(20, 35, 32, .14);
  --neu-hi: rgba(255, 255, 255, .9); --neu-lo: rgba(20, 35, 32, .17);
  --base: 16px;
  --wood: #B98756;   /* 함께 짜는 그물(3D)의 수틀 나무색. 기도 노트와 같은 색 */
  --f-display: 'Gowun Batang', 'AppleMyungjo', 'Batang', serif;
  --f-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-mode="light"]) {
  --page: #141B19; --surface: #1C2522; --surface-2: #232D2A;
  --ink: #E5ECE9; --ink-2: #9CAAA5; --line: #2D3935; --line-strong: #4A5853;
  --accent: #7CC2B7; --accent-mid: #3F7C73; --accent-soft: #1E3934; --on-accent: #0F1A18;
  --leader: #B6A8EA; --leader-soft: #2A2442; --private: #252E2B;
  --warn: #E2A563; --warn-soft: #3A2C1B; --shadow: rgba(0, 0, 0, .5); --neu-hi: rgba(255, 255, 255, .06); --neu-lo: rgba(0, 0, 0, .6); --wood: #7A5636; color-scheme: dark; } }
/* 화면 모드: 기기 설정이면 기기를 따르고, '밝게'·'어둡게'를 고르면 그대로(data-mode) */
:root[data-mode="dark"] {
  --page: #141B19; --surface: #1C2522; --surface-2: #232D2A;
  --ink: #E5ECE9; --ink-2: #9CAAA5; --line: #2D3935; --line-strong: #4A5853;
  --accent: #7CC2B7; --accent-mid: #3F7C73; --accent-soft: #1E3934; --on-accent: #0F1A18;
  --leader: #B6A8EA; --leader-soft: #2A2442; --private: #252E2B;
  --warn: #E2A563; --warn-soft: #3A2C1B; --shadow: rgba(0, 0, 0, .5); --neu-hi: rgba(255, 255, 255, .06); --neu-lo: rgba(0, 0, 0, .6); --wood: #7A5636; color-scheme: dark; }
/* 글씨: 휴대폰·태블릿 16px, PC 15px. 큰 글씨 모드는 약 1.2배 */
@media (min-width: 1000px) { :root { --base: 15px; } }
:root[data-big] { --base: 19px; }
@media (min-width: 1000px) { :root[data-big] { --base: 18px; } }
/* 색 테마(초록은 위 기본값). 시안의 THEMES와 같은 값: 밝은 화면 / 어두운 화면 */
:root[data-accent="amber"] { --page:#EDE8E0;--surface:#F9F5EE;--surface-2:#ECE5DA;--ink:#2A221B;--ink-2:#6E6155;--line:#E0D6C8;--line-strong:#C9B9A3;--accent:#A9561B;--accent-mid:#E2B07F;--accent-soft:#F6E3CF;--on-accent:#FFFFFF;--private:#EFE8DE; }

:root[data-accent="amber"][data-mode="dark"] { --page:#1A1612;--surface:#231E19;--surface-2:#2B241E;--ink:#EEE6DC;--ink-2:#AE9F8E;--line:#3A3129;--line-strong:#5A4D41;--accent:#E9A066;--accent-mid:#8A5A32;--accent-soft:#3A2818;--on-accent:#1E140C;--private:#2E2721; }
:root[data-accent="blue"] { --page:#E7E9EE;--surface:#F6F7FA;--surface-2:#E5E9EF;--ink:#1B2230;--ink-2:#5A6475;--line:#D6DCE5;--line-strong:#B6C0CF;--accent:#2F5D95;--accent-mid:#93AFD3;--accent-soft:#DCE6F3;--on-accent:#FFFFFF;--private:#E8EBF0; }
@media (prefers-color-scheme: dark) { :root[data-accent="blue"]:not([data-mode="light"]) { --page:#12161D;--surface:#1A2029;--surface-2:#212833;--ink:#E4E9F0;--ink-2:#9AA5B5;--line:#2C3542;--line-strong:#485466;--accent:#8EB4E6;--accent-mid:#3C5B85;--accent-soft:#1D2C42;--on-accent:#0E1622;--private:#232A35; } }
:root[data-accent="blue"][data-mode="dark"] { --page:#12161D;--surface:#1A2029;--surface-2:#212833;--ink:#E4E9F0;--ink-2:#9AA5B5;--line:#2C3542;--line-strong:#485466;--accent:#8EB4E6;--accent-mid:#3C5B85;--accent-soft:#1D2C42;--on-accent:#0E1622;--private:#232A35; }

@media (prefers-color-scheme: dark) { :root[data-accent="rose"]:not([data-mode="light"]) { --page:#1A1416;--surface:#231B1E;--surface-2:#2B2226;--ink:#EEE3E6;--ink-2:#B09CA2;--line:#3A2D31;--line-strong:#5A464C;--accent:#E896AB;--accent-mid:#86475A;--accent-soft:#3B2029;--on-accent:#200E14;--private:#2E2428; } }
:root[data-accent="rose"][data-mode="dark"] { --page:#1A1416;--surface:#231B1E;--surface-2:#2B2226;--ink:#EEE3E6;--ink-2:#B09CA2;--line:#3A2D31;--line-strong:#5A464C;--accent:#E896AB;--accent-mid:#86475A;--accent-soft:#3B2029;--on-accent:#200E14;--private:#2E2428; }
:root[data-accent="ink"] { --page:#E9E9E7;--surface:#F7F7F6;--surface-2:#E8E8E5;--ink:#1D1D1B;--ink-2:#62625E;--line:#DADAD6;--line-strong:#BDBDB7;--accent:#33332F;--accent-mid:#A3A39C;--accent-soft:#E6E6E1;--on-accent:#FFFFFF;--private:#ECECE8; }
@media (prefers-color-scheme: dark) { :root[data-accent="ink"]:not([data-mode="light"]) { --page:#141414;--surface:#1D1D1C;--surface-2:#252524;--ink:#ECECE8;--ink-2:#A3A39E;--line:#30302E;--line-strong:#4D4D4A;--accent:#E2E2DC;--accent-mid:#6A6A65;--accent-soft:#2E2E2C;--on-accent:#141414;--private:#262625; } }
:root[data-accent="ink"][data-mode="dark"] { --page:#141414;--surface:#1D1D1C;--surface-2:#252524;--ink:#ECECE8;--ink-2:#A3A39E;--line:#30302E;--line-strong:#4D4D4A;--accent:#E2E2DC;--accent-mid:#6A6A65;--accent-soft:#2E2E2C;--on-accent:#141414;--private:#262625; }
:root[data-accent="paper"] { --page:#F0EEE6;--surface:#FAF9F5;--surface-2:#F2F0E9;--ink:#1F1E1D;--ink-2:#5E5D59;--line:#E3E0D5;--line-strong:#C4C1B5;--accent:#6B4A2E;--accent-mid:#C4A27F;--accent-soft:#EADFCD;--on-accent:#FFFFFF;--private:#EEECE4; }
@media (prefers-color-scheme: dark) { :root[data-accent="paper"]:not([data-mode="light"]) { --page:#1F1E1D;--surface:#262624;--surface-2:#30302E;--ink:#F5F4EE;--ink-2:#B7B5A9;--line:#3E3E38;--line-strong:#5C5B55;--accent:#D2B08A;--accent-mid:#7E6247;--accent-soft:#362B20;--on-accent:#1C150E;--private:#2C2C2A; } }
:root[data-accent="paper"][data-mode="dark"] { --page:#1F1E1D;--surface:#262624;--surface-2:#30302E;--ink:#F5F4EE;--ink-2:#B7B5A9;--line:#3E3E38;--line-strong:#5C5B55;--accent:#D2B08A;--accent-mid:#7E6247;--accent-soft:#362B20;--on-accent:#1C150E;--private:#2C2C2A; }
* { box-sizing: border-box; }
html, body { margin: 0; }
/* 휴대폰을 가로로 돌려도 브라우저가 글씨를 저절로 키우지 않게 */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { background: var(--page); color: var(--ink); font-family: var(--f-body); font-size: var(--base); line-height: 1.55; -webkit-tap-highlight-color: transparent; word-break: keep-all; overflow-wrap: anywhere; }
button, input, textarea, select { font: inherit; color: inherit; }
/* 아이폰에서 빠르게 두세 번 눌러도 화면이 확대되지 않게(두 손가락으로 벌려 확대하는 것은 그대로). 캔버스·3D 무대는 건드리지 않는다 */
button, a, label, summary, select, input, [role="button"], [data-act], .brand { touch-action: manipulation; }
/* 틀(시안과 같게): 휴대폰·태블릿은 상단 바(배지·설정) + 하단 바(아이콘만), PC(1000px 이상)는 메뉴가 상단 바로 올라가고 2단 */
.ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.wrap { width: 100%; max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); transition: transform .25s ease; }
.topbar .wrap { display: flex; align-items: center; gap: .6em; min-height: 3.4em; position: relative; }
.brand { display: inline-flex; align-items: center; gap: .45em; background: none; border: 0; padding: .3em 0; color: var(--ink); cursor: pointer; min-height: 44px; }
.brand-mark { width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.brand-mark .ic { width: .95em; height: .95em; }
.brand-name { font-family: var(--f-display); font-size: 1.05em; font-weight: 700; white-space: nowrap; }
.topnav { display: none; gap: .2em; margin-left: 1.2em; }
.topnav :is(button, a) { text-decoration: none; font-size: .92em; background: none; border: 0; color: var(--ink-2); padding: .5em .9em; border-radius: 10px; cursor: pointer; min-height: 40px; }
.topnav :is(button, a).on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.spacer { flex: 1; }
.badge-btn { display: inline-flex; align-items: center; gap: .4em; font-size: .8em; font-weight: 600; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: .35em .5em .35em .85em; min-height: 38px; cursor: pointer; white-space: nowrap; }
.role-tag { font-size: .86em; padding: .15em .6em; border-radius: 999px; background: var(--surface); color: var(--ink-2); border: 1px solid var(--line); }
.role-tag.leader { color: var(--leader); border-color: var(--leader); background: var(--leader-soft); }
.role-tag.admin { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0; border-radius: 12px; color: var(--ink); cursor: pointer; flex: none; }
.icon-btn .ic { width: 1.35em; height: 1.35em; }
.icon-btn[aria-expanded="true"] { background: var(--surface-2); }
.menu { position: absolute; top: calc(100% + 6px); right: max(16px, env(safe-area-inset-right, 0px)); width: min(300px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 16px 40px -12px var(--shadow); padding: .5em; display: flex; flex-direction: column; gap: .1em; z-index: 25; }
.mlabel { font-size: .72em; font-weight: 600; color: var(--ink-2); margin: .6em .7em .3em; }
#placeMenu .mlabel { font-size: .75rem; margin: 6px; }
.place-row { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 8px; min-height: 44px; padding: 10px 6px; border: 0; border-radius: 10px; background: none; color: var(--ink); font: 500 .875rem var(--f-body); text-align: left; text-decoration: none; cursor: pointer; }
.place-row .role-tag { margin-left: 6px; }
.place-row:hover, .place-row:focus-visible { background: var(--surface-2); }
.place-row .place-copy { display: flex; flex-direction: column; gap: 2px; }
.place-row .sm { font-size: .875rem; color: var(--ink-2); }
.place-row.on { cursor: default; }
.place-row.on:hover { background: none; }
/* 함께하는 곳 메뉴는 코이데처럼 이름은 왼쪽, 작은 글은 오른쪽, 지금 보는 곳은 굵게(2026-11-14) */
#placeMenu .place-copy { flex-direction: row; justify-content: space-between; align-items: center; gap: .6em; width: 100%; }
#placeMenu .place-copy .sm { font-size: .8125rem; color: var(--ink-2); text-align: right; }
#placeMenu .place-row.on .place-copy > span:first-child { font-weight: 700; }
.mitem { display: flex; justify-content: space-between; align-items: center; gap: .6em; width: 100%; text-align: left; font-size: .9em; color: var(--ink); background: none; border: 0; border-radius: 10px; padding: .55em .7em; min-height: 44px; cursor: pointer; text-decoration: none; }
.mitem:hover { background: var(--surface-2); }
.mitem.static { cursor: default; flex-direction: column; align-items: flex-start; gap: .1em; }
.mitem.static:hover { background: none; }
.mitem small { font-size: .82em; color: var(--ink-2); }
.swatches { display: flex; gap: 4px; margin: .2em .2em .4em; flex-wrap: nowrap; }   /* 색 테마 여섯 개는 늘 한 줄. 칸이 좁으면(더보기 화면 설정, 320px 휴대폰) 동그라미가 조금 작아진다. 간격은 노트 설정과 같은 4px(S-77) */
.swatch { flex: 0 1 40px; min-width: 0; max-width: 40px; aspect-ratio: 1; height: auto; border-radius: 50%; padding: 0; border: 2px solid transparent; background: none; cursor: pointer; display: grid; place-items: center; }
.swatch i { width: 28px; height: 28px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); }
.swatch.on { border-color: var(--ink); }
.menu .seg { margin: 0 .3em .3em; }
.card .swatches { margin: .6em 0 0; }
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.mdiv { height: 1px; background: var(--line); margin: .35em .3em; }
@media (max-width: 420px) { .brand-name { display: none; } }
@media (prefers-reduced-motion: reduce) { .topbar, .tabs { transition: none; } }
h1 { font-family: var(--f-display); font-size: 1.65em; line-height: 1.3; margin: .3em 0 .2em; }
h2 { font-size: 1.05em; margin: 0; }
.eyebrow { font-size: .8em; color: var(--ink-2); margin: 1em 0 0; }
.top-eyebrow { margin: 0 0 2px; }   /* 코이데처럼 큰 제목 위에 둔다(교회·사랑방·부서 같은 회색 글) */
.top-eyebrow + .page-top h1, .top-eyebrow + .sh-top h1 { margin-top: 0; }
.hint { font-size: .82em; color: var(--ink-2); margin: .4em 0 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 12px 0; }
.row { display: flex; justify-content: space-between; align-items: center; gap: .6em; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4em; min-height: 44px; padding: 0 1.1em; border-radius: 12px; border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); font-weight: 600; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.small { min-height: 36px; padding: 0 .8em; font-size: .88em; border-radius: 10px; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }
.field { width: 100%; min-height: 44px; padding: .5em .75em; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); }
/* 날짜 칸: 아이폰은 날짜 칸을 따로 그려서 폭이 달라지고 시트가 옆으로 밀렸다. 다른 칸과 같은 폭으로 묶는다(D-16) */
input.field[type="date"] { -webkit-appearance: none; appearance: none; display: block; width: 100%; max-width: 100%; min-width: 0; text-align: left; }
input.field[type="date"]::-webkit-date-and-time-value { text-align: left; }
textarea.field { resize: vertical; line-height: 1.55; overflow-y: hidden; }
.tabs[hidden] { display: none !important; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 0 env(safe-area-inset-right, 0px) max(6px, env(safe-area-inset-bottom, 0px)) env(safe-area-inset-left, 0px); z-index: 10; transition: transform .25s ease; }
.tabs :is(button, a) { text-decoration: none; background: none; border: 0; color: var(--ink-2); display: grid; place-items: center; padding: .55em 0; min-height: 56px; cursor: pointer; position: relative; }
.tabs .ic { width: 28px; height: 28px; stroke-width: 1.4; }
.tabs :is(button, a).on { color: var(--accent); }
.tabs :is(button, a).on .ic { stroke-width: 1.8; }
.tabs :is(button, a).on::after { content: ''; position: absolute; bottom: 6px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.tabs :is(button, a).pray-tab .ic { width: 44px; height: 44px; padding: 8px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); }
.tabs :is(button, a).pray-tab.on .ic { background: var(--accent); color: var(--on-accent); }
.tabs :is(button, a).pray-tab.on::after { content: none; }

.st-top { flex: none; display: flex; align-items: center; gap: .4em; min-height: 56px; padding: max(6px, env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px)) 6px max(8px, env(safe-area-inset-left, 0px)); }
.st-top[hidden] { display: none; }
.st-pill { font: inherit; font-size: .84em; font-weight: 600; background: var(--surface); color: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 0 .95em; min-height: 44px; display: inline-flex; align-items: center; gap: .4em; cursor: pointer; white-space: nowrap; }
.st-body { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); position: relative; }
.st-in { margin: auto; width: 100%; max-width: 680px; padding: 12px 0 20px; min-width: 0; }
.st-foot { flex: none; padding: 8px max(16px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.st-foot[hidden] { display: none; }
.st-nav { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; max-width: 680px; margin: 0 auto; }
.st-nav .btn { min-height: 52px; font-size: 1.02em; }
.st-nav.one { grid-template-columns: 1fr; }
.st-skip { display: block; margin: 0 auto 6px; background: none; border: 0; color: var(--ink-2); font-size: .9em; min-height: 44px; padding: 0 1em; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.st-eyebrow { font-size: .84em; color: var(--ink-2); margin: 0 0 .7em; text-align: center; }
.st-body.qmode { overflow: hidden; }
.q-top { flex: none; min-height: 36vh; min-height: 36dvh; display: flex; align-items: center; justify-content: center; padding: 8px 0; }
.q-core { width: 100%; max-width: 680px; min-width: 0; }
.q-aux { flex: 1 1 0; min-height: 0; overflow-y: auto; width: 100%; max-width: 680px; margin: 0 auto; padding: 2px 0 16px; display: flex; flex-direction: column; gap: 10px; font-size: .88em; }
.q-aux .more { margin: 0; align-items: center; text-align: center; color: var(--ink-2); }
.q-text { white-space: pre-line; text-align: center; position: relative; z-index: 9; transition: color .15s ease-out; font-family: var(--f-display); font-weight: 700; font-size: clamp(1.55em, 6vmin, 2.5em); line-height: 1.5; margin: 0; word-break: keep-all; text-wrap: balance; }
.passage-big { font-family: var(--f-display); font-weight: 700; font-size: clamp(2.2em, 10vmin, 4em); line-height: 1.3; margin: .1em 0 .5em; text-align: center; word-break: keep-all; }
.center { text-align: center; }
.cover-name { font-family: var(--f-display); font-weight: 700; font-size: clamp(2em, 8.5vmin, 3.2em); line-height: 1.35; text-align: center; margin: 0; }
.cover-sub { text-align: center; color: var(--ink-2); margin: .6em 0 0; font-size: 1.05em; }
.cover-mark { display: block; margin: 0 auto 1.2em; width: 120px; height: 30px; opacity: .9; }
.triple { display: flex; flex-direction: column; gap: 0; padding: .4em 1.1em; }
.tri { padding: 1em 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: auto 1fr; gap: .4em 1em; align-items: baseline; }
.tri:first-child { border-top: 0; }
.tri .who { align-self: start; margin-top: .3em; }
.tri .tri-memo { grid-column: 2; font-size: .88em; margin-top: .3em; }
.tri p { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 1.2em; line-height: 1.55; word-break: keep-all; }
.h2d.tri-lead { white-space: nowrap; font-size: clamp(14px, calc((100vw - 32px) / 20.5), 2em); }
:root[data-big] .h2d.tri-lead, .stage.big .h2d.tri-lead { white-space: normal; font-size: clamp(1.4em, 5.5vmin, 2.1em); }
.h2d { font-family: var(--f-display); font-size: clamp(1.5em, 5.5vmin, 2.1em); line-height: 1.4; margin: 0 0 .4em; word-break: keep-all; }
.bless { display: flex; flex-direction: column; gap: .5em; align-items: center; text-align: center; }
.bless p { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(1.6em, 6.6vmin, 2.5em); line-height: 1.5; word-break: keep-all; animation: wo-in .8s ease-out calc(.3s + var(--i) * 1s) both; }
.bless p.lastline { margin-top: .3em; color: var(--accent); }
.bless .bl-lead { margin: 0 0 .6em; }
.bless .bl-ref { margin-top: 1em; animation: wo-in .8s ease-out 4.3s both; }
.done-mark { display: block; margin: .6em auto 1em; height: 170px; width: 52px; max-width: 100%; }
.done-btns { display: flex; flex-direction: column; gap: 10px; max-width: 420px; margin: 1.4em auto 0; }
.done-btns .btn { min-height: 52px; }
/* 화면 내려놓기: 카드 전체 위에 어두운 한 겹(.dimmer)을 얹고 그 한 겹만 바뀐다. 질문(.q-text)은 이 겹 위로 올라와 같은 때에 흰색이 된다.
   어두워질 때 0.8초, 밝아질 때 0.15초. 어두운 색은 테마와 상관없이 고정이다 */
.dimmer { position: absolute; inset: 0; z-index: 8; background: #090d0c; opacity: 0; pointer-events: none; transition: opacity .15s ease-out; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: .35em; padding: 0 24px max(8vh, env(safe-area-inset-bottom, 0px)); text-align: center; }
.stage.dim .dimmer { opacity: 1; pointer-events: auto; transition-duration: .8s; transition-timing-function: ease-in; }
.stage.dim .q-text { color: #fff; transition-duration: .8s; transition-timing-function: ease-in; }
.stage.nt .dimmer, .stage.nt .q-text { transition: none !important; }
.dimmer p { word-break: keep-all; text-wrap: balance; margin: 0; }
.dimmer .dm-msg { font-family: var(--f-display); font-weight: 700; font-size: 1.15em; color: #fff; }
.dimmer .dm-sub { font-size: .88em; color: #c9d3cf; }
.stage.big .dimmer .dm-msg { font-size: 1em; }
.stage.big { font-size: calc(var(--base) * 1.35); }
.stage.big .q-text { font-size: clamp(2.1em, 8.5vmin, 4.4em); }
.stage.big .st-in { max-width: 1100px; }
.stage.big .tri p { font-size: 1.5em; }
.stage.big .passage-big { font-size: clamp(3em, 14vmin, 6em); }
.stage.big .st-nav { max-width: 1100px; }
@media (prefers-reduced-motion: reduce) {
  .wo-par path, .wo-lines p, .wo-skip, .bless p, .bless .bl-ref { animation: none; }
  .wo-par { animation: none; opacity: 0; }
  .wo-braid { animation: none; clip-path: none; }
  .deep-cord .dc-on { animation: none; } .deep-cord .dc-braid { animation: none; clip-path: none; }
  .dimmer, .q-text, .stage.dim .dimmer, .stage.dim .q-text { transition-duration: .2s; }
}


/* ══ 책장·내 기록 ══ */
/* ── 책장(#shelf) ── 시안 shelf.html의 것을 옮겼다. 앱에 이미 있는 이름(.toc-list, .bm, .back-link)과 겹치는 것만 이름을 바꾸거나 범위를 좁혔다 */
/* 배치: 휴대폰은 한 줄. 640px 이상은 가운데 읽는 폭에 넓게, 1000px 이상은 책 목차를 조금 더 넓게 둔다 */
.shelf-wrap { max-width: 760px; margin: 0 auto; }
@media (min-width: 1000px) { .shelf-wrap { max-width: 880px; } }
/* 책장 첫 화면: 넓은 화면에서도 지금 읽는 책 아래에 교재 목록을 놓는다 */
@media (min-width: 1000px) { .shelf-wrap.shelf-home { max-width: none; } }
.shelf-wrap h1, .record-wrap h1 { word-break: keep-all; overflow-wrap: anywhere; }

/* 검색 */
.search { position: relative; margin-top: 10px; }
.search .ic { position: absolute; left: .8em; top: 50%; transform: translateY(-50%); color: var(--ink-2); pointer-events: none; }
.search .field { padding-left: 2.5em; }
.hit-list { list-style: none; margin: 0; padding: 0; }
.hit-list li + li { border-top: 1px solid var(--line); }
.hit { display: block; width: 100%; text-align: left; background: none; border: 0; padding: .8em 0; min-height: 44px; cursor: pointer; }
.hit .hit-book { display: block; font-size: .8em; color: var(--ink-2); }
.hit b { display: block; word-break: keep-all; overflow-wrap: anywhere; font-family: var(--f-display); font-size: 1.05em; margin-top: .1em; }
.hit .hit-ref { font-size: .84em; color: var(--accent); font-family: var(--f-display); font-weight: 700; }
.hit .hit-body { display: block; font-size: .86em; color: var(--ink-2); margin-top: .15em; line-height: 1.55; }

/* 책 표지: 크기와 관계없이 책등을 뺀 자리의 가운데에 같은 비율로 상징을 둔다 */
.book-cover { display: block; position: relative; width: 100%; aspect-ratio: 3 / 4; overflow: hidden; border-radius: 3px 7px 7px 3px; background: color-mix(in srgb, var(--cover-color) 16%, var(--surface)); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 6px 14px -6px rgba(0,0,0,.22); }
.book-cover::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 7%; background: var(--cover-color); opacity: .55; }
.book-cover::after { content: ''; position: absolute; top: 0; bottom: 0; left: 7%; width: 2px; background: rgba(255,255,255,.35); }
.book-symbol { display: block; position: absolute; width: 70%; height: auto; aspect-ratio: 1; left: 18.5%; top: 50%; transform: translateY(-50%); }
/* 표지 이름(선택, 2026-11-10): 위쪽에 두 줄까지. 이름이 있으면 그림을 조금 작게 아래로 내린다. 이름은 장식이라 화면 읽기에는 옆의 책 제목을 쓴다 */
.book-cover { container-type: inline-size; }
.book-name { position: absolute; top: 9%; left: 13%; right: 6%; z-index: 1; text-align: center; font-family: var(--f-display); font-weight: 700; font-size: max(9px, 11cqw); line-height: 1.25; color: color-mix(in srgb, var(--cover-color) 72%, var(--ink)); word-break: keep-all; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.book-cover.has-name .book-symbol { width: 56%; left: 25.5%; top: 60%; }
.mg-cover:not(.big) .book-name { display: none; }
/* 어두운 화면에서는 표지 이름을 조금 밝게 해서 먹색·종이색 표지에서도 읽히게 한다(2026-11-10) */
@media (prefers-color-scheme: dark) { :root:not([data-mode="light"]) .book-name { color: color-mix(in srgb, var(--cover-color) 40%, var(--ink)); } }
:root[data-mode="dark"] .book-name { color: color-mix(in srgb, var(--cover-color) 40%, var(--ink)); }
.mg-cover:not(.big) .book-cover.has-name .book-symbol { width: 70%; left: 18.5%; top: 50%; }
.cover-art > svg { display: none; width: 100%; height: 100%; }
.cover-art > img { display: block; width: 100%; height: 100%; object-fit: contain; }
.cover-art.cover-missing > svg { display: block; }
.cover-art.cover-missing > img { display: none; }
/* 책장 첫 화면의 작은 제목과 카드 제목은 기존 크기를 따른다 */
.sf { font-family: var(--f-display); }
.sh-sm { font-size: calc(var(--base) * .875); color: var(--ink-2); }
.xlb { font-size: calc(var(--base) * .8125); font-weight: 700; color: var(--ink-2); margin: 20px 0 8px; }
.xcard { padding: 14px 16px; margin: 0; }
.xcard .xct { font-size: calc(var(--base) * 1.1875); font-weight: 700; line-height: 1.35; }
/* 책장 머리: 제목 오른쪽에 검색 단추. 검색 칸과 결과는 제목 아래에 열린다 */
.sh-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; }
.sh-top .icon-btn { margin-right: -10px; }
/* 지금 읽는 책: 왼쪽 표지, 오른쪽 글. 단추로만 책과 펼치기를 연다 */
.sh-card { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; align-items: start; }
.book-cover-current { width: 96px; }
.sh-body { min-width: 0; }
.sh-kind { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.sh-lesson { margin-top: 4px; line-height: 1.5; }
.sh-date { margin-top: 2px; }
.sh-actions { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; }
.sh-actions .btn { min-height: 36px; padding: 0 .8em; font-size: .88em; border-radius: 10px; }
/* 교재 목록: 한 칸에 책 표지와 두 줄까지의 제목 */
.sh-books { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 14px; row-gap: 18px; }
.sh-book { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; min-width: 0; padding: 0; border: 0; background: none; color: var(--ink); font-family: var(--f-body); text-align: left; cursor: pointer; }
.sh-book-title { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; font-size: calc(var(--base) * .875); font-weight: 700; line-height: 1.4; overflow-wrap: anywhere; margin-top: 3px; }
.sh-book-period { font-size: calc(var(--base) * .75); color: var(--ink-2); line-height: 1.4; }
.sh-book .walk-tag { max-width: 100%; min-height: 22px; padding: 2px 6px; font-size: calc(var(--base) * .625); white-space: normal; }
@media (min-width: 640px) { .sh-books { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (min-width: 1000px) {
  .sh-card { grid-template-columns: 140px minmax(0, 1fr) auto; align-items: center; gap: 22px; }
  .book-cover-current { width: 140px; }
  .sh-actions { grid-column: 3; flex-direction: column; }
  .sh-actions .sh-read { order: -1; }
  .sh-actions .btn { min-height: 44px; padding: 0 1.15em; font-size: 1em; border-radius: 12px; }
  .sh-books { grid-template-columns: repeat(6, minmax(0, 1fr)); column-gap: 22px; row-gap: 26px; }
}
/* 지금 읽는 책 카드의 과 점: 교회 진도(지난 과 · 이번 주 과 · 남은 과). 내가 쓴 것과 상관없고 숫자는 적지 않는다(철학 ③, 2026-11-10) */
.sh-dots { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; }
.sh-dots i { display: block; width: 8px; height: 8px; border-radius: 999px; box-sizing: border-box; border: 1.5px solid var(--line-strong); }
.sh-dots i.past { background: var(--accent-mid); border-color: var(--accent-mid); }
.sh-dots i.now { width: 20px; background: var(--accent); border-color: var(--accent); }

/* 책 안(목차) */
/* 책 안 머리와 표지 색(2026-11-10): --cover-color를 옅게 섞어 머리 카드, 과 번호, 장절, 단추에 입힌다 */
.book-in { --bk: color-mix(in srgb, var(--cover-color) 82%, var(--ink)); --bk-solid: color-mix(in srgb, var(--cover-color) 88%, var(--ink)); --bk-on: #fff; }
.book-hero { margin-top: 10px; background: color-mix(in srgb, var(--cover-color) 11%, var(--surface)); border-color: color-mix(in srgb, var(--cover-color) 28%, var(--line)); }
.bh-row { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 16px; align-items: center; }
.book-cover-hero { width: 104px; }
.bh-info { display: grid; gap: 6px; min-width: 0; justify-items: start; }
.bh-t { font-family: var(--f-display); font-size: 1.5em; line-height: 1.3; margin: 0; word-break: keep-all; overflow-wrap: anywhere; }
.bh-range { background: color-mix(in srgb, var(--cover-color) 18%, var(--surface)); color: var(--bk); }
.bh-mine { margin: 0; }
.bh-read { width: 100%; margin-top: 16px; }
.sh-actions .ic, .bh-read .ic { width: 1.15em; height: 1.15em; }
.book-in .bh-read:not(.ghost) { background: var(--bk-solid); border-color: var(--bk-solid); color: var(--bk-on); }
.book-in .bh-read.ghost { border-color: var(--bk); color: var(--bk); }
.book-toc { margin-top: 12px; }
.book-in .les-ref { color: var(--bk); }
.les-no { flex: none; width: 30px; height: 30px; border-radius: 999px; display: grid; place-items: center; font-size: .82em; font-weight: 600; border: 1.5px solid var(--line-strong); color: var(--ink-2); }
.les-no.past { background: color-mix(in srgb, var(--cover-color) 26%, var(--surface)); border-color: transparent; color: var(--bk); }
.les-no.now { background: var(--bk-solid); border-color: transparent; color: var(--bk-on); }
.les-now { display: inline-block; font-size: .85em; font-weight: 600; padding: 0 .55em; border-radius: 999px; background: var(--bk-solid); color: var(--bk-on); margin-left: .2em; }
@media (prefers-color-scheme: dark) { :root:not([data-mode="light"]) .book-in { --bk: color-mix(in srgb, var(--cover-color) 45%, var(--ink)); --bk-solid: color-mix(in srgb, var(--cover-color) 55%, var(--ink)); --bk-on: #1C150E; } }
:root[data-mode="dark"] .book-in { --bk: color-mix(in srgb, var(--cover-color) 45%, var(--ink)); --bk-solid: color-mix(in srgb, var(--cover-color) 55%, var(--ink)); --bk-on: #1C150E; }
@media (min-width: 1000px) { .bh-row { grid-template-columns: 140px minmax(0, 1fr); gap: 22px; } .book-cover-hero { width: 140px; } .bh-read { width: auto; min-width: 200px; } }
.book-head .book-l { margin: 0; }
.book-head h2.book-t { font-family: var(--f-display); font-size: 1.55em; margin: .3em 0 .4em; word-break: keep-all; }
.book-head .passage-chip { font-size: .96em; }
.les-list { list-style: none; margin: 0; padding: 0; }
.les { padding: .9em 0; border-top: 1px solid var(--line); scroll-margin-top: 84px; }
.les:first-child { border-top: 0; padding-top: .2em; }
.les-head { display: flex; align-items: center; gap: .6em; width: 100%; min-height: 44px; text-align: left; background: none; border: 0; padding: 0; color: var(--ink); text-decoration: none; cursor: pointer; }
.les-head .les-txt { flex: 1; min-width: 0; }
.les-head .ic { color: var(--ink-2); }
.les-date { display: block; font-size: .8em; color: var(--ink-2); }
.les-t { display: block; overflow-wrap: anywhere; font-family: var(--f-display); font-weight: 700; font-size: 1.1em; line-height: 1.4; word-break: keep-all; }
.les-ref { display: block; font-size: .84em; color: var(--accent); font-family: var(--f-display); font-weight: 700; }
.les .bm { display: inline-flex; align-items: center; gap: .3em; font-size: .76em; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: .1em .7em .1em .4em; margin-top: .3em; }
.les .bm .mk { width: 1.4em; height: 1.4em; --cord-bg: var(--accent-soft); }
.les.has-bm { border-left: 3px solid var(--accent); padding-left: .8em; margin-left: -.2em; }

/* 책을 덮는 마지막 장: 남긴 한 문장들이 한 장에 모인다. 숫자도 순위도 없다 */
.last-page { text-align: center; }
.last-page .done-mark { width: 26px; height: 72px; display: block; margin: 0 auto .4em; }
.last-page h2 { font-family: var(--f-display); font-size: 1.25em; }
.last-page .ls { list-style: none; margin: 1em 0 0; padding: 0; text-align: left; }
.last-page .ls li { padding: .8em 0; border-top: 1px solid var(--line); }
.last-page .ls li:first-child { border-top: 0; }
.last-page .ls p { margin: 0; font-family: var(--f-display); line-height: 1.7; word-break: keep-all; }
.last-page .ls small { display: block; margin-top: .15em; font-size: .78em; color: var(--ink-2); }

/* 책 없음 */
.card.empty { text-align: center; padding: 28px 16px; }
.card.empty .ic { width: 2.4em; height: 2.4em; color: var(--ink-2); stroke-width: 1.2; }
.card.empty h2 { font-family: var(--f-display); font-size: 1.2em; margin: .5em 0 .3em; }
.card.empty .btn { margin-top: 14px; text-decoration: none; }

/* 책장의 카드·한 줄 목록은 .card라 디자인 스타일(basic·new·classic·glass)을 그대로 따른다 */
:root[data-style="neu"] .field { border-color: transparent; }

/* ── 내 기록(#record) ── 시안 record.html의 것을 옮겼다 */
/* 내 기록 달마다 보기와 상세 */
.record-wrap { max-width:760px; margin:0 auto; }
/* 올해의 그림: 기록한 주의 그림만 보여 주는 52칸 격자 */
.gallery-wrap { max-width: 980px; margin: 0 auto; }

function liveSaveLesson(b, L) {
  const k = lkey(b, L);
  clearTimeout(LS.timers[k]); delete LS.timers[k];
  if (LS.busy[k]) { LS.again[k] = true; return LS.busy[k]; }
  const run = (async () => {
    do {
      LS.again[k] = false;
      try {
        await api('lessonSave', { bookId: b.id, no: L.no, lesson: liveLessonOut(L, mgGuide(b, L)) });
        ls.del(unsavedKey(b, L));
        L.saveState = LS.again[k] ? { busy: true } : { at: liveClock(new Date()) };
        b.savedAt = liveClock(new Date()); b.edited = true;
        liveSyncData();
      } catch (err) {
        if (err && err.cancelled) return;
        L.saveState = { err: true };   // 쓴 글은 그대로 두고 안내만 바꾼다. 페이지를 닫아도 잃지 않게 이 기기에 임시로 둔다
        ls.set(unsavedKey(b, L), JSON.stringify({ at: Date.now(), lesson: liveLessonOut(L, mgGuide(b, L)) }));
        LS.again[k] = false;
      }
      mgSaveNoteShow(b, L);
    } while (LS.again[k]);
  })();
  LS.busy[k] = run;
  run.finally(() => { delete LS.busy[k]; });
  return run;
}
// 화면을 떠나거나 배포하기 전에, 기다리던 저장을 바로 한다
function liveFlush() { Object.keys(LS.timers).forEach(k => { const [bid, no] = k.split(':'), b = MG && MG.books.find(x => x.id === bid), L = b && b.lessons.find(x => x.no === Number(no)); if (L) liveSaveLesson(b, L); else { clearTimeout(LS.timers[k]); delete LS.timers[k]; } }); }
// 서버에 있는 과를 쓰는 일(배포·복제·삭제) 앞에서, 이 과의 저장이 끝나 있게 한다. 저장하지 못했으면 멈춘다
async function liveSettle(b, L) {
  const k = lkey(b, L);
  if (LS.timers[k] || LS.busy[k] || (L.saveState && L.saveState.err)) await liveSaveLesson(b, L);
  if (L.saveState && L.saveState.err) throw { code: 'net', message: '저장하지 못했어요. 다시 해 주세요.' };
}

  const me = LV.me || {}, d = PEND.data;
  const head = `<a class="back-link" href="#more">${ic('back')}<span>더보기</span></a>
    <p class="eyebrow top-eyebrow">${esc(me.roomName)} · ${esc(roleName())}</p><div class="page-top"><h1>우리 사랑방</h1></div>`;
  if (!d) return head + `<section class="card calm"><p class="calm-t">${PEND.err ? '불러오지 못했어요' : '불러오고 있어요'}</p>${PEND.err ? `<p class="soft" style="margin:0">${esc(PEND.err)}</p><button class="btn ghost" type="button" data-act="lv-pend">다시 불러오기</button>` : ''}</section>`;
  const reqs = d.requests, solo = !!(me.dept && me.dept.unit === '개인');
  const linked = d.families.reduce((n, f) => n + f.linked.length, 0);
  const people = d.families.flatMap(f => f.linked.length
    ? f.linked.map(l => `<div class="gr"><span class="gt"><b>${esc(l.person)}</b><span class="gd">${String(l.kakaoId) === String(me.kakaoId) ? '연결됨 · 나' : '연결됨'}</span></span>${String(l.kakaoId) === String(me.kakaoId) ? '' : `<button class="btn ghost small" type="button" data-act="room-dc" data-k="${esc(l.kakaoId)}" data-n="${esc(l.person)}" aria-label="${esc(l.person)} 연결 해제">연결 해제</button>`}</div>`)
    : [`<div class="gr"><span class="gt"><b>${esc(f.name)}</b><span class="gd">아직 연결 전</span></span></div>`]);
  return `${head}
    <div class="more-grid"><div>
      <div class="gl">연결 승인${reqs.length ? ` · 기다리는 요청 ${reqs.length}명` : ''}</div><div class="gc">
        ${reqs.length > 1 ? `<div class="gr"><span class="gt"><span class="gd">기다리는 요청을 한 번에 승인해요</span></span><button class="btn small" type="button" data-act="room-apall">모두 승인 (${reqs.length})</button></div>` : ''}
        ${reqs.length ? reqs.map(p => `<div class="gr"><span class="gt"><b>${esc(p.person)}</b><span class="gd">카카오 닉네임 · ${esc(p.nick)}${p.newFamily ? ' · ' + (solo ? '새로 왔어요' : '새 가정 신청' + (p.familyName && p.familyName !== p.person ? ' ' + esc(p.familyName) : '')) : ''}</span></span>
          <div class="set-btns"><button class="btn ghost small" type="button" data-act="room-reject" data-k="${esc(p.kakaoId)}" data-n="${esc(p.person)}" aria-label="${esc(p.person)} 거절">거절</button><button class="btn small" type="button" data-act="room-approve" data-k="${esc(p.kakaoId)}" data-n="${esc(p.person)}" aria-label="${esc(p.person)} 승인">승인</button></div></div>`).join('')
          : '<div class="gr"><span class="gt"><span class="gd">기다리는 요청이 없어요. 새로 들어온 사람이 연결을 요청하면 여기에 보여요.</span></span></div>'}
      </div>
    </div><div>
      <div class="gl">명단 · 연결된 사람 ${linked}명</div><div class="gc">
        ${people.join('')}
      </div>
    </div></div>
    <p class="soft">${ic('lock')} 이름과 연결 상태만 보여요. 묵상 기록은 잠겨 있어서 리더도 볼 수 없어요.</p>`;
}

// ── 첫 화면(C-01): 데모에서는 카카오 대신 "데모로 둘러보기". 실제 모드의 첫 화면과 걸음은 아래 "실제 서버"에 있다 ──
function startView(arg) { return LIVE ? liveStartView(arg) : arg ? cmStartView(arg) : demoStartView(); }
// 실제 서버(SB) 로그인 전: 데모 첫 화면의 모양 그대로, 가운데 카드만 Supabase에서 켠 로그인 단추로 바꾼다

  return `${joining ? '<p class="hint">초대받은 공동체에 들어오려면 먼저 로그인해 주세요.</p>' : ''}
        ${sbList.map(k => `<button class="kakao sso-${k}" type="button" data-act="sb-login" data-v="${k}">${k === 'kakao' ? BUBBLE : DidakoSb.logos[k]}${SB_START[k]}</button>`).join('')}

// 공동체의 첫 접속(C-01): 내 공동체 목록, 공동체 만들기, 초대 링크로 들어오기 신청. 모양은 실제 모드 첫 접속의 걸음 화면(.col-n, .choice)을 그대로 쓴다
const CM_CONSENT = '공동체 이름과 내 이름은 공동체 사람들과 함께 봐요. 내 생각과 기록은 공동체에 보내지 않아요.';
const cmFull = () => SB ? CM.places <= 0 : CM.list.length >= CM_MAX;   // 실제 서버는 남은 자리(끝난 곳은 세지 않음)를 알려 준다
function cmStartView(arg) {
  const back = '<a class="link" href="#start/list">뒤로</a>';
  const myName = SB && CM.list.length ? esc(CM.list[0].me || '') : '';   // 실제 서버: 내 이름 칸을 이미 있는 공동체의 내 이름으로 미리 채운다
  if (arg === 'new') return `<div class="col-n"><p class="eyebrow">디다코 공동체</p><h1>공동체 만들기</h1>
      <form data-cmform="new" novalidate>
        <label class="f" for="cmName">공동체 이름</label><input id="cmName" class="field" required maxlength="20" autocomplete="off" placeholder="예) 금요 말씀 모임">
        <label class="f" for="cmMe">내 이름</label><input id="cmMe" class="field" required maxlength="10" autocomplete="name" placeholder="예) 김하늘"${myName ? ` value="${myName}"` : ''}>
        <label class="f" for="cmEnd">끝나는 날</label><select id="cmEnd" class="field">${CM_ENDS.map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select>
        <p class="hint">끝나는 날을 정하지 않으면 계속 열려 있어요. 한 공동체는 ${CM_PEOPLE}명까지 함께해요.</p>
        <p class="hint">${CM_CONSENT}</p>
        <p class="msg" id="cmMsg" role="alert"></p>
        <button class="btn wide" type="submit">만들기</button></form>
      ${back}</div>`;
  if (arg === 'join' && SB) {   // 실제 서버: 초대 링크의 공동체 이름과 모임장은 서버에서 받는다
    if (!SBJ.peek && !SBJ.err) return `<div class="col-n"><p class="eyebrow">초대받은 공동체</p><p class="hint">불러오고 있어요…</p></div>`;
    const full = SBJ.peek && Number(SBJ.peek.n) >= Number(SBJ.peek.max);
    if (SBJ.err || full) return `<div class="col-n"><section class="card calm"><p class="calm-t">${esc(SBJ.err || '12명이 모두 찼어요.')}</p>
      <button class="btn" type="button" data-act="sb-join-drop">내 공동체로</button></section></div>`;
  }
  const J = arg === 'join' && SB ? { name: String(SBJ.peek.name || ''), leader: String(SBJ.peek.lead || '') } : CM_JOIN;
  if (arg === 'join') return `<div class="col-n"><p class="eyebrow">초대받은 공동체</p><h1>${esc(J.name)}</h1>
      <p class="hint">모임장 ${esc(J.leader)} 님이 보낸 초대 링크예요.</p>
      <form data-cmform="join" novalidate>
        <label class="f" for="cmMe">내 이름</label><input id="cmMe" class="field" required maxlength="10" autocomplete="name" placeholder="예) 김하늘"${myName ? ` value="${myName}"` : ''}>
        <p class="hint">모임장이 승인할 때 누구인지 알아보는 데 써요.</p>
        <p class="hint">${CM_CONSENT}</p>
        <p class="msg" id="cmMsg" role="alert"></p>
        <button class="btn wide" type="submit">들어오기 신청</button></form>
      ${back}</div>`;
  if (arg === 'wait') return `<div class="col-n"><section class="card calm"><p class="calm-t">신청을 보냈어요</p>
      <p class="soft" style="margin:0">모임장이 승인하면 열려요.${SB ? '' : ' 데모에서는 신청이 실제로 전해지지 않아요.'}</p>
      <a class="btn" href="#start/list">내 공동체로</a></section></div>`;
  const cur = cmCur();
  return `<div class="col-n"><p class="eyebrow">디다코 공동체</p><h1>내 공동체</h1>
      <div class="choices">${CM.list.map(g => `<button class="choice" type="button" data-act="cm-open" data-v="${esc(g.id)}">${esc(g.name)} <span class="role-tag${g.role === 'leader' ? ' leader' : ''}">${cmTagText(g)}</span></button>`).join('')}
        ${cmFull() ? '' : SB && CM.open === false ? '<p class="hint">디다코 공동체는 아직 열리지 않았어요.</p>' : '<a class="choice new" href="#start/new" style="display:flex;align-items:center;text-decoration:none">공동체 만들기</a>'}</div>
      <p class="hint">${cmFull() ? `한 사람은 ${CM_MAX}곳까지 함께할 수 있어요.` : `한 사람은 ${CM_MAX}곳까지 함께할 수 있어요. 지금 ${SB ? CM_MAX - CM.places : CM.list.length}곳이에요.`}</p>
      <p class="hint">다른 공동체에는 모임장이 보낸 초대 링크로 들어와요. 찾아서 들어가는 검색은 없어요.</p>
      ${cmFull() || SB ? '' : '<div class="choices"><button class="choice new" type="button" data-act="cm-join-demo">초대 링크로 들어오기 (데모 예시)</button></div>'}
      ${CM.list.some(g => g.wait) ? '<button class="link" type="button" data-act="cm-cancel">들어오기 신청 취소</button>' : ''}
      ${cur ? '<a class="link" href="#week">이번 주로 가기</a>' : ''}${SB ? `
      <button class="link" type="button" data-act="sb-logout">로그아웃</button>` : ''}</div>`;
}

// 보이지 않는 종이에 그려서 잰다
function ppMeasure(inner, fn) {
  const w = document.createElement('div'); w.className = 'paper-wrap pp-measure';
  w.innerHTML = `<article class="paper">${inner}</article>`;
  document.body.appendChild(w);
  try { return fn(w.firstElementChild, w.getBoundingClientRect().width / 210); } finally { w.remove(); }
}
// 질문 조각을 쪽마다 나눈다: 쪽마다 조각 번호 묶음을 돌려준다
function ppPaginate(inner, blocks, firstPageOpen) {
  return ppMeasure(inner + blocks.join(''), (art, mm) => {
    const top0 = art.getBoundingClientRect().top + 16 * mm;
    const els = Array.from(art.querySelectorAll(':scope > .pp-blk')), pages = [[]];
    let lim = top0 + PAGE_AV * mm;
    els.forEach((el, i) => {
      const r = el.getBoundingClientRect();
      if (r.bottom > lim && (pages[pages.length - 1].length || firstPageOpen)) { pages.push([]); lim = r.top + PAGE_AV * mm; firstPageOpen = false; }
      pages[pages.length - 1].push(i);

  });
}
// 본문을 넣었으면 1쪽은 머리만, 2쪽부터 질문. 넣지 않았으면 머리 바로 아래부터 질문을 잇고 넘칠 때만 다음 쪽

  for (let i = 0; i < n; i++) {

      return { k, pts, z: Math.cos(tm * periods * 2 * Math.PI + p) };
    }).sort((a, b) => a.z - b.z).forEach(o => {
      const d = o.pts.map((q, m) => (m ? 'L' : 'M') + (vert ? `${f(q[1])} ${f(q[0])}` : `${f(q[0])} ${f(q[1])}`)).join('');

    });
  }
  return out.join('');
}

// 읽을 글에만 쓰는 마크다운 다섯 가지. HTML은 항상 esc로 막는다.
function mdBlocks(text) {
  const lines = String(text || '').replace(/\r\n?/g, '\n').split('\n'), blocks = [];
  const row = l => l.trim().split('|').slice(1, -1).map(x => x.trim());
  const tableLine = l => /^\s*\|.*\|\s*$/.test(l);
  const separator = l => tableLine(l) && row(l).length > 0 && row(l).every(c => /^:?-{3,}:?$/.test(c));
  const tableStart = i => i + 1 < lines.length && tableLine(lines[i]) && separator(lines[i + 1])
    && row(lines[i]).length === row(lines[i + 1]).length;
  const heading = l => /^#{1,3} /.test(l);
  const kind = l => /^(- |· )/.test(l) ? 'ul' : /^\d+\. /.test(l) ? 'ol' : '';
  let i = 0;
  while (i < lines.length) {
    if (!lines[i].trim()) { i++; continue; }
    if (tableStart(i)) {
      const head = row(lines[i]), rows = []; i += 2;
      while (i < lines.length && tableLine(lines[i]) && !separator(lines[i])) rows.push(row(lines[i++]));
      blocks.push({ type: 'table', head, rows }); continue;
    }
    if (heading(lines[i])) { blocks.push({ type: 'h', text: lines[i++].replace(/^#{1,3} /, '') }); continue; }
    const listType = kind(lines[i]);
    if (listType) {
      const items = [];
      while (i < lines.length && kind(lines[i]) === listType) {
        const m = /^(- |· |\d+\. )/.exec(lines[i]);
        items.push({ marker: m[0], text: lines[i++].slice(m[0].length) });
      }
      blocks.push({ type: listType, items }); continue;
    }
    if (lines[i].startsWith('> ')) {
      const parts = [];
      while (i < lines.length && lines[i].startsWith('> ')) parts.push(lines[i++].slice(2));
      blocks.push({ type: 'quote', text: parts.join('\n') }); continue;
    }
    const parts = [];
    while (i < lines.length && lines[i].trim() && !tableStart(i) && !heading(lines[i])
      && !kind(lines[i]) && !lines[i].startsWith('> ')) parts.push(lines[i++]);
    blocks.push({ type: 'p', text: parts.join('\n') });
  }
  return blocks;
}
function mdHtml(input) {
  const blocks = Array.isArray(input) ? input : input && typeof input === 'object' ? [input] : mdBlocks(input);
  const inline = s => esc(s).replace(/\*\*([^\n*]+)\*\*/g, '<strong>$1</strong>');
  const withBreaks = s => inline(s).replace(/\n/g, '<br>');
  return blocks.map(b => {
    if (b.type === 'h') return '<h4 class="md-h">' + inline(b.text) + '</h4>';
    if (b.type === 'p') return '<p>' + withBreaks(b.text) + '</p>';
    if (b.type === 'quote') return '<blockquote class="md-q">' + withBreaks(b.text) + '</blockquote>';
    if (b.items) return '<' + b.type + ' class="md-list">' + b.items.map(x => '<li>' + withBreaks(x.text) + '</li>').join('') + '</' + b.type + '>';
    if (b.type === 'table') {
      const cells = (items, tag) => items.map(x => '<' + tag + '>' + inline(x) + '</' + tag + '>').join('');
      return '<div class="md-tw"><table class="md-t"><thead><tr>' + cells(b.head, 'th') + '</tr></thead><tbody>'
        + b.rows.map(items => '<tr>' + cells(items, 'td') + '</tr>').join('') + '</tbody></table></div>';
    }
    return '';
  }).join('');
}
function mdPlain(text) {
  const clean = s => String(s).replace(/\*\*/g, '');
  return mdBlocks(text).map(b => b.type === 'table'
    ? [b.head, ...b.rows].map(row => row.map(clean).join(' · ')).join('\n')
    : b.items ? b.items.map(x => clean(x.text)).join('\n') : clean(b.text)).join('\n');
}

    window.scrollTo(0, 0);

  }
  if (LIVE && entering) liveEnter(v);

}

});
// ── 실제 서버(SB): 내 공동체를 Supabase에서 받고 바꾸기 (docs/setup.md 3-5) ──
// 화면은 데모 그대로 쓰고, 내 공동체 목록(CM)을 서버 답으로 채우고 바꾸는 통로만 여기에 둔다. 답의 모양은 cm-api.js가 데모 자료 모양으로 바꾼다.
// 서버에 보내는 것은 공동체 이름, 내 이름, 끝나는 날, 지금 읽는 책과 과뿐이다. 펼치기의 내 생각, 오늘 남길 것 같은 기록은 보내지 않는다.
// 기기에는 마지막 답의 사본(didako-cm-sb-cache.해시)을 남겨 두고 먼저 그린다. 실시간 연결은 쓰지 않고, 들어올 때·화면이 다시 보일 때·무언가 바꾼 뒤에 새로 받는다
const SB_WANT = location.hash;   // 처음 열 때 가려던 화면(사본이 비어 첫 화면이 내 공동체로 바뀌기 전에 적어 둔다)
let SBJ = { token: '', peek: null, err: '', busy: false };   // 초대 링크로 받은 공동체 정보(peek)
let sbBusy = false, sbLast = 0, sbRun = null, sbReady = false;   // sbBusy: 같은 단추를 두 번 누르지 못하게 하는 깃발. sbReady: 시작(로그인 확인)이 끝났는지
function sbJoinToken() { let t = ''; try { t = sessionStorage.getItem(SB_JOIN) || ''; } catch (e) { /* 못 읽으면 localStorage */ } return t || ls.get(SB_JOIN) || ''; }
function sbJoinSet(t) {
  try { if (t) sessionStorage.setItem(SB_JOIN, t); else sessionStorage.removeItem(SB_JOIN); } catch (e) { /* localStorage에도 적는다 */ }
  if (t) ls.set(SB_JOIN, t); else { ls.del(SB_JOIN); SBJ = { token: '', peek: null, err: '', busy: false }; }
}
// ?join=토큰으로 열었으면 토큰을 적어 두고(로그인하러 다녀와도 남게) 주소에서는 지운다
function sbTakeJoin() {
  const q = new URLSearchParams(location.search), j = q.get('join');
  if (j == null) return;
  sbJoinSet(String(j).trim().slice(0, 64));
  if (!sbJoinToken()) return;   // 저장이 안 되는 브라우저면 주소에 그대로 둔다
  q.delete('join'); const qs = q.toString();
  history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + location.hash);
}
const sbGo = h => { if (location.hash === h) route(true); else location.hash = h; };
// 이 기기의 로그인 표시와 사본을 지운다(기기의 기록은 그대로 남는다)
function sbForget() { const h = ls.get(SBH); if (h) ls.del(SB_CACHE + h); ls.del(SBH); D.entered = false; CM = { cur: '', list: [], open: true, places: CM_MAX }; sbLast = 0; sbReady = false; }
function sbFail(e) {
  if (e && e.code === 'login') { sbForget(); closeSheet(); sbGo('#start'); toast('로그인이 끝났어요. 다시 로그인해 주세요.'); return; }
  toast(e && e.message ? e.message : '서버가 답하지 않아요. 잠시 뒤 다시 해 주세요.');
}
// 쓰는 중(글 칸에 커서, 창이 열림, 펼치기·나눔하기·이번 주의 질문)에는 새로 받은 답으로 화면을 다시 그리지 않는다
const sbCalm = () => { const a = document.activeElement; return !(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) && $('#pop').hidden && !['read', 'share', 'wq'].includes(currentView()); };
// 내 공동체 목록과 지금 연 공동체의 자세한 정보를 새로 받는다. force가 아니면 30초 안에는 다시 받지 않는다
function sbRefresh(force) {
  if (sbRun) return sbRun;
  if (!force && Date.now() - sbLast < 30000) return Promise.resolve(true);
  sbRun = (async () => {
    try {
      const m = await DidakoCm.mine() || {};
      const rows = Array.isArray(m.list) ? m.list : [];
      const before = JSON.stringify(CM), prev = cmCur();
      const old = id => CM.list.find(g => g.id === String(id));
      let list = rows.map(r => DidakoCm.toGroup(r, null, old(r.id)));
      const open = list.filter(g => !g.wait && g.state !== '닫음');
      const cur = open.some(g => g.id === CM.cur) ? CM.cur : open[0] ? open[0].id : '';
      if (cur) {
        try {
          const info = await DidakoCm.info(cur);
          list = list.map(g => (g.id === cur ? DidakoCm.toGroup(rows.find(r => String(r.id) === cur), info, g) : g));
        } catch (e) { if (e.code === 'login' || e.code === 'net') throw e; /* 볼 수 없게 된 곳은 목록 답 그대로 둔다 */ }
      }
      CM = { cur, list, open: m.open !== false, places: Number.isInteger(m.places) ? m.places : CM_MAX };
      const now = cmCur();
      // 다른 공동체로 바뀌었거나 모임장이 지금 읽는 책·과를 바꿨으면, 나눔하기에서 고른 과와 책갈피를 지운다(모임장이 바꿀 때와 같다)
      if (prev && now && (prev.id !== now.id || prev.book !== now.book || prev.no !== now.no)) { ls.del(K.shareLesson); ls.del(K.bookmark); }
      cmSave(); sbLast = Date.now();
      if (JSON.stringify(CM) !== before && sbCalm()) { const y = window.scrollY; route(false); window.scrollTo(0, y); }
      return true;
    } catch (e) { sbFail(e); return false; }
    finally { sbRun = null; }
  })();
  return sbRun;
}
// 초대 링크의 공동체 정보 받기. 이미 함께하면 그 공동체를 열고, 신청해 두었으면 기다림 화면으로
function sbPeek() {
  const t = sbJoinToken();
  if (!t || SBJ.busy || (SBJ.token === t && (SBJ.peek || SBJ.err))) return;
  SBJ = { token: t, peek: null, err: '', busy: true };
  (async () => {
    try {
      const p = await DidakoCm.peek(t) || {};
      if (p.mine === '요청') { sbJoinSet(''); await sbRefresh(true); sbGo('#start/wait'); return; }
      if (p.mine === '함께') {
        const r = await DidakoCm.join(t, '-');   // 이미 함께하면 서버가 이름을 보지 않고 그 공동체를 알려 준다
        sbJoinSet(''); CM.cur = String(r && r.id || ''); cmSave(); await sbRefresh(true); sbGo('#week'); return;
      }
      SBJ.peek = p; SBJ.busy = false;
    } catch (e) {
      SBJ.busy = false;
      if (e && e.code === 'login') { sbFail(e); return; }
      SBJ.err = e && e.message ? e.message : '서버가 답하지 않아요. 잠시 뒤 다시 해 주세요.';
    }
    if (currentView() === 'start') route(false);
  })();
}
// route()가 화면에 들어올 때마다 부른다
function sbEnter(v, arg) {
  if (!sbReady) return;   // 로그인한 계정을 확인하기 전에는 받지 않는다(다른 계정의 답이 사본에 섞이지 않게)
  if (v === 'start' && arg === 'join') { sbPeek(); return; }
  if (v === 'week' || v === 'church' || v === 'more' || (v === 'start' && arg === 'list')) sbRefresh(false);
}
// 시작: 로그인 확인 → 계정마다 기록 자리 정하기 → 내 공동체 받기 → 갈 화면 정하기
async function sbBoot() {
  const err = DidakoSb.returnError();
  if (err) toast(err === 'cancel' ? '로그인을 취소했어요.' : '로그인을 마치지 못했어요. 다시 해 주세요.');
  let s;
  try { s = await DidakoSb.session(); } catch (e) { toast(e && e.message ? e.message : '서버가 답하지 않아요. 잠시 뒤 다시 해 주세요.'); return; }   // 사본으로 계속 보인다
  if (!s) { const was = D.entered; sbForget(); if (was || currentView() !== 'start') sbGo('#start'); return; }
  let h;
  try { h = await DidakoSb.hash(s.user.id); } catch (e) { toast('이 브라우저에서는 로그인을 이어 갈 수 없어요.'); return; }
  const same = ls.get(SBH) === h;
  ls.set(SBH, h);
  try { switchOwnerApp('sb:' + h); } catch (e) { /* 기록 자리를 못 바꾸면 그대로 둔다 */ }   // 한 기기를 여러 계정이 써도 기록이 섞이지 않게
  D.entered = true; sbReady = true;
  if (!same) cmLoad();
  await sbRefresh(true);
  if (sbJoinToken()) { sbGo('#start/join'); return; }
  if (!cmCur()) { sbGo('#start/list'); return; }
  // 처음 가려던 화면이 있으면 그곳(내 공동체·만들기 포함), 없거나 첫 화면이었으면 이번 주
  sbGo(/^#start\/(list|new)$/.test(SB_WANT) || (SB_WANT && SB_WANT !== '#' && !/^#start/.test(SB_WANT)) ? SB_WANT : '#week');
}
// 단추 동작: 서버가 받은 뒤에만 화면 자료를 바꾼다. 실패하면 바꾸지 않고 서버 글을 알린다
const sbAct = fn => async (e, el) => { if (sbBusy) return; sbBusy = true; try { await fn(e, el); } catch (err) { sbFail(err); } finally { sbBusy = false; } };
const sbLeaderOk = () => { const g = cmCur(); return g && g.role === 'leader' && g.canWrite !== false ? g : null; };
async function sbForm(f) {
  const msg = t => { const m = $('#cmMsg'); if (m) m.textContent = t; };
  if (sbBusy) return;
  const me = $('#cmMe').value.trim(), btn = f.querySelector('[type="submit"]');
  let name = '', months = 0;
  if (f.dataset.cmform === 'join') { if (!me) { msg('내 이름을 적어 주세요.'); $('#cmMe').focus(); return; } }
  else {
    name = $('#cmName').value.trim(); months = Number($('#cmEnd').value) || 0;
    if (!name) { msg('공동체 이름을 적어 주세요.'); $('#cmName').focus(); return; }
    if (!me) { msg('내 이름을 적어 주세요.'); $('#cmMe').focus(); return; }
    if (CM.list.some(g => g.name === name)) { msg('같은 이름의 공동체에 이미 함께하고 있어요.'); return; }
  }
  sbBusy = true; if (btn) btn.disabled = true; msg('');
  try {
    if (f.dataset.cmform === 'join') {
      const r = await DidakoCm.join(sbJoinToken(), me) || {};
      sbJoinSet('');
      if (r.status === '함께') { CM.cur = String(r.id || ''); cmSave(); await sbRefresh(true); sbGo('#week'); }
      else { await sbRefresh(true); sbGo('#start/wait'); }
      return;
    }
    const first = CM_BASE.books[0];
    const r = await DidakoCm.create({ name, me, months, book: first.id, no: first.lessons[0].no }) || {};
    CM.cur = String(r.id || ''); cmSave(); ls.del(K.shareLesson); ls.del(K.bookmark);
    await sbRefresh(true);
    window.addEventListener('hashchange', () => toast('공동체를 만들었어요. 초대 링크로 사람들을 불러요'), { once: true });
    sbGo('#church');
  } catch (e) {
    if (e && e.code === 'login') sbFail(e); else msg(e && e.message ? e.message : '서버가 답하지 않아요. 잠시 뒤 다시 해 주세요.');
  } finally { sbBusy = false; if (btn && btn.isConnected) btn.disabled = false; }
}
if (SB) {
  const demoActs = Object.assign({}, acts);
  Object.assign(acts, {
    'sb-login': sbAct(async (e, el) => { await DidakoSb.oauth(el.dataset.v); }),
    'sb-logout'() {
      closeMenu();
      openSheet(sheetHead('로그아웃') + `<p>로그아웃할까요?</p><p class="hint">다시 들어올 때는 같은 계정으로 로그인해요. 이 기기의 기록은 그대로 남아요. 디다코 노트의 동기화 로그인도 함께 풀려요.</p><div class="set-btns"><button class="btn ghost" type="button" data-act="pop-close" data-focus>그만두기</button><button class="btn" type="button" data-act="sb-logout-do">로그아웃</button></div>`);
    },
    'sb-logout-do': sbAct(async () => { closeSheet(); await DidakoSb.signOut(); sbForget(); sbJoinSet(''); sbGo('#start'); }),
    'sb-join-drop'() { sbJoinSet(''); sbGo('#start/list'); },
    'cm-open'(e, el) {
      const g = CM.list.find(x => x.id === el.dataset.v); if (!g) return;
      if (g.state === '닫음') { closeMenu(); toast('운영자가 닫은 공동체예요'); return; }
      demoActs['cm-open'](e, el);
      if (!g.wait) sbRefresh(true);
    },
    'cm-cancel': sbAct(async () => {
      for (const g of CM.list.filter(x => x.wait)) await DidakoCm.leave(g.id);
      await sbRefresh(true); route(false); toast('들어오기 신청을 취소했어요');
    }),
    'cm-invite-new': sbAct(async () => {
      const g = sbLeaderOk(); if (!g) return;
      const r = await DidakoCm.renew(g.id) || {};
      g.invite = { code: String(r.token || ''), made: (Date.parse(String(r.expires || '')) || Date.now() + CM_DAYS * 86400000) - CM_DAYS * 86400000 };
      cmSave(); roomRedraw(); toast('새 링크를 만들었어요. 전에 보낸 링크는 쓸 수 없어요');
    }),
    'cm-invite-copy'(e, el) { const g = cmCur(); if (!g || !g.invite) return; demoActs['cm-invite-copy'](e, el); },
    'cm-now-do': sbAct(async (e, el) => {
      const g = sbLeaderOk(), b = g && bookById(g.book), no = Number(el.dataset.no);
      if (!g || D.role !== 'leader' || !b || !b.lessons.some(l => l.no === no)) return;
      await DidakoCm.now(g.id, g.book, no);
      demoActs['cm-now-do'](e, el);
    }),
    'book-pick': sbAct(async (e, el) => {
      const g = sbLeaderOk(), b = bookById(el.dataset.book);
      if (!g || D.role !== 'leader' || !b) return;
      if (b.lessons.length) await DidakoCm.now(g.id, b.id, b.lessons[0].no);
      demoActs['book-pick'](e, el);
    }),
    'room-approve': sbAct(async (e, el) => {
      const g = sbLeaderOk(), p = g && g.pending[Number(el.dataset.i)]; if (!p || D.role !== 'leader') return;
      if (cmCount(g) >= CM_PEOPLE) { toast(`한 공동체는 ${CM_PEOPLE}명까지 함께해요`); return; }
      await DidakoCm.decide(g.id, p.id, true);
      await sbRefresh(true); roomRedraw(); toast(`${p.name} 님의 신청을 승인했어요`);
    }),
    'room-reject': sbAct(async (e, el) => {
      const g = sbLeaderOk(), p = g && g.pending[Number(el.dataset.i)]; if (!p || D.role !== 'leader') return;
      await DidakoCm.decide(g.id, p.id, false);
      await sbRefresh(true); roomRedraw(); toast(`${p.name} 님의 신청을 거절했어요`);
    }),
    'room-dc'(e, el) { if (!sbLeaderOk()) return; demoActs['room-dc'](e, el); },
    'room-dc-do': sbAct(async (e, el) => {
      const g = sbLeaderOk(), i = Number(el.dataset.i), name = g && g.members[i], mid = g && g.mids && g.mids[i];
      if (!name || !mid || name === g.leader || D.role !== 'leader') return;
      await DidakoCm.remove(g.id, mid);
      closeSheet(); await sbRefresh(true); roomRedraw(); toast('내보냈어요');
    })
  });
  document.addEventListener('visibilitychange', () => { if (D.entered && document.visibilityState === 'visible' && Date.now() - sbLast > 60000) sbRefresh(true); });
  sbTakeJoin();
}
// 초대 링크(?join=…)로 열었으면 들어오기 신청 화면으로 간다. 데모에서는 어떤 링크든 예시 모임으로 친다(실제 서버는 위 sbTakeJoin)
if (!LIVE && !SB && new URLSearchParams(location.search).has('join')) { D.entered = true; saveDemo(); history.replaceState(null, '', location.pathname + '?demo#start/join'); }
window.addEventListener('hashchange', () => route(true));

applySettings(); route(false);
if (LIVE) {
  // 실제 모드에는 데모 표시가 없다. 로그인 상태를 확인하고 첫 화면을 정한다
  const demoTag = $('.topbar .demo-tag'); if (demoTag) demoTag.remove();
  bootLive();
}
if (SB) {
  // 실제 서버(Supabase)에도 데모 표시가 없다. 로그인을 확인하고 내 공동체를 받는다
  const demoTag = $('.topbar .demo-tag'); if (demoTag) demoTag.remove();
  sbBoot();
}
// 홈 화면 앱: 한 번 열어 두면 인터넷이 없어도 열린다
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => { /* 없어도 앱은 그대로 */ });
})();
</script>
