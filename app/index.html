    const names = Object.keys(adRgRooms()), nowRooms = d.rooms.map(r => r.name);
    const chip = (n, l, cls) => `<span class="ad-rg-chip ${cls || ''}"><b>${n}</b>${l}</span>`;
    return wrap(`<section class="card"><div class="ad-rg-chips">${chip(matches.length, '자동으로 맞춤', 'ok')}${chip(checks.length, '확인 필요', checks.length ? 'warn' : '')}${chip(news.length, '새 ' + one)}${chip(miss.length, '편성표에 없음')}</div>
        <p class="hint">표기만 다른 ${one}(/, 띄어쓰기, 부부 순서)은 자동으로 같은 ${one}${adPt(one, '으로/로')} 맞췄어요. 아래만 확인해 주세요.</p>
        ${res.bad.length ? `<p class="hint warn-text">읽지 못한 줄 ${res.bad.length}개: ${res.bad.slice(0, 3).map(esc).join(' / ')}${res.bad.length > 3 ? ' …' : ''}</p>` : ''}</section>
      <section class="card"><h2>${esc(g)} ${names.length}곳</h2>
        <ul class="ad-rg-fams">${names.map(n => `<li><b>${esc(n)}</b><small>${nowRooms.includes(n) ? '그대로 이어져요' : '새 ' + esc(g)}</small></li>`).join('')}</ul>
        ${nowRooms.filter(n => !names.includes(n)).length ? `<p class="hint">새 편성에 없는 ${esc(g)}: ${nowRooms.filter(n => !names.includes(n)).map(esc).join(', ')}. 각자의 기록은 그대로 남아요.</p>` : ''}</section>
      ${checks.length ? `<section class="card"><h2>확인 필요, 비슷한 이름</h2>${checks.map(({ r, i }) => `<div class="ad-rg-row">
          <div><b>${esc(r.raw)}</b><small>편성표: ${esc(r.room)}</small><small>지금: ${esc(r.ex.name)} (${esc(r.ex.room)})</small></div>
          <div class="seg2" role="group" aria-label="${esc(r.raw)}">${[['same', '같은 ' + one + '이에요'], ['new', '새 ' + one + '이에요']].map(([v, l]) => `<button type="button" class="${rg.dec[i] === v ? 'on' : ''}" data-act="ad-rgdec" data-v="${i}:${v}" aria-pressed="${rg.dec[i] === v}">${l}</button>`).join('')}</div></div>`).join('')}</section>` : ''}
      ${news.length ? `<section class="card"><h2>새 ${one}</h2><p class="hint" style="margin:0">바뀌는 날부터 명단에 나와요. 처음 들어올 때 이름을 골라 카카오 연결을 요청하고, 리더가 승인해요.</p><ul class="ad-rg-fams">${news.map(({ r }) => `<li>${esc(r.raw)} <small>${esc(r.room)}</small></li>`).join('')}</ul></section>` : ''}
      ${miss.length ? `<section class="card"><h2>편성표에 없는 ${one}</h2>${miss.map(f => `<div class="ad-rg-row">
          <div><b>${esc(f.name)}</b><small>${now}년 ${esc(f.room || '')}</small></div>
          <div class="seg2" role="group" aria-label="${esc(f.name)}">${[['leave', '떠남'], ['hold', '편성 보류']].map(([v, l]) => `<button type="button" class="${(rg.miss[f.id] || 'leave') === v ? 'on' : ''}" data-act="ad-rgmiss" data-v="${esc(f.id)}:${v}" aria-pressed="${(rg.miss[f.id] || 'leave') === v}">${l}</button>`).join('')}</div></div>`).join('')}
        <p class="hint">떠남이어도 각자의 기록은 남고 명단에서만 빠져요. 편성 보류는 ${esc(adJ(g, '이/가'))} 정해질 때까지 "새 편성을 정하고 있어요" 안내가 나와요. 둘 다 바뀌는 날부터예요.</p></section>` : ''}
      ${matches.length ? `<details class="card ad-rg-match"><summary>자동으로 맞춘 ${matches.length}${cnt} 보기</summary><ul class="ad-rg-fams">${matches.map(({ r }) => `<li>${esc(r.raw)} <small>${esc(r.room)}, 지금 ${esc(r.ex.name)}</small></li>`).join('')}</ul></details>` : ''}`
      + nav('ad-rgnext', undecided ? `확인 필요 ${undecided}개 남음` : '다음: 리더 정하기', undecided));
  }
  const rooms = adRgRooms();
  // 3. 리더 정하기
  if (rg.step === 3) return wrap(`<div class="ad-rg-board">${Object.keys(rooms).map((n, k) => `<section class="card">
      <h2>${esc(n)}</h2><p class="hint" style="margin:0 0 .5em">${rooms[n].length}${cnt}</p>
      <label class="ad-label" for="adRgL${k}">리더</label><select id="adRgL${k}" class="field" data-adrg="leaders" data-room="${esc(n)}"><option value="">아직 안 정함</option>${rooms[n].map(i => `<option value="${i}"${rg.leaders[n] === i ? ' selected' : ''}>${esc(adRgLabel(i))}</option>`).join('')}</select>
      <label class="ad-label" for="adRgC${k}" style="margin-top:.7em">코리더 (없으면 비워 두세요)</label><select id="adRgC${k}" class="field" data-adrg="co" data-room="${esc(n)}"><option value="">없음</option>${rooms[n].map(i => `<option value="${i}"${rg.co[n] === i ? ' selected' : ''}>${esc(adRgLabel(i))}</option>`).join('')}</select>
    </section>`).join('')}</div>
    <p class="hint">리더를 정하지 않은 ${esc(adJ(g, '은/는'))} 바뀐 뒤 관리 화면에서 정할 수 있어요.</p>${nav('ad-rgnext', '다음: 확인과 예약')}`);
  // 4. 확인과 예약: 구성과 이동, 이동표, 날짜
  const from = i => (adRgSame(i) ? (res.rows[i].ex.room || '') : ''), NEW = '새 ' + one;
  const moves = [...res.rows.map((r, i) => ({ name: adRgLabel(i), from: from(i) || NEW, to: r.room })),
    ...adRgMissing().map(f => ({ name: f.name, from: f.room, to: (rg.miss[f.id] || 'leave') === 'leave' ? '떠남' : '편성 보류' }))];
  const role = (n, i) => (rg.leaders[n] === i ? ' <small>리더</small>' : rg.co[n] === i ? ' <small>코리더</small>' : '');
  const months = Array.from({ length: 6 }, (_, k) => adMonAdd(adMonth(), k + 1));
  if (!months.includes(rg.start)) months.push(rg.start);
  const dayBefore = adDayAdd(rg.start + '-01', -1);
  return wrap(`<section class="card"><h2>${Object.keys(rooms).length}개 ${esc(g)}, ${res.rows.length}${cnt}</h2><p class="hint" style="margin:0">이 편성으로 ${next}년 편성을 만들어요. 여기에는 구성과 이동만 나와요. 각자의 기록은 잠겨 있어서 옮겨도 아무도 읽을 수 없어요.</p></section>
    <div class="ad-rg-board">${Object.keys(rooms).map(n => { const c = {}; rooms[n].forEach(i => { const k = from(i) || NEW; c[k] = (c[k] || 0) + 1; });
      return `<section class="card"><h2>${esc(n)}</h2><div class="ad-rg-comp">${Object.entries(c).map(([k, v]) => `<span class="ad-rg-cc">${esc(k)}${k === NEW ? '' : '에서'} ${v}</span>`).join('')}</div>
        <ul class="ad-rg-fams">${rooms[n].map(i => `<li>${esc(adRgLabel(i))}${role(n, i)}</li>`).join('')}</ul></section>`; }).join('')}</div>
    <section class="card"><h2>${one}별 이동표</h2>
      <label class="vh" for="adRgFind">이름으로 찾기</label><input id="adRgFind" class="field" type="search" placeholder="이름으로 찾기" value="${esc(rg.find)}" autocomplete="off">
      <div class="ad-rg-tw"><table class="ad-rg-table"><caption class="vh">${one}별 이동표</caption><thead><tr><th scope="col">${solo ? '이름' : '가정'}</th><th scope="col">${now}년</th><th scope="col">${next}년</th></tr></thead>
        <tbody>${moves.map(m => `<tr data-name="${esc(m.name)}"${rg.find && !m.name.includes(rg.find) ? ' hidden' : ''}><th scope="row">${esc(m.name)}</th><td>${esc(m.from)}</td><td class="${m.to === '떠남' || m.to === '편성 보류' ? 'muted' : 'to'}">${esc(m.to)}</td></tr>`).join('')}</tbody></table></div></section>
    <section class="card"><h2>날짜</h2><div class="ad-rg-dates">
      <label for="adRgStart">바뀌는 날<select id="adRgStart" class="field" data-adrg="start">${months.map(m => `<option value="${m}"${rg.start === m ? ' selected' : ''}>${adMonName(m)} 1일</option>`).join('')}</select></label>
      <label for="adRgLf">새 리더에게 맡을 ${one} 명단 보여 주기<input id="adRgLf" class="field" type="date" data-adrg="lf" value="${rg.lf}" max="${dayBefore}"></label>
      <label for="adRgMf">회원에게 "${Number(rg.start.slice(5))}월부터 ○○ ${esc(adJ(g, '이에요/예요'))}" 안내하기<input id="adRgMf" class="field" type="date" data-adrg="mf" value="${rg.mf}" max="${dayBefore}"></label></div>
      <p class="hint">바뀌는 날 0시에 새 편성이 저절로 적용돼요. 그 전까지는 ${now}년 편성이 그대로이고, 예약은 언제든 고치거나 취소할 수 있어요. 카카오 연결과 각자의 잠긴 기록은 그대로 따라가요.</p>
      <p class="hint">${esc(AD_NOCHANGE_PLAN)}</p></section>`
    + nav('ad-rgsave', `${adMonName(rg.start)} 1일에 바뀌도록 예약`));
}

// ── 교회 전체 관리(A-01): 코이데 churchView를 옮겼다. 부서 관리와 따로 열고, 데모 역할 관리자만 연다 ──
// 왼쪽은 부서 카드와 부서 만들기, 오른쪽은 접어 둔 메뉴(교회 초대, 교재 종류, 교회 밖 모임 열기, 교회 관리자, 가정 다른 부서로 보내기).
// 서버 호출은 없고 바뀐 것은 DATA.admin에만 남는다(새로 고치면 처음으로). 데모의 부서 관리(#admin)는 청장년부만 열려서 다른 부서 카드는 안내만 한다.
// 코이데에서 뺀 것: 의견과 설문 탭, 부서 닫기·다시 열기·기록 지우기(코이데 노트 쪽 일), 앱 상태 카드(부서 카드의 점으로 대신), 교회 관리자 초대 링크(데모라 안내만).
// 바꾼 것: 다른 부서로 옮기기는 코이데에서 가정 줄에서 시작하지만 여기서는 교회 전체에서 부서와 가정을 골라 시작한다.
const adChurchAdminBody = () => {
  const L = DATA.admin.churchAdmins, n = L.length;
  return `<ul class="ad-list">${L.map(x => `<li><div class="ad-main"><span class="ad-l1"><b>${esc(x.name)}</b><span class="role-tag admin">교회 관리자</span></span><small>${adDot(x.linked)}${x.linked ? '카카오 연결됨' : '아직 카카오 연결 없음'}</small></div></li>`).join('')}</ul>
    ${n < 2 ? '<p class="warn-text" style="margin:0">한 사람이 빠져도 멈추지 않게 관리자를 한 명 더 정해 주세요.</p>' : ''}
    <p class="hint">모든 부서를 꾸리고 부서를 만들어요. 앱을 쓰는 사람의 기록은 보이지 않아요. 한 사람이 빠져도 멈추지 않도록 두 명 이상을 권해요.</p>
    <div class="ad-acts">${adSay('교회 관리자 더하기', '데모에서는 초대 링크를 만들지 않아요', 'btn small')}${adSay('내 자리 넘겨주기')}</div>
    <p class="soft" style="margin:0">마지막 남은 관리자는 자리를 넘겨준 뒤에 교회를 나갈 수 있어요.</p>`;

// ── 분석(부서 관리와 교회 전체): 코이데 analysisView 맨 위 카드 모양을 본떴다 ──
// 기록 관련 숫자(쓴 사람, 기록 수, 작성률, 나눔하기 한 수), 사랑방끼리 견주는 그림(칸 그림, 순위), 주제 흐름은 두지 않는다(결정 기록 2026-11-11).
// 있는 것: 한눈에(이번 달 앱에 들어온 사람, 카카오로 연결된 사람, 달마다 흐름), 구성, 교재 진행, 도움이 필요한 곳. 숫자는 편성 자료에서 세고, 앱에 들어온 비율만 DATA.admin.analysis의 지어낸 값이다.
const AD_WAIT_DAYS = 3;
const adWaitDays = q => {
  const m = /(\d+)월\s*(\d+)일/.exec(q.at || ''), t = DATA.admin.analysis.today;
  return m ? Math.round((new Date(2026, t[0] - 1, t[1]) - new Date(2026, Number(m[1]) - 1, Number(m[2]))) / 864e5) : 0;
};
function adDeptStat(d) {
  const reqs = adReqs().filter(q => d.rooms.some(r => r.name === q.room));
  let people = 0, linked = 0, fams = 0;
  const noLead = [], moreUnlinked = [], waiting = [];
  d.rooms.forEach(r => {
    const un = r.fams.filter(f => !f.on.length).length;
    fams += r.fams.length; people += r.fams.reduce((n, f) => n + adNames(f).length, 0); linked += adRoomN(r);
    if (!r.leader) noLead.push(r.name);
    if (un >= 2 || (r.fams.length && un / r.fams.length >= .3)) moreUnlinked.push(r.name);
    if (reqs.some(q => q.room === r.name && adWaitDays(q) > AD_WAIT_DAYS)) waiting.push(r.name);
  });
  return { d, rooms: d.rooms.length, fams, people, linked: Math.min(linked, people), reqs: reqs.length, noLead, moreUnlinked, waiting, admins: adDeptAdmins(d).length };
}
const adPct = (k, n) => (n ? Math.round(k / n * 100) : 0);

const adDateKey = L => { const m = /(\d+)월\s*(\d+)일/.exec(L.date || ''); return m ? Number(m[1]) * 100 + Number(m[2]) : Infinity; };
// 교재 진행: 지금 열린 교재마다 모두에게 공개한 과까지와 다음 과 날짜, 다가오는 과 세 개. 교재 관리가 쓰는 자료(mg())에서 읽는다

// 방금 더하거나 바꾼 줄을 잠깐 밝혀 보인다(움직임 줄이기는 밝은 채로 두었다 끈다)
function adShowHl() {

function braidPaths(len, amp, periods, vert, sw, ol, cols, n, sub) {
  ol = ol == null ? 3 : ol; cols = cols || STRAND; n = n || periods * 22; sub = sub || 1;

      const tm = (i + .5) / n;
      return { k, pts, z: Math.cos(tm * periods * 2 * Math.PI + p) };
    }).sort((a, b) => a.z - b.z).forEach(o => {
      const d = o.pts.map((q, m) => (m ? 'L' : 'M') + (vert ? `${f(q[1])} ${f(q[0])}` : `${f(q[0])} ${f(q[1])}`)).join('');

    });

}

// 읽을 글에만 쓰는 마크다운 다섯 가지. HTML은 항상 esc로 막는다.
function mdBlocks(text) {
  const lines = String(text || '').replace(/\r\n?/g, '\n').split('\n'), blocks = [];
  const row = l => l.trim().split('|').slice(1, -1).map(x => x.trim());
  const tableLine = l => /^\s*\|.*\|\s*$/.test(l);
  const separator = l => tableLine(l) && row(l).length > 0 && row(l).every(c => /^:?-{3,}:?$/.test(c));
  const tableStart = i => i + 1 < lines.length && tableLine(lines[i]) && separator(lines[i + 1])
    && row(lines[i]).length === row(lines[i + 1]).length;
  const heading = l => /^#{1,3} /.test(l);
  const kind = l => /^(- |· )/.test(l) ? 'ul' : /^\d+\. /.test(l) ? 'ol' : '';

  while (i < lines.length) {
    if (!lines[i].trim()) { i++; continue; }
    if (tableStart(i)) {
      const head = row(lines[i]), rows = []; i += 2;
      while (i < lines.length && tableLine(lines[i]) && !separator(lines[i])) rows.push(row(lines[i++]));
      blocks.push({ type: 'table', head, rows }); continue;
    }
    if (heading(lines[i])) { blocks.push({ type: 'h', text: lines[i++].replace(/^#{1,3} /, '') }); continue; }
    const listType = kind(lines[i]);
    if (listType) {
      const items = [];
      while (i < lines.length && kind(lines[i]) === listType) {
        const m = /^(- |· |\d+\. )/.exec(lines[i]);
        items.push({ marker: m[0], text: lines[i++].slice(m[0].length) });
      }
      blocks.push({ type: listType, items }); continue;
    }
    if (lines[i].startsWith('> ')) {
      const parts = [];
      while (i < lines.length && lines[i].startsWith('> ')) parts.push(lines[i++].slice(2));
      blocks.push({ type: 'quote', text: parts.join('\n') }); continue;
    }
    const parts = [];
    while (i < lines.length && lines[i].trim() && !tableStart(i) && !heading(lines[i])
      && !kind(lines[i]) && !lines[i].startsWith('> ')) parts.push(lines[i++]);
    blocks.push({ type: 'p', text: parts.join('\n') });
  }
  return blocks;
}

  const blocks = Array.isArray(input) ? input : input && typeof input === 'object' ? [input] : mdBlocks(input);
  const inline = s => esc(s).replace(/\*\*([^\n*]+)\*\*/g, '<strong>$1</strong>');
  const withBreaks = s => inline(s).replace(/\n/g, '<br>');
  return blocks.map(b => {
    if (b.type === 'h') return '<h4 class="md-h">' + inline(b.text) + '</h4>';
    if (b.type === 'p') return '<p>' + withBreaks(b.text) + '</p>';
    if (b.type === 'quote') return '<blockquote class="md-q">' + withBreaks(b.text) + '</blockquote>';
    if (b.items) return '<' + b.type + ' class="md-list">' + b.items.map(x => '<li>' + withBreaks(x.text) + '</li>').join('') + '</' + b.type + '>';
    if (b.type === 'table') {
      const cells = (items, tag) => items.map(x => '<' + tag + '>' + inline(x) + '</' + tag + '>').join('');
      return '<div class="md-tw"><table class="md-t"><thead><tr>' + cells(b.head, 'th') + '</tr></thead><tbody>'
        + b.rows.map(items => '<tr>' + cells(items, 'td') + '</tr>').join('') + '</tbody></table></div>';
    }
    return '';
  }).join('');
}

  const clean = s => String(s).replace(/\*\*/g, '');
  return mdBlocks(text).map(b => b.type === 'table'
    ? [b.head, ...b.rows].map(row => row.map(clean).join(' · ')).join('\n')
    : b.items ? b.items.map(x => clean(x.text)).join('\n') : clean(b.text)).join('\n');

document.addEventListener('click', e => {
  if (!e.target.closest('#placeMenu, #badge')) closePlaceMenu();
  if (e.target.closest('#opening')) { hideOpening(); return; }
  const set = e.target.closest('[data-set]');
  if (set) {
    const [k, v] = set.dataset.set.split(':');
    if (DISPLAY_KEYS.includes(k)) { S[k] = k === 'big' ? Number(v) : v; saveDisplay(); }
    else if (LIVE) return;   // 실제 모드에는 화면 설정 말고는 바꿀 설정이 없다
    else if (k === 'galleryDemo') { D.galleryDemo = v === '1'; saveDemo(); }
    else if (k === 'bookmark') { if (v === '1') { if (!hasBm()) ls.set(K.bookmark, JSON.stringify({ id: 'o2', at: Date.now() })); } else ls.del(K.bookmark); }   // 책갈피는 펼치기가 꽂는 것과 같은 자리
    else { D[k] = ['before', 'alt', 'readOpen', 'readTriple', 'two', 'noBooks', 'longTitle', 'newcomer'].includes(k) ? v === '1' : k === 'dimSec' ? (v === '5' ? 5 : 15) : v; saveDemo(); }
    rerender();

  if (sview) { R.view = sview.dataset.sview; renderStart(); return; }

  if (el && acts[el.dataset.act]) { e.preventDefault(); acts[el.dataset.act](e, el); return; }

document.addEventListener('keydown', e => {
  // 말씀을 열며(펼치기·나눔하기)의 글을 키보드로 눌러 넘기기
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('wo')) {
    e.preventDefault(); if (e.target.closest('#opening')) hideOpening(); else if (R.on) go(1); return;
  }
  // 소그룹 이름 직접 쓰기 칸에서 Enter는 [쓰기]와 같다
  if (e.key === 'Enter' && e.target.id === 'adGrpIn') { e.preventDefault(); acts['ad-grp-write'](); return; }
  // 책장의 카드(button이 아닌 칸)를 키보드로 열기
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('sh-card')) { e.preventDefault(); e.target.click(); return; }
  if (e.key !== 'Escape') return;
  if (!$('#pop').hidden) closeSheet(); else if (!$('#opening').hidden) hideOpening(); else closeMenu();
});

  if (t.id === 'lvCode') { const g = $('#lvGo'); if (g) g.disabled = t.value.trim().length < 4; return; }   // 교회 코드는 네 글자부터
  if (t.dataset && t.dataset.adin) { adInput(t); return; }
  if (t.id === 'adRgFind' && AD.rg) { AD.rg.find = t.value.trim(); $$('.ad-rg-table tbody tr').forEach(tr => { tr.hidden = !!AD.rg.find && !tr.dataset.name.includes(AD.rg.find); }); return; }
  if (t.dataset && t.dataset.mg) { mgEditInput(t); return; }
  if (t.id === 'mgTitle') { const h = $('#mgTitleHint'); if (h && t.value.trim()) h.hidden = true; }
  else if (t.id === 'feedbackText') { feedbackState.text = t.value; const count = $('#feedbackCount'); if (count) count.textContent = String(t.value.length); const send = $('#feedbackSend'); if (send) send.disabled = !t.value.trim(); }
  else if (t.id === 'wqMed') { const meds = readJson(K.walkMeditate); meds[walkWeek().n] = t.value; ls.set(K.walkMeditate, JSON.stringify(meds)); }
  else if (t.id === 'wqTa') { const thought = readJson(K.walkThought); thought[walkWeek().n] = t.value; ls.set(K.walkThought, JSON.stringify(thought)); }
  else if (t.dataset && t.dataset.memoKey) { const m = readMemo(); if (t.value.trim()) m[t.dataset.memoKey] = t.value; else delete m[t.dataset.memoKey]; ls.set(K.memo, JSON.stringify(m)); }
  else if (t.matches && t.matches('textarea[data-id]')) { const id = t.dataset.id; sizeTa(t); setBookmark(id); clearTimeout(timers[id]); timers[id] = setTimeout(() => saveAns(id, t), 450); }
  else if ((t.id === 'kSentence' || t.id === 'kAction') && currentView() === 'read') { clearTimeout(keepT); keepT = setTimeout(saveKeepRead, 450); }
  else if (t.id === 'shelfQ') runShelfSearch();
  else if (t.id === 'recQ') { rec.q = t.value; $('#recResults').innerHTML = recSearch(); }
  else if (t.id === 'memoText') { const m = readMemo(); m[t.dataset.key] = t.value; ls.set(K.memo, JSON.stringify(m)); }   // 리더의 내 진행 메모
});
document.addEventListener('focusout', e => {
  const t = e.target;
  if (t.dataset && t.dataset.mg) { mgEditBlur(t); return; }
  if (t.matches && t.matches('textarea[data-id]') && timers[t.dataset.id]) saveAns(t.dataset.id, t);
  else if ((t.id === 'kSentence' || t.id === 'kAction') && keepT) saveKeepRead(true);
});
window.addEventListener('pagehide', () => { flushAll(); if (keepT) saveKeepRead(); });
// 남기고 다음: 눌러서 넘어가기 전에 나눔하기의 오늘 남길 것을 저장
document.addEventListener('click', e => { const el = e.target.closest('[data-act="next"]'); if (el && R.on && cur().t === 'keep') saveKeepShare(); }, true);
document.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.admv && AD.mv) { AD.mv[e.target.dataset.admv] = e.target.value; adRedraw('#adMvRoom'); return; }
  if (e.target.dataset && e.target.dataset.adrg && AD.rg) {
    const t = e.target, k = t.dataset.adrg, rg = AD.rg, v = t.value;
    if (k === 'leaders' || k === 'co') {
      const room = t.dataset.room, other = k === 'leaders' ? 'co' : 'leaders';
      if (v === '') delete rg[k][room]; else { rg[k][room] = Number(v); if (rg[other][room] === Number(v)) delete rg[other][room]; }   // 같은 사람이 리더와 코리더를 함께 맡지 못한다
    } else if (k === 'start') { rg.start = v; rg.lf = adDayAdd(v + '-01', -14); rg.mf = adDayAdd(v + '-01', -7); }
    else if (v) rg[k] = v > adDayAdd(rg.start + '-01', -1) ? adDayAdd(rg.start + '-01', -1) : v;   // 안내 날짜는 바뀌는 날 전날까지만
    adRedraw('#' + t.id); return;
  }
  if (e.target.dataset && e.target.dataset.admap && AD.mv) { AD.mv.map[e.target.dataset.admap] = e.target.value; return; }
  if (e.target.dataset && e.target.dataset.acmv && AD.cMv) {
    const M = AD.cMv, k = e.target.dataset.acmv; M[k] = e.target.value; M.ok = false;
    if (k === 'from') { M.fam = ''; M.to = ''; M.room = ''; } else if (k === 'fam') { M.to = ''; M.room = ''; } else if (k === 'to') M.room = '';
    adRedraw('#' + e.target.id); return;
  }
  if (['mgGroup', 'mgMotif', 'mgColor'].includes(e.target.id)) { mgPreview(); return; }
  if (e.target.id === 'walkSel') { const n = Number(e.target.value); if (Number.isInteger(n) && DATA.weekWalk.some(w => w.n === n)) { D.walk = n; walkDay = ''; saveDemo(); rerender(); } return; }
  if (e.target.id === 'jcoverMotif') { D.jcoverMotif = pick(e.target.value, COVER_MOTIFS, JOHN_COVER.motif); saveDemo(); rerender(); return; }
  if (e.target.id === 'jcoverColor') { D.jcoverColor = pick(e.target.value, COVER_COLORS, JOHN_COVER.color); saveDemo(); rerender(); return; }
});
// 돌아보기: 시간이 지난 뒤 남기는 생각. 쌓아 두고 날짜를 붙인다(오늘은 데모의 오늘)
document.addEventListener('submit', e => {
  const f = e.target; if (!f || f.id !== 'reflectionForm') return;
  e.preventDefault();
  const id = f.dataset.id, text = $('#recReflection').value.trim(); if (!text) return;
  const all = readJson(K.recRefl); all[id] = Array.isArray(all[id]) ? all[id] : [];
  all[id].push({ date: LIVE ? `${new Date().getMonth() + 1}월 ${new Date().getDate()}일` : DATA.today.replace(/\(.*$/, '').trim(), text });
  const ok = recSave(K.recRefl, all); recRedraw(); recDone(ok);
});
// 편성의 쓰는 칸은 쓰는 대로 AD에 담아 둔다(다시 그려져도 쓴 글이 남도록)
function adInput(t) {
  const k = t.dataset.adin, M = AD.mv;
  if (k === 'mvname' && M) { M.name = t.value; M.nameEdited = true; const nx = $('[data-act="ad-mvnext"]'); if (nx) nx.disabled = !M.name.trim(); }
  else if (k === 'mvnp' && M) { M.newPerson = t.value; const nx = $('[data-act="ad-mvnext"]'); if (nx) nx.disabled = !(M.a && M.newPerson.trim()); }
  else if (k === 'rgtext' && AD.rg) AD.rg.text = t.value;
  else if (k === 'cname' && AD.cNew) AD.cNew.name = t.value;
  else if (AD.edit) AD.edit[k] = t.value;
}
// 편성의 쓰는 칸(폼): 가정 더하기, 이름 바꾸기, 사랑방 만들기, 합칠 사람 찾기
document.addEventListener('submit', e => {
  const f = e.target; if (!f || !f.dataset || !f.dataset.adform) return;
  e.preventDefault();
  const d = adDept(), kind = f.dataset.adform;
  if (kind === 'mvfind') {
    const q = f.elements.q.value.trim(); if (!q || !AD.mv) return;
    AD.mv.slot = f.dataset.v; AD.mv.q = q; AD.mv.found = adFind(AD.mv, q); adRedraw(); return;
  }
  if (kind === 'dept') {
    const N = AD.cNew, n = f.elements.n.value.trim(); if (!N || !n) return;
    N.name = n;
    if (DATA.admin.depts.some(x => x.name === n)) { toast('같은 이름이 이미 있어요'); return; }
    const nd = { id: 'd' + (++adSeq), name: n, group: N.group, unit: N.unit, rooms: [] }; DATA.admin.depts.push(nd);
    AD.cNew = null; AD.hl = [nd.id]; toast(adJ(n, '을/를') + ' 만들었어요'); adRedraw(); return;
  }
  if (kind === 'person') {
    const r = d.rooms.find(x => x.id === f.dataset.v), a = f.elements.a.value.trim(), b = f.elements.b ? f.elements.b.value.trim() : ''; if (!r || !a) return;
    if (AD.edit) { AD.edit.a = a; AD.edit.b = b; }
    if (!AD_BK_NAME.test(a) || (b && !AD_BK_NAME.test(b))) { toast('이름은 글자로만 적어 주세요'); return; }
    const parts = b ? [a, b] : [a], key = adKey(parts);
    for (const rr of d.rooms) { const hit = rr.fams.find(x => adKey(adNames(x)) === key); if (hit) { toast(`${hit.name}${adSolo(d) ? ' 님은' : ' 가정은'} 이미 ${rr.name}에 있어요`); return; } }
    const nf = { id: adNewId('f'), name: parts.join(', '), role: '', on: [] }; r.fams.push(nf);
    AD.edit = null; AD.hl = [nf.id]; toast('더했어요'); adRedraw(); return;
  }
  const n = f.elements.n.value.trim(); if (!n) return;
  if (AD.edit) AD.edit.n = n;
  if (d.rooms.some(x => x.name === n && x.id !== f.dataset.v)) { toast('같은 이름이 이미 있어요'); return; }
  if (kind === 'room') {
    const r = { id: adNewId('r'), name: n, leader: '', co: '', fams: [] }; d.rooms.push(r); DATA.admin.invites.rooms.push(n);
    AD.open[r.id] = true; AD.edit = null; AD.hl = [r.id]; toast(adJ(n, '을/를') + ' 만들었어요'); adRedraw(); return;
  }
  if (kind === 'rename') {
    const r = d.rooms.find(x => x.id === f.dataset.v); if (!r) return;
    adRenameRoom(r, n); AD.edit = null; AD.hl = [r.id]; toast('이름을 바꿨어요'); adRedraw();
  }
});
window.addEventListener('hashchange', () => route(true));

applySettings(); route(false);
if (LIVE) {
  // 실제 모드에는 데모 표시가 없다. 로그인 상태를 확인하고 첫 화면을 정한다
  const demoTag = $('.topbar .demo-tag'); if (demoTag) demoTag.remove();
  bootLive();
}
// 홈 화면 앱: 한 번 열어 두면 인터넷이 없어도 열린다
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => { /* 없어도 앱은 그대로 */ });
})();
</script>
