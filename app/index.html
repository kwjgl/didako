<!-- 홈 화면 앱(PWA): 홈 화면에 두면 주소창 없이 앱처럼 열린다. 아이폰은 apple- 줄들을 본다 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>
// 저장된 화면 설정을 그림이 그려지기 전에 먼저 입힌다(밝은 화면이 잠깐 번쩍이지 않게). 읽을 수 없으면 기기 설정을 따른다
try {
  const d = JSON.parse(localStorage.getItem('didako-display') || '{}'), r = document.documentElement;
  if (d.mode === 'light' || d.mode === 'dark') r.setAttribute('data-mode', d.mode);
  if (['amber', 'blue', 'rose', 'ink'].includes(d.accent)) r.setAttribute('data-accent', d.accent);
  if (['neu', 'skeu', 'glass'].includes(d.style)) r.setAttribute('data-style', d.style);
  if (d.big === true) r.setAttribute('data-big', '');
} catch (e) {}
</script>
<style>

   화면 모드는 코이데처럼 data-mode를 쓴다. 이름과 내용은 모두 지어낸 데모 예시다. */
:root {
  --page: #F3F5F2; --surface: #FFFFFF; --surface-2: #EEF2EF;
  --ink: #1B2523; --ink-2: #5B6965; --line: #DDE4E0; --line-strong: #B9C4BF;
  --accent: #2B6A62; --accent-mid: #8DBDB5; --accent-soft: #DCEBE7; --on-accent: #FFFFFF;

  --base: 16px;
  --wood: #B98756;   /* 함께 짜는 그물(3D)의 수틀 나무색. 기도 노트와 같은 색 */
  --f-display: 'Gowun Batang', 'AppleMyungjo', 'Batang', serif;
  --f-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-mode="light"]) {
  --page: #141B19; --surface: #1C2522; --surface-2: #232D2A;
  --ink: #E5ECE9; --ink-2: #9CAAA5; --line: #2D3935; --line-strong: #4A5853;
  --accent: #7CC2B7; --accent-mid: #3F7C73; --accent-soft: #1E3934; --on-accent: #0F1A18;
  --leader: #B6A8EA; --leader-soft: #2A2442; --private: #252E2B;
  --warn: #E2A563; --warn-soft: #3A2C1B; --shadow: rgba(0, 0, 0, .5); --neu-hi: rgba(255, 255, 255, .06); --neu-lo: rgba(0, 0, 0, .6); --wood: #7A5636; color-scheme: dark; } }
/* 화면 모드: 기기 설정이면 기기를 따르고, '밝게'·'어둡게'를 고르면 그대로(data-mode) */
:root[data-mode="dark"] {
  --page: #141B19; --surface: #1C2522; --surface-2: #232D2A;
  --ink: #E5ECE9; --ink-2: #9CAAA5; --line: #2D3935; --line-strong: #4A5853;
  --accent: #7CC2B7; --accent-mid: #3F7C73; --accent-soft: #1E3934; --on-accent: #0F1A18;

  --warn: #E2A563; --warn-soft: #3A2C1B; --shadow: rgba(0, 0, 0, .5); --neu-hi: rgba(255, 255, 255, .06); --neu-lo: rgba(0, 0, 0, .6); --wood: #7A5636; color-scheme: dark; }
/* 글씨: 휴대폰·태블릿 16px, PC 15px. 큰 글씨 모드는 약 1.2배 */
@media (min-width: 1000px) { :root { --base: 15px; } }
:root[data-big] { --base: 19px; }
@media (min-width: 1000px) { :root[data-big] { --base: 18px; } }
/* 색 테마(초록은 위 기본값). 시안의 THEMES와 같은 값: 밝은 화면 / 어두운 화면 */

:root[data-accent="amber"][data-mode="dark"] { --page:#1A1612;--surface:#231E19;--surface-2:#2B241E;--ink:#EEE6DC;--ink-2:#AE9F8E;--line:#3A3129;--line-strong:#5A4D41;--accent:#E9A066;--accent-mid:#8A5A32;--accent-soft:#3A2818;--on-accent:#1E140C;--private:#2E2721; }
:root[data-accent="blue"] { --page:#F2F4F8;--surface:#FFFFFF;--surface-2:#EAEEF4;--ink:#1B2230;--ink-2:#5A6475;--line:#DCE2EB;--line-strong:#B6C0CF;--accent:#2F5D95;--accent-mid:#93AFD3;--accent-soft:#DCE6F3;--on-accent:#FFFFFF;--private:#E8EBF0; }
@media (prefers-color-scheme: dark) { :root[data-accent="blue"]:not([data-mode="light"]) { --page:#12161D;--surface:#1A2029;--surface-2:#212833;--ink:#E4E9F0;--ink-2:#9AA5B5;--line:#2C3542;--line-strong:#485466;--accent:#8EB4E6;--accent-mid:#3C5B85;--accent-soft:#1D2C42;--on-accent:#0E1622;--private:#232A35; } }
:root[data-accent="blue"][data-mode="dark"] { --page:#12161D;--surface:#1A2029;--surface-2:#212833;--ink:#E4E9F0;--ink-2:#9AA5B5;--line:#2C3542;--line-strong:#485466;--accent:#8EB4E6;--accent-mid:#3C5B85;--accent-soft:#1D2C42;--on-accent:#0E1622;--private:#232A35; }
:root[data-accent="rose"] { --page:#F8F2F3;--surface:#FFFDFD;--surface-2:#F2E8EA;--ink:#2A1E21;--ink-2:#6E5B60;--line:#E8DADD;--line-strong:#CDB6BC;--accent:#A8435C;--accent-mid:#DDA2B1;--accent-soft:#F5DFE5;--on-accent:#FFFFFF;--private:#F0E7E9; }
@media (prefers-color-scheme: dark) { :root[data-accent="rose"]:not([data-mode="light"]) { --page:#1A1416;--surface:#231B1E;--surface-2:#2B2226;--ink:#EEE3E6;--ink-2:#B09CA2;--line:#3A2D31;--line-strong:#5A464C;--accent:#E896AB;--accent-mid:#86475A;--accent-soft:#3B2029;--on-accent:#200E14;--private:#2E2428; } }
:root[data-accent="rose"][data-mode="dark"] { --page:#1A1416;--surface:#231B1E;--surface-2:#2B2226;--ink:#EEE3E6;--ink-2:#B09CA2;--line:#3A2D31;--line-strong:#5A464C;--accent:#E896AB;--accent-mid:#86475A;--accent-soft:#3B2029;--on-accent:#200E14;--private:#2E2428; }
:root[data-accent="ink"] { --page:#F4F4F2;--surface:#FFFFFF;--surface-2:#EDEDEA;--ink:#1D1D1B;--ink-2:#62625E;--line:#E0E0DC;--line-strong:#BDBDB7;--accent:#33332F;--accent-mid:#A3A39C;--accent-soft:#E6E6E1;--on-accent:#FFFFFF;--private:#ECECE8; }
@media (prefers-color-scheme: dark) { :root[data-accent="ink"]:not([data-mode="light"]) { --page:#141414;--surface:#1D1D1C;--surface-2:#252524;--ink:#ECECE8;--ink-2:#A3A39E;--line:#30302E;--line-strong:#4D4D4A;--accent:#E2E2DC;--accent-mid:#6A6A65;--accent-soft:#2E2E2C;--on-accent:#141414;--private:#262625; } }
:root[data-accent="ink"][data-mode="dark"] { --page:#141414;--surface:#1D1D1C;--surface-2:#252524;--ink:#ECECE8;--ink-2:#A3A39E;--line:#30302E;--line-strong:#4D4D4A;--accent:#E2E2DC;--accent-mid:#6A6A65;--accent-soft:#2E2E2C;--on-accent:#141414;--private:#262625; }
* { box-sizing: border-box; }
html, body { margin: 0; }
/* 휴대폰을 가로로 돌려도 브라우저가 글씨를 저절로 키우지 않게 */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { background: var(--page); color: var(--ink); font-family: var(--f-body); font-size: var(--base); line-height: 1.55; -webkit-tap-highlight-color: transparent; word-break: keep-all; overflow-wrap: anywhere; }
button, input, textarea, select { font: inherit; color: inherit; }
/* 아이폰에서 빠르게 두세 번 눌러도 화면이 확대되지 않게(두 손가락으로 벌려 확대하는 것은 그대로). 캔버스·3D 무대는 건드리지 않는다 */
button, a, label, summary, select, input, [role="button"], [data-act], .brand { touch-action: manipulation; }
/* 틀(시안과 같게): 휴대폰·태블릿은 상단 바(배지·설정) + 하단 바(아이콘만), PC(1000px 이상)는 메뉴가 상단 바로 올라가고 2단 */
.ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.wrap { width: 100%; max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); transition: transform .25s ease; }
.topbar .wrap { display: flex; align-items: center; gap: .6em; min-height: 3.4em; position: relative; }
.brand { display: inline-flex; align-items: center; gap: .45em; background: none; border: 0; padding: .3em 0; color: var(--ink); cursor: pointer; min-height: 44px; }
.brand-mark { width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.brand-mark .ic { width: .95em; height: .95em; }
.brand-name { font-family: var(--f-display); font-size: 1.05em; font-weight: 700; white-space: nowrap; }
.topnav { display: none; gap: .2em; margin-left: 1.2em; }
.topnav :is(button, a) { text-decoration: none; font-size: .92em; background: none; border: 0; color: var(--ink-2); padding: .5em .9em; border-radius: 10px; cursor: pointer; min-height: 40px; }
.topnav :is(button, a).on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.spacer { flex: 1; }
.badge-btn { display: inline-flex; align-items: center; gap: .4em; font-size: .8em; font-weight: 600; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: .35em .5em .35em .85em; min-height: 38px; cursor: pointer; white-space: nowrap; }
.role-tag { font-size: .86em; padding: .15em .6em; border-radius: 999px; background: var(--surface); color: var(--ink-2); border: 1px solid var(--line); }
.role-tag.leader { color: var(--leader); border-color: var(--leader); background: var(--leader-soft); }
.role-tag.admin { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0; border-radius: 12px; color: var(--ink); cursor: pointer; flex: none; }
.icon-btn .ic { width: 1.35em; height: 1.35em; }
.icon-btn[aria-expanded="true"] { background: var(--surface-2); }
.menu { position: absolute; top: calc(100% + 6px); right: max(16px, env(safe-area-inset-right, 0px)); width: min(300px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 16px 40px -12px var(--shadow); padding: .5em; display: flex; flex-direction: column; gap: .1em; z-index: 25; }
.mlabel { font-size: .72em; font-weight: 600; color: var(--ink-2); margin: .6em .7em .3em; }
.mitem { display: flex; justify-content: space-between; align-items: center; gap: .6em; width: 100%; text-align: left; font-size: .9em; color: var(--ink); background: none; border: 0; border-radius: 10px; padding: .55em .7em; min-height: 44px; cursor: pointer; text-decoration: none; }
.mitem:hover { background: var(--surface-2); }
.mitem.static { cursor: default; flex-direction: column; align-items: flex-start; gap: .1em; }
.mitem.static:hover { background: none; }
.mitem small { font-size: .82em; color: var(--ink-2); }
.swatches { display: flex; gap: .55em; margin: .2em .4em .4em; flex-wrap: wrap; }

.swatch i { width: 28px; height: 28px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); }
.swatch.on { border-color: var(--ink); }
.menu .seg { margin: 0 .3em .3em; }
.card .swatches { margin: .6em 0 0; }
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

h2 { font-size: 1.05em; margin: 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4em; min-height: 44px; padding: 0 1.1em; border-radius: 12px; border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); font-weight: 600; cursor: pointer; }

.btn.wide { width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }
.field { width: 100%; min-height: 44px; padding: .5em .75em; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); }
textarea.field { resize: vertical; line-height: 1.55; overflow-y: hidden; }
.tabs[hidden] { display: none !important; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 0 env(safe-area-inset-right, 0px) max(6px, env(safe-area-inset-bottom, 0px)) env(safe-area-inset-left, 0px); z-index: 10; transition: transform .25s ease; }
.tabs :is(button, a) { text-decoration: none; background: none; border: 0; color: var(--ink-2); display: grid; place-items: center; padding: .55em 0; min-height: 56px; cursor: pointer; position: relative; }

.toast { pointer-events: none; position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--ink); color: var(--page); padding: .6em 1em; border-radius: 10px; font-size: .88em; z-index: 20; max-width: calc(100% - 32px); }
.pop { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; }

<style>

.fine { font-size: .84em; color: var(--ink-2); margin: .8em 0 0; line-height: 1.55; word-break: keep-all; }

.book-l .mk { width: 1.6em; height: 1.6em; flex: none; --cord-bg: var(--surface); }
/* 상단 바 로고: 코이데와 같은 테마색 동그라미(1.6em) 안에 마크 */
.brand-mark .mk { width: 1.5em; height: 1.5em; display: block; --s1: var(--on-accent); --s2: color-mix(in srgb, var(--on-accent) 72%, var(--accent)); --s3: color-mix(in srgb, var(--on-accent) 48%, var(--accent)); --cord-bg: var(--accent); }
.book-l b { font-family: var(--f-display); font-weight: 700; font-size: 1.05em; }
.book-l span { font-size: .84em; color: var(--ink-2); }
.lesson-title { margin-top: .35em !important; }
/* 위쪽 진행 알약: 단계 이름 + 질문 점, 지난 시간 */
.pill { flex: none; display: inline-flex; align-items: center; gap: .55em; font-size: .76em; line-height: 1; min-height: 30px; padding: 0 .95em; border-radius: 999px; white-space: nowrap; border: 1px solid transparent; font-variant-numeric: tabular-nums; }
.pill .ic { width: 1.2em; height: 1.2em; }
.pill-p { background: var(--accent-soft); color: var(--accent); }
.pill-p b { font-weight: 600; }
:root[data-style="neu"] .pill { border-color: transparent; box-shadow: var(--press-sm); }
:root[data-style="skeu"] .pill { box-shadow: inset 0 1px 2px rgba(0, 0, 0, .15), 0 1px 0 rgba(255, 255, 255, .6); }
:root[data-style="glass"] .pill-p { background: color-mix(in srgb, var(--accent-soft) 70%, transparent); border-color: color-mix(in srgb, var(--surface) 65%, transparent); }
.pn { border-radius: 14px; padding: .75em 1em; line-height: 1.65; word-break: keep-all; }
.pn .lab { display: flex; align-items: center; gap: .45em; font-size: .86em; font-weight: 600; color: var(--ink-2); margin: 0 0 .25em; }

.pn .ic { width: 1.1em; height: 1.1em; }
.pn.mine, .pn.memo { background: var(--private); border: 1px solid var(--line); }
.toast { z-index: 60; }

/* ── 이 시안에만 있는 것 ── */
/* 카드 배치: 휴대폰은 한 줄, 태블릿(640px 이상)부터 카드 2열. 왼쪽은 과, 오른쪽은 지난주와 이번 주 실천 */
.week-top .card { margin: 12px 0 0; }
.week-grid { display: grid; gap: 14px; align-items: start; margin-top: 12px; }
.week-grid .col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.week-grid .col:empty { display: none; }
.week-grid:has(#colR:empty) { grid-template-columns: minmax(0, 1fr); }
.week-grid .card { margin: 0; min-width: 0; }
@media (min-width: 640px) { .week-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.lesson-top { align-items: center; }
.lesson-date { font-size: .84em; color: var(--ink-2); white-space: nowrap; }
.lesson-intro { margin: .8em 0 0; line-height: 1.7; }
.act-row { display: flex; gap: 10px; margin-top: 10px; }
.act-row .btn { flex: 1; text-decoration: none; }
.read-btn { margin-top: 16px; min-height: 52px; font-size: 1.05em; text-decoration: none; }
.status-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: .7em; }
.status-row { align-items: center; gap: .3em; }
.status-row .st-off, .status-row .st-sep { font-size: .84em; color: var(--ink-2); }
.quiet-link { display: inline-block; margin: .1em 0 0; padding: 0; background: none; border: 0; color: var(--ink-2); font-size: .84em; min-height: 36px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.sub-h { font-weight: 600; margin: 0; }
.lw-act { margin-top: .7em; }
.lw-form { margin-top: .7em; }
.lw-form label { display: block; font-size: .92em; font-weight: 600; margin-bottom: .3em; }
.keep-sen { margin: .7em 0 0; font-family: var(--f-display); line-height: 1.7; word-break: keep-all; }
.keep-act { margin: .5em 0 0; font-family: var(--f-display); font-weight: 700; font-size: 1.15em; line-height: 1.55; word-break: keep-all; }

a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }


/* ── 코이데에서 그대로 옮긴 것: 첫 화면(.welcome), 카카오 버튼 ── */
.topbar[hidden] { display: none !important; }
/* 첫 화면에서는 코이데처럼 상단 바 없이 시작한다. 시안 설정(톱니)만 오른쪽 위에 조용히 남긴다 */
.topbar.bare { background: transparent; border-bottom-color: transparent; box-shadow: none; position: absolute; left: 0; right: 0; }
:root[data-style="neu"] .topbar.bare, :root[data-style="glass"] .topbar.bare { background: transparent; box-shadow: none; backdrop-filter: none; border-color: transparent; }
.topbar.bare .brand { visibility: hidden; }
.welcome { display: grid; gap: 18px; max-width: 30rem; margin: 0 auto; padding: 1.2em 0 2em; }
.ab-mark { width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.ab-mark svg { width: 38px; height: 38px; }
.ab-mark .mk { --s1: var(--on-accent); --s2: color-mix(in srgb, var(--on-accent) 72%, var(--accent)); --s3: color-mix(in srgb, var(--on-accent) 48%, var(--accent)); --cord-bg: var(--accent); }
.ab-words { display: flex; align-items: center; justify-content: center; gap: .5em; margin: .6em 0 .2em; }
.ab-words span { display: flex; flex-direction: column; align-items: center; gap: .1em; padding: .5em .7em; border: 1px solid var(--line); border-radius: 12px; background: var(--page); min-width: 6.4em; }
.ab-words b { font-weight: 600; }
.ab-words i { font-style: normal; font-family: var(--f-display); color: var(--accent); }
.ab-words small { font-size: .74em; color: var(--ink-2); }
.ab-words em { font-style: normal; color: var(--ink-2); }
.wl-hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: .35em; padding: 1.2em 0 .2em; }
.wl-mark { width: 76px; height: 76px; margin-bottom: .3em; }
.wl-mark svg { width: 46px; height: 46px; }
.wl-name { font-family: var(--f-display); font-size: 2.1em; margin: 0; letter-spacing: .02em; }
.wl-tag { margin: 0; font-family: var(--f-display); font-size: 1.15em; line-height: 1.55; color: var(--ink-2); }
.wl-act { display: flex; flex-direction: column; gap: 10px; }
.wl-act .hint { margin: 0; }
.wl-once { text-align: center; word-break: keep-all; }
.wl-or { display: flex; align-items: center; gap: .8em; margin: 6px 0 0; color: var(--ink-2); font-size: .8em; }
.wl-or::before, .wl-or::after { content: ''; flex: 1; border-top: 1px solid var(--line); }
.wl-alt { display: flex; flex-direction: column; gap: 8px; }
.wl-alt-btn { display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: .6em; padding: .75em .9em; border: 1px solid var(--line); border-radius: 12px; background: var(--page); color: var(--ink); text-align: left; text-decoration: none; font: inherit; cursor: pointer; }
.wl-alt-btn b { font-weight: 600; font-size: .95em; }
.wl-alt-btn small { grid-column: 1; color: var(--ink-2); font-size: .8em; }
.wl-alt-btn svg { grid-column: 2; grid-row: 1 / span 2; color: var(--ink-2); }
.wl-alt-btn:hover { border-color: var(--line-strong); }
.wl-feat { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.wl-feat li { display: flex; gap: 12px; align-items: flex-start; }
.wl-ico { flex: none; width: 38px; height: 38px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.wl-ico svg { width: 20px; height: 20px; }
.wl-feat div { display: flex; flex-direction: column; gap: .15em; }
.wl-feat b { font-weight: 600; }
.wl-feat div span { color: var(--ink-2); font-size: .9em; line-height: 1.55; word-break: keep-all; }
.wl-name-note { text-align: center; border-top: 1px solid var(--line); padding-top: 1em; }
.wl-name-note .hint { margin: .4em 0 0; }
@media (min-width: 860px) {
  .welcome { max-width: 58rem; grid-template-columns: 1fr 24rem; grid-template-areas: "hero act" "feat act" "name name"; column-gap: 56px; align-items: start; padding-top: 3em; }
  .wl-hero { grid-area: hero; align-items: flex-start; text-align: left; padding-top: .4em; }
  .wl-name { font-size: 2.6em; }
  .wl-act { grid-area: act; }
  .wl-feat { grid-area: feat; }
  .wl-name-note { grid-area: name; }
}
.kakao { display: flex; align-items: center; justify-content: center; gap: .5em; width: 100%; min-height: 52px; border: 0; border-radius: 12px; background: #FEE500; color: rgba(0,0,0,.85); font-weight: 600; cursor: pointer; }
a.btn { text-decoration: none; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }


/* ── 디다코 앱에서 더한 것: 데모 표시, 설정 창 단추, 아직 없는 화면 ── */
.soft { color: var(--ink-2); }
.demo-tag { font: inherit; font-size: .72em; font-weight: 600; color: var(--warn); background: var(--warn-soft); border: 0; border-radius: 999px; padding: 0 .9em; min-height: 36px; display: inline-flex; align-items: center; white-space: nowrap; cursor: pointer; }
.demo-tag.static { min-height: 0; padding: .15em .7em; cursor: default; }
span.badge-btn { cursor: default; }
.menu .set-btns { display: flex; gap: 6px; margin: 0 .3em .3em; }
.menu .set-btns .btn { flex: 1; }
.pop-sheet.card { margin: 0; }
.pop-sheet h2 { font-family: var(--f-display); font-size: 1.25em; margin: 0 0 .4em; }
.pop-sheet .btn.wide { margin-top: 1em; }
.pop-sheet .set-btns { display: flex; gap: 8px; margin-top: 1em; }
.pop-sheet .set-btns .btn { flex: 1; }
.kakao:disabled, .wl-alt-btn:disabled { opacity: .5; cursor: default; }
.wl-alt-btn:disabled:hover { border-color: var(--line); }
.calm { display: flex; flex-direction: column; gap: .7em; align-items: flex-start; }
.calm-t { font-family: var(--f-display); font-size: 1.3em; margin: 0; }
@media (max-width: 420px) { .topbar .wrap { gap: .4em; } :root[data-big] .brand-name { display: none; } }

/* ── 펼치기·나눔하기 시안(read.html, sharing.html)에서 그대로 옮긴 것 ── */
.switch { width: 48px; height: 28px; border-radius: 999px; border: 0; background: var(--line-strong); position: relative; flex: none; padding: 0; cursor: pointer; }
.switch > span { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); transition: left .2s; }
.switch.on { background: var(--accent); }
.switch.on > span { left: 23px; }
.close-ask { display: flex; flex-direction: column; gap: 10px; margin-top: .8em; }
.nudge-t { margin: 0 0 .4em; font-family: var(--f-display); font-size: 1.15em; }
.sh p { margin: 0; line-height: 1.7; word-break: keep-all; }
.sh .soft, .read-wrap .soft, .stage .soft { line-height: 1.7; }
.sheet-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 0 0 .6em; }
.sheet-h h3 { margin: 0; font-family: var(--f-display); font-size: 1.15em; }
.sheet-x { width: 44px; height: 44px; border-radius: 12px; background: none; border: 0; color: var(--ink-2); cursor: pointer; display: grid; place-items: center; flex: none; }
.jump { display: flex; flex-direction: column; gap: 6px; }
.jump .grp { font-size: .8em; font-weight: 600; color: var(--ink-2); margin: .7em 0 .1em; }
.jump button { text-align: left; min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: .5em .9em; cursor: pointer; line-height: 1.5; word-break: keep-all; }
.jump button.here { border-color: var(--accent); background: var(--accent-soft); }
.pill .dots { display: inline-flex; gap: 4px; }
.pill .dots i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--accent); }
.pill .dots i.on { background: var(--accent); }
.pill .dv { width: 1px; height: 1.1em; background: currentColor; opacity: .35; }
.pill-t { background: var(--surface-2); color: var(--ink-2); }
:root[data-style="glass"] .pill-t { background: var(--glass-soft); border-color: color-mix(in srgb, var(--surface) 65%, transparent); }
.st-prog { flex: 1; min-width: 0; display: flex; justify-content: center; align-items: center; gap: 6px; }
@media (max-width: 420px) { .st-pill.ico { width: 44px; padding: 0; justify-content: center; } .st-pill.ico .lbl { display: none; } }
@media (max-width: 360px) { .pill .pn-n, .pill .dv { display: none; } }
.stage.big .st-top { font-size: calc(var(--base) / 1.35); }
.stage.big .pill { font-size: .88em; min-height: 34px; }
@media (max-width: 420px) { .stage.big .pill .pn-n, .stage.big .pill .dv { display: none; } }
/* 도움말, 해설, 관련 구절, 말씀을 열며 */
.help-btn { align-self: center; display: inline-flex; align-items: center; gap: .4em; font: inherit; font-size: .9em; min-height: 44px; padding: 0 .8em; background: none; border: 0; color: var(--ink-2); cursor: pointer; border-radius: 10px; }
.help-btn .ic { width: 1.15em; height: 1.15em; }
.help-btn.on { color: var(--ink); }
.more .verse { background: none; color: var(--ink-2); font-family: inherit; font-weight: 400; padding: 0; }
.more .verse + .verse::before { content: '·'; margin-right: .45em; }
.pn.lead { background: var(--leader-soft); border-left: 5px solid var(--leader); }
.pn.lead .lab { color: var(--leader); margin: 0; }
.pn.lead .pn-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pn.lead .fold { font: inherit; font-size: .9em; font-weight: 600; min-height: 44px; margin: -.6em -.6em -.6em 0; padding: 0 .8em; background: none; border: 0; color: var(--leader); cursor: pointer; border-radius: 10px; }
.pn.lead .t { margin-top: .25em; }
.pn.lead.closed .t { display: none; }
.pn.lead .empty { color: var(--ink-2); }
.pn textarea.field { min-height: 3.4em; font-size: 1em; margin-top: .3em; background: var(--surface); }
.more { margin-top: .9em; display: flex; flex-direction: column; gap: .8em; }
.more[hidden] { display: none; }
.more p { margin: 0; line-height: 1.7; word-break: keep-all; }
.verse-row { display: flex; flex-wrap: wrap; gap: .45em; align-items: center; }
.verse-row .lab { font-size: .84em; color: var(--ink-2); }
.verse { font-family: var(--f-display); font-weight: 700; font-size: .95em; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: .2em .85em; }
.wo { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; max-width: 30em; margin: 0 auto; cursor: pointer; }
.wo-cord { position: relative; width: 240px; max-width: 100%; height: 64px; margin-bottom: .6em; }
.wo-cord svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.wo-par path { stroke-dasharray: 1; stroke-width: 4; animation: wo-draw .8s ease-out both; }
.wo-par path:nth-child(1) { animation-delay: .4s; } .wo-par path:nth-child(2) { animation-delay: 1.4s; } .wo-par path:nth-child(3) { animation-delay: 2.4s; }
.wo-par { animation: wo-fade 1.4s linear 3.4s both; }
.wo-braid { clip-path: inset(0 100% 0 0); animation: wo-wipe 1.4s cubic-bezier(.4, 0, .2, 1) 3.4s both; }
@keyframes wo-draw { from { stroke-dashoffset: 1; opacity: 0; } 1% { opacity: 1; } to { stroke-dashoffset: 0; opacity: 1; } }
@keyframes wo-fade { to { opacity: 0; } }
@keyframes wo-wipe { to { clip-path: inset(0 0 0 0); } }
.wo-lines { display: flex; flex-direction: column; gap: .35em; }
.wo-lines p { margin: 0; font-family: var(--f-display); font-size: clamp(1.35em, 5.4vmin, 1.9em); line-height: 1.5; word-break: keep-all; animation: wo-in .7s ease-out calc(.4s + var(--i) * 1s) both; }
.wo-lines p:nth-child(2) { --i: 1; } .wo-lines p:nth-child(3) { --i: 2; } .wo-lines p:nth-child(1) { --i: 0; }
.wo-eyebrow { font-size: .84em; color: var(--ink-2); margin: 0; }
.wo-skip { font-size: .8em; color: var(--ink-2); margin: 1.4em 0 0; animation: wo-in .7s ease-out 1.5s both; }
@keyframes wo-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.opening { position: fixed; inset: 0; z-index: 45; background: var(--page); display: flex; align-items: center; justify-content: center; padding: 24px; cursor: pointer; overflow-y: auto; }
.opening[hidden] { display: none !important; }
.opening .wo { cursor: pointer; outline: none; }

/* 펼치기 (read.html) */
.read-wrap { max-width: 680px; margin: 0 auto; }
@media (min-width: 1000px) { .read-wrap { max-width: 968px; } }
.back-link { display: inline-flex; align-items: center; gap: .3em; min-height: 44px; margin: -8px 0 0 -4px; padding: 0 4px; color: var(--ink-2); text-decoration: none; font-size: .92em; }
.back-link:hover { color: var(--ink); }
.read-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-items: start; margin-top: 4px; }
.read-grid > * { min-width: 0; }
.rg-head { grid-area: head; } .rg-toc { grid-area: toc; } .rg-body { grid-area: body; }
.read-grid { grid-template-areas: "head" "toc" "body"; }
@media (min-width: 1000px) {
  .read-grid { grid-template-columns: 260px minmax(0, 680px); grid-template-areas: "toc head" "toc body"; column-gap: 28px; }
  .rg-toc { position: sticky; top: 84px; max-height: calc(100vh - 110px); overflow-y: auto; }
}
.read-head { margin: 0; }
.read-head .fine { margin-top: .9em; }
.toc { margin: 0; padding: 0; overflow: hidden; }
.toc-btn { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: .6em; min-height: 52px; padding: 0 16px; background: none; border: 0; font-weight: 600; color: var(--ink); cursor: pointer; text-align: left; }
.toc-btn .l { display: inline-flex; align-items: center; gap: .5em; }
.toc-btn .ch { transition: transform .2s; }
.toc-btn[aria-expanded="true"] .ch { transform: rotate(180deg); }
.toc-list { padding: 0 8px 10px; display: flex; flex-direction: column; gap: 2px; }

.toc-grp { font-size: .8em; font-weight: 600; color: var(--ink-2); margin: .9em 8px .2em; }
.toc-grp:first-child { margin-top: .2em; }
.toc-q { display: grid; grid-template-columns: 1.6em minmax(0, 1fr) 1.4em; gap: .4em; align-items: start; width: 100%; text-align: left; min-height: 44px; padding: .5em .6em; border: 0; border-radius: 10px; background: none; cursor: pointer; line-height: 1.5; word-break: keep-all; font-size: .92em; }
.toc-q:hover { background: var(--surface-2); }
.toc-q .tn { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.toc-q .tt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.toc-q .tb { display: none; }
.toc-q.has-bm { background: var(--accent-soft); }
.toc-q.has-bm .tb { display: block; }
.toc-q .tb .mk, .bm .mk { width: 1.3em; height: 1.3em; display: block; --cord-bg: var(--surface); }
@media (min-width: 1000px) { .toc-btn { cursor: default; } .toc-btn .ch { display: none; } .toc-list[hidden] { display: flex !important; } }
.stage-sec { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
.stage-sec:first-child { margin-top: 0; }
.stage-h { font-family: var(--f-display); font-size: 1.1em; margin: 12px 2px 0; }
.stage-sec:first-child .stage-h { margin-top: 2px; }
.qcard { margin: 0; scroll-margin-top: 84px; }
.q-meta { display: flex; justify-content: space-between; align-items: center; gap: .6em; min-height: 1.6em; }
.q-eyebrow { font-size: .8em; color: var(--ink-2); }
.bm { display: inline-flex; align-items: center; gap: .35em; font-size: .78em; font-weight: 600; color: var(--accent); }
.bm[hidden] { display: none !important; }
.q-t { font-family: var(--f-display); font-weight: 700; font-size: 1.15em; line-height: 1.55; margin: .15em 0 .2em; word-break: keep-all; }
.qcard .help-btn { align-self: flex-start; margin-left: -.8em; }
.qcard .more { margin-top: .2em; margin-bottom: .4em; }
.qcard .pn.lead { font-size: .88em; margin-top: .5em; }
.think-btn { display: inline-flex; align-items: center; gap: .4em; font: inherit; font-size: .9em; min-height: 44px; padding: 0 .8em; margin-left: -.8em; background: none; border: 0; color: var(--ink-2); cursor: pointer; border-radius: 10px; }
.think-btn .ic { width: 1.15em; height: 1.15em; }

(() => {
'use strict';
// 지금은 데모만 있다. 서버를 잇는 2단계에서 설정 파일(config.js)의 주소가 비었는지로 바꾼다.
// 데모에서는 아무것도 밖으로 보내지 않고, 쓴 것은 이 기기(localStorage)에만 남는다
const DEMO = true;
const DATA = window.DIDAKO_DEMO;

// ── 도구 ──
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
// 저장소를 못 쓰는 브라우저(비공개 창 등)에서도 화면은 그대로 돌아가야 해서 모두 try/catch로 감싼다. set은 성공 여부를 돌려준다
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const readJson = k => { try { const v = JSON.parse(ls.get(k) || 'null'); return v && typeof v === 'object' ? v : {}; } catch (e) { return {}; } };
const ic = (n, c) => `<svg class="ic ${c || ''}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const root = document.documentElement;

const STRAND = ['var(--accent)', 'var(--accent-mid)', 'var(--ink-2)'];
function braidPaths(len, amp, periods, vert, sw, ol, cols, n, sub) {
  ol = ol == null ? 3 : ol; cols = cols || STRAND; n = n || periods * 22; sub = sub || 1;
  const ph = [0, 2 * Math.PI / 3, 4 * Math.PI / 3], out = [], f = v => v.toFixed(2);
  for (let i = 0; i < n; i++) {
    ph.map((p, k) => {
      const pts = [];
      for (let m = 0; m <= sub; m++) { const t = (i + m / sub) / n; pts.push([len * t, amp * Math.sin(t * periods * 2 * Math.PI + p)]); }
      const tm = (i + .5) / n;
      return { k, pts, z: Math.cos(tm * periods * 2 * Math.PI + p) };
    }).sort((a, b) => a.z - b.z).forEach(o => {
      const d = o.pts.map((q, m) => (m ? 'L' : 'M') + (vert ? `${f(q[1])} ${f(q[0])}` : `${f(q[0])} ${f(q[1])}`)).join('');
      out.push(`<path d="${d}" stroke="var(--cord-bg, var(--page))" stroke-width="${sw + ol}" stroke-linecap="butt"/><path d="${d}" stroke="${cols[o.k]}" stroke-width="${sw}" stroke-linecap="round"/>`);
    });
  }
  return out.join('');
}

  if (!$('#pop').hidden) closeSheet(); else if (!$('#opening').hidden) hideOpening(); else closeMenu();
});
// 한 줄 돌아보기: 쓰는 대로 기기에 남기고, 칸을 벗어날 때 "저장했어요"를 잠깐 보인다(실패하면 그때만 알린다)
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'lwInput') ls.set(K.reflect, t.value);
  else if (t.matches && t.matches('textarea[data-id]')) { const id = t.dataset.id; sizeTa(t); setBookmark(id); clearTimeout(timers[id]); timers[id] = setTimeout(() => saveAns(id, t), 450); }
  else if ((t.id === 'kSentence' || t.id === 'kAction') && currentView() === 'read') { clearTimeout(keepT); keepT = setTimeout(saveKeepRead, 450); }
  else if (t.id === 'memoText') { const m = readMemo(); m[t.dataset.key] = t.value; ls.set(K.memo, JSON.stringify(m)); }   // 리더의 내 진행 메모
});
document.addEventListener('focusout', e => {
  const t = e.target;
  if (t.matches && t.matches('textarea[data-id]') && timers[t.dataset.id]) saveAns(t.dataset.id, t);
  else if ((t.id === 'kSentence' || t.id === 'kAction') && keepT) saveKeepRead(true);
});
window.addEventListener('pagehide', () => { flushAll(); if (keepT) saveKeepRead(); });
// 남기고 다음: 눌러서 넘어가기 전에 나눔하기의 오늘 남길 것을 저장
document.addEventListener('click', e => { const el = e.target.closest('[data-act="next"]'); if (el && R.on && cur().t === 'keep') saveKeepShare(); }, true);
document.addEventListener('change', e => {
  if (e.target.id === 'lwInput') toast(ls.set(K.reflect, e.target.value) ? '저장했어요' : '저장하지 못했어요 · 다시 시도');
});
window.addEventListener('hashchange', () => route(true));

applySettings(); route(false);
// 홈 화면 앱: 한 번 열어 두면 인터넷이 없어도 열린다
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => { /* 없어도 앱은 그대로 */ });
})();
</script>
</body>
</html>
