<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>디다코</title>
<meta name="theme-color" content="#6B4A2E">
<!-- 홈 화면 앱(PWA): 아이콘은 디다코 노트와 같은 종이(고동색) 세 겹 책갈피(icons/icon.svg). 두 앱은 오가는 한 앱이다 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="디다코">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<script>
// 저장된 화면 설정을 그림이 그려지기 전에 먼저 입힌다(밝은 화면이 잠깐 번쩍이지 않게). 읽을 수 없으면 기기 설정을 따른다
try {
  const d = JSON.parse(localStorage.getItem('didako-note-display') || '{}'), r = document.documentElement;
  if (d.mode === 'light' || d.mode === 'dark') r.setAttribute('data-mode', d.mode);
  if (d.accent !== 'green') r.setAttribute('data-accent', ['amber', 'blue', 'rose', 'ink', 'paper'].includes(d.accent) ? d.accent : 'paper');   // 기본은 종이(S-83, S-87). 초록은 속성 없이 :root 값
  if (['neu', 'skeu', 'glass'].includes(d.style)) r.setAttribute('data-style', d.style);
  if (d.big === true) r.setAttribute('data-big', '');
} catch (e) {}
</script>
<style>
/* 디다코 앱. 색 변수와 상단 바·하단 탭·설정 창은 시안(prototype/week.html)과 같은 것을 옮겼고, 코이데 app/index.html의 값을 그대로 쓴다.
   화면 모드는 코이데처럼 data-mode를 쓴다. 이름과 내용은 모두 지어낸 데모 예시다. */
:root {
  --page: #E8EBE8; --surface: #F7F8F6; --surface-2: #E9EDEA;
  --ink: #1B2523; --ink-2: #5B6965; --line: #D7DEDA; --line-strong: #B9C4BF;
  --accent: #2B6A62; --accent-mid: #8DBDB5; --accent-soft: #DCEBE7; --on-accent: #FFFFFF;
  --leader: #62519E; --leader-soft: #ECE7F7; --private: #E8ECEA;
  --warn: #9A5A14; --warn-soft: #F5E8D6; --shadow: rgba(20, 35, 32, .14);
  --neu-hi: rgba(255, 255, 255, .9); --neu-lo: rgba(20, 35, 32, .17);
  --base: 16px;
  --wood: #B98756;   /* 함께 짜는 그물(3D)의 수틀 나무색. 기도 노트와 같은 색 */
  --f-display: 'Gowun Batang', 'AppleMyungjo', 'Batang', serif;
  --f-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-mode="light"]) {
  --page: #141B19; --surface: #1C2522; --surface-2: #232D2A;
  --ink: #E5ECE9; --ink-2: #9CAAA5; --line: #2D3935; --line-strong: #4A5853;
  --accent: #7CC2B7; --accent-mid: #3F7C73; --accent-soft: #1E3934; --on-accent: #0F1A18;
  --leader: #B6A8EA; --leader-soft: #2A2442; --private: #252E2B;
  --warn: #E2A563; --warn-soft: #3A2C1B; --shadow: rgba(0, 0, 0, .5); --neu-hi: rgba(255, 255, 255, .06); --neu-lo: rgba(0, 0, 0, .6); --wood: #7A5636; color-scheme: dark; } }
/* 화면 모드: 기기 설정이면 기기를 따르고, '밝게'·'어둡게'를 고르면 그대로(data-mode) */
:root[data-mode="dark"] {
  --page: #141B19; --surface: #1C2522; --surface-2: #232D2A;
  --ink: #E5ECE9; --ink-2: #9CAAA5; --line: #2D3935; --line-strong: #4A5853;
  --accent: #7CC2B7; --accent-mid: #3F7C73; --accent-soft: #1E3934; --on-accent: #0F1A18;
  --leader: #B6A8EA; --leader-soft: #2A2442; --private: #252E2B;
  --warn: #E2A563; --warn-soft: #3A2C1B; --shadow: rgba(0, 0, 0, .5); --neu-hi: rgba(255, 255, 255, .06); --neu-lo: rgba(0, 0, 0, .6); --wood: #7A5636; color-scheme: dark; }
/* 글씨: 휴대폰·태블릿 16px, PC 15px. 큰 글씨 모드는 약 1.2배 */
@media (min-width: 1000px) { :root { --base: 15px; } }
:root[data-big] { --base: 19px; }
@media (min-width: 1000px) { :root[data-big] { --base: 18px; } }
/* 색 테마(초록은 위 기본값). 시안의 THEMES와 같은 값: 밝은 화면 / 어두운 화면 */
:root[data-accent="amber"] { --page:#EDE8E0;--surface:#F9F5EE;--surface-2:#ECE5DA;--ink:#2A221B;--ink-2:#6E6155;--line:#E0D6C8;--line-strong:#C9B9A3;--accent:#A9561B;--accent-mid:#E2B07F;--accent-soft:#F6E3CF;--on-accent:#FFFFFF;--private:#EFE8DE; }

:root[data-accent="amber"][data-mode="dark"] { --page:#1A1612;--surface:#231E19;--surface-2:#2B241E;--ink:#EEE6DC;--ink-2:#AE9F8E;--line:#3A3129;--line-strong:#5A4D41;--accent:#E9A066;--accent-mid:#8A5A32;--accent-soft:#3A2818;--on-accent:#1E140C;--private:#2E2721; }
:root[data-accent="blue"] { --page:#E7E9EE;--surface:#F6F7FA;--surface-2:#E5E9EF;--ink:#1B2230;--ink-2:#5A6475;--line:#D6DCE5;--line-strong:#B6C0CF;--accent:#2F5D95;--accent-mid:#93AFD3;--accent-soft:#DCE6F3;--on-accent:#FFFFFF;--private:#E8EBF0; }
@media (prefers-color-scheme: dark) { :root[data-accent="blue"]:not([data-mode="light"]) { --page:#12161D;--surface:#1A2029;--surface-2:#212833;--ink:#E4E9F0;--ink-2:#9AA5B5;--line:#2C3542;--line-strong:#485466;--accent:#8EB4E6;--accent-mid:#3C5B85;--accent-soft:#1D2C42;--on-accent:#0E1622;--private:#232A35; } }
:root[data-accent="blue"][data-mode="dark"] { --page:#12161D;--surface:#1A2029;--surface-2:#212833;--ink:#E4E9F0;--ink-2:#9AA5B5;--line:#2C3542;--line-strong:#485466;--accent:#8EB4E6;--accent-mid:#3C5B85;--accent-soft:#1D2C42;--on-accent:#0E1622;--private:#232A35; }
:root[data-accent="rose"] { --page:#EEE7E8;--surface:#FAF5F6;--surface-2:#EDE3E5;--ink:#2A1E21;--ink-2:#6E5B60;--line:#E2D4D7;--line-strong:#CDB6BC;--accent:#A8435C;--accent-mid:#DDA2B1;--accent-soft:#F5DFE5;--on-accent:#FFFFFF;--private:#F0E7E9; }
@media (prefers-color-scheme: dark) { :root[data-accent="rose"]:not([data-mode="light"]) { --page:#1A1416;--surface:#231B1E;--surface-2:#2B2226;--ink:#EEE3E6;--ink-2:#B09CA2;--line:#3A2D31;--line-strong:#5A464C;--accent:#E896AB;--accent-mid:#86475A;--accent-soft:#3B2029;--on-accent:#200E14;--private:#2E2428; } }
:root[data-accent="rose"][data-mode="dark"] { --page:#1A1416;--surface:#231B1E;--surface-2:#2B2226;--ink:#EEE3E6;--ink-2:#B09CA2;--line:#3A2D31;--line-strong:#5A464C;--accent:#E896AB;--accent-mid:#86475A;--accent-soft:#3B2029;--on-accent:#200E14;--private:#2E2428; }
:root[data-accent="ink"] { --page:#E9E9E7;--surface:#F7F7F6;--surface-2:#E8E8E5;--ink:#1D1D1B;--ink-2:#62625E;--line:#DADAD6;--line-strong:#BDBDB7;--accent:#33332F;--accent-mid:#A3A39C;--accent-soft:#E6E6E1;--on-accent:#FFFFFF;--private:#ECECE8; }
@media (prefers-color-scheme: dark) { :root[data-accent="ink"]:not([data-mode="light"]) { --page:#141414;--surface:#1D1D1C;--surface-2:#252524;--ink:#ECECE8;--ink-2:#A3A39E;--line:#30302E;--line-strong:#4D4D4A;--accent:#E2E2DC;--accent-mid:#6A6A65;--accent-soft:#2E2E2C;--on-accent:#141414;--private:#262625; } }
:root[data-accent="ink"][data-mode="dark"] { --page:#141414;--surface:#1D1D1C;--surface-2:#252524;--ink:#ECECE8;--ink-2:#A3A39E;--line:#30302E;--line-strong:#4D4D4A;--accent:#E2E2DC;--accent-mid:#6A6A65;--accent-soft:#2E2E2C;--on-accent:#141414;--private:#262625; }
:root[data-accent="paper"] { --page:#F0EEE6;--surface:#FAF9F5;--surface-2:#F2F0E9;--ink:#1F1E1D;--ink-2:#5E5D59;--line:#E3E0D5;--line-strong:#C4C1B5;--accent:#6B4A2E;--accent-mid:#C4A27F;--accent-soft:#EADFCD;--on-accent:#FFFFFF;--private:#EEECE4; }
@media (prefers-color-scheme: dark) { :root[data-accent="paper"]:not([data-mode="light"]) { --page:#1F1E1D;--surface:#262624;--surface-2:#30302E;--ink:#F5F4EE;--ink-2:#B7B5A9;--line:#3E3E38;--line-strong:#5C5B55;--accent:#D2B08A;--accent-mid:#7E6247;--accent-soft:#362B20;--on-accent:#1C150E;--private:#2C2C2A; } }
:root[data-accent="paper"][data-mode="dark"] { --page:#1F1E1D;--surface:#262624;--surface-2:#30302E;--ink:#F5F4EE;--ink-2:#B7B5A9;--line:#3E3E38;--line-strong:#5C5B55;--accent:#D2B08A;--accent-mid:#7E6247;--accent-soft:#362B20;--on-accent:#1C150E;--private:#2C2C2A; }
* { box-sizing: border-box; }
html, body { margin: 0; }
/* 휴대폰을 가로로 돌려도 브라우저가 글씨를 저절로 키우지 않게 */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { background: var(--page); color: var(--ink); font-family: var(--f-body); font-size: var(--base); line-height: 1.55; -webkit-tap-highlight-color: transparent; word-break: keep-all; overflow-wrap: anywhere; }
button, input, textarea, select { font: inherit; color: inherit; }
/* 아이폰에서 빠르게 두세 번 눌러도 화면이 확대되지 않게(두 손가락으로 벌려 확대하는 것은 그대로). 캔버스·3D 무대는 건드리지 않는다 */
button, a, label, summary, select, input, [role="button"], [data-act], .brand { touch-action: manipulation; }
/* 틀(시안과 같게): 휴대폰·태블릿은 상단 바(배지·설정) + 하단 바(아이콘만), PC(1000px 이상)는 메뉴가 상단 바로 올라가고 2단 */
.ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.wrap { width: 100%; max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); transition: transform .25s ease; }
.topbar .wrap { display: flex; align-items: center; gap: .6em; min-height: 3.4em; position: relative; }
.brand { display: inline-flex; align-items: center; gap: .45em; background: none; border: 0; padding: .3em 0; color: var(--ink); cursor: pointer; min-height: 44px; }
.brand-mark { width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.brand-mark .ic { width: .95em; height: .95em; }
.brand-name { font-family: var(--f-display); font-size: 1.05em; font-weight: 700; white-space: nowrap; }
.topnav { display: none; gap: .2em; margin-left: 1.2em; }
.topnav :is(button, a) { text-decoration: none; font-size: .92em; background: none; border: 0; color: var(--ink-2); padding: .5em .9em; border-radius: 10px; cursor: pointer; min-height: 40px; }
.topnav :is(button, a).on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.spacer { flex: 1; }
.badge-btn { display: inline-flex; align-items: center; gap: .4em; font-size: .8em; font-weight: 600; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: .35em .5em .35em .85em; min-height: 38px; cursor: pointer; white-space: nowrap; }
.role-tag { font-size: .86em; padding: .15em .6em; border-radius: 999px; background: var(--surface); color: var(--ink-2); border: 1px solid var(--line); }
.role-tag.leader { color: var(--leader); border-color: var(--leader); background: var(--leader-soft); }
.role-tag.admin { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0; border-radius: 12px; color: var(--ink); cursor: pointer; flex: none; }
.icon-btn .ic { width: 1.35em; height: 1.35em; }
.icon-btn[aria-expanded="true"] { background: var(--surface-2); }
.menu { position: absolute; top: calc(100% + 6px); right: max(16px, env(safe-area-inset-right, 0px)); width: min(300px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 16px 40px -12px var(--shadow); padding: .5em; display: flex; flex-direction: column; gap: .1em; z-index: 25; }
.mlabel { font-size: .72em; font-weight: 600; color: var(--ink-2); margin: .6em .7em .3em; }
#placeMenu .mlabel { font-size: .75rem; margin: 6px; }
.place-row { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 8px; min-height: 44px; padding: 10px 6px; border: 0; border-radius: 10px; background: none; color: var(--ink); font: 500 .875rem var(--f-body); text-align: left; text-decoration: none; cursor: pointer; }
.place-row .role-tag { margin-left: 6px; }
.place-row:hover, .place-row:focus-visible { background: var(--surface-2); }
.mitem { display: flex; justify-content: space-between; align-items: center; gap: .6em; width: 100%; text-align: left; font-size: .9em; color: var(--ink); background: none; border: 0; border-radius: 10px; padding: .55em .7em; min-height: 44px; cursor: pointer; text-decoration: none; }
.mitem:hover { background: var(--surface-2); }
.mitem.static { cursor: default; flex-direction: column; align-items: flex-start; gap: .1em; }
.mitem.static:hover { background: none; }
.mitem small { font-size: .82em; color: var(--ink-2); }
.swatches { display: flex; gap: 4px; margin: .2em .2em .4em; flex-wrap: nowrap; }   /* 색 테마 여섯 개는 늘 한 줄. 칸이 좁으면(더보기 화면 설정, 320px 휴대폰) 동그라미가 조금 작아진다. 간격은 노트 설정과 같은 4px(S-77) */
.swatch { flex: 0 1 40px; min-width: 0; max-width: 40px; aspect-ratio: 1; height: auto; border-radius: 50%; padding: 0; border: 2px solid transparent; background: none; cursor: pointer; display: grid; place-items: center; }
.swatch i { width: 28px; height: 28px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); }
.swatch.on { border-color: var(--ink); }
.menu .seg { margin: 0 .3em .3em; }
.card .swatches { margin: .6em 0 0; }
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.mdiv { height: 1px; background: var(--line); margin: .35em .3em; }
@media (max-width: 420px) { .brand-name { display: none; } }
@media (prefers-reduced-motion: reduce) { .topbar, .tabs { transition: none; } }
h1 { font-family: var(--f-display); font-size: 1.65em; line-height: 1.3; margin: .3em 0 .2em; }
h2 { font-size: 1.05em; margin: 0; }
.eyebrow { font-size: .8em; color: var(--ink-2); margin: 1em 0 0; }
.top-eyebrow { margin: 0 0 2px; }   /* 코이데처럼 큰 제목 위에 둔다(교회·사랑방·부서 같은 회색 글) */
.top-eyebrow + .page-top h1, .top-eyebrow + .sh-top h1 { margin-top: 0; }
.hint { font-size: .82em; color: var(--ink-2); margin: .4em 0 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 12px 0; }
.row { display: flex; justify-content: space-between; align-items: center; gap: .6em; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4em; min-height: 44px; padding: 0 1.1em; border-radius: 12px; border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); font-weight: 600; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.small { min-height: 36px; padding: 0 .8em; font-size: .88em; border-radius: 10px; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }
.field { width: 100%; min-height: 44px; padding: .5em .75em; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); }
/* 날짜 칸: 아이폰은 날짜 칸을 따로 그려서 폭이 달라지고 시트가 옆으로 밀렸다. 다른 칸과 같은 폭으로 묶는다(D-16) */
input.field[type="date"] { -webkit-appearance: none; appearance: none; display: block; width: 100%; max-width: 100%; min-width: 0; text-align: left; }
input.field[type="date"]::-webkit-date-and-time-value { text-align: left; }
textarea.field { resize: vertical; line-height: 1.55; overflow-y: hidden; }
.tabs[hidden] { display: none !important; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 0 env(safe-area-inset-right, 0px) max(6px, env(safe-area-inset-bottom, 0px)) env(safe-area-inset-left, 0px); z-index: 10; transition: transform .25s ease; }
.tabs :is(button, a) { text-decoration: none; background: none; border: 0; color: var(--ink-2); display: grid; place-items: center; padding: .55em 0; min-height: 56px; cursor: pointer; position: relative; }
.tabs .ic { width: 28px; height: 28px; stroke-width: 1.4; }
.tabs :is(button, a).on { color: var(--accent); }
.tabs :is(button, a).on .ic { stroke-width: 1.8; }
.tabs :is(button, a).on::after { content: ''; position: absolute; bottom: 6px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.tabs :is(button, a).pray-tab .ic { width: 44px; height: 44px; padding: 8px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); }
.tabs :is(button, a).pray-tab.on .ic { background: var(--accent); color: var(--on-accent); }
.tabs :is(button, a).pray-tab.on::after { content: none; }
.seg { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); gap: 3px; padding: 3px; background: var(--surface-2); border-radius: 12px; margin-top: 6px; }
.seg button { font: inherit; font-size: .86em; word-break: keep-all; padding: 0 4px; border: 0; border-radius: 9px; min-height: 44px; background: transparent; color: var(--ink-2); cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.toast { pointer-events: none; position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--ink); color: var(--page); padding: .6em 1em; border-radius: 10px; font-size: .88em; z-index: 20; max-width: calc(100% - 32px); }
.pop { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; }

.detail-head { margin-bottom:12px; }
.detail-head h1 { margin:.1em 0; }
.detail-meta { color:var(--ink-2); font-size:.88em; }
.field-head { display:flex; justify-content:space-between; align-items:center; gap:8px; }
.field-head .quiet-link { margin:0; }
.del-record { text-align:center; margin:18px 0 8px; }
.del-list { margin:.6em 0 0; padding-left:1.3em; line-height:1.9; }
.detail-quote { font-family:var(--f-display); font-size:1.25em; line-height:1.75; margin:.2em 0; word-break:keep-all; }
.reflection-form { margin-top:10px; }
.reflection-form textarea { min-height:90px; }
.reflection-entry { padding:.55em 0; } .reflection-entry + .reflection-entry { margin-top:.25em; }
@media(min-width:680px) { .report-grid.two { grid-template-columns:repeat(2,minmax(0,1fr)); } }
.record-wrap .set-btns .delete-answer { min-height:44px; padding:0 .8em; border:0; border-radius:10px; background:none; color:var(--ink-2); font:inherit; cursor:pointer; }
.ps-topics { margin-top: 8px; padding: 8px 10px; border-radius: 12px; background: var(--surface-2); }
.menu select.field { margin: 0 .3em .3em; width: calc(100% - .6em); }
/* 디다코 소개(C-03): 노트 소개(M8c)와 같은 모양 */
.about-page, .feedback-page { max-width: 760px; margin: 0 auto; }
.about-page .ab-mark { margin: 0 auto; }
.about-page .about-head { text-align: center; padding: 24px 18px; }
.about-page .about-head h1 { margin-top: 14px; }
.about-page .about-names { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 18px 0; }
.about-page .about-name { display: flex; flex: 1; min-width: 0; flex-direction: column; align-items: center; gap: 4px; padding: 12px 6px; border: 1px solid var(--line); border-radius: 12px; }
.about-page .about-name .greek { color: var(--ink-2); }
.about-page .about-card { margin-top: 14px; padding: 20px; }
.about-page .about-card h2 { margin-bottom: 12px; }
.about-page .about-card p { line-height: 1.75; margin: 0; }
.about-page .about-step { display: grid; grid-template-columns: 27px 1fr; gap: 10px; padding: 13px 0; border-top: 1px solid var(--line); }
.about-page .about-step:first-of-type { border-top: 0; }
.about-page .about-step .step-no { color: var(--accent); font-weight: 700; }
.about-page .about-step p { margin: 5px 0; line-height: 1.7; }
.about-page .about-step a { display: inline-block; margin-top: 6px; color: var(--accent); font-weight: 600; text-decoration: none; }
.feedback-page .feedback-card { max-width: 760px; margin-top: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.feedback-page .feedback-card .seg { width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); }
.feedback-page .feedback-card textarea { min-height: 140px; }
.feedback-page .feedback-card .warning { color: var(--ink-2); }
.feedback-page .feedback-card .feedback-count { text-align: right; margin: 0; color: var(--ink-2); }
.feedback-page .feedback-card .set-row > span { display: flex; flex-direction: column; gap: 3px; }
.guide-icon { display: grid; place-items: center; margin: 12px auto; width: 56px; height: 56px; border-radius: 50%; background: var(--surface-2); color: var(--accent); }
.guide-icon .ic { width: 30px; height: 30px; }
.guide-dots { display: flex; justify-content: center; gap: 8px; margin: 18px 0; }
.guide-dots i { width: 9px; height: 9px; border: 1px solid var(--accent); border-radius: 50%; }
.guide-dots i.on { background: var(--accent); }
.guide-nav { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
/* ── 인쇄(C-02): A4 종이와 쪽 나누기. 시안 manage.html·prep.html의 인쇄용을 옮겼다. 종이 안 색은 화면 색 테마와 상관없이 흰 종이 ── */
.print-bar { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; margin: 12px 0 14px; }
.print-bar .btn { align-self: flex-start; }
.print-bar .pb-btns { display: flex; flex-wrap: wrap; gap: 8px; }
/* 인쇄용 보기: PC에서는 왼쪽 종이, 오른쪽 고르는 칸(D-19). 휴대폰은 위에서 아래로 그대로 */
@media (min-width: 1024px) {
  .pp-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; }
  .pp-side { order: 2; position: sticky; top: 76px; }
  .pp-main { order: 1; min-width: 0; }
  .pp-side .print-bar { margin-top: 12px; }
}
.paper { --accent: #2B6A62; --accent-mid: #8DBDB5; --accent-soft: #DCEBE7; --ink-2: #5B6965; --s1: #2B6A62; --s2: #8DBDB5; --s3: #5B6965; --cord-bg: #FFFFFF; position: relative; }
.paper .mk { width: 1.5em; height: 1.5em; flex: none; }
.pp-pg { position: absolute; left: 0; right: 0; bottom: calc(var(--mm) * 8); text-align: center; font-size: .8em; color: #5B6965; letter-spacing: .04em; }
.paper-wrap { container-type: inline-size; width: 100%; max-width: 640px; margin: 0 auto 14px; }
.paper { --mm: calc(100cqw / 210); width: 100%; aspect-ratio: 210 / 297; overflow: hidden; background: #FFFFFF; color: #1B2523; border: 1px solid #DDE4E0; box-shadow: 0 12px 28px -14px var(--shadow); padding: calc(var(--mm) * 16) calc(var(--mm) * 18); font-family: var(--f-body); font-size: calc(var(--mm) * 3.88); line-height: 1.6; box-sizing: border-box; }
.paper p { margin: 0; }
.paper h3 { font-family: var(--f-display); font-size: 1.7em; line-height: 1.3; margin: .6em 0 .1em; word-break: keep-all; }
.pp-ref { font-family: var(--f-display); font-weight: 700; }
.pp-intro { margin-top: .6em !important; color: #5B6965; white-space: pre-line; }
.pp-text-h { margin-top: 1.4em !important; font-size: .84em; color: #5B6965; border-top: 1px solid #DDE4E0; padding-top: .8em; }
.pp-text { margin-top: .3em !important; font-family: var(--f-display); font-size: calc(var(--mm) * 3.88); line-height: 1.85; white-space: pre-wrap; word-break: keep-all; }
.pp-text.fs-s { font-size: calc(var(--mm) * 3.35); }
.pp-text.fs-l { font-size: calc(var(--mm) * 4.41); }
.pp-blk.pp-more { margin-top: .7em; }
.pp-measure { position: fixed; left: -9999px; top: 0; width: 210mm; max-width: none; margin: 0; container-type: normal; visibility: hidden; pointer-events: none; }
.pp-measure .paper { --mm: 1mm; width: 210mm; height: auto; aspect-ratio: auto; overflow: visible; }
.paper h4 { font-family: var(--f-display); font-size: 1.1em; margin: 1em 0 .3em; padding-bottom: .15em; border-bottom: calc(var(--mm) * .25) solid var(--accent); }
.pp-qs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .7em; }
.pp-qs li { display: grid; grid-template-columns: 1.6em 1fr; column-gap: .2em; break-inside: avoid; }
.pp-n { font-weight: 600; }
.pp-q { font-family: var(--f-display); font-weight: 700; word-break: keep-all; white-space: pre-line; }
.pp-help { font-size: .86em; color: #5B6965; margin-top: .2em !important; word-break: keep-all; }
.pp-lines { grid-column: 2; height: 2.8em; margin-top: .2em; background-image: repeating-linear-gradient(180deg, transparent 0 1.4em, #B9C4BF 1.4em calc(1.4em + 1px)); }
.pp-wrap p { margin-top: .3em; white-space: pre-wrap; word-break: keep-all; }
.pp-toc { list-style: none; margin: .8em 0 0; padding: 0; }
.pp-toc li { display: flex; justify-content: space-between; gap: 1em; padding: .3em 0; border-bottom: 1px solid #DDE4E0; }
.pp-toc span:last-child { color: #5B6965; font-size: .9em; white-space: nowrap; }
.paper-cap { text-align: center; font-size: .82em; color: var(--ink-2); margin: 0 0 12px; }
.pp-lead { margin-top: .5em !important; padding: .3em .7em; background: #ECE7F7; border-left: calc(var(--mm) * 1) solid #62519E; font-size: .86em; line-height: 1.55; word-break: keep-all; }
.pp-lead b { color: #62519E; margin-right: .7em; }
.pp-qs.pp-tri li { grid-template-columns: 1fr; }
.pp-who { display: inline-block; margin-right: .6em; padding: 0 .6em; border-radius: 999px; background: #DCEBE7; color: #2B6A62; font-family: var(--f-body); font-size: .82em; font-weight: 600; }
.pp-lines.wide { height: 5.6em; }
.pp-qs.pp-tri .pp-lines { grid-column: 1; }
.pp-memo { margin-top: .5em; }
.pp-lab { font-size: .8em; font-weight: 600; color: #5B6965; }
.pp-memotext { margin-top: .15em !important; padding-left: .7em; border-left: calc(var(--mm) * .5) solid #B9C4BF; white-space: pre-wrap; word-break: keep-all; }
.pp-memo .pp-lines { height: 4.2em; margin-top: .1em; }
.pp-qs li > .pp-memo { grid-column: 2; }
.pp-qs.pp-tri li > .pp-memo { grid-column: 1; }
@page { size: A4; margin: 0; }
@media print {
  body:has(.print-area) { background: #fff !important; overflow: visible; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body:has(.print-area) :is(#topbar, #topnav, #tabs, #toast, #pop, #settings, #opening, #stage) { display: none !important; }
  body:has(.print-area) #view { max-width: none; padding: 0; margin: 0; }
  body:has(.print-area) #view > :not(.pp-layout) { display: none !important; }
  .pp-side { display: none !important; }
  .pp-layout { display: block; }
  .print-area .paper-wrap { max-width: none; width: 210mm; margin: 0; container-type: normal; break-after: page; page-break-after: always; }
  .print-area .paper-wrap:last-child { break-after: auto; page-break-after: auto; }
  .print-area .paper { --mm: 1mm; width: 210mm; height: 297mm; aspect-ratio: auto; border: 0; box-shadow: none; }
}
</style>

  <div class="pop-sheet card" id="popSheet" role="dialog" aria-modal="true" aria-labelledby="popT"></div>
</div>

<script src="covers.js"></script>
<script src="demo-data.js"></script>
<script src="book-gospel.js"></script>
<script>
(() => {
'use strict';
// 지금은 데모만 있다. 서버를 잇는 2단계에서 설정 파일(config.js)의 주소가 비었는지로 바꾼다.
// 데모에서는 아무것도 밖으로 보내지 않고, 쓴 것은 이 기기(localStorage)에만 남는다
const DEMO = true;
const DATA = window.DIDAKO_DEMO;

// ── 도구 ──
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
// 저장소를 못 쓰는 브라우저(비공개 창 등)에서도 화면은 그대로 돌아가야 해서 모두 try/catch로 감싼다. set은 성공 여부를 돌려준다
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const readJson = k => { try { const v = JSON.parse(ls.get(k) || 'null'); return v && typeof v === 'object' ? v : {}; } catch (e) { return {}; } };
// 책장 머리의 돋보기(디다코 노트의 SEARCH_IC와 같은 그림)
const SEARCH_IC = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>';
const ic = (n, c) => `<svg class="ic ${c || ''}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const root = document.documentElement;
const BUBBLE = '<svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M9 2.2c-4.1 0-7.4 2.6-7.4 5.8 0 2.1 1.4 3.9 3.5 4.9l-.8 2.9c-.1.3.2.5.4.3l3.4-2.3h.9c4.1 0 7.4-2.6 7.4-5.8S13.1 2.2 9 2.2z"/></svg>';

// ── 저장 자리 ──
// 화면 설정(화면 모드·색 테마·디자인·큰 글씨)은 한 자리에만 적는다. 데모 설정과 쓴 글은 따로 둔다
// answers 내 생각(펼치기), bookmark 책갈피(펼치기), memo 리더의 내 진행 메모(나눔하기), leadopen 해설 접기/펼치기, keep 오늘 남길 것(펼치기·나눔하기가 같이 쓴다)
// shareDone 나눔하기를 끝까지 넘겼는지(내 기록에 이번 주 기록이 나타나는 때), record… 내 기록에서 고친 글·돌아보기·지운 기록·비워 둔 상태
const K = { display: 'didako-note-display', demo: 'didako-demo', myBook: 'didako-my-book', shareLesson: 'didako-share-lesson', keep: 'didako-keep', answers: 'didako-read-answers', bookmark: 'didako-read-bookmark', memo: 'didako-share-memo', leadopen: 'didako-leadopen',
  walkRead: 'didako-weekwalk-read', walkThought: 'didako-weekwalk-thought', walkDone: 'didako-weekwalk-done', walkMeditate: 'didako-weekwalk-meditate',
  shareDone: 'didako-share-done', recRefl: 'didako-record-reflections', recAns: 'didako-record-answers', recEdit: 'didako-record-edits', recDel: 'didako-record-deleted', recHide: 'didako-record-hidden' };
const MODES = ['auto', 'light', 'dark'], ACCENTS = ['green', 'amber', 'blue', 'rose', 'ink', 'paper'], STYLES = ['basic', 'neu', 'skeu', 'glass'];
const ROLES = [['member', '회원'], ['leader', '리더'], ['pastor', '목사님'], ['admin', '관리자']];
const STATUS = [['draft', '준비 중'], ['leader', '리더까지'], ['all', '모두']];
const pick = (v, list, d) => (list.includes(v) ? v : d);
// 표지 파일을 불러오지 못해도 세 겹 끈·종이색 기본 표지는 그린다
const COVER_FALLBACK = {
  colors: [['paper', '#6B4A2E', '종이']],
  groups: [{ id: 'basic', name: '기본', items: [{ id: 'cord', name: '세 겹 끈', svg: '<path d="M18 7 C18 14 30 14 30 21 S18 28 18 35"/><path d="M24 7 C24 14 18 14 18 21 S30 28 30 35"/><path d="M30 7 C30 14 24 14 24 21 S24 28 24 35"/><path d="M18 35v6M24 35v6M30 35v6"/>' }] }]
};
const COVERS = window.DIDAKO_COVERS || COVER_FALLBACK;
const COVER_ITEMS = COVERS.groups.flatMap(group => group.items);
const COVER_MOTIFS = COVER_ITEMS.map(item => item.id);
const COVER_COLORS = COVERS.colors.map(color => color[0]);
const JOHN_COVER = DATA.books.find(book => book.id === 'john').cover;
const S = { mode: 'auto', accent: 'paper', style: 'basic', big: false };
const D = { entered: false, role: 'member', status: 'all', walk: 1, galleryDemo: false, before: false, readOpen: true, readTriple: true, dimSec: 15, noBooks: false, longTitle: false, jcoverMotif: JOHN_COVER.motif, jcoverColor: JOHN_COVER.color, newcomer: false };
function loadState() {
  const a = readJson(K.display), b = readJson(K.demo);
  S.mode = pick(a.mode, MODES, 'auto'); S.accent = pick(a.accent, ACCENTS, 'paper'); S.style = pick(a.style, STYLES, 'basic'); S.big = a.big === true;
  D.entered = b.entered === true; D.role = pick(b.role, ROLES.map(r => r[0]), 'member'); D.status = pick(b.status, STATUS.map(r => r[0]), 'all'); D.walk = Number.isInteger(Number(b.walk)) && Number(b.walk) >= 1 && Number(b.walk) <= 52 && DATA.weekWalk.some(w => w.n === Number(b.walk)) ? Number(b.walk) : 1; D.galleryDemo = b.galleryDemo === true;
  D.before = b.before === true;
  D.readOpen = b.readOpen !== false; D.readTriple = b.readTriple !== false; D.dimSec = b.dimSec === 5 ? 5 : 15;
  D.noBooks = b.noBooks === true; D.longTitle = b.longTitle === true; D.jcoverMotif = pick(b.jcoverMotif, COVER_MOTIFS, JOHN_COVER.motif); D.jcoverColor = pick(b.jcoverColor, COVER_COLORS, JOHN_COVER.color); D.newcomer = b.newcomer === true;
}
const saveDisplay = () => ls.set(K.display, JSON.stringify({ ...readJson(K.display), mode: S.mode, accent: S.accent, style: S.style, big: S.big }));
const saveDemo = () => ls.set(K.demo, JSON.stringify(D));
loadState();

const STYLE_ATTR = { basic: null, neu: 'neu', skeu: 'skeu', glass: 'glass' };
function applySettings() {
  S.mode === 'auto' ? root.removeAttribute('data-mode') : root.setAttribute('data-mode', S.mode);
  S.accent === 'green' ? root.removeAttribute('data-accent') : root.setAttribute('data-accent', S.accent);
  STYLE_ATTR[S.style] ? root.setAttribute('data-style', STYLE_ATTR[S.style]) : root.removeAttribute('data-style');
  S.big ? root.setAttribute('data-big', '') : root.removeAttribute('data-big');
}

// ── 역할과 위쪽 배지 ──
// 배지 규칙: 회원·리더는 "2-20 사랑방", 목사님·관리자는 "청장년부" + 역할 이름표
const isTop = () => D.role === 'pastor' || D.role === 'admin';
const groupName = () => (isTop() ? DATA.church.dept : DATA.church.room);
const roleName = () => ROLES.find(x => x[0] === D.role)[1];
function paintBadge() {
  $('#placeRoom').innerHTML = `${esc(groupName())} <span class="role-tag${D.role === 'leader' ? ' leader' : isTop() ? ' admin' : ''}">${roleName()}</span>`;
  $('#badge').innerHTML = $('#placeRoom').innerHTML;
  const row = $('#placeMenu [data-act="place-room"]');
  row.setAttribute('aria-current', 'true');
  $('.pk', row).hidden = false;
}

// ── 알림과 아래에서 올라오는 창 ──
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }
let sheetFrom = null, shareSheet = false;
function openSheet(html) {
  $('#popSheet').innerHTML = html; $('#pop').hidden = false; document.body.classList.add('pop-open');
  sheetFrom = document.activeElement;
  const f = $('#popSheet [data-focus]'); if (f) f.focus();
}
function closeSheet() {
  $('#pop').hidden = true; document.body.classList.remove('pop-open'); $('#popSheet').classList.remove('sh');
  if (sheetFrom && sheetFrom.focus) sheetFrom.focus();
  sheetFrom = null;
  if (shareSheet) { shareSheet = false; armDim(); }   // 나눔하기 중에 열었던 창이면 화면 내려놓기를 다시 건다
}

// ── 설정 창: 화면 설정(한 번만 기억) + 데모용 ──
const seg = (key, opts, cur) => `<div class="seg" style="--n:${opts.length}">${opts.map(([v, l]) => `<button type="button" data-set="${key}:${v}" class="${String(cur) === String(v) ? 'on' : ''}" aria-pressed="${String(cur) === String(v)}">${l}</button>`).join('')}</div>`;
const onoff = (key, cur) => seg(key, [['0', '끄기'], ['1', '켜기']], cur ? 1 : 0);
const DISPLAY_KEYS = ['mode', 'accent', 'style', 'big'];
function displayControls() {
  const sw = [['green', '#2B6A62', '초록'], ['amber', '#A9561B', '주황'], ['blue', '#2F5D95', '파랑'], ['rose', '#A8435C', '장미'], ['ink', '#33332F', '먹색'], ['paper', '#6B4A2E', '종이(기본)']];
  return `
    <p class="mlabel" style="margin-top:.3em">화면 모드</p>${seg('mode', [['auto', '기기'], ['light', '밝게'], ['dark', '어둡게']], S.mode)}
    <p class="mlabel">색 테마</p><div class="swatches">${sw.map(([k, c, n]) => `<button type="button" class="swatch ${S.accent === k ? 'on' : ''}" data-set="accent:${k}" aria-label="${n}" aria-pressed="${S.accent === k}"><i style="background:${c}"></i></button>`).join('')}</div>
    <p class="mlabel">디자인</p>${seg('style', [['basic', 'basic'], ['neu', 'new'], ['skeu', 'classic'], ['glass', 'glass']], S.style)}
    <p class="mlabel">큰 글씨</p>${seg('big', [['0', '끄기'], ['1', '켜기']], S.big ? 1 : 0)}
`;
}
function renderSettings() {
  const inApp = currentView() !== 'start';
  $('#settings').innerHTML = `${displayControls()}    <div class="mdiv"></div>
    <p class="mlabel">데모용 <span class="demo-tag static">데모</span></p>
    <p class="set-note">실제 앱에는 없는 설정이에요. 이 기기에만 기억해요.</p>
    <p class="mlabel">역할</p>${seg('role', ROLES, D.role)}
    <p class="mlabel">이번 주의 질문</p><select class="field" id="walkSel" aria-label="이번 주의 질문 주 고르기">${DATA.weekWalk.map(w => `<option value="${w.n}"${D.walk === w.n ? ' selected' : ''}>${w.n}주 · ${esc(w.title)}</option>`).join('')}</select>
    <p class="mlabel">올해의 그림</p>${seg('galleryDemo', [['0', '이 기기 기록만'], ['1', '예시로 채움']], D.galleryDemo ? 1 : 0)}
    ${inApp && isTop() ? `<p class="mlabel">공개 범위</p>${seg('status', STATUS, D.status)}` : ''}
    ${inApp ? `<p class="mlabel">책갈피 있음</p>${onoff('bookmark', hasBm())}
    <p class="mlabel">이번 주 과 배포 전</p>${onoff('before', D.before)}
        <p class="mlabel">이번 주 작은 실천(오늘 남길 것)</p>
    <div class="set-btns"><button type="button" class="btn ghost small" data-act="keep-fill">예시 채우기</button><button type="button" class="btn ghost small" data-act="keep-clear">비우기</button></div>` : ''}
    ${currentView() === 'read' ? `<p class="mlabel">말씀을 열며</p>${onoff('readOpen', D.readOpen)}
    <p class="mlabel">깊이 묵상하기</p>${onoff('readTriple', D.readTriple)}
    <p class="mlabel">내 생각</p>
    <div class="set-btns"><button type="button" class="btn ghost small" data-act="ans-fill">예시 채우기</button><button type="button" class="btn ghost small" data-act="ans-clear">비우기</button></div>` : ''}
    ${currentView() === 'shelf' ? `    <p class="mlabel">책 없음</p>${onoff('noBooks', D.noBooks)}
    <p class="mlabel">긴 제목 예시</p>${onoff('longTitle', D.longTitle)}
    <p class="mlabel">요한복음 표지</p>
    <select class="field" id="jcoverMotif" aria-label="요한복음 표지 상징">${COVERS.groups.map(group => `<optgroup label="${esc(group.name)}">${group.items.map(item => `<option value="${esc(item.id)}"${D.jcoverMotif === item.id ? ' selected' : ''}>${esc(item.name)}</option>`).join('')}</optgroup>`).join('')}</select>
    <select class="field" id="jcoverColor" aria-label="요한복음 표지 색">${COVERS.colors.map(([id, hex, name]) => `<option value="${id}"${D.jcoverColor === id ? ' selected' : ''}>${esc(name)}</option>`).join('')}</select>
    <p class="set-note">실제 앱에서는 목사님이나 교재 담당이 교재를 만들 때 고르는 방향이에요.</p>` : ''}
    ${['record', 'records'].includes(currentView()) ? `<p class="mlabel">새가족반 기록</p>${seg('newcomer', [['0', '숨기기'], ['1', '보이기']], D.newcomer ? 1 : 0)}
    <p class="mlabel">예시 기록</p>
    <div class="set-btns"><button type="button" class="btn ghost small" data-act="rec-restore">예시 기록 되살리기</button></div>
    <div class="set-btns"><button type="button" class="btn ghost small" data-act="rec-hide">기록 비우기</button></div>
    <p class="set-note">비우면 기록이 하나도 없는 화면을 볼 수 있어요. 예시 기록 되살리기로 되돌려요. 이번 주에 쓴 글은 나눔하기를 마치면 맨 위 기록으로 더해져요.</p>` : ''}
    ${currentView() === 'share' ? `<p class="mlabel">화면 내려놓기 시간</p>${seg('dimSec', [['15', '15초'], ['5', '데모용 5초']], D.dimSec)}` : ''}
    <div class="mdiv"></div>
    <div class="set-btns"><button type="button" class="btn ghost small" data-act="demo-reset-ask">데모 처음으로</button></div>`;
}
function closePlaceMenu() { $('#placeMenu').hidden = true; $('#badge').setAttribute('aria-expanded', 'false'); }
function closeMenu() { const m = $('#settings'); m.hidden = true; $('#gearBtn').setAttribute('aria-expanded', 'false'); closePlaceMenu(); }

// ── 화면 이름표 ──
// 이름표와 어느 탭이 켜지는지는 여기에 모아 둔다. 아직 만들지 않은 화면은 차분한 안내 한 장으로 연다(막다른 길이 없게 이번 주로 가는 링크를 둔다)
const PLACE = {
  wq: ['이번 주의 질문', 'week'], read: ['펼치기', 'week'], share: ['나눔하기', 'share'], shelf: ['책장', 'shelf'], record: ['내 기록', 'record'], records: ['모든 기록', 'record'], gallery: ['올해의 그림', 'record'], rooms: ['사랑방 전체 보기', 'more'], more: ['더보기', 'more'],
  church: ['우리 사랑방', 'more'], prep: ['진행 준비', 'share'], prepprint: ['리더용 인쇄', 'share'], manage: ['교재 관리', 'more'], admin: ['관리', 'more'], 'church-admin': ['교회 전체', 'more'], about: ['디다코 소개', 'more'], feedback: ['의견 보내기', 'more']
};
const VIEWS = ['start', 'week'].concat(Object.keys(PLACE));
// 책 안(#book-교재)과 기록 상세(#rec-기록)는 책장·내 기록 안의 화면이다
function parseHash() {
  const h = location.hash.replace(/^#/, ''), m = /^(book|rec)-([\w-]+)$/.exec(h);
  if (m) return { v: m[1] === 'book' ? 'shelf' : 'record', arg: m[2] };
  if (/^(mb|me|mp|mx|mxb)-([\w.-]+)$/.test(h)) return { v: 'manage', arg: h };
  return { v: VIEWS.includes(h) ? h : null, arg: '' };
}
const hashFor = (v, arg) => v === 'manage' && arg ? '#' + arg : '#' + (arg ? (v === 'shelf' ? 'book-' : 'rec-') + arg : v);
const currentView = () => parseHash().v;

// ── 이번 주 ──
function lessonOf(sel) {
  const b = DATA.books.find(x => x.id === sel.book), l = b.lessons.find(x => x.no === sel.no);
  return { id: sel.book + ':' + l.no, book: b.title, period: b.period, no: l.no, title: `제${l.no}과 · ${l.name}`, ref: l.ref, date: l.date, intro: l.intro || '' };
}
const thisLesson = () => lessonOf(weekSel());
function keepCard() {
  const k = readJson(K.keep);
  if (!k.sentence && !k.action) return '';
  return `<section class="card" aria-labelledby="kpT">
    <h2 id="kpT">이번 주 작은 실천</h2>
    ${k.action ? `<p class="keep-act">${esc(k.action)}</p>` : ''}
    ${k.sentence ? `<p class="keep-sen">${esc(k.sentence)}</p>` : ''}
  </section>`;
}
function statusCard() {
  if (D.role !== 'pastor') return '';
  const L = thisLesson(), cur = STATUS.find(x => x[0] === D.status)[1];
  return `<section class="card" aria-label="공개 범위">
    <p class="opt-name">제${L.no}과 공개 범위</p>
    <p class="status-row" aria-label="공개 범위: ${esc(cur)}">${STATUS.map(([v, l], i) => (i ? '<span class="st-sep" aria-hidden="true">›</span>' : '') + (v === D.status ? `<span class="pill pill-p">${ic('check')}<b>${l}</b></span>` : `<span class="st-off">${l}</span>`)).join('')}</p>
    <p class="fine" style="margin-top:.6em">해설과 진행 안내는 늘 리더에게만 보여요.</p>
    <a class="quiet-link" href="#mp-${DATA.thisWeek.main.book}.${DATA.thisWeek.main.no}">교재 관리에서 바꾸기</a>
  </section>`;
}
// 이번 주의 질문: 고른 날과 고백 열기 상태는 화면에서만 기억한다
let walkDay = '', walkWrong = {}, lampNow = '';   // 오답과 방금 켠 등불은 화면에서만 기억한다
const walkNames = { 월: '월요일', 화: '화요일', 수: '수요일', 목: '목요일', 금: '금요일' };
const walkWeek = () => DATA.weekWalk.find(w => w.n === D.walk) || DATA.weekWalk[0];
const walkToday = () => '목'; // 데모 오늘(DATA.today)은 목요일
function walkRedraw() { const y = window.scrollY; route(false); window.scrollTo(0, y); }
function weekView() {
  const w = walkWeek(), today = walkToday(), selected = walkDay || today;
  const day = w.days.find(x => x.d === selected) || w.days[3];
  const read = readJson(K.walkRead), weekDone = readJson(K.walkDone);
  const solved = read[w.n + '-' + day.d] === true, done = weekDone[w.n] === true;
  const wrong = walkWrong[w.n + '-' + day.d] ?? -1;
  const days = w.days.map(x => {
    const future = w.days.findIndex(y => y.d === x.d) > w.days.findIndex(y => y.d === today);
    const chosen = x.d === selected, isToday = x.d === today, checked = read[w.n + '-' + x.d] === true;
    const newlyLit = lampNow === w.n + '-' + x.d;
    return `<button class="walk-day${chosen ? ' chosen' : ''}${isToday ? ' today' : ''}${future ? ' future' : ''}${newlyLit && checked ? ' lamp-now' : ''}" type="button" data-act="walk-day" data-d="${x.d}" aria-pressed="${chosen}" aria-label="${walkNames[x.d]}${checked ? ', 찾았어요' : ''}"${future ? ' aria-disabled="true"' : ''}><span>${x.d}</span>${checked && !future ? ic('lamp-lit', 'lamp on') : ''}</button>`;
  }).join('');
  lampNow = '';
  return `<p class="eyebrow top-eyebrow">${esc(DATA.admin.church)}</p>
    <div class="page-top"><h1>이번 주</h1></div>
    <div class="week-grid"><div class="col">
    <section class="card walk-hero">
      <img src="${w.img}" alt="${esc(w.alt)}">
      <div class="walk-hero-body">

    `<div class="xcur"><div class="xnm s" id="xHead" tabindex="-1">함께 볼 말씀</div><div class="xgq sm">성경을 펴서 읽어 봐요</div>
      <div class="card xvl">${refs}</div><div class="act-row"><button class="btn" type="button" data-act="wq-next">다음 →</button></div></div>`,
    `<div class="xcur"><div class="xnm s" id="xHead" tabindex="-1">교회가 고백해 온 것</div>
      <div class="card" style="margin-top:10px;padding:14px 16px"><div style="font-size:.90625rem;line-height:1.65;word-break:keep-all">${esc(w.confess)}</div><div class="soft" style="margin-top:10px;font-size:.8125rem;line-height:1.5">${esc(w.base)}</div></div>
      <div class="act-row"><button class="btn" type="button" data-act="wq-next">다음 →</button></div></div>`,
    `<div class="xcur"><div class="xnm s" id="xHead" tabindex="-1">나의 묵상</div><div class="xgq sm">말씀과 교회의 고백을 읽고 새로 보이게 된 것을 적어 봐요</div>

      <div class="act-row"><button class="btn ghost" type="button" data-act="wq-next">건너뛰기</button><button class="btn" type="button" data-act="wq-next">마치기</button></div></div>`
  ];
  const finished = `<div class="xfin"><div class="xft">이번 주의 질문을 다 펴 봤어요.</div><div class="hint">오늘 적은 내 생각은 내년 이맘때<br>이 질문과 함께 다시 보여요.</div><p class="fine">이번 주 그림이 올해의 그림에 담겼어요.</p><a class="quiet-link" href="#gallery">올해의 그림 보기 ›</a></div>

  let past = '';
  for (let i = Math.min(WQ.max, 3); i >= 0; i--) if (i !== WQ.view) past += fold(i);
  // 그림은 첫 단계와 마친 화면에만 둔다. 가운데 단계에서는 물음이 그림에 밀려 스크롤해야 했다(D-15)

// 질문 조각: 단계 이름은 그 단계 첫 질문과 한 덩어리로 묶어 쪽 맨 아래에 홀로 남지 않게 한다. 글이 빈 질문과 질문이 없는 단계는 뺀다

function ppMeasure(inner, fn) {

const adJ = (w, pair) => { const c = w.charCodeAt(w.length - 1) - 0xAC00, [a, b] = pair.split('/'); return w + (c >= 0 && c < 11172 && c % 28 ? a : b); };

// 한 줄에 한 가정씩 붙여 넣은 글을 가정 목록으로. 줄 안에 이름이 여럿이면 쉼표, 가운뎃점, /, 띄어쓰기로 나눈다.
// 번호(1. 1) ①)와 글머리, "가정"·"님"은 떼고, 이름 같지 않은 줄(숫자, 기호, 긴 글)은 빼서 알려 준다.
// 가정 단위: 한 줄에 이름 하나는 1인 가정, 둘은 한 가정(남편, 아내), 셋 이상은 줄을 나누도록 안내한다
const AD_BK_NUM = /^(?:\(?\d{1,3}\s*[.)\]:、]|\d{1,3}(?=\s)|[-–—•·*▪●○▶■□◆◇➢]+|[①-⑳])\s*/;
const AD_BK_NAME = /^[가-힣A-Za-z][가-힣A-Za-z.'-]*$/;
function adBulkParse(text) {
  const one = adSolo(), exist = {}, seen = {}, rows = [], noise = [];
  adDept().rooms.forEach(r => r.fams.forEach(f => { const parts = adNames(f); exist[adKey(parts)] = { name: f.name, room: r.name, parts }; }));
  String(text || '').split(/\r?\n/).forEach(raw => {

    const people = one ? toks.map(x => [x]) : toks.length <= 2 ? [toks] : null;
    if (!people) { rows.push({ bad: '한 줄에 이름이 세 개 이상이에요. 줄을 나눠 주세요', label: toks.join(', ') }); return; }
    people.forEach(parts => {
      const k = adKey(parts); if (seen[k]) return; seen[k] = true;
      const ex = exist[k], near = !ex && Object.keys(exist).map(x => exist[x]).find(e => e.parts.some(x => parts.includes(x)));

    });
  });

}

const AD_WAIT_DAYS = 3;
const adWaitDays = q => {
  const m = /(\d+)월\s*(\d+)일/.exec(q.at || ''), t = DATA.admin.analysis.today;
  return m ? Math.round((new Date(2026, t[0] - 1, t[1]) - new Date(2026, Number(m[1]) - 1, Number(m[2]))) / 864e5) : 0;

function adDeptStat(d) {
  const reqs = adReqs().filter(q => d.rooms.some(r => r.name === q.room));
  let people = 0, linked = 0, fams = 0;
  const noLead = [], moreUnlinked = [], waiting = [];
  d.rooms.forEach(r => {
    const un = r.fams.filter(f => !f.on.length).length;
    fams += r.fams.length; people += r.fams.reduce((n, f) => n + adNames(f).length, 0); linked += adRoomN(r);
    if (!r.leader) noLead.push(r.name);
    if (un >= 2 || (r.fams.length && un / r.fams.length >= .3)) moreUnlinked.push(r.name);
    if (reqs.some(q => q.room === r.name && adWaitDays(q) > AD_WAIT_DAYS)) waiting.push(r.name);
  });

function braidPaths(len, amp, periods, vert, sw, ol, cols, n, sub) {
  ol = ol == null ? 3 : ol; cols = cols || STRAND; n = n || periods * 22; sub = sub || 1;
  const ph = [0, 2 * Math.PI / 3, 4 * Math.PI / 3], out = [], f = v => v.toFixed(2);

      return { k, pts, z: Math.cos(tm * periods * 2 * Math.PI + p) };
    }).sort((a, b) => a.z - b.z).forEach(o => {
      const d = o.pts.map((q, m) => (m ? 'L' : 'M') + (vert ? `${f(q[1])} ${f(q[0])}` : `${f(q[0])} ${f(q[1])}`)).join('');

    });
  }
  return out.join('');
}

    room.members.splice(i, 1); closeSheet(); roomRedraw(); toast('연결을 해제했어요');
  },
  prep() { location.hash = '#prep'; },
  'prep-start'() { shareAuto = true; location.hash = '#share'; },
  'prep-member'() { readAsMember = true; readFrom = ''; if (location.hash === '#read') route(true); else location.hash = '#read'; },
  later() { toast('다음 단계에서 열려요'); },
  // 인쇄: PDF는 기기의 인쇄 창, 대상·답변 공간을 바꾸면 종이를 다시 그린다
  'pp-pdf'() { window.print(); },
  'pp-word-book'() {
    const b = mgBook((parseHash().arg || '').slice(4)); if (!b) return;
    const o = { leader: PP.leader, space: PP.space, memo: null };
    downloadDocx(buildDocxBlob(wordTocXml(b) + b.lessons.map(L => wordLessonXml(ppSource(b, L), o, true)).join('')), `${b.title} 전체${PP.leader ? ' (리더용)' : ''}`);
  },
  'pp-word-prep'() {
    if (!isLead() || !(G = readyGuide())) return;
    const src = prepSource();
    downloadDocx(buildDocxBlob(wordLessonXml(src, prepPrintOpts(), false)), `${src.book} 제${src.no}과 ${src.name} (리더용 · 내 메모)`);
  },
  'pp-word'() {
    const m = /^mx-([\w-]+)\.(\d+)$/.exec(parseHash().arg || ''), b = m && mgBook(m[1]), L = b && b.lessons.find(l => l.no === Number(m[2])); if (!L) return;
    downloadDocx(buildDocxBlob(wordLessonXml(ppSource(b, L), { leader: PP.leader, space: PP.space, memo: null }, false)), `${b.title} 제${L.no}과 ${L.name || ''}${PP.leader ? ' (리더용)' : ''}`);
  },
  'pp-target'(e, el) { PP.leader = el.dataset.v === '1'; recRedraw(); },
  'pp-space'(e, el) { PP.space = ['none', 'mid', 'wide'].includes(el.dataset.v) ? el.dataset.v : 'mid'; recRedraw(); },
  'keep-fill'() { ls.set(K.keep, JSON.stringify(Object.assign({ at: Date.now() }, DATA.sampleKeep))); rerender(); toast('예시를 채웠어요'); },
  'keep-clear'() { ls.del(K.keep); rerender(); toast('비웠어요'); },
  // 펼치기
  toc(e, el) { const l = $('#tocList'); l.hidden = !l.hidden; el.setAttribute('aria-expanded', String(!l.hidden)); },
  goto(e, el) {
    if (el.dataset.id) setBookmark(el.dataset.id);
    if (matchMedia('(max-width: 999px)').matches) { $('#tocList').hidden = true; $('#tocBtn').setAttribute('aria-expanded', 'false'); }
    goTo(el.dataset.to);
  },
  more(e, el) {
    const m = el.nextElementSibling; m.hidden = !m.hidden; el.classList.toggle('on', !m.hidden); el.setAttribute('aria-expanded', String(!m.hidden));
    const q = el.closest('[data-qid]'); if (q) setBookmark(q.dataset.qid);   // 펼치기에서만 책갈피를 꽂는다
  },
  fold() {
    const open = !leadOpen(); ls.set(K.leadopen, open ? '1' : '0');
    $$('.pn.lead').forEach(p => { if (!$('.fold', p)) return; p.classList.toggle('closed', !open); const b = $('.fold', p); b.textContent = open ? '접기' : '펼치기'; b.setAttribute('aria-expanded', String(open)); });
  },
  'ans-more'(e, el) { const id = el.dataset.id; if (expanded.has(id)) expanded.delete(id); else expanded.add(id); renderAns(id); },
  think(e, el) { const id = el.dataset.id; editing.add(id); renderAns(id); const t = $(`#ta-${id}`); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } setBookmark(id); },
  done(e, el) {
    const id = el.dataset.id, t = $(`#ta-${id}`); if (t) saveAns(id, t);
    if (!(status[id] && status[id].ok)) return;
    editing.delete(id); renderAns(id); toast('저장했어요');
  },
  retry(e, el) { const t = $(`#ta-${el.dataset.id}`); if (t) saveAns(el.dataset.id, t); },
  'keep-retry'() { saveKeepRead(); },
  'ans-fill'() { allQs().forEach(q => { if (q.sample && !answers[q.id]) answers[q.id] = q.sample; }); persistAnswers(); editing.clear(); renderAll(); toast('예시를 채웠어요'); },
  'ans-clear'() { answers = {}; ls.del(K.answers); editing.clear(); renderAll(); toast('비웠어요'); },
  // 나눔하기
  'sw-open'() { R.open = !R.open; renderStart(); },
  'sw-triple'() { R.triple = !R.triple; renderStart(); },
  'sw-dim'() { R.dim = !R.dim; renderStart(); },
  stage(e, el) {
    const i = +el.dataset.i, off = R.stages.map((v, k) => (v ? -1 : k)).filter(k => k >= 0);
    if (R.stages[i]) { if (off.length >= 1) { toast('한 단계만 뺄 수 있어요'); return; } R.stages[i] = false; } else R.stages[i] = true;
    renderStart();
  },
  'share-pick'() {
    const book = bookById(myBookId()), picked = weekSel();
    const lessons = book.lessons.filter(l => l.state === 'past' || l.state === 'now');
    openSheet(`${sheetHead('나눌 과 고르기')}
      <p class="fine">${esc(bTitle(book))}</p>
      <div class="gc">${lessons.map(l => `<button class="gr" type="button" data-act="share-pick-lesson" data-no="${l.no}"><span class="gt"><b>제${l.no}과 · ${esc(l.name)}</b><span class="gd">${esc(l.ref)}</span></span>${l.no === picked.no ? '<span aria-label="선택됨">✓</span>' : ''}</button>`).join('')}</div>
      <p class="fine">다른 책으로 나누려면 책장에서 지금 읽는 책을 바꿔요.</p>
      <a class="back-link" href="#shelf" data-act="share-pick-shelf">책장 열기 ›</a>`);
  },
  'share-pick-lesson'(e, el) {
    const book = bookById(myBookId()), no = Number(el.dataset.no);
    if (!book.lessons.some(l => l.no === no && (l.state === 'past' || l.state === 'now'))) return;
    ls.set(K.shareLesson, JSON.stringify({ book: book.id, no }));
    closeSheet(); rerender();
  },
  'share-pick-shelf'() { closeSheet(); location.hash = '#shelf'; },
  'share-start'() { startShare(); },
  next() { go(1); }, prev() { go(-1); },
  'skip-keep'() { go(1); },
  pray() { toast('데모에서는 코이데로 이어지지 않아요'); },
  finish() { exitShare(); },
  'ask-close'() {
    shareOpenSheet(`${sheetHead('나눔을 마칠까요?')}<p class="soft">처음 화면으로 돌아가요.</p><div class="close-ask"><button class="btn" type="button" data-act="pop-close">계속 나누기</button><button class="btn ghost" type="button" data-act="exit">나가기</button></div>`);
  },
  exit() { exitShare(); },
  jump() {
    const s = cur(); let html = sheetHead('단계 목록') + '<div class="jump">';
    html += `<button type="button" data-act="jump-to" data-p="${R.steps.findIndex(x => x.t === 'passage')}" class="${s.t === 'passage' ? 'here' : ''}">본문 · ${esc(thisLesson().ref)}</button>`;
    R.steps.forEach((x, p) => {
      if (x.t === 'cover') html += `<p class="grp">${esc(G.stages[x.si].name)}</p>`;
      if (x.t === 'q' || x.t === 'read') { const q = G.stages[x.si].qs[x.qi]; html += `<button type="button" data-act="jump-to" data-p="${p}" class="${R.pos === p ? 'here' : ''}">${esc(isRead(q) ? readLabel(q) : q.t)}</button>`; }
    });
    html += '</div>';
    shareOpenSheet(html);
  },
  'jump-to'(e, el) { const p = +el.dataset.p; closeSheet(); R.pos = p; renderStep(); }
};
document.addEventListener('click', e => {
  if (!e.target.closest('#placeMenu, #badge')) closePlaceMenu();
  if (e.target.closest('#opening')) { hideOpening(); return; }
  const set = e.target.closest('[data-set]');
  if (set) {
    const [k, v] = set.dataset.set.split(':');
    if (DISPLAY_KEYS.includes(k)) { S[k] = k === 'big' ? v === '1' : v; saveDisplay(); }
    else if (k === 'galleryDemo') { D.galleryDemo = v === '1'; saveDemo(); }
    else if (k === 'bookmark') { if (v === '1') { if (!hasBm()) ls.set(K.bookmark, JSON.stringify({ id: 'o2', at: Date.now() })); } else ls.del(K.bookmark); }   // 책갈피는 펼치기가 꽂는 것과 같은 자리
    else { D[k] = ['before', 'alt', 'readOpen', 'readTriple', 'two', 'noBooks', 'longTitle', 'newcomer'].includes(k) ? v === '1' : k === 'dimSec' ? (v === '5' ? 5 : 15) : v; saveDemo(); }
    rerender();
    return;
  }
  const sview = e.target.closest('[data-sview]');
  if (sview) { R.view = sview.dataset.sview; renderStart(); return; }
  const el = e.target.closest('[data-act]');
  if (el && acts[el.dataset.act]) { e.preventDefault(); acts[el.dataset.act](e, el); return; }
  const menu = $('#settings');
  if (!menu.hidden && !e.target.closest('#settings')) closeMenu();
});
document.addEventListener('keydown', e => {
  // 말씀을 열며(펼치기·나눔하기)의 글을 키보드로 눌러 넘기기
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('wo')) {
    e.preventDefault(); if (e.target.closest('#opening')) hideOpening(); else if (R.on) go(1); return;
  }
  // 소그룹 이름 직접 쓰기 칸에서 Enter는 [쓰기]와 같다
  if (e.key === 'Enter' && e.target.id === 'adGrpIn') { e.preventDefault(); acts['ad-grp-write'](); return; }
  // 책장의 카드(button이 아닌 칸)를 키보드로 열기
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('sh-card')) { e.preventDefault(); e.target.click(); return; }
  if (e.key !== 'Escape') return;
  if (!$('#pop').hidden) closeSheet(); else if (!$('#opening').hidden) hideOpening(); else closeMenu();
});
// 책장 카드의 표지 그림을 못 불러오면 그 자리를 숨긴다(카드는 그대로)
// 그림을 못 불러오면 같은 자리의 선 그림을 보여 준다.
document.addEventListener('error', e => {
  if (e.target instanceof HTMLImageElement && e.target.parentElement.classList.contains('cover-art')) e.target.parentElement.classList.add('cover-missing');
}, true);
// 한 줄 돌아보기: 쓰는 대로 기기에 남기고, 칸을 벗어날 때 "저장했어요"를 잠깐 보인다(실패하면 그때만 알린다)
document.addEventListener('input', e => {
  if (e.target.id === 'mgCoverName') { mgPreview(); return; }
  const t = e.target;
  if (t.dataset && t.dataset.adin) { adInput(t); return; }
  if (t.dataset && t.dataset.mg) { mgEditInput(t); return; }
  if (t.id === 'mgTitle') { const h = $('#mgTitleHint'); if (h && t.value.trim()) h.hidden = true; }
  else if (t.id === 'feedbackText') { feedbackState.text = t.value; const count = $('#feedbackCount'); if (count) count.textContent = String(t.value.length); const send = $('#feedbackSend'); if (send) send.disabled = !t.value.trim(); }
  else if (t.id === 'wqMed') { const meds = readJson(K.walkMeditate); meds[walkWeek().n] = t.value; ls.set(K.walkMeditate, JSON.stringify(meds)); }
  else if (t.id === 'wqTa') { const thought = readJson(K.walkThought); thought[walkWeek().n] = t.value; ls.set(K.walkThought, JSON.stringify(thought)); }
  else if (t.dataset && t.dataset.memoKey) { const m = readMemo(); if (t.value.trim()) m[t.dataset.memoKey] = t.value; else delete m[t.dataset.memoKey]; ls.set(K.memo, JSON.stringify(m)); }
  else if (t.matches && t.matches('textarea[data-id]')) { const id = t.dataset.id; sizeTa(t); setBookmark(id); clearTimeout(timers[id]); timers[id] = setTimeout(() => saveAns(id, t), 450); }
  else if ((t.id === 'kSentence' || t.id === 'kAction') && currentView() === 'read') { clearTimeout(keepT); keepT = setTimeout(saveKeepRead, 450); }
  else if (t.id === 'shelfQ') runShelfSearch();
  else if (t.id === 'recQ') { rec.q = t.value; $('#recResults').innerHTML = recSearch(); }
  else if (t.id === 'memoText') { const m = readMemo(); m[t.dataset.key] = t.value; ls.set(K.memo, JSON.stringify(m)); }   // 리더의 내 진행 메모
});
document.addEventListener('focusout', e => {
  const t = e.target;
  if (t.dataset && t.dataset.mg) { mgEditBlur(t); return; }
  if (t.matches && t.matches('textarea[data-id]') && timers[t.dataset.id]) saveAns(t.dataset.id, t);
  else if ((t.id === 'kSentence' || t.id === 'kAction') && keepT) saveKeepRead(true);
});
window.addEventListener('pagehide', () => { flushAll(); if (keepT) saveKeepRead(); });
// 남기고 다음: 눌러서 넘어가기 전에 나눔하기의 오늘 남길 것을 저장
document.addEventListener('click', e => { const el = e.target.closest('[data-act="next"]'); if (el && R.on && cur().t === 'keep') saveKeepShare(); }, true);
document.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.admv && AD.mv) { AD.mv[e.target.dataset.admv] = e.target.value; adRedraw('#adMvRoom'); return; }
  if (e.target.dataset && e.target.dataset.admap && AD.mv) { AD.mv.map[e.target.dataset.admap] = e.target.value; return; }
  if (e.target.dataset && e.target.dataset.acmv && AD.cMv) {
    const M = AD.cMv, k = e.target.dataset.acmv; M[k] = e.target.value; M.ok = false;
    if (k === 'from') { M.fam = ''; M.to = ''; M.room = ''; } else if (k === 'fam') { M.to = ''; M.room = ''; } else if (k === 'to') M.room = '';
    adRedraw('#' + e.target.id); return;
  }
  if (['mgGroup', 'mgMotif', 'mgColor'].includes(e.target.id)) { mgPreview(); return; }
  if (e.target.id === 'walkSel') { const n = Number(e.target.value); if (Number.isInteger(n) && DATA.weekWalk.some(w => w.n === n)) { D.walk = n; walkDay = ''; saveDemo(); rerender(); } return; }
  if (e.target.id === 'jcoverMotif') { D.jcoverMotif = pick(e.target.value, COVER_MOTIFS, JOHN_COVER.motif); saveDemo(); rerender(); return; }
  if (e.target.id === 'jcoverColor') { D.jcoverColor = pick(e.target.value, COVER_COLORS, JOHN_COVER.color); saveDemo(); rerender(); return; }
});
// 돌아보기: 시간이 지난 뒤 남기는 생각. 쌓아 두고 날짜를 붙인다(오늘은 데모의 오늘)
document.addEventListener('submit', e => {
  const f = e.target; if (!f || f.id !== 'reflectionForm') return;
  e.preventDefault();
  const id = f.dataset.id, text = $('#recReflection').value.trim(); if (!text) return;
  const all = readJson(K.recRefl); all[id] = Array.isArray(all[id]) ? all[id] : [];
  all[id].push({ date: DATA.today.replace(/\(.*$/, '').trim(), text });
  const ok = recSave(K.recRefl, all); recRedraw(); recDone(ok);
});
// 편성의 쓰는 칸은 쓰는 대로 AD에 담아 둔다(다시 그려져도 쓴 글이 남도록)
function adInput(t) {
  const k = t.dataset.adin, M = AD.mv;
  if (k === 'mvname' && M) { M.name = t.value; M.nameEdited = true; const nx = $('[data-act="ad-mvnext"]'); if (nx) nx.disabled = !M.name.trim(); }
  else if (k === 'mvnp' && M) { M.newPerson = t.value; const nx = $('[data-act="ad-mvnext"]'); if (nx) nx.disabled = !(M.a && M.newPerson.trim()); }
  else if (k === 'cname' && AD.cNew) AD.cNew.name = t.value;
  else if (AD.edit) AD.edit[k] = t.value;
}
// 편성의 쓰는 칸(폼): 가정 더하기, 이름 바꾸기, 사랑방 만들기, 합칠 사람 찾기
document.addEventListener('submit', e => {
  const f = e.target; if (!f || !f.dataset || !f.dataset.adform) return;
  e.preventDefault();
  const d = adDept(), kind = f.dataset.adform;
  if (kind === 'mvfind') {
    const q = f.elements.q.value.trim(); if (!q || !AD.mv) return;
    AD.mv.slot = f.dataset.v; AD.mv.q = q; AD.mv.found = adFind(AD.mv, q); adRedraw(); return;
  }
  if (kind === 'dept') {
    const N = AD.cNew, n = f.elements.n.value.trim(); if (!N || !n) return;
    N.name = n;
    if (DATA.admin.depts.some(x => x.name === n)) { toast('같은 이름이 이미 있어요'); return; }
    const nd = { id: 'd' + (++adSeq), name: n, group: N.group, unit: N.unit, rooms: [] }; DATA.admin.depts.push(nd);
    AD.cNew = null; AD.hl = [nd.id]; toast(adJ(n, '을/를') + ' 만들었어요'); adRedraw(); return;
  }
  if (kind === 'person') {
    const r = d.rooms.find(x => x.id === f.dataset.v), a = f.elements.a.value.trim(), b = f.elements.b ? f.elements.b.value.trim() : ''; if (!r || !a) return;
    if (AD.edit) { AD.edit.a = a; AD.edit.b = b; }
    if (!AD_BK_NAME.test(a) || (b && !AD_BK_NAME.test(b))) { toast('이름은 글자로만 적어 주세요'); return; }
    const parts = b ? [a, b] : [a], key = adKey(parts);
    for (const rr of d.rooms) { const hit = rr.fams.find(x => adKey(adNames(x)) === key); if (hit) { toast(`${hit.name}${adSolo(d) ? ' 님은' : ' 가정은'} 이미 ${rr.name}에 있어요`); return; } }
    const nf = { id: adNewId('f'), name: parts.join(', '), role: '', on: [] }; r.fams.push(nf);
    AD.edit = null; AD.hl = [nf.id]; toast('더했어요'); adRedraw(); return;
  }
  const n = f.elements.n.value.trim(); if (!n) return;
  if (AD.edit) AD.edit.n = n;
  if (d.rooms.some(x => x.name === n && x.id !== f.dataset.v)) { toast('같은 이름이 이미 있어요'); return; }
  if (kind === 'room') {
    const r = { id: adNewId('r'), name: n, leader: '', co: '', fams: [] }; d.rooms.push(r); DATA.admin.invites.rooms.push(n);
    AD.open[r.id] = true; AD.edit = null; AD.hl = [r.id]; toast(adJ(n, '을/를') + ' 만들었어요'); adRedraw(); return;
  }
  if (kind === 'rename') {
    const r = d.rooms.find(x => x.id === f.dataset.v); if (!r) return;
    adRenameRoom(r, n); AD.edit = null; AD.hl = [r.id]; toast('이름을 바꿨어요'); adRedraw();
  }
});
window.addEventListener('hashchange', () => route(true));

applySettings(); route(false);
// 홈 화면 앱: 한 번 열어 두면 인터넷이 없어도 열린다
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => { /* 없어도 앱은 그대로 */ });
})();
