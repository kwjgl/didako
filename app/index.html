<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>디다코</title>
<meta name="theme-color" content="#6B4A2E">
<!-- 홈 화면 앱(PWA): 아이콘은 디다코 노트와 같은 종이(고동색) 세 겹 책갈피(icons/icon.svg). 두 앱은 오가는 한 앱이다 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="디다코">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<script>
// 저장된 화면 설정을 그림이 그려지기 전에 먼저 입힌다(밝은 화면이 잠깐 번쩍이지 않게). 읽을 수 없으면 기기 설정을 따른다
try {
  const d = JSON.parse(localStorage.getItem('didako-note-display') || '{}'), r = document.documentElement;
  if (d.mode === 'light' || d.mode === 'dark') r.setAttribute('data-mode', d.mode);
  if (d.accent !== 'green') r.setAttribute('data-accent', ['amber', 'blue', 'rose', 'ink', 'paper'].includes(d.accent) ? d.accent : 'paper');   // 기본은 종이(S-83, S-87). 초록은 속성 없이 :root 값
  if (['neu', 'skeu', 'glass'].includes(d.style)) r.setAttribute('data-style', d.style);
  if (d.big === true || d.big === 1) r.setAttribute('data-big', ''); else if (d.big === 2) r.setAttribute('data-big', '2');
} catch (e) {}
</script>
<style>
/* 디다코 앱. 색 변수와 상단 바·하단 탭·설정 창은 시안(prototype/week.html)과 같은 것을 옮겼고, 코이데 app/index.html의 값을 그대로 쓴다.
   화면 모드는 코이데처럼 data-mode를 쓴다. 이름과 내용은 모두 지어낸 데모 예시다. */
:root {
  --page: #E8EBE8; --surface: #F7F8F6; --surface-2: #E9EDEA;
  --ink: #1B2523; --ink-2: #5B6965; --line: #D7DEDA; --line-strong: #B9C4BF;
  --accent: #2B6A62; --accent-mid: #8DBDB5; --accent-soft: #DCEBE7; --on-accent: #FFFFFF;
  --leader: #62519E; --leader-soft: #ECE7F7; --private: #E8ECEA;
  --warn: #9A5A14; --warn-soft: #F5E8D6; --shadow: rgba(20, 35, 32, .14);
  --neu-hi: rgba(255, 255, 255, .9); --neu-lo: rgba(20, 35, 32, .17);
  --base: 16px;
  --wood: #B98756;   /* 함께 짜는 그물(3D)의 수틀 나무색. 기도 노트와 같은 색 */
  --f-display: 'Gowun Batang', 'AppleMyungjo', 'Batang', serif;
  --f-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-mode="light"]) {
  --page: #141B19; --surface: #1C2522; --surface-2: #232D2A;
  --ink: #E5ECE9; --ink-2: #9CAAA5; --line: #2D3935; --line-strong: #4A5853;
  --accent: #7CC2B7; --accent-mid: #3F7C73; --accent-soft: #1E3934; --on-accent: #0F1A18;
  --leader: #B6A8EA; --leader-soft: #2A2442; --private: #252E2B;
  --warn: #E2A563; --warn-soft: #3A2C1B; --shadow: rgba(0, 0, 0, .5); --neu-hi: rgba(255, 255, 255, .06); --neu-lo: rgba(0, 0, 0, .6); --wood: #7A5636; color-scheme: dark; } }
/* 화면 모드: 기기 설정이면 기기를 따르고, '밝게'·'어둡게'를 고르면 그대로(data-mode) */
:root[data-mode="dark"] {
  --page: #141B19; --surface: #1C2522; --surface-2: #232D2A;
  --ink: #E5ECE9; --ink-2: #9CAAA5; --line: #2D3935; --line-strong: #4A5853;
  --accent: #7CC2B7; --accent-mid: #3F7C73; --accent-soft: #1E3934; --on-accent: #0F1A18;
  --leader: #B6A8EA; --leader-soft: #2A2442; --private: #252E2B;
  --warn: #E2A563; --warn-soft: #3A2C1B; --shadow: rgba(0, 0, 0, .5); --neu-hi: rgba(255, 255, 255, .06); --neu-lo: rgba(0, 0, 0, .6); --wood: #7A5636; color-scheme: dark; }
/* 글씨: 휴대폰·태블릿 16px, PC 15px. 큰 글씨는 크게 약 1.2배, 아주 크게 약 1.4배(코이데와 같다) */
@media (min-width: 1000px) { :root { --base: 15px; } }
:root[data-big] { --base: 19px; }
:root[data-big="2"] { --base: 22px; }
@media (min-width: 1000px) { :root[data-big] { --base: 18px; } :root[data-big="2"] { --base: 20px; } }
/* 색 테마(초록은 위 기본값). 시안의 THEMES와 같은 값: 밝은 화면 / 어두운 화면 */
:root[data-accent="amber"] { --page:#EDE8E0;--surface:#F9F5EE;--surface-2:#ECE5DA;--ink:#2A221B;--ink-2:#6E6155;--line:#E0D6C8;--line-strong:#C9B9A3;--accent:#A9561B;--accent-mid:#E2B07F;--accent-soft:#F6E3CF;--on-accent:#FFFFFF;--private:#EFE8DE; }
@media (prefers-color-scheme: dark) { :root[data-accent="amber"]:not([data-mode="light"]) { --page:#1A1612;--surface:#231E19;--surface-2:#2B241E;--ink:#EEE6DC;--ink-2:#AE9F8E;--line:#3A3129;--line-strong:#5A4D41;--accent:#E9A066;--accent-mid:#8A5A32;--accent-soft:#3A2818;--on-accent:#1E140C;--private:#2E2721; } }
:root[data-accent="amber"][data-mode="dark"] { --page:#1A1612;--surface:#231E19;--surface-2:#2B241E;--ink:#EEE6DC;--ink-2:#AE9F8E;--line:#3A3129;--line-strong:#5A4D41;--accent:#E9A066;--accent-mid:#8A5A32;--accent-soft:#3A2818;--on-accent:#1E140C;--private:#2E2721; }
:root[data-accent="blue"] { --page:#E7E9EE;--surface:#F6F7FA;--surface-2:#E5E9EF;--ink:#1B2230;--ink-2:#5A6475;--line:#D6DCE5;--line-strong:#B6C0CF;--accent:#2F5D95;--accent-mid:#93AFD3;--accent-soft:#DCE6F3;--on-accent:#FFFFFF;--private:#E8EBF0; }
@media (prefers-color-scheme: dark) { :root[data-accent="blue"]:not([data-mode="light"]) { --page:#12161D;--surface:#1A2029;--surface-2:#212833;--ink:#E4E9F0;--ink-2:#9AA5B5;--line:#2C3542;--line-strong:#485466;--accent:#8EB4E6;--accent-mid:#3C5B85;--accent-soft:#1D2C42;--on-accent:#0E1622;--private:#232A35; } }
:root[data-accent="blue"][data-mode="dark"] { --page:#12161D;--surface:#1A2029;--surface-2:#212833;--ink:#E4E9F0;--ink-2:#9AA5B5;--line:#2C3542;--line-strong:#485466;--accent:#8EB4E6;--accent-mid:#3C5B85;--accent-soft:#1D2C42;--on-accent:#0E1622;--private:#232A35; }
:root[data-accent="rose"] { --page:#EEE7E8;--surface:#FAF5F6;--surface-2:#EDE3E5;--ink:#2A1E21;--ink-2:#6E5B60;--line:#E2D4D7;--line-strong:#CDB6BC;--accent:#A8435C;--accent-mid:#DDA2B1;--accent-soft:#F5DFE5;--on-accent:#FFFFFF;--private:#F0E7E9; }
@media (prefers-color-scheme: dark) { :root[data-accent="rose"]:not([data-mode="light"]) { --page:#1A1416;--surface:#231B1E;--surface-2:#2B2226;--ink:#EEE3E6;--ink-2:#B09CA2;--line:#3A2D31;--line-strong:#5A464C;--accent:#E896AB;--accent-mid:#86475A;--accent-soft:#3B2029;--on-accent:#200E14;--private:#2E2428; } }
:root[data-accent="rose"][data-mode="dark"] { --page:#1A1416;--surface:#231B1E;--surface-2:#2B2226;--ink:#EEE3E6;--ink-2:#B09CA2;--line:#3A2D31;--line-strong:#5A464C;--accent:#E896AB;--accent-mid:#86475A;--accent-soft:#3B2029;--on-accent:#200E14;--private:#2E2428; }
:root[data-accent="ink"] { --page:#E9E9E7;--surface:#F7F7F6;--surface-2:#E8E8E5;--ink:#1D1D1B;--ink-2:#62625E;--line:#DADAD6;--line-strong:#BDBDB7;--accent:#33332F;--accent-mid:#A3A39C;--accent-soft:#E6E6E1;--on-accent:#FFFFFF;--private:#ECECE8; }
@media (prefers-color-scheme: dark) { :root[data-accent="ink"]:not([data-mode="light"]) { --page:#141414;--surface:#1D1D1C;--surface-2:#252524;--ink:#ECECE8;--ink-2:#A3A39E;--line:#30302E;--line-strong:#4D4D4A;--accent:#E2E2DC;--accent-mid:#6A6A65;--accent-soft:#2E2E2C;--on-accent:#141414;--private:#262625; } }
:root[data-accent="ink"][data-mode="dark"] { --page:#141414;--surface:#1D1D1C;--surface-2:#252524;--ink:#ECECE8;--ink-2:#A3A39E;--line:#30302E;--line-strong:#4D4D4A;--accent:#E2E2DC;--accent-mid:#6A6A65;--accent-soft:#2E2E2C;--on-accent:#141414;--private:#262625; }
:root[data-accent="paper"] { --page:#F0EEE6;--surface:#FAF9F5;--surface-2:#F2F0E9;--ink:#1F1E1D;--ink-2:#5E5D59;--line:#E3E0D5;--line-strong:#C4C1B5;--accent:#6B4A2E;--accent-mid:#C4A27F;--accent-soft:#EADFCD;--on-accent:#FFFFFF;--private:#EEECE4; }
@media (prefers-color-scheme: dark) { :root[data-accent="paper"]:not([data-mode="light"]) { --page:#1F1E1D;--surface:#262624;--surface-2:#30302E;--ink:#F5F4EE;--ink-2:#B7B5A9;--line:#3E3E38;--line-strong:#5C5B55;--accent:#D2B08A;--accent-mid:#7E6247;--accent-soft:#362B20;--on-accent:#1C150E;--private:#2C2C2A; } }
:root[data-accent="paper"][data-mode="dark"] { --page:#1F1E1D;--surface:#262624;--surface-2:#30302E;--ink:#F5F4EE;--ink-2:#B7B5A9;--line:#3E3E38;--line-strong:#5C5B55;--accent:#D2B08A;--accent-mid:#7E6247;--accent-soft:#362B20;--on-accent:#1C150E;--private:#2C2C2A; }
* { box-sizing: border-box; }
html, body { margin: 0; }
/* 휴대폰을 가로로 돌려도 브라우저가 글씨를 저절로 키우지 않게 */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { background: var(--page); color: var(--ink); font-family: var(--f-body); font-size: var(--base); line-height: 1.55; -webkit-tap-highlight-color: transparent; word-break: keep-all; overflow-wrap: anywhere; }
button, input, textarea, select { font: inherit; color: inherit; }
/* 아이폰에서 빠르게 두세 번 눌러도 화면이 확대되지 않게(두 손가락으로 벌려 확대하는 것은 그대로). 캔버스·3D 무대는 건드리지 않는다 */
button, a, label, summary, select, input, [role="button"], [data-act], .brand { touch-action: manipulation; }
/* 틀(시안과 같게): 휴대폰·태블릿은 상단 바(배지·설정) + 하단 바(아이콘만), PC(1000px 이상)는 메뉴가 상단 바로 올라가고 2단 */
.ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.wrap { width: 100%; max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); transition: transform .25s ease; }
.topbar .wrap { display: flex; align-items: center; gap: .6em; min-height: 3.4em; position: relative; }
.brand { display: inline-flex; align-items: center; gap: .45em; background: none; border: 0; padding: .3em 0; color: var(--ink); cursor: pointer; min-height: 44px; }
.brand-mark { width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.brand-mark .ic { width: .95em; height: .95em; }
.brand-name { font-family: var(--f-display); font-size: 1.05em; font-weight: 700; white-space: nowrap; }
.topnav { display: none; gap: .2em; margin-left: 1.2em; }
.topnav :is(button, a) { text-decoration: none; font-size: .92em; background: none; border: 0; color: var(--ink-2); padding: .5em .9em; border-radius: 10px; cursor: pointer; min-height: 40px; }
.topnav :is(button, a).on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.spacer { flex: 1; }
.badge-btn { display: inline-flex; align-items: center; gap: .4em; font-size: .8em; font-weight: 600; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: .35em .5em .35em .85em; min-height: 38px; cursor: pointer; white-space: nowrap; }
.role-tag { font-size: .86em; padding: .15em .6em; border-radius: 999px; background: var(--surface); color: var(--ink-2); border: 1px solid var(--line); }
.role-tag.leader { color: var(--leader); border-color: var(--leader); background: var(--leader-soft); }
.role-tag.admin { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0; border-radius: 12px; color: var(--ink); cursor: pointer; flex: none; }
.icon-btn .ic { width: 1.35em; height: 1.35em; }
.icon-btn[aria-expanded="true"] { background: var(--surface-2); }
.menu { position: absolute; top: calc(100% + 6px); right: max(16px, env(safe-area-inset-right, 0px)); width: min(300px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 16px 40px -12px var(--shadow); padding: .5em; display: flex; flex-direction: column; gap: .1em; z-index: 25; }
.mlabel { font-size: .72em; font-weight: 600; color: var(--ink-2); margin: .6em .7em .3em; }
.place-row { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 8px; min-height: 44px; padding: 10px 6px; border: 0; border-radius: 10px; background: none; color: var(--ink); font: 500 .875rem var(--f-body); text-align: left; text-decoration: none; cursor: pointer; }
.place-row .role-tag { margin-left: 6px; }
.place-row:hover, .place-row:focus-visible { background: var(--surface-2); }
.place-row .place-copy { display: flex; flex-direction: column; gap: 2px; }
.place-row .sm { font-size: .875rem; color: var(--ink-2); }
.place-row.on { cursor: default; }
.place-row.on:hover { background: none; }
/* 함께하는 곳 메뉴는 코이데처럼 이름은 왼쪽, 작은 글은 오른쪽, 지금 보는 곳은 굵게(2026-11-14) */
#placeMenu .place-copy { flex-direction: row; justify-content: space-between; align-items: center; gap: .6em; width: 100%; }
#placeMenu .place-copy .sm { font-size: .82em; color: var(--ink-2); text-align: right; }
#placeMenu .place-copy > span:first-child { flex: none; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }   /* 곳 이름은 한 줄로 두고, 길면 오른쪽 작은 글이 줄을 바꾼다 */
/* 크기 · 굵기 · 여백은 코이데 노트의 값을 그대로 쓴다(pray-for app/note.html의 .mlabel · .mitem. 디다코 노트와 같다, 2026-11-14) */
#placeMenu .mlabel { font-size: .72em; margin: .6em .7em .3em; }
#placeMenu .place-row { gap: .6em; font: inherit; font-size: .9em; padding: .55em .7em; }
#placeMenu .place-row[aria-disabled="true"] { cursor: default; opacity: .7; }
#placeMenu .place-row[aria-disabled="true"]:hover { background: none; }
#placeMenu .place-row.on .place-copy > span:first-child { font-weight: 700; }
.mitem { display: flex; justify-content: space-between; align-items: center; gap: .6em; width: 100%; text-align: left; font-size: .9em; color: var(--ink); background: none; border: 0; border-radius: 10px; padding: .55em .7em; min-height: 44px; cursor: pointer; text-decoration: none; }
.mitem:hover { background: var(--surface-2); }
.mitem.static { cursor: default; flex-direction: column; align-items: flex-start; gap: .1em; }
.mitem.static:hover { background: none; }
.mitem small { font-size: .82em; color: var(--ink-2); }
.swatches { display: flex; gap: 4px; margin: .2em .2em .4em; flex-wrap: nowrap; }   /* 색 테마 여섯 개는 늘 한 줄. 칸이 좁으면(더보기 화면 설정, 320px 휴대폰) 동그라미가 조금 작아진다. 간격은 노트 설정과 같은 4px(S-77) */
.swatch { flex: 0 1 40px; min-width: 0; max-width: 40px; aspect-ratio: 1; height: auto; border-radius: 50%; padding: 0; border: 2px solid transparent; background: none; cursor: pointer; display: grid; place-items: center; }
.swatch i { width: 28px; height: 28px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); }
.swatch.on { border-color: var(--ink); }
.menu .seg { margin: 0 .3em .3em; }
.card .swatches { margin: .6em 0 0; }
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.mdiv { height: 1px; background: var(--line); margin: .35em .3em; }
@media (max-width: 420px) { .brand-name { display: none; } }
@media (prefers-reduced-motion: reduce) { .topbar, .tabs { transition: none; } }
h1 { font-family: var(--f-display); font-size: 1.65em; line-height: 1.3; margin: .3em 0 .2em; }
/* 탭 제목 옆 그림(코이데와 같게): 글자색과 크기를 따라가며, 그림만 따로 줄바꿈하지 않게 한다. */
.h-ic { display:inline-flex; width:1.1em; height:1.1em; align-items:center; justify-content:center; vertical-align:-.16em; flex:none; color:inherit; }
.h-ic svg { display:block; width:100%; height:100%; overflow:visible; }
h2 { font-size: 1.05em; margin: 0; }
.eyebrow { font-size: .8em; color: var(--ink-2); margin: 1em 0 0; }
.top-eyebrow { margin: 0 0 2px; }   /* 코이데처럼 큰 제목 위에 둔다(교회·사랑방·부서 같은 회색 글) */
.top-eyebrow + .page-top h1, .top-eyebrow + .sh-top h1 { margin-top: 0; }
.hint { font-size: .82em; color: var(--ink-2); margin: .4em 0 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 12px 0; }
.row { display: flex; justify-content: space-between; align-items: center; gap: .6em; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4em; min-height: 44px; padding: 0 1.1em; border-radius: 12px; border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); font-weight: 600; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.small { min-height: 36px; padding: 0 .8em; font-size: .88em; border-radius: 10px; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }
.field { width: 100%; min-height: 44px; padding: .5em .75em; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); }
/* 날짜 칸: 아이폰은 날짜 칸을 따로 그려서 폭이 달라지고 시트가 옆으로 밀렸다. 다른 칸과 같은 폭으로 묶는다(D-16) */
input.field[type="date"] { -webkit-appearance: none; appearance: none; display: block; width: 100%; max-width: 100%; min-width: 0; text-align: left; }
input.field[type="date"]::-webkit-date-and-time-value { text-align: left; }

.week-grid { display: grid; gap: 14px; align-items: start; margin-top: 12px; }

/* ── 코이데에서 그대로 옮긴 것: 첫 화면(.welcome), 카카오 버튼 ── */
.topbar[hidden] { display: none !important; }

.topbar.bare { background: transparent; border-bottom-color: transparent; box-shadow: none; position: absolute; left: 0; right: 0; }
:root[data-style="neu"] .topbar.bare, :root[data-style="glass"] .topbar.bare { background: transparent; box-shadow: none; backdrop-filter: none; border-color: transparent; }
.topbar.bare .brand { visibility: hidden; }
.welcome { display: grid; gap: 18px; max-width: 30rem; margin: 0 auto; padding: 1.2em 0 2em; }
.ab-mark { width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.ab-mark svg { width: 38px; height: 38px; }
.ab-mark .mk { --s1: var(--on-accent); --s2: color-mix(in srgb, var(--on-accent) 72%, var(--accent)); --s3: color-mix(in srgb, var(--on-accent) 48%, var(--accent)); --cord-bg: var(--accent); }

.ab-words span { display: flex; flex-direction: column; align-items: center; gap: .1em; padding: .5em .7em; border: 1px solid var(--line); border-radius: 12px; background: var(--page); min-width: 6.4em; }
.ab-words b { font-weight: 600; }
.ab-words i { font-style: normal; font-family: var(--f-display); color: var(--accent); }
.ab-words small { font-size: .74em; color: var(--ink-2); }

.wl-hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: .35em; padding: 1.2em 0 .2em; }

.wl-name { font-family: var(--f-display); font-size: 2.1em; margin: 0; letter-spacing: .02em; }

.wl-alt { display: flex; flex-direction: column; gap: 8px; }
.wl-alt-btn { display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: .6em; padding: .75em .9em; border: 1px solid var(--line); border-radius: 12px; background: var(--page); color: var(--ink); text-align: left; text-decoration: none; font: inherit; cursor: pointer; }
.wl-alt-btn b { font-weight: 600; font-size: .95em; }

@media (min-width: 860px) {
  .welcome { max-width: 58rem; grid-template-columns: 1fr 24rem; grid-template-areas: "hero act" "feat act" "name name"; column-gap: 56px; align-items: start; padding-top: 3em; }

}
.kakao { display: flex; align-items: center; justify-content: center; gap: .5em; width: 100%; min-height: 52px; border: 0; border-radius: 12px; background: #FEE500; color: rgba(0,0,0,.85); font-weight: 600; cursor: pointer; }
a.btn { text-decoration: none; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }


/* ── 디다코 앱에서 더한 것: 데모 표시, 설정 창 단추, 아직 없는 화면 ── */

/* ── 실제 앱의 첫 접속(2026-11-11): 시안 start.html의 걸음 화면(.col-n, .steps, .choice 등)을 그대로 옮겼다. 새 색은 없고 있는 변수만 쓴다 ── */

.choices { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }

.choice.new { border-style: dashed; color: var(--ink-2); }
.steps { display: flex; gap: 6px; margin-top: 16px; }

.col-n .btn.wide { margin-top: 12px; }

/* ── 관리(A-01): 코이데 app/index.html의 관리 화면 CSS를 옮겼다. 앱에 이미 있는 이름(.fold)과 겹치는 것은 ad-로 시작하게 바꿨다 ── */
.two-col { display: grid; gap: 14px; align-items: start; margin-top: 12px; }

.ad-l1 { display: flex; align-items: center; flex-wrap: wrap; gap: .3em .5em; }

/* 편성(A-01): 코이데의 편성 CSS(.rs-, .mv-, .bk-, .pn-, .link)를 옮겼다. 이름은 ad-로 시작하게 바꿨고 색은 앱의 변수만 쓴다 */

/* 연도 개편 마법사(A-01): 코이데의 .stepper, .rg-*, .sum-chip, .mv-table를 옮겼다. 앱에 이미 있는 이름(.rg-head 등)과 겹치지 않게 ad-rg-로 시작한다. 색은 앱의 변수만 쓴다 */
.ad-rg { max-width: 920px; margin: 0 auto; }
.ad-rg-steps { list-style: none; margin: 12px 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .4em; }
.ad-rg-steps li { display: flex; flex-direction: column; gap: .3em; font-size: .76em; color: var(--ink-2); border-top: 3px solid var(--line); padding-top: .45em; word-break: keep-all; }

.ad-rg-text { min-height: 12em; font-size: .86em; line-height: 1.6; resize: vertical; overflow-y: auto; font-variant-numeric: tabular-nums; }

.ad-rg-row { display: flex; justify-content: space-between; align-items: center; gap: .6em; flex-wrap: wrap; border-top: 1px solid var(--line); padding: .6em 0 0; margin-top: .6em; }

/* 교회 전체 관리와 분석(2026-11-11): 코이데 churchView·analysisView를 옮겼다. 새 색은 쓰지 않고 있는 변수만 쓴다 */
.ad-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

.ad-dept-form { display: flex; flex-direction: column; gap: .3em; margin: 0; }

.an-sec { display: flex; flex-direction: column; gap: .8em; min-width: 0; }

/* 관리 전환 화면: 화면 전체를 덮고 세 겹 끈이 엮이며 나타난다 */

/* 도움말, 해설, 관련 구절, 말씀을 열며 */

.pn.lead { background: var(--leader-soft); border-left: 5px solid var(--leader); }

.wo { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; max-width: 30em; margin: 0 auto; cursor: pointer; }

.wo-par path:nth-child(1) { animation-delay: .4s; } .wo-par path:nth-child(2) { animation-delay: 1.4s; } .wo-par path:nth-child(3) { animation-delay: 2.4s; }
.wo-par { animation: wo-fade 1.4s linear 3.4s both; }

@keyframes wo-draw { from { stroke-dashoffset: 1; opacity: 0; } 1% { opacity: 1; } to { stroke-dashoffset: 0; opacity: 1; } }

}

.stage-sec { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }

.md > :first-child { margin-top: 0; }
.md p { margin: .6em 0 0; }
.md .md-h { font-family: var(--f-display); font-size: 1em; font-weight: 700; margin: 1em 0 0; }
.md .md-list { margin: .5em 0 0; padding-left: 1.3em; }
.md .md-list li { margin-top: .2em; }
.md .md-q { margin: .6em 0 0; padding-left: .8em; border-left: 3px solid var(--line, #DDE4E0); color: var(--ink-2); }
.md .md-tw { overflow-x: auto; max-width: 100%; }
.md .md-t { width: 100%; border-collapse: collapse; margin-top: .6em; font-size: .92em; }

.md .md-t th { background: var(--accent-soft); }
.paper .md-tw { overflow: visible; }
.paper .md .md-h { border-bottom: 0; padding-bottom: 0; }
.paper .pp-read p { text-align: justify; word-break: keep-all; }

.qcard { margin: 0; scroll-margin-top: 84px; }
.q-meta { display: flex; justify-content: space-between; align-items: center; gap: .6em; min-height: 1.6em; }
.q-eyebrow { font-size: .8em; color: var(--ink-2); }
.bm { display: inline-flex; align-items: center; gap: .35em; font-size: .78em; font-weight: 600; color: var(--accent); }
.bm[hidden] { display: none !important; }
.q-t { font-family: var(--f-display); font-weight: 700; font-size: 1.15em; line-height: 1.55; margin: .15em 0 .2em; word-break: keep-all; white-space: pre-line; }
.qcard .help-btn { align-self: flex-start; margin-left: -.8em; }
.qcard .more { margin-top: .2em; margin-bottom: .4em; }
.qcard .pn.lead { font-size: .88em; margin-top: .5em; }
.think-btn { display: inline-flex; align-items: center; gap: .4em; font: inherit; font-size: .9em; min-height: 44px; padding: 0 .8em; margin-left: -.8em; background: none; border: 0; color: var(--ink-2); cursor: pointer; border-radius: 10px; }
.think-btn .ic { width: 1.15em; height: 1.15em; }
.think-btn:hover { color: var(--ink); }
.ans { margin-top: .3em; }
.ans .pn { margin-bottom: .1em; }
.ans .pn .t { white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.ans .pn .t.open { display: block; -webkit-line-clamp: unset; line-clamp: unset; overflow: visible; }
.ans .pn .quiet-link { margin: 0 0 -.4em; }
.ans .pn.edit .lab { margin-bottom: .1em; }
.ans-foot { display: flex; justify-content: space-between; align-items: center; gap: .6em; margin-top: .3em; }
.ans-foot .hint { margin: 0; }
.ans-foot .quiet-link { margin: 0; }

.deep { margin: 10px 0 0; scroll-margin-top: 84px; }
.deep .d-lead { font-family: var(--f-display); font-size: 1.15em; line-height: 1.55; margin: .2em 0 0; word-break: keep-all; }
.deep-cord { position: relative; width: 240px; max-width: 100%; height: 40px; margin: .7em auto .2em; }
.deep-cord svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.deep-cord .dc-line { stroke-width: 4; }

@keyframes dc-in { from { opacity: 0; } to { opacity: 1; } }
.tri-item { padding: .9em 0 .2em; border-top: 1px solid var(--line); scroll-margin-top: 84px; }
.tri-item:first-of-type { border-top: 0; }
.tri-item .q-meta { justify-content: flex-start; gap: .6em; }
.who { font-weight: 600; font-size: .86em; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: .15em .8em; }
.tri-item .q-t { font-size: 1.06em; margin-top: .45em; }
.wrapup { margin: 10px 0 0; scroll-margin-top: 84px; }
.wrapup .keep-form { margin-top: .9em; }
.wrapup label { font-weight: 600; font-size: .92em; display: block; margin-bottom: .3em; }
.wrapup .field { font-size: 1em; }
.end-btns { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.end-btns .btn { min-height: 52px; text-decoration: none; }
@media (min-width: 640px) { .end-btns { flex-direction: row-reverse; } .end-btns .btn { flex: 1; } }
.keep-form { display: flex; flex-direction: column; gap: 14px; margin-top: 1.1em; }
.keep-form label { font-weight: 600; font-size: .92em; display: block; margin-bottom: .3em; }
.keep-form .field { font-size: 1em; }

/* 나눔하기 (sharing.html) */
.start-grid { display: grid; gap: 14px; align-items: start; margin-top: 12px; }
@media (min-width: 760px) { .start-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.start-grid .card { margin: 0; min-width: 0; }
.opt { padding: .8em 0; border-top: 1px solid var(--line); }
.opt:first-of-type { border-top: 0; padding-top: .2em; }
.opt-sub { font-size: .84em; color: var(--ink-2); margin: .1em 0 0; line-height: 1.5; }
.opt .row { align-items: center; }
.stage-checks { display: flex; flex-direction: column; gap: 6px; margin-top: .6em; }
.chk { display: flex; align-items: center; gap: .7em; min-height: 46px; padding: 0 .9em; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; text-align: left; width: 100%; }
.chk .box { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--line-strong); display: grid; place-items: center; flex: none; color: var(--on-accent); }
.chk .box .ic { width: 15px; height: 15px; stroke-width: 2.4; opacity: 0; }
.chk.on { border-color: var(--accent); background: var(--accent-soft); }
.chk.on .box { background: var(--accent); border-color: var(--accent); }
.chk.on .box .ic { opacity: 1; }
.chk small { margin-left: auto; color: var(--ink-2); font-size: .8em; }
.start-btn { margin-top: 16px; min-height: 52px; font-size: 1.05em; }
.stage { position: fixed; inset: 0; z-index: 30; background: var(--page); color: var(--ink); display: flex; flex-direction: column; }
.stage[hidden] { display: none !important; }
body.sharing { overflow: hidden; }
.st-top { flex: none; display: flex; align-items: center; gap: .4em; min-height: 56px; padding: max(6px, env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px)) 6px max(8px, env(safe-area-inset-left, 0px)); }
.st-top[hidden] { display: none; }
.st-pill { font: inherit; font-size: .84em; font-weight: 600; background: var(--surface); color: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 0 .95em; min-height: 44px; display: inline-flex; align-items: center; gap: .4em; cursor: pointer; white-space: nowrap; }
.st-body { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); position: relative; }
.st-in { margin: auto; width: 100%; max-width: 680px; padding: 12px 0 20px; min-width: 0; }
.st-foot { flex: none; padding: 8px max(16px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.st-foot[hidden] { display: none; }
.st-nav { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; max-width: 680px; margin: 0 auto; }
.st-nav .btn { min-height: 52px; font-size: 1.02em; }
.st-nav.one { grid-template-columns: 1fr; }
.st-skip { display: block; margin: 0 auto 6px; background: none; border: 0; color: var(--ink-2); font-size: .9em; min-height: 44px; padding: 0 1em; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.st-eyebrow { font-size: .84em; color: var(--ink-2); margin: 0 0 .7em; text-align: center; }
.st-body.qmode { overflow: hidden; }
.q-top { flex: none; min-height: 36vh; min-height: 36dvh; display: flex; align-items: center; justify-content: center; padding: 8px 0; }
.q-core { width: 100%; max-width: 680px; min-width: 0; }
.q-aux { flex: 1 1 0; min-height: 0; overflow-y: auto; width: 100%; max-width: 680px; margin: 0 auto; padding: 2px 0 16px; display: flex; flex-direction: column; gap: 10px; font-size: .88em; }
.q-aux .more { margin: 0; align-items: center; text-align: center; color: var(--ink-2); }
.q-text { white-space: pre-line; text-align: center; position: relative; z-index: 9; transition: color .15s ease-out; font-family: var(--f-display); font-weight: 700; font-size: clamp(1.55em, 6vmin, 2.5em); line-height: 1.5; margin: 0; word-break: keep-all; text-wrap: balance; }
.passage-big { font-family: var(--f-display); font-weight: 700; font-size: clamp(2.2em, 10vmin, 4em); line-height: 1.3; margin: .1em 0 .5em; text-align: center; word-break: keep-all; }
.center { text-align: center; }
.cover-name { font-family: var(--f-display); font-weight: 700; font-size: clamp(2em, 8.5vmin, 3.2em); line-height: 1.35; text-align: center; margin: 0; }
.cover-sub { text-align: center; color: var(--ink-2); margin: .6em 0 0; font-size: 1.05em; }
.cover-mark { display: block; margin: 0 auto 1.2em; width: 120px; height: 30px; opacity: .9; }
.triple { display: flex; flex-direction: column; gap: 0; padding: .4em 1.1em; }
.tri { padding: 1em 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: auto 1fr; gap: .4em 1em; align-items: baseline; }
.tri:first-child { border-top: 0; }
.tri .who { align-self: start; margin-top: .3em; }
.tri .tri-memo { grid-column: 2; font-size: .88em; margin-top: .3em; }
.tri p { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 1.2em; line-height: 1.55; word-break: keep-all; }
.h2d.tri-lead { white-space: nowrap; font-size: clamp(14px, calc((100vw - 32px) / 20.5), 2em); }
:root[data-big] .h2d.tri-lead, .stage.big .h2d.tri-lead { white-space: normal; font-size: clamp(1.4em, 5.5vmin, 2.1em); }
.h2d { font-family: var(--f-display); font-size: clamp(1.5em, 5.5vmin, 2.1em); line-height: 1.4; margin: 0 0 .4em; word-break: keep-all; }
.bless { display: flex; flex-direction: column; gap: .5em; align-items: center; text-align: center; }
.bless p { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(1.6em, 6.6vmin, 2.5em); line-height: 1.5; word-break: keep-all; animation: wo-in .8s ease-out calc(.3s + var(--i) * 1s) both; }
.bless p.lastline { margin-top: .3em; color: var(--accent); }
.bless .bl-lead { margin: 0 0 .6em; }
.bless .bl-ref { margin-top: 1em; animation: wo-in .8s ease-out 4.3s both; }
.done-mark { display: block; margin: .6em auto 1em; height: 170px; width: 52px; max-width: 100%; }
.done-btns { display: flex; flex-direction: column; gap: 10px; max-width: 420px; margin: 1.4em auto 0; }
.done-btns .btn { min-height: 52px; }
/* 화면 내려놓기: 카드 전체 위에 어두운 한 겹(.dimmer)을 얹고 그 한 겹만 바뀐다. 질문(.q-text)은 이 겹 위로 올라와 같은 때에 흰색이 된다.
   어두워질 때 0.8초, 밝아질 때 0.15초. 어두운 색은 테마와 상관없이 고정이다 */
.dimmer { position: absolute; inset: 0; z-index: 8; background: #090d0c; opacity: 0; pointer-events: none; transition: opacity .15s ease-out; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: .35em; padding: 0 24px max(8vh, env(safe-area-inset-bottom, 0px)); text-align: center; }
.stage.dim .dimmer { opacity: 1; pointer-events: auto; transition-duration: .8s; transition-timing-function: ease-in; }
.stage.dim .q-text { color: #fff; transition-duration: .8s; transition-timing-function: ease-in; }
.stage.nt .dimmer, .stage.nt .q-text { transition: none !important; }
.dimmer p { word-break: keep-all; text-wrap: balance; margin: 0; }
.dimmer .dm-msg { font-family: var(--f-display); font-weight: 700; font-size: 1.15em; color: #fff; }
.dimmer .dm-sub { font-size: .88em; color: #c9d3cf; }
.stage.big .dimmer .dm-msg { font-size: 1em; }
.stage.big { font-size: calc(var(--base) * 1.35); }
.stage.big .q-text { font-size: clamp(2.1em, 8.5vmin, 4.4em); }
.stage.big .st-in { max-width: 1100px; }
.stage.big .tri p { font-size: 1.5em; }
.stage.big .passage-big { font-size: clamp(3em, 14vmin, 6em); }
.stage.big .st-nav { max-width: 1100px; }
@media (prefers-reduced-motion: reduce) {
  .wo-par path, .wo-lines p, .wo-skip, .bless p, .bless .bl-ref { animation: none; }
  .wo-par { animation: none; opacity: 0; }
  .wo-braid { animation: none; clip-path: none; }
  .deep-cord .dc-on { animation: none; } .deep-cord .dc-braid { animation: none; clip-path: none; }
  .dimmer, .q-text, .stage.dim .dimmer, .stage.dim .q-text { transition-duration: .2s; }
}


/* ══ 책장·내 기록 ══ */
/* ── 책장(#shelf) ── 시안 shelf.html의 것을 옮겼다. 앱에 이미 있는 이름(.toc-list, .bm, .back-link)과 겹치는 것만 이름을 바꾸거나 범위를 좁혔다 */
/* 배치: 휴대폰은 한 줄. 640px 이상은 가운데 읽는 폭에 넓게, 1000px 이상은 책 목차를 조금 더 넓게 둔다 */
.shelf-wrap { max-width: 760px; margin: 0 auto; }
@media (min-width: 1000px) { .shelf-wrap { max-width: 880px; } }
/* 책장 첫 화면: 넓은 화면에서도 지금 읽는 책 아래에 교재 목록을 놓는다 */
@media (min-width: 1000px) { .shelf-wrap.shelf-home { max-width: none; } }
.shelf-wrap h1, .record-wrap h1 { word-break: keep-all; overflow-wrap: anywhere; }

/* 검색 */
.search { position: relative; margin-top: 10px; }
.search .ic { position: absolute; left: .8em; top: 50%; transform: translateY(-50%); color: var(--ink-2); pointer-events: none; }
.search .field { padding-left: 2.5em; }
.hit-list { list-style: none; margin: 0; padding: 0; }
.hit-list li + li { border-top: 1px solid var(--line); }
.hit { display: block; width: 100%; text-align: left; background: none; border: 0; padding: .8em 0; min-height: 44px; cursor: pointer; }
.hit .hit-book { display: block; font-size: .8em; color: var(--ink-2); }
.hit b { display: block; word-break: keep-all; overflow-wrap: anywhere; font-family: var(--f-display); font-size: 1.05em; margin-top: .1em; }
.hit .hit-ref { font-size: .84em; color: var(--accent); font-family: var(--f-display); font-weight: 700; }
.hit .hit-body { display: block; font-size: .86em; color: var(--ink-2); margin-top: .15em; line-height: 1.55; }

/* 책 표지: 크기와 관계없이 책등을 뺀 자리의 가운데에 같은 비율로 상징을 둔다 */
.book-cover { display: block; position: relative; width: 100%; aspect-ratio: 3 / 4; overflow: hidden; border-radius: 3px 7px 7px 3px; background: color-mix(in srgb, var(--cover-color) 16%, var(--surface)); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 6px 14px -6px rgba(0,0,0,.22); }
.book-cover::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 7%; background: var(--cover-color); opacity: .55; }
.book-cover::after { content: ''; position: absolute; top: 0; bottom: 0; left: 7%; width: 2px; background: rgba(255,255,255,.35); }
.book-symbol { display: block; position: absolute; width: 70%; height: auto; aspect-ratio: 1; left: 18.5%; top: 50%; transform: translateY(-50%); }
/* 표지 이름(선택, 2026-11-10): 위쪽에 두 줄까지. 이름이 있으면 그림을 조금 작게 아래로 내린다. 이름은 장식이라 화면 읽기에는 옆의 책 제목을 쓴다 */
.book-cover { container-type: inline-size; }
.book-name { position: absolute; top: 9%; left: 13%; right: 6%; z-index: 1; text-align: center; font-family: var(--f-display); font-weight: 700; font-size: max(9px, 11cqw); line-height: 1.25; color: color-mix(in srgb, var(--cover-color) 72%, var(--ink)); word-break: keep-all; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.book-cover.has-name .book-symbol { width: 56%; left: 25.5%; top: 60%; }
.mg-cover:not(.big) .book-name { display: none; }
/* 어두운 화면에서는 표지 이름을 조금 밝게 해서 먹색·종이색 표지에서도 읽히게 한다(2026-11-10) */
@media (prefers-color-scheme: dark) { :root:not([data-mode="light"]) .book-name { color: color-mix(in srgb, var(--cover-color) 40%, var(--ink)); } }
:root[data-mode="dark"] .book-name { color: color-mix(in srgb, var(--cover-color) 40%, var(--ink)); }
.mg-cover:not(.big) .book-cover.has-name .book-symbol { width: 70%; left: 18.5%; top: 50%; }
.cover-art > svg { display: none; width: 100%; height: 100%; }
.cover-art > img { display: block; width: 100%; height: 100%; object-fit: contain; }
.cover-art.cover-missing > svg { display: block; }
.cover-art.cover-missing > img { display: none; }
/* 책장 첫 화면의 작은 제목과 카드 제목은 기존 크기를 따른다 */
.sf { font-family: var(--f-display); }
.sh-sm { font-size: calc(var(--base) * .875); color: var(--ink-2); }
.xlb { font-size: calc(var(--base) * .8125); font-weight: 700; color: var(--ink-2); margin: 20px 0 8px; }
.xcard { padding: 14px 16px; margin: 0; }
.xcard .xct { font-size: calc(var(--base) * 1.1875); font-weight: 700; line-height: 1.35; }
/* 책장 머리: 제목 오른쪽에 검색 단추. 검색 칸과 결과는 제목 아래에 열린다 */
.sh-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; }
.sh-top .icon-btn { margin-right: -10px; }
/* 지금 읽는 책: 왼쪽 표지, 오른쪽 글. 단추로만 책과 펼치기를 연다 */
.sh-card { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; align-items: start; }
.book-cover-current { width: 96px; }
.sh-body { min-width: 0; }
.sh-kind { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.sh-lesson { margin-top: 4px; line-height: 1.5; }
.sh-date { margin-top: 2px; }
.sh-actions { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; }
.sh-actions .btn { min-height: 36px; padding: 0 .8em; font-size: .88em; border-radius: 10px; }
/* 교재 목록: 한 칸에 책 표지와 두 줄까지의 제목 */
.sh-books { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 14px; row-gap: 18px; }
.sh-book { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; min-width: 0; padding: 0; border: 0; background: none; color: var(--ink); font-family: var(--f-body); text-align: left; cursor: pointer; }
.sh-book-title { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; font-size: calc(var(--base) * .875); font-weight: 700; line-height: 1.4; overflow-wrap: anywhere; margin-top: 3px; }
.sh-book-period { font-size: calc(var(--base) * .75); color: var(--ink-2); line-height: 1.4; }
.sh-book .walk-tag { max-width: 100%; min-height: 22px; padding: 2px 6px; font-size: calc(var(--base) * .625); white-space: normal; }
@media (min-width: 640px) { .sh-books { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (min-width: 1000px) {
  .sh-card { grid-template-columns: 140px minmax(0, 1fr) auto; align-items: center; gap: 22px; }
  .book-cover-current { width: 140px; }
  .sh-actions { grid-column: 3; flex-direction: column; }
  .sh-actions .sh-read { order: -1; }
  .sh-actions .btn { min-height: 44px; padding: 0 1.15em; font-size: 1em; border-radius: 12px; }
  .sh-books { grid-template-columns: repeat(6, minmax(0, 1fr)); column-gap: 22px; row-gap: 26px; }
}
/* 지금 읽는 책 카드의 과 점: 교회 진도(지난 과 · 이번 주 과 · 남은 과). 내가 쓴 것과 상관없고 숫자는 적지 않는다(철학 ③, 2026-11-10) */
.sh-dots { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; }
.sh-dots i { display: block; width: 8px; height: 8px; border-radius: 999px; box-sizing: border-box; border: 1.5px solid var(--line-strong); }
.sh-dots i.past { background: var(--accent-mid); border-color: var(--accent-mid); }
.sh-dots i.now { width: 20px; background: var(--accent); border-color: var(--accent); }

/* 책 안(목차) */
/* 책 안 머리와 표지 색(2026-11-10): --cover-color를 옅게 섞어 머리 카드, 과 번호, 장절, 단추에 입힌다 */
.book-in { --bk: color-mix(in srgb, var(--cover-color) 82%, var(--ink)); --bk-solid: color-mix(in srgb, var(--cover-color) 88%, var(--ink)); --bk-on: #fff; }

.les-no.now { background: var(--bk-solid); border-color: transparent; color: var(--bk-on); }

.thread { padding:.55em 0; } .thread + .thread { margin-top:.5em; }
.thread-name { margin:0 0 .2em; }

.thread p { margin:.25em 0; }
.path-item { padding:.55em 0; } .path-item + .path-item { margin-top:.25em; } .more-practices { display:block; min-height:44px; margin:4px auto 0; padding:0 .7em; border:0; border-radius:10px; color:var(--ink-2); background:transparent; font:inherit; cursor:pointer; } .more-practices:hover { background:var(--surface-2); }
.path-item strong { display:block; }

.keep-quote, .thread p:not(.thread-name), .path-item strong { font-family:var(--f-display); font-size:1.05em; font-weight:400; line-height:1.7; color:var(--ink); word-break:keep-all; }

.keep-meta, .reflection { font-family:var(--f-body); font-size:.8em; color:var(--ink-2); }
.period-options { display:grid; gap:4px; margin-top:10px; } .period-option { display:flex; align-items:center; justify-content:space-between; width:100%; min-height:48px; padding:.6em .75em; border:0; border-radius:10px; background:transparent; color:var(--ink); text-align:left; font:inherit; cursor:pointer; } .period-option:hover, .period-option:active { background:var(--surface-2); } .period-option[aria-pressed="true"] { background:var(--surface-2); } .period-option[aria-pressed="true"] span { color:var(--accent); font-size:.72em; }
.date-row { display:grid; grid-template-columns:1fr; gap:6px; padding:0; margin:0 -.7em 6px; border:0; border-radius:12px; }
.date-row button { position:relative; display:grid; grid-template-columns:5.8em minmax(0,1fr); align-items:center; gap:10px; width:100%; min-height:44px; text-align:left; background:none; border:0; border-radius:12px; padding:.8em .7em; color:inherit; cursor:pointer; }

.month-card h2 { margin-bottom:.3em; font-family:var(--f-display); }

.record-wrap .set-btns { display:flex; justify-content:flex-end; gap:12px; margin-top:.6em; }
.detail-head { margin-bottom:12px; }

.detail-meta { color:var(--ink-2); font-size:.88em; }
.field-head { display:flex; justify-content:space-between; align-items:center; gap:8px; }

.del-record { text-align:center; margin:18px 0 8px; }
.del-list { margin:.6em 0 0; padding-left:1.3em; line-height:1.9; }

/* ── 인쇄(C-02): A4 종이와 쪽 나누기. 시안 manage.html·prep.html의 인쇄용을 옮겼다. 종이 안 색은 화면 색 테마와 상관없이 흰 종이 ── */

.print-bar .btn { align-self: flex-start; }

/* 인쇄용 보기: PC에서는 왼쪽 종이, 오른쪽 고르는 칸(D-19). 휴대폰은 위에서 아래로 그대로 */
@media (min-width: 1024px) {
  .pp-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; }
  .pp-side { order: 2; position: sticky; top: 76px; }
  .pp-main { order: 1; min-width: 0; }
  .pp-side .print-bar { margin-top: 12px; }
}
.paper { --accent: #2B6A62; --accent-mid: #8DBDB5; --accent-soft: #DCEBE7; --ink-2: #5B6965; --s1: #2B6A62; --s2: #8DBDB5; --s3: #5B6965; --cord-bg: #FFFFFF; position: relative; }
/* 인쇄 종이의 로고: 상단 바와 같은 모양(테마색 동그라미 안 흰 마크). 종이는 늘 기본 초록이다 */
.pp-logo { width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--accent); display: grid; place-items: center; flex: none; }
.paper .pp-logo .mk { width: 1.5em; height: 1.5em; display: block; --s1: #FFFFFF; --s2: color-mix(in srgb, #FFFFFF 72%, var(--accent)); --s3: color-mix(in srgb, #FFFFFF 48%, var(--accent)); --cord-bg: var(--accent); }
.paper .mk { width: 1.5em; height: 1.5em; flex: none; }
.pp-pg { position: absolute; left: 0; right: 0; bottom: calc(var(--mm) * 8); text-align: center; font-size: .8em; color: #5B6965; letter-spacing: .04em; }
.paper-wrap { container-type: inline-size; width: 100%; max-width: 640px; margin: 0 auto 14px; }
.paper { --mm: calc(100cqw / 210); width: 100%; aspect-ratio: 210 / 297; overflow: hidden; background: #FFFFFF; color: #1B2523; border: 1px solid #DDE4E0; box-shadow: 0 12px 28px -14px var(--shadow); padding: calc(var(--mm) * 16) calc(var(--mm) * 18); font-family: var(--f-body); font-size: calc(var(--mm) * 3.88); line-height: 1.6; box-sizing: border-box; }
.paper p { margin: 0; }
.paper h3 { font-family: var(--f-display); font-size: 1.7em; line-height: 1.3; margin: .6em 0 .1em; word-break: keep-all; }
.pp-ref { font-family: var(--f-display); font-weight: 700; }
.pp-intro { margin-top: .6em !important; color: #5B6965; white-space: pre-line; }

<script>
(() => {
'use strict';
// 설정 파일(config.js)에 서버 주소(HUB_URL)가 있으면 실제 모드, 비어 있으면(또는 주소 끝에 ?demo) 데모다 (디다코 노트와 같다).
// 데모에서는 아무것도 밖으로 보내지 않고, 쓴 것은 이 기기(localStorage)에만 남는다
const CFG = window.DIDAKO_CONFIG || {};
const LIVE = !!CFG.HUB_URL && !new URLSearchParams(location.search).has('demo');
const DEMO = !LIVE;
const DATA = window.DIDAKO_DEMO;
const clone = x => JSON.parse(JSON.stringify(x));
// 디다코 기본 교재(앱에 들어 있는 GOSPEL 새가족반과 12소예언서). 실제 모드에서는 DATA.books를 서버 교재로 바꾸니, 그 전에 복사해 둔다.
//  교재 관리의 "디다코 기본 교재"에서 [가져오기]를 누르면 우리 교회 교재로 복제된다(서버 basicImport)
const BASIC = LIVE ? { books: ['gospel', 'prophets'].map(id => DATA.books.find(b => b.id === id)).filter(Boolean).map(clone), guides: clone(DATA.guides) } : { books: [], guides: {} };

// ── 도구 ──
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
// 저장소를 못 쓰는 브라우저(비공개 창 등)에서도 화면은 그대로 돌아가야 해서 모두 try/catch로 감싼다. set은 성공 여부를 돌려준다
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const readJson = k => { try { const v = JSON.parse(ls.get(k) || 'null'); return v && typeof v === 'object' ? v : {}; } catch (e) { return {}; } };
// 책장 머리의 돋보기(디다코 노트의 SEARCH_IC와 같은 그림)
const HEAD_ICON = {
  bubble: '<span class="h-ic" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none"><path d="M20 46C11 46 5 39.8 5 32.5c0-6.4 4.6-12 11.1-13.1C18.3 11.2 26 6 34 8.1c5.4-5.6 14.6-3.8 17.8 3.4 6.9.7 11.1 6.6 9.7 13.3 2.9 6.8-.9 14.1-8.1 16-2.4 7-10 10.1-16.8 6.8-4.5 2.4-10.1 2-13.9-1.3-3.4 1.8-7.3 2.4-11.2 1.7Z" stroke="currentColor" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16" cy="52" r="4.3" stroke="currentColor" stroke-width="3.8"/><circle cx="7" cy="60" r="1.6" fill="currentColor"/></svg></span>',
  glass: '<span class="h-ic" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none"><circle cx="39" cy="25" r="20" stroke="currentColor" stroke-width="4.8"/><path d="M23.9 40.1 7.2 56.8a4.2 4.2 0 0 0 5.9 5.9l16.7-16.7" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>',
  hand: '<span class="h-ic" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none"><path d="M20 48 43 8a4 4 0 0 1 7-1l3 2a4 4 0 0 1 1 6L29 54l-11 7 2-13Z" stroke="currentColor" stroke-width="3.8" stroke-linejoin="round"/><path d="m46 12 7 5M20 48l9 6M20 48l-2 13 11-7" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 37c-2-3-1-6 1-8 3-3 6-3 9-2l8 4 5-8c2-3 5-4 7-2 3 2 3 5 1 8l-4 7c4-1 7 0 9 3 2 3 1 6-2 8l-9 7c-3 2-6 3-10 2l-11-4-5-9c-1-3-1-5 1-6Z" stroke="currentColor" stroke-width="3.8" stroke-linejoin="round" stroke-linecap="round"/><path d="m14 35 10 5M16 43l9 4M34 37l-6 8M7 52l9 8 8-5" stroke="currentColor" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"/></svg></span>',
  cabinet: '<span class="h-ic" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none"><rect x="6" y="4" width="52" height="56" rx="5" stroke="currentColor" stroke-width="4.2"/><path d="M6 23h52M6 42h52" stroke="currentColor" stroke-width="4.2"/><path d="M25 12v5h14v-5M25 31v5h14v-5M25 50v5h14v-5" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>'
};
const SEARCH_IC = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>';
const ic = (n, c) => `<svg class="ic ${c || ''}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const root = document.documentElement;

function switchOwnerApp(uid) {
  const owner = ls.get('didako-note-owner');
  if (owner === uid) return;
  const old = Object.fromEntries(OWNER_KEYS.map(k => [k, ls.get(k)]));
  const stashKey = 'didako-note-stash.' + uid, stash = ls.get(stashKey);
  const next = stash ? JSON.parse(stash) : {};
  if (owner) localStorage.setItem('didako-note-stash.' + owner, JSON.stringify(old));
  try {
    OWNER_KEYS.forEach(k => next[k] == null ? localStorage.removeItem(k) : localStorage.setItem(k, next[k]));
    localStorage.setItem('didako-note-owner', uid);
  } catch (err) {
    OWNER_KEYS.forEach(k => old[k] == null ? localStorage.removeItem(k) : localStorage.setItem(k, old[k]));
    throw err;
  }
  if (stash) localStorage.removeItem(stashKey);
  loadState();
}

const HIDDEN_TAB = [[.34, 0], [.40, 0, .42, .06, .38, .12], [.33, .20, .40, .30, .50, .30], [.60, .30, .67, .20, .62, .12], [.58, .06, .60, 0, .66, 0]];

// me: 서버가 알려 준 나의 정보, depts: 첫 접속에서 고르는 부서·사랑방 목록, booting: 켜지는 중
// writer: 교재를 쓸 수 있는 사람인지, writeDepts: 새 교재의 대상으로 고를 수 있는 부서, hold: 못 받은 이번 주 즈음의 과(교재ID와 날짜), booksOk: 교재를 받았는지(2-3)
const LV = { me: null, depts: null, join: null, epoch: 0, booting: false, authBusy: false, needChurch: false, repick: false, notice: '', err: '', busy: false, work: null, want: '', writer: false, writeDepts: [], hold: [], booksOk: false, booksWork: null };
// 첫 접속에서 고르는 중인 것. byName은 이름을 써서 찾는 길, newFamily는 새로 왔어요
const lvFresh = () => ({ deptId: '', roomId: '', staff: false, familyId: '', person: '', byName: false, newFamily: null });
const ST = lvFresh();
let PEND = { data: null, err: '' };   // 우리 사랑방(pending)에서 받은 요청과 명단
const sget = k => { try { return sessionStorage.getItem(k); } catch (e) { return null; } };
const sset = (k, v) => { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) { /* 없어도 된다 */ } };
if (LIVE) {
  const q = new URLSearchParams(location.search);
  LV.authBusy = q.has('code') || (!!ls.get(LK.hub) && !ls.get(LK.tok));   // 카카오에서 돌아왔거나 교회를 찾는 중
  LV.booting = q.has('code') || !!ls.get(LK.hub) || !!ls.get(LK.tok);
  LV.want = location.hash;   // 켜지는 동안 첫 화면으로 돌려져도, 들어온 뒤에는 열려던 화면(예: #more)으로 간다
  // 초대 링크 값(?join=)과 설치 코드 화면(?setup)은 카카오 로그인으로 오가는 사이에도 남게 기억해 두고 주소에서는 지운다
  let strip = false;
  if (q.has('join')) { ls.set(LK.join, q.get('join')); q.delete('join'); strip = true; }
  if (q.has('setup')) { sset(LK.setup, '1'); q.delete('setup'); strip = true; }
  if (strip) { const u = new URL(location.href); u.search = q.toString(); history.replaceState(null, '', u); }
}
const canSetup = () => LIVE && sget(LK.setup) === '1';

// 서버가 알려 준 나로 역할을 정한다: 교회 관리자·부서 관리자 → admin, 교역자 → pastor, 리더·코리더 → leader, 나머지 → member
function liveRole(me) {
  if (me.ops || me.admin) return 'admin';
  if (me.staff) return 'pastor';
  if (me.role === '리더' || me.role === '코리더') return 'leader';
  return 'member';
}
// 앱에 들어올 수 있는 사람: 연결이 승인된 사람, 또는 교회 관리자(가정 없이도 들어온다). 연결은 됐는데 올해 편성에 없는 사람(notLinked)은 기다림 화면에서 까닭을 본다
function applyMe() {
  const me = LV.me;
  const linked = !!me && !!me.link && me.link.status === '연결' && !me.notLinked;
  D.entered = !!me && (linked || !!me.ops);
  D.role = D.entered ? liveRole(me) : 'member';
}
// 우리 사랑방(승인·거절·연결 해제)을 여는 사람: 리더·코리더. 부서 관리자 가정이면서 사랑방 리더·코리더인 사람은 역할이 admin이어도 연다
const liveLeads = () => D.role === 'leader' || (LIVE && D.role === 'admin' && !!LV.me && !!LV.me.admin && (LV.me.role === '리더' || LV.me.role === '코리더'));
function liveGroupName() {
  const me = LV.me || {};
  if (isTop()) return (me.dept && me.dept.name) || (me.ops && !me.ops.all && me.ops.depts[0] && me.ops.depts[0].name) || ls.get(LK.name) || '';
  return me.roomName || (me.dept && me.dept.name) || '';
}

// 서버 부르기. hub는 코이데 기본 서버(로그인·교회 코드), 아니면 이 교회의 디다코 서버. 응답은 { ok, data }
async function postLive(hub, action, data = {}) {
  const tokenKey = hub ? LK.hub : LK.tok, token = ls.get(tokenKey), e = LV.epoch;
  const ctl = new AbortController(), stop = setTimeout(() => ctl.abort(), 60000);
  let res;
  try {
    res = await (await fetch(hub ? CFG.HUB_URL : ls.get(LK.url), {
      method: 'POST', body: JSON.stringify({ ...data, action, token, ...(hub ? { app: 'didako' } : {}) }), signal: ctl.signal
    })).json();
  } catch (_) { throw { code: 'net', message: '서버가 답하지 않아요. 잠시 뒤 다시 해 주세요.' }; }
  finally { clearTimeout(stop); }
  if (e !== LV.epoch) throw { cancelled: true };
  if (res.ok === false) {
    // 로그인이 끝났다는 답이면 그 표시를 지운다. 기본 서버의 것이면 첫 화면으로, 교회 서버의 것이면 조용히 다시 찾아 들어간다
    if (res.code === 'login' && action !== 'logout' && action !== 'ticketLogin') {
      ls.del(tokenKey); liveReset();
      if (hub) route(true); else recoverLogin();
    }
    throw res;
  }
  return res.ok === true && res.data && typeof res.data === 'object' ? res.data : res;
}
const hubApi = (action, data) => postLive(true, action, data);
const api = (action, data) => postLive(false, action, data);
function liveError(err) {
  if (!err || err.cancelled) return;
  if (!err.code) console.error(err);
  const msg = err.code && err.message ? err.message : '서버가 답하지 않아요. 잠시 뒤 다시 해 주세요.';
  const m = $('#liveMsg');
  if (m) m.textContent = msg; else toast(msg);
}
// 사람이 바뀌거나 로그아웃할 때 서버에서 받아 둔 것과 고르던 것을 모두 비운다
function liveReset() {
  LV.epoch++; LV.me = null; LV.depts = null; LV.join = null; LV.needChurch = false; LV.repick = false; LV.err = ''; LV.notice = '';
  Object.assign(ST, lvFresh()); PEND = { data: null, err: '' };
  D.entered = false; D.role = 'member';
  // 앞사람이 받은 교재와 과가 남지 않게 비운다
  Object.keys(LS.timers).forEach(k => clearTimeout(LS.timers[k])); LS.timers = {}; LS.busy = {}; LS.again = {};
  LV.writer = false; LV.writeDepts = []; LV.hold = []; LV.booksOk = false; LV.booksWork = null;
  MG = null; DATA.books = []; DATA.guides = {}; DATA.roomBook = '';
}

// 부서·사랑방 목록은 연결을 요청하는 중에는 서버가 다시 주지 않는다. "다른 사랑방으로 다시 고르기"를 위해 이 기기에 이름만 남겨 둔다(가정 이름은 뺀다)
const lvKeepDepts = depts => ls.set(LK.depts, JSON.stringify(depts.map(d => ({ ...d, rooms: d.rooms.map(r => ({ id: r.id, name: r.name, deptId: r.deptId })) }))));
const lvCachedDepts = () => { try { const v = JSON.parse(ls.get(LK.depts) || 'null'); return Array.isArray(v) ? v : null; } catch (e) { return null; } };

// 앱을 열 때 한 번: 나 + (연결 전이면) 부서·사랑방 목록. 연결은 됐는데 올해 편성에 없는 사람은 start가 notLinked로 거절하니 me로 까닭을 받는다
async function loadStart() {
  const join = ls.get(LK.join);
  let r;
  try { r = await api('start', join ? { join } : {}); }
  catch (err) { if (err.code === 'notLinked') r = { me: await api('me') }; else throw err; }
  LV.me = r.me; LV.err = '';
  const waiting = !!r.me.link && r.me.link.status === '요청';
  if (r.depts) { LV.depts = r.depts; lvKeepDepts(r.depts); }
  else if (waiting) LV.depts = LV.depts || lvCachedDepts();
  else { LV.depts = null; ls.del(LK.depts); }
  LV.join = r.join || null;
  if (r.me.link && join) ls.del(LK.join);   // 이미 연결(또는 요청)된 사람의 기기에 남은 초대 값은 쓰지 않는다
  if (!r.me.link) {
    // 초대 링크로 왔으면 그 부서(와 사랑방)를 미리 고른다. 막힌 링크면 알리고 직접 고르게 한다
    Object.assign(ST, lvFresh());
    const J = LV.join, depts = LV.depts || [];
    if (J && J.bad) { toast('이 초대 링크는 더 이상 쓰지 않아요. 직접 골라 주세요.'); ls.del(LK.join); }
    else if (J && depts.some(d => d.id === J.deptId)) { ST.deptId = J.deptId; if (J.roomId && lvDept().rooms.some(x => x.id === J.roomId)) ST.roomId = J.roomId; }
  }
  applyMe();
  // 들어올 수 있는 사람은 이번 주로 들어가기 전에 교재와 과를 받는다(못 받으면 안내와 다시 불러오기)
  if (D.entered) await loadBooks(); else LV.booksOk = false;
}
// 교회 서버에 확인증으로 들어간다(교회를 찾았거나 교회 코드를 넣은 뒤)
async function enterChurch(result) {
  const c = result.church;
  ls.set(LK.url, c.url); ls.set(LK.name, c.name); ls.set(LK.kind, c.kind);
  const login = await api('ticketLogin', { ticket: result.ticket });
  ls.set(LK.tok, login.token); ls.set(LK.uid, String(login.uid));
  if (LIVE) switchOwnerApp(String(login.uid));
  LV.needChurch = false;
  await loadStart();
}
async function findChurch() {
  const r = await hubApi('where');
  if (r.church) await enterChurch(r);
  else {
    LV.notice = r.notYet ? `${r.notYet.name}은 아직 디다코 노트를 쓰지 않아요. 교회 관리자에게 알려 주세요.` : '';
    LV.me = null; LV.needChurch = true;
  }
}
// 교회 서버 로그인이 끝났을 때 조용히 다시 들어간다
function recoverLogin() {
  if (LV.work) return LV.work;
  LV.authBusy = true; route(false);
  LV.work = findChurch().catch(liveError).finally(() => { LV.work = null; LV.authBusy = false; route(true); });
  return LV.work;
}
// 켜질 때: 카카오에서 돌아왔으면 로그인 → 교회 찾기, 이미 들어와 있으면 바로 나의 정보
async function bootLive() {
  const url = new URL(location.href), code = url.searchParams.get('code');
  if (code) { url.searchParams.delete('code'); url.searchParams.delete('state'); history.replaceState(null, '', url); }
  try {
    if (code || (ls.get(LK.hub) && !ls.get(LK.tok))) {
      LV.authBusy = true; route(false);
      try {
        if (code) {
          const r = await hubApi('login', { code, redirectUri: CFG.REDIRECT_URI });
          ls.set(LK.hub, r.token);
          // 새 카카오 계정으로 들어온 경우 옛 교회 로그인으로 돌아가지 않게 한다
          ls.del(LK.tok); ls.del(LK.uid); ls.del(LK.join); ls.del(LK.depts);   // 앞사람의 초대 값과 부서 목록이 남지 않게
        }
        await findChurch();
      } finally { LV.authBusy = false; }
    } else if (ls.get(LK.tok)) {
      // 교회 서버 주소나 기기 표시가 빠진 불완전한 로그인은 지우고 첫 화면으로
      if (ls.get(LK.uid) && ls.get(LK.url)) { switchOwnerApp(ls.get(LK.uid)); await loadStart(); } else ls.del(LK.tok);
    }
  } catch (err) {
    if (!err.cancelled) {
      // 나의 정보를 못 받았으면 안내와 [다시 불러오기]를 보인다
      LV.err = err.code && err.message ? err.message : '서버가 답하지 않아요. 잠시 뒤 다시 해 주세요.';
      if (!ls.get(LK.tok)) liveError(err);
    }
  } finally { LV.booting = false; }
  if (D.entered && LV.want && !/^#start/.test(LV.want)) history.replaceState(null, '', LV.want);
  LV.want = '';
  route(true);
}

// ── 실제 모드 첫 접속의 어느 걸음을 보일지 ──
const lvDept = () => (LV.depts || []).find(d => d.id === ST.deptId) || { name: '', group: '사랑방', unit: '가정', rooms: [] };
const lvRoom = () => lvDept().rooms.find(r => r.id === ST.roomId) || {};
const lvGrp = () => lvDept().group || '사랑방';
const lvSolo = () => lvDept().unit === '개인';
const lvFam = () => (Array.isArray(lvRoom().families) ? lvRoom().families : []).find(f => f.id === ST.familyId);
function liveStep(arg) {
  const me = LV.me;
  if (!ls.get(LK.tok)) return LV.needChurch && ls.get(LK.hub) && !LV.authBusy ? 'church' : '';
  if (!me) return 'loading';   // 서버에서 나의 정보를 받는 중(못 받았으면 안내와 다시 불러오기)
  if (canSetup() && !me.ops) return 'setup';   // 주소에 ?setup을 붙여 연 운영자: 로그인 뒤 설치 코드 화면부터(나중에 하기로 건너뛴다)
  if (D.entered) {
    if (!LV.booksOk) { if (arg === 'done') LV.want = '#start/done'; liveEnsureBooks(); return 'loading'; }   // 교재와 과를 받는 중(못 받았으면 안내와 다시 불러오기)
    return arg === 'done' ? 'done' : 'enter';
  }
  if (!LV.repick && ((me.link && me.link.status === '요청') || me.notLinked)) return 'wait';
  // 연결 전: 부서 → 사랑방 → (가정 고르기 | 이름 쓰기 | 새로 왔어요) → 동의. 새로 고쳐서 고른 것이 없어졌으면 가능한 첫 걸음으로
  const depts = LV.depts || [], hasDept = depts.some(d => d.id === ST.deptId), room = lvRoom(), fam = lvFam();
  const ok = {
    dept: true,
    room: hasDept,
    family: hasDept && !ST.staff && Array.isArray(room.families),
    who: hasDept && !!fam && String(fam.name).split(' · ').length > 1,
    name: hasDept && (ST.staff || !!room.id),
    new: hasDept && !ST.staff && !!room.id,
    consent: hasDept && (!!ST.person || !!ST.newFamily)
  };
  if (ok[arg]) return arg;
  if (!hasDept) { if (depts.length === 1) { ST.deptId = depts[0].id; return 'room'; } return 'dept'; }
  if (!ST.roomId && !ST.staff) return 'room';
  if (!ST.person && !ST.newFamily) return Array.isArray(room.families) && !ST.staff ? 'family' : 'name';
  return 'consent';
}
const lvGo = step => goHash(step ? '#start/' + step : '#start');
function goHash(h) { if (location.hash === h) route(true); else location.hash = h; }
// 화면을 옮길 때 서버에서 새로 받을 것: 리더의 우리 사랑방(승인을 기다리는 요청과 명단)
function liveEnter(v) { if ((v === 'church' || v === 'more') && liveLeads()) livePendLoad(); }
function livePendLoad() {
  PEND.err = '';
  return api('pending').then(d => { PEND.data = d; }).catch(err => { if (!err.cancelled) PEND.err = err.code && err.message ? err.message : '서버가 답하지 않아요. 잠시 뒤 다시 해 주세요.'; })
    .finally(() => { if (['church', 'more'].includes(currentView())) roomRedraw(); });
}

// ── 서버 교재를 화면 자료로 (2-3) ──
// 화면은 교재를 DATA.books(책장), DATA.guides(과의 진행 안내·단계·질문·깊이 묵상하기), DATA.thisWeek, DATA.roomBook에서 읽고, 교재 관리는 mg()(MG)에서 고친다.
// 실제 모드에서는 이 자리를 서버(books)가 준 자료로 채운다. 화면 코드는 그대로 두고 자료를 받는 층과 교재 관리의 저장 지점만 서버로 잇는다.
// 서버가 거른다: 회원은 '모두'로 배포한 과만, 리더 해설과 전체 진행 안내 없이 받는다(화면에서 숨기는 것이 아니라 받지 않는다).
// 쓰는 사람은 MG가 준비 중인 과까지 모두 갖고, 책장 자료(DATA)는 MG에서 다시 만든다.
const pad2 = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const isoAdd = (iso, n) => { const [y, m, d] = iso.split('-').map(Number); return isoOf(new Date(y, m - 1, d + n)); };
const isoDow = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d).getDay(); };
// 이번 주: 오늘 또는 오늘 뒤 첫 일요일(sun)과 그 앞 월요일(from)부터 일요일(to)까지
function liveWeek() {
  const today = isoOf(new Date()), sun = isoAdd(today, (7 - isoDow(today)) % 7);
  return { today, sun, from: isoAdd(sun, -6), to: sun };
}
// 날짜 글: "10월 25일 주일"(일요일이면 주일을 붙인다. 교재 관리가 날짜를 고를 때와 같다)
function liveDateText(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  return m ? `${Number(m[2])}월 ${Number(m[3])}일${isoDow(iso) === 0 ? ' 주일' : ''}` : '';
}
const liveClock = d => pad2(d.getHours()) + ':' + pad2(d.getMinutes());
function liveTimeText(ts) {
  const d = new Date(ts);
  return isNaN(d) ? '' : `${d.getMonth() + 1}월 ${d.getDate()}일 ${liveClock(d)}`;
}
const liveDeptName = () => { const me = LV.me || {}; return (me.dept && me.dept.name) || (me.ops && !me.ops.all && me.ops.depts[0] && me.ops.depts[0].name) || ls.get(LK.name) || ''; };
// 새 교재의 기본 대상 모임: 내 부서(쓸 수 있으면), 아니면 쓸 수 있는 첫 부서
function liveDefaultDept() {
  const own = (LV.me && LV.me.deptId) || '', list = LV.writeDepts || [];
  return own && list.some(d => d.id === own) ? own : (list.find(d => d.id) || list[0] || { id: '' }).id;
}
// 서버가 준 교재 하나를 화면이 쓰는 모양으로. 과의 날짜는 iso(yyyy-MM-dd)와 화면 글(date)을 함께 둔다
function liveMapBook(sb) {
  const b = { id: sb.id, deptId: sb.deptId || '', target: sb.target || '', title: sb.title, kind: sb.kind, period: sb.period || '', closed: !!sb.closed, canWrite: !!sb.canWrite, cover: sb.cover, coverName: sb.coverName || '', range: sb.range || '', start: sb.start || '', source: sb.source || '', lessons: (sb.lessons || []).filter(l => l.status !== 'archived').map(liveMapLesson) };
  if (sb.end) b.end = sb.end;
  return b;
}
function liveMapLesson(l) {
  const o = { no: l.no, name: l.name || '', ref: l.ref || '', iso: l.date || '', date: liveDateText(l.date), intro: l.intro || '', body: l.body || '', wrap: l.wrap || '', status: l.status || 'all', state: 'upcoming' };

}
// 과의 상태(past 지났음 / now 이번 주 / prep 준비 중 / upcoming 다가오는 과): 날짜와 공개 범위로 정한다.
//  모두에게 배포하지 않은 과는 이번 주 즈음이면 now(회원 화면은 "준비하고 있어요"), 그 밖에는 prep(책장 목차에 안 나온다)
function liveStates(books, wk) {
  books.forEach(b => {
    b.lessons.forEach(L => {
      const inWeek = !!L.iso && L.iso >= wk.from && L.iso <= wk.to;
      L.state = L.status !== 'all' ? (inWeek ? 'now' : 'prep') : !L.iso ? 'upcoming' : L.iso < wk.from ? 'past' : inWeek ? 'now' : 'upcoming';
    });
    // 한 주에 둘 이상이면 날짜가 가장 늦은 과만 이번 주
    const nows = b.lessons.filter(L => L.state === 'now').sort((x, y) => (x.iso < y.iso ? -1 : x.iso > y.iso ? 1 : x.no - y.no));
    nows.slice(0, -1).forEach(L => { L.state = L.status === 'all' ? 'past' : 'prep'; });
  });
}
// MG(서버에서 받은 모든 과)에서 책장 자료를 다시 만든다. 못 받은 이번 주 과(hold)는 "준비하고 있어요" 자리만 만든다
function liveSyncData() {
  const wk = liveWeek();
  liveStates(MG.books, wk);
  const shelf = clone(MG.books.filter(b => b.lessons.length));
  (LV.hold || []).forEach(h => {
    const b = shelf.find(x => x.id === h.book);
    if (!b || h.date < wk.from || h.date > wk.to || b.lessons.some(L => L.state === 'now')) return;
    b.lessons.push({ no: Math.max(0, ...b.lessons.map(L => L.no)) + 1, name: '', ref: '', iso: h.date, date: liveDateText(h.date), intro: '', body: '', status: 'draft', state: 'now', hold: true });
  });
  DATA.books = shelf;
  DATA.guides = clone(MG.guides);

  const open = shelf.filter(b => !b.closed), mine = (LV.me && LV.me.deptId) || '';
  const pool = open.filter(b => b.deptId === mine).concat(open.filter(b => b.deptId !== mine), shelf.filter(b => b.closed));
  DATA.roomBook = (pool.find(b => b.lessons.some(L => L.state === 'now')) || pool[0] || { id: '' }).id;
  const wl = liveWeekLesson();

}

// ── 쓰는 대로 저장 (교재 관리) ──

const LS = { timers: {}, busy: {}, again: {} };
// 저장하지 못한 과의 글은 이 기기에 임시로 둔다(열쇠: didako-mg-unsaved.교재ID.과 번호). 다시 저장하면 지우고, 교재 관리에 다시 들어오면 되살린다
const UNSAVED = 'didako-mg-unsaved.';
const unsavedKey = (b, L) => UNSAVED + b.id + '.' + L.no;
const unsavedKeys = () => { const out = []; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(UNSAVED)) out.push(k); } } catch (e) { /* 저장소를 못 쓰면 임시 글도 없다 */ } return out; };
const liveClearUnsaved = () => unsavedKeys().forEach(k => ls.del(k));
const liveHasUnsaved = () => !!MG && MG.books.some(b => b.lessons.some(L => L.saveState && L.saveState.err));
function liveRestoreUnsaved() {
  unsavedKeys().forEach(k => {
    const m = /^didako-mg-unsaved\.([^.]+)\.(\d+)$/.exec(k), b = m && mgBook(m[1]), L = b && b.lessons.find(l => l.no === Number(m[2]));
    let v = null; try { v = JSON.parse(ls.get(k) || 'null'); } catch (e) { /* 깨진 임시 글은 버린다 */ }
    if (!L || !v || !v.lesson || (L.editedAt && Date.parse(L.editedAt) > v.at)) { ls.del(k); return; }   // 서버에 더 새 글이 있으면 임시 글을 쓰지 않는다

function liveLessonOut(L, g) {
  return { name: L.name || '', ref: L.ref || '', date: L.iso || '', intro: L.intro || '', body: L.body || '', wrap: L.wrap || '', useText: !!L.useText, text: L.text || '', fs: L.fs || 'm', guide: g.guide || '', stages: g.stages, triple: g.triple };

function liveDirty(b, L) {

function liveSaveLesson(b, L) {
  const k = lkey(b, L);
  clearTimeout(LS.timers[k]); delete LS.timers[k];
  if (LS.busy[k]) { LS.again[k] = true; return LS.busy[k]; }
  const run = (async () => {
    do {
      LS.again[k] = false;
      try {
        await api('lessonSave', { bookId: b.id, no: L.no, lesson: liveLessonOut(L, mgGuide(b, L)) });
        ls.del(unsavedKey(b, L));
        L.saveState = LS.again[k] ? { busy: true } : { at: liveClock(new Date()) };
        b.savedAt = liveClock(new Date()); b.edited = true;
        liveSyncData();
      } catch (err) {
        if (err && err.cancelled) return;
        L.saveState = { err: true };   // 쓴 글은 그대로 두고 안내만 바꾼다. 페이지를 닫아도 잃지 않게 이 기기에 임시로 둔다
        ls.set(unsavedKey(b, L), JSON.stringify({ at: Date.now(), lesson: liveLessonOut(L, mgGuide(b, L)) }));

    const back = ST.newFamily ? 'new' : ST.byName ? 'name' : (lvFam() && String(lvFam().name).split(' · ').length > 1 ? 'who' : 'family');
    return `<div class="col-n">${lvSteps(3)}<p class="eyebrow">${esc(ST.person)}</p><h1>내 기록은 이렇게 지켜요</h1>
      <ul class="consent">
        <li><b>명단</b><span>이름과 ${esc(lvGrp())}, 카카오 회원번호와 닉네임은 교회가 관리하는 서버에 있어요</span></li>
        <li><b>내 기록</b><span>답변, 한 문장, 작은 실천, 돌아보기, 메모는 이 휴대폰에서 잠가서 맡겨요. 운영자도, 목사님도, 리더도 열 수 없어요</span></li>
        <li><b>이 기기</b><span>브라우저에서 사이트 데이터를 지우면 이 기기의 사본이 지워질 수 있어요</span></li>
        <li><b>홈 화면</b><span>홈 화면에 추가해 두면 좋아요. 아이폰은 공유 버튼에서, 안드로이드는 메뉴에서 "홈 화면에 추가"를 눌러요</span></li></ul>
      <button class="btn wide" type="button" data-act="lv-request">동의하고 연결 요청</button>
      <p class="msg" id="liveMsg" role="alert"></p>
      <p class="hint">동의하지 않으면 앱을 쓸 수 없어요. 궁금한 점은 리더나 목사님께 물어봐 주세요.</p>
      ${lvBackBtn(back)}</div>`;
  }
  if (arg === 'wait') {
    const who = esc(me.link ? me.link.person : ''), asked = !me.notLinked;
    if (!asked) return `<div class="col-n">${lvSteps(4)}<p class="eyebrow">${esc(me.familyName || '')}</p><h1>아직 열리지 않았어요</h1>
      <p>${esc(me.notLinked)}</p>
      <button class="btn wide" type="button" data-act="lv-recheck">승인됐는지 다시 확인</button>
      <button class="link" type="button" data-act="lv-logout">로그아웃</button></div>`;
    return `<div class="col-n">${lvSteps(4)}<p class="eyebrow">${esc(me.familyName || '')}</p><h1>연결을 요청했어요</h1>
      <p>${who} 님의 연결 요청을 ${me.staff ? '부서 관리자' : '리더'}에게 보냈어요. 승인되면 바로 열려요.</p>
      <div class="wait">${me.staff ? '부서 관리자' : '리더'}가 확인하고 있어요</div>
      <button class="btn wide" type="button" data-act="lv-recheck">승인됐는지 다시 확인</button>
      <p class="hint">보통 하루 안에 끝나요. 승인된 뒤에는 링크만 누르면 바로 열려요.</p>
      <button class="link" type="button" data-act="lv-repick">다른 ${esc(lvGrpOfCache())}${lvRo(lvGrpOfCache())} 다시 고르기</button>
      <button class="link" type="button" data-act="lv-logout">로그아웃</button></div>`;
  }
  if (arg === 'done') {
    const place = me.roomName || (me.dept && me.dept.name) || '디다코';
    return `<div class="col-n">${lvSteps(4)}<p class="eyebrow">${esc(place)}</p><h1>함께하게 되었어요</h1>
      <p>${esc(me.person || '')} 님, ${esc(place)}에 오신 것을 환영해요.</p>
      <a class="btn wide" href="#week">이번 주로</a></div>`;
  }
  if (arg === 'setup') return `<form class="col-n" data-lform="setup" novalidate>
      <p class="eyebrow">처음 한 번만</p><h1>설치 코드를 넣어 주세요</h1>
      <p class="hint">처음 한 번만 써요. 서버를 만든 사람에게 받은 설치 코드를 넣어 주세요.</p>
      <label class="f" for="lvSetupCode">설치 코드</label><input class="field" id="lvSetupCode" autocomplete="off" spellcheck="false" aria-label="설치 코드">
      <label class="f" for="lvSetupName">내 이름</label><input class="field" id="lvSetupName" maxlength="20" autocomplete="name" aria-label="내 이름" placeholder="예) 김하늘">
      <p class="hint">교회 관리자로 보일 이름이에요.</p>
      <button class="btn wide" type="submit">교회 관리자로 시작하기</button>
      <p class="msg" id="liveMsg" role="alert"></p>
      <button class="link" type="button" data-act="lv-setup-skip">나중에 하기</button>
    </form>`;
  return liveWelcome();
}
// 다시 고르기 단추에 쓰는 소그룹 이름(저장해 둔 목록의 첫 부서 기준. 없으면 사랑방)과 '로/으로'
const lvRo = w => { const c = String(w).charCodeAt(String(w).length - 1) - 0xAC00; return c >= 0 && c < 11172 && (c % 28 === 0 || c % 28 === 8) ? '로' : '으로'; };
function lvGrpOfCache() { const d = (LV.depts || lvCachedDepts() || [])[0]; return (d && d.group) || '사랑방'; }

        <li><span class="wl-ico">${ic('lock')}</span><div><b>기록은 지켜져요</b><span>내 기록은 암호화하여 보관해요. 운영자·목사님·리더도 볼 수 없어요.</span></div></li>

// 더보기의 우리 사랑방 카드: 사랑방 이름은 서버가 알려 주고, 함께하는 사람은 리더에게만 보인다(리더가 우리 사랑방에서 받아 온 명단)
function liveRoomCard() {
  const me = LV.me || {};
  if (!me.roomName) return '';
  const names = liveLeads() && PEND.data ? PEND.data.families.flatMap(f => f.linked.map(l => l.person)) : null;
  return `<div class="gc" style="margin:14px 0;padding-top:14px;padding-bottom:14px">
        <b>우리 사랑방</b><p>${esc(me.roomName)}</p>
        ${names ? `<p class="mlabel">함께하는 사람</p><div class="kids">${names.map(n => `<span class="kid">${esc(n)}</span>`).join('')}</div>` : ''}
        <p class="hint">이름만 보여요. 서로 얼마나 썼는지는 보이지 않아요.</p>
        <p class="hint">사랑방이 바뀌면 리더나 관리자에게 알려 주세요.</p>
      </div>`;
}

// 우리 사랑방(L-02) 실제 모드: 화면 모양과 글은 데모와 같고 자료만 서버(pending)에서 받는다
function liveChurchView() {
  const me = LV.me || {}, d = PEND.data;
  const head = `<a class="back-link" href="#more">${ic('back')}<span>더보기</span></a>
    <p class="eyebrow top-eyebrow">${esc(me.roomName)} · ${esc(roleName())}</p><div class="page-top"><h1>우리 사랑방</h1></div>`;
  if (!d) return head + `<section class="card calm"><p class="calm-t">${PEND.err ? '불러오지 못했어요' : '불러오고 있어요'}</p>${PEND.err ? `<p class="soft" style="margin:0">${esc(PEND.err)}</p><button class="btn ghost" type="button" data-act="lv-pend">다시 불러오기</button>` : ''}</section>`;
  const reqs = d.requests, solo = !!(me.dept && me.dept.unit === '개인');
  const linked = d.families.reduce((n, f) => n + f.linked.length, 0);
  const people = d.families.flatMap(f => f.linked.length
    ? f.linked.map(l => `<div class="gr"><span class="gt"><b>${esc(l.person)}</b><span class="gd">${String(l.kakaoId) === String(me.kakaoId) ? '연결됨 · 나' : '연결됨'}</span></span>${String(l.kakaoId) === String(me.kakaoId) ? '' : `<button class="btn ghost small" type="button" data-act="room-dc" data-k="${esc(l.kakaoId)}" data-n="${esc(l.person)}" aria-label="${esc(l.person)} 연결 해제">연결 해제</button>`}</div>`)
    : [`<div class="gr"><span class="gt"><b>${esc(f.name)}</b><span class="gd">아직 연결 전</span></span></div>`]);
  return `${head}
    <div class="more-grid"><div>
      <div class="gl">연결 승인${reqs.length ? ` · 기다리는 요청 ${reqs.length}명` : ''}</div><div class="gc">
        ${reqs.length > 1 ? `<div class="gr"><span class="gt"><span class="gd">기다리는 요청을 한 번에 승인해요</span></span><button class="btn small" type="button" data-act="room-apall">모두 승인 (${reqs.length})</button></div>` : ''}
        ${reqs.length ? reqs.map(p => `<div class="gr"><span class="gt"><b>${esc(p.person)}</b><span class="gd">카카오 닉네임 · ${esc(p.nick)}${p.newFamily ? ' · ' + (solo ? '새로 왔어요' : '새 가정 신청' + (p.familyName && p.familyName !== p.person ? ' ' + esc(p.familyName) : '')) : ''}</span></span>
          <div class="set-btns"><button class="btn ghost small" type="button" data-act="room-reject" data-k="${esc(p.kakaoId)}" data-n="${esc(p.person)}" aria-label="${esc(p.person)} 거절">거절</button><button class="btn small" type="button" data-act="room-approve" data-k="${esc(p.kakaoId)}" data-n="${esc(p.person)}" aria-label="${esc(p.person)} 승인">승인</button></div></div>`).join('')
          : '<div class="gr"><span class="gt"><span class="gd">기다리는 요청이 없어요. 새로 들어온 사람이 연결을 요청하면 여기에 보여요.</span></span></div>'}
      </div>
    </div><div>
      <div class="gl">명단 · 연결된 사람 ${linked}명</div><div class="gc">
        ${people.join('')}
      </div>
    </div></div>
    <p class="soft">${ic('lock')} 이름과 연결 상태만 보여요. 묵상 기록은 잠겨 있어서 리더도 볼 수 없어요.</p>`;
}

// ── 더보기(C-03) ──
let dispOpen = false;
let roomState = null;
const myRoom = () => roomState || (roomState = { members: DATA.rooms.mine.members.slice(), pending: DATA.rooms.mine.pending.map(p => ({ ...p })) });
function moreView() {
  const room = LIVE ? null : DATA.rooms.mine;
  const chevron = '<span class="ch" aria-hidden="true">›</span>';
  const jobRow = (title, desc, target, tag) => `<a class="gr" href="${target}"><span class="gt"><b>${title}</b><span class="gd">${desc}</span></span><span class="role-tag ${!tag && D.role === 'leader' ? 'leader' : 'admin'}">${esc(tag || roleName())}</span>${chevron}</a>`;
  let jobs = '';
  if (D.role === 'leader') jobs = jobRow('우리 사랑방', '함께하는 사람 · 연결 승인', '#church');
  else if (D.role === 'pastor') jobs = jobRow('교재 관리', '교재와 과를 꾸리고 배포해요', '#manage') + jobRow('사랑방 전체 보기', '모든 사랑방의 명단과 연결 상태', '#rooms');
  else if (D.role === 'admin') jobs = jobRow('교재 관리', '교재와 과를 꾸리고 배포해요', '#manage') + jobRow('관리', '부서와 사랑방, 명단을 꾸려요', '#admin') + jobRow('교회 전체 관리', '부서와 교회 설정을 꾸려요', '#church-admin');
  if (LIVE && D.role === 'admin' && liveLeads()) jobs = jobRow('우리 사랑방', '함께하는 사람 · 연결 승인', '#church') + jobs;

        <p class="mlabel">리더</p><div class="kids"><span class="kid lead">${esc(room.leader)}</span><span class="kid lead">${esc(room.coLeader)} · 코리더</span></div>

        <p class="hint">사랑방이 바뀌면 리더나 관리자에게 알려 주세요.</p>

        <a class="gr" href="../community/"><span class="gt"><b>디다코 공동체</b><span class="gd">작은 모임에서 말씀을 함께 읽어요.</span></span>${chevron}</a>
      </div>
    </div><div>
      ${jobs ? `<div class="gl">맡은 일</div><div class="gc">${jobs}</div>` : ''}
      <div class="gl">앱 설정</div><div class="gc">
        <button class="gr${dispOpen ? ' open' : ''}" type="button" data-act="disp" aria-expanded="${dispOpen}" aria-controls="dispEx"><span class="gt"><b class="mhead">화면 설정</b><span class="gd">화면 모드 · 색 테마 · 디자인 · 큰 글씨</span></span>${dispOpen ? ic('chev', 'ch') : chevron}</button>
        ${dispOpen ? `<div id="dispEx" style="padding:4px 0 14px">${displayControls()}</div>` : ''}
        <button class="gr" type="button" data-act="a2hs"><span class="gt"><b>홈 화면에 앱처럼 두기</b><span class="gd">아이콘을 눌러 바로 열 수 있게 해요</span></span>${chevron}</button>
      </div>
      <div class="gl">디다코</div><div class="gc">

// 붙여 넣은 편성표를 지금 가정과 이름으로 맞춘다: 표기만 다르면(/, 띄어쓰기, 부부 순서) 자동, 한 사람만 같으면 확인, 처음 보는 이름은 새 가정
function adRgMatch() {
  const rg = AD.rg, d = adDept(), gw = d.group.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), pool = [];
  d.rooms.forEach(r => r.fams.forEach(f => pool.push({ id: f.id, name: f.name, room: r.name, parts: adNames(f), key: adKey(adNames(f)) })));
  const used = new Set(), bad = [];
  const rows = rg.text.split(/\n+/).map(l => l.trim()).filter(Boolean).map(l => {
    const tab = l.indexOf('\t'), cut = tab > 0 ? [l.slice(0, tab), l.slice(tab + 1)] : (l.match(new RegExp('^(.+?' + gw + ')\\s*(.+)$')) || []).slice(1);
    if (cut.length < 2 || !cut[1].trim()) { bad.push(l); return null; }
    const parts = adNameParts(cut[1]); if (!parts.length) { bad.push(l); return null; }
    const hit = pool.find(f => !used.has(f.id) && f.key === adKey(parts));
    if (hit) used.add(hit.id);
    return { room: cut[0].trim().replace(/\s+/g, ' '), raw: parts.join(', '), parts, status: hit ? 'match' : '', ex: hit || null };
  }).filter(Boolean);
  rows.forEach(r => { if (r.status) return;
    const near = pool.find(f => !used.has(f.id) && f.parts.some(x => r.parts.includes(x)));
    if (near) { used.add(near.id); r.status = 'check'; r.ex = near; } else r.status = 'new'; });
  rg.res = { rows, bad, missing: pool.filter(f => !used.has(f.id)) };
  rg.matched = rg.text;
}

// 연도 개편 마법사 화면(#admin-reorg). 단계 표시 1~4, 단계마다 [이전] [다음], [그만두기]는 관리 화면으로

  const A = DATA.admin, d = adDept(), g = d.group, solo = adSolo(d), one = adRgOne(), cnt = adRgCnt(), rg = AD.rg, now = A.term, next = A.nextYear;
  const head = `<a class="back-link" href="#admin">${ic('back')}<span>관리</span></a>

  const steps = `<ol class="ad-rg-steps" aria-label="진행 단계">${AD_RG_STEPS.map((x, i) => `<li class="${i + 1 === rg.step ? 'on' : i + 1 < rg.step ? 'done' : ''}"${i + 1 === rg.step ? ' aria-current="step"' : ''}><b>${i + 1}</b>${x}${i + 1 < rg.step ? '<span class="vh">, 마쳤어요</span>' : ''}</li>`).join('')}</ol>`;

  const wrap = body => `<div class="ad-rg">${head}${steps}${body}</div>`;

  if (rg.step === 1) return wrap(`<section class="card">

      <p class="hint" style="margin:0 0 .6em">한 줄에 "${esc(g)} 이름 + ${solo ? '이름' : '가정 이름'}"이면 돼요. 엑셀에서 두 칸을 복사해 붙여도 되고, ${solo ? '' : '"홍길동/김영희", "김영희 홍길동"처럼 '}표기가 달라도 괜찮아요. ${esc(g)} 이름이 지금과 같으면 그대로 이어지고, 바뀐 이름은 새 ${esc(adJ(g, '이/가'))} 돼요.</p>
      <textarea id="adRgText" class="field ad-rg-text" rows="10" data-adin="rgtext" placeholder="${solo ? '김하늘 순&#9;정서우&#10;김하늘 순&#9;한이든' : '2-20 사랑방&#9;홍길동/김영희&#10;2-20 사랑방&#9;박민수'}">${esc(rg.text)}</textarea>
      ${rg.msg ? `<p class="hint warn-text">${esc(rg.msg)}</p>` : ''}
      <div class="ad-acts" style="margin-top:.6em"><button class="btn small ghost" type="button" data-act="ad-rgsample">예시 편성표 넣기</button></div>
      <p class="hint">예시 편성표는 데모용으로 지어낸 이름이에요. 지금 편성에서 몇 곳을 바꾼 모양이에요.</p></section>`
    + nav('ad-rgmatch', '맞춰 보기'));
  const res = rg.res, idx = s => res.rows.map((r, i) => ({ r, i })).filter(x => x.r.status === s);
  // 2. 이름 맞추기
  if (rg.step === 2) {
